<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8"/>
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>SAI · Executive Financial Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg-page:#f4f6fa; --bg-surface:#ffffff; --bg-raised:#ffffff;
  --bg-app:#eef2f8;
  --text-primary:#141a24; --text-secondary:#4d5666; --text-muted:#88909f;
  --border:#e3e8f0; --border-subtle:#eef1f6; --grid:#e8ecf3;
  --primary:#256abf; --primary-hover:#1d5aa6; --primary-subtle:#e9f0fb;
  --good:#1b9e63; --warn:#c98a00; --serious:#d4622a; --critical:#c62d2d;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
  --radius-sm:8px; --radius-md:12px; --radius-lg:16px;
  --elev-1:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.08);
  --elev-2:0 4px 14px rgba(16,24,40,.10);
  --elev-3:0 12px 34px rgba(16,24,40,.14);
  --sans:'Inter',system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --glass-bg:rgba(255,255,255,.80); --glass-border:#e3e8f0;
}
::selection{background:rgba(37,106,191,.22);color:#0b1220}
html{scroll-behavior:smooth}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(16,24,40,.20);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:rgba(16,24,40,.32)}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg-page);color:var(--text-primary);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.tnum{font-variant-numeric:tabular-nums}
a{color:var(--primary);text-decoration:none}
button{font-family:inherit}

/* layout */
.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.sidebar{background:var(--glass-bg);backdrop-filter:blur(24px) saturate(1.3);-webkit-backdrop-filter:blur(24px) saturate(1.3);border-right:1px solid var(--glass-border);position:sticky;top:0;height:100vh;overflow-y:auto;padding:18px 12px}
.brand{display:flex;gap:10px;align-items:center;padding:6px 10px 16px}
.brand .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--primary),#4a3aa7);color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px;flex:none;box-shadow:0 0 24px rgba(37,106,191,.35),0 0 8px rgba(37,106,191,.2)}
.brand .bt{font-weight:700;font-size:14px;line-height:1.15}
.brand .bs{font-size:11px;color:var(--text-muted)}
.navgroup{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);padding:14px 12px 6px;font-weight:600}
.navitem{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;color:var(--text-secondary);cursor:pointer;font-size:14px;font-weight:500;border:none;background:none;width:100%;text-align:left}
.navitem:hover{background:var(--bg-page)}
.navitem.active{background:var(--primary-subtle);color:var(--primary-hover);font-weight:600}
.navitem.feat{position:relative;margin:3px 0;background:linear-gradient(135deg,rgba(37,106,191,.1),rgba(74,58,167,.08));color:var(--primary-hover);font-weight:600;box-shadow:inset 0 0 0 1px rgba(37,106,191,.18)}
.navitem.feat:hover{background:linear-gradient(135deg,rgba(37,106,191,.16),rgba(74,58,167,.12))}
.navitem.feat.active{background:linear-gradient(135deg,rgba(37,106,191,.2),rgba(74,58,167,.15));box-shadow:inset 0 0 0 1px rgba(37,106,191,.35)}
.navitem.feat .ic-chip{width:25px;height:25px;border-radius:8px;background:linear-gradient(135deg,var(--primary),#4a3aa7);display:grid;place-items:center;flex:none;box-shadow:0 2px 8px rgba(37,106,191,.4)}
.navitem.feat .ic-chip svg{width:14px;height:14px;color:#fff}
.navitem .ic{width:18px;height:18px;flex:none;opacity:.9}
.navitem .badge-n{margin-left:auto;font-size:11px;background:var(--critical);color:#fff;border-radius:20px;padding:1px 7px;font-weight:700}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.86);backdrop-filter:blur(20px) saturate(1.2);-webkit-backdrop-filter:blur(20px) saturate(1.2);border-bottom:1px solid var(--glass-border);padding:12px 28px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;row-gap:10px}
.topfilters{display:flex;align-items:center;gap:7px;flex-wrap:wrap;flex:1 1 auto;min-width:0}
.fchip{border:1px solid var(--border);background:var(--bg-surface);border-radius:20px;padding:7px 12px;font-size:12.5px;font-weight:600;color:var(--text-secondary);cursor:pointer;white-space:nowrap;font-family:inherit;transition:background .12s,border-color .12s,box-shadow .12s,color .12s}
.fchip:hover{border-color:var(--primary);color:var(--primary)}
.fchip.on{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:700;box-shadow:0 2px 12px rgba(37,106,191,.35),inset 0 0 0 1px rgba(255,255,255,.14)}
.fchip.on:hover{color:#fff}
.fchip.fchip-2l{display:inline-flex;flex-direction:column;align-items:flex-start;gap:1px;padding:6px 14px;line-height:1.25}
.fchip-main{font-size:12.5px;font-weight:inherit}
.fchip-sub{font-size:9.5px;font-weight:500;opacity:.75}
.topbar .search{flex:0 1 250px;max-width:250px;min-width:132px;position:relative}
.topbar .search input{width:100%;padding:8px 12px 8px 34px;border:1px solid var(--border);border-radius:8px;background:var(--bg-surface);font-size:14px;color:var(--text-primary)}
.topbar .search input:focus{outline:2px solid var(--primary);outline-offset:0;border-color:var(--primary)}
.topbar .search svg{position:absolute;left:10px;top:9px;color:var(--text-muted)}
.verchip{margin-left:auto;font-size:12px;color:var(--text-secondary);background:var(--bg-surface);border:1px solid var(--border);border-radius:20px;padding:5px 12px;white-space:nowrap}
/* four filter chips plus the Classification select need the room on laptop widths, so the
   data-as-of chip (duplicated in every page sub-heading) yields first. */
@media(max-width:1320px){.verchip{display:none}}
/* live-sync status pill */
.syncp{display:inline-flex;align-items:center;gap:7px;cursor:pointer;user-select:none}
.syncp .dot{width:7px;height:7px;border-radius:50%;flex:none}
.syncp .dot.ok{background:var(--good);box-shadow:0 0 0 3px rgba(27,158,99,.16)}
.syncp .dot.run{background:var(--primary);animation:pulseD 1s ease-in-out infinite}
.syncp .dot.err{background:var(--critical);box-shadow:0 0 0 3px rgba(198,45,45,.16)}
.syncp .dot.idle{background:var(--text-muted)}
.syncp b{color:var(--text-primary);font-weight:600}
.syncp .rf{color:var(--primary);font-weight:700;font-size:11px}
@keyframes pulseD{0%,100%{opacity:.35}50%{opacity:1}}
@media(max-width:1120px){.topbar .search{flex:0 1 190px;max-width:190px}}
.rolechip{font-size:12px;color:#fff;background:var(--primary);border-radius:20px;padding:5px 12px;font-weight:600}
.searchres{position:absolute;top:40px;left:0;right:0;background:var(--bg-surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--elev-3);max-height:360px;overflow-y:auto;display:none;z-index:40}
.searchres.show{display:block}
.searchres .sr{padding:9px 12px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--border)}
.searchres .sr:hover{background:var(--primary-subtle)}
.searchres .sr .t{font-size:10px;text-transform:uppercase;color:var(--text-muted);letter-spacing:.05em}

.content{padding:22px 28px 60px;max-width:1440px;width:100%}
.pagehead{margin:2px 0 4px}
.pagehead h1{font-size:26px;font-weight:700;margin:0}
.pagehead .sub{color:var(--text-secondary);font-size:14px;margin-top:3px}
.breadcrumb{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--text-muted);margin:10px 0 2px}
.breadcrumb .cr{background:var(--bg-surface);border:1px solid var(--border);border-radius:16px;padding:3px 10px;cursor:pointer;color:var(--text-secondary);display:inline-flex;gap:6px;align-items:center}
.breadcrumb .cr:hover{border-color:var(--primary);color:var(--primary)}

.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:16px 0}
.kpi-grid.k3{grid-template-columns:repeat(3,1fr)}
.kpi{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:16px 16px 14px;box-shadow:var(--elev-1);min-width:0;transition:transform .2s,box-shadow .2s,border-color .2s}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--elev-2);border-color:rgba(37,106,191,.30)}
.kpi .lbl{font-size:12.5px;color:var(--text-muted);font-weight:500;display:flex;align-items:center;gap:6px}
.kpi .val{font-size:28px;font-weight:700;margin-top:8px;letter-spacing:-.01em}
.kpi .sub{font-size:12.5px;color:var(--text-secondary);margin-top:3px}
.kpi .val.sm{font-size:23px}
.kpi .val.neg{color:var(--critical)}
.kpi.accent{background:linear-gradient(180deg,#f4f8fe,#ffffff)}
.kpi-top{display:flex;align-items:flex-start;gap:12px}
.kpi-txt{min-width:0;flex:1}
.kpi-ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none}
.kpi-ic svg{width:19px;height:19px}
.kpi-ic.ic-blue{background:var(--primary-subtle);color:var(--primary)}
.kpi-ic.ic-green{background:#e3f6e8;color:var(--good)}
.kpi-ic.ic-orange{background:#fdece1;color:var(--serious)}
.kpi-ic.ic-purple{background:#ece8fa;color:#4a3aa7}

.grid2{display:grid;grid-template-columns:1.35fr 1fr;gap:16px;margin-top:4px}
.grid2b{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:16px 18px;box-shadow:var(--elev-1);margin-bottom:16px;min-width:0;transition:box-shadow .2s,border-color .2s}
.card:hover{border-color:rgba(37,106,191,.30)}
.card h3{margin:0;font-size:15px;font-weight:600}
.card .qh{font-size:12.5px;color:var(--text-muted);margin:2px 0 12px}
.card-hd{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.card-hd .link{font-size:12.5px;font-weight:600;cursor:pointer}

.barrow{display:grid;grid-template-columns:170px 1fr 96px;gap:10px;align-items:center;padding:5px 0;cursor:pointer}
.barrow:hover .lab{color:var(--primary)}
.barrow .lab{font-size:13px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barrow .track{background:var(--bg-page);border-radius:5px;height:20px;overflow:hidden;position:relative}
.barrow .fill{height:100%;border-radius:5px}
.barrow .amt{font-size:13px;text-align:right;font-weight:600}
.barrow .amt small{display:block;font-weight:400;color:var(--text-muted);font-size:11px}

table.dt{width:100%;border-collapse:collapse;font-size:13px}
table.dt th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--border);cursor:pointer;white-space:nowrap;position:sticky;top:0;background:var(--bg-surface);backdrop-filter:blur(8px)}
table.dt th.num,table.dt td.num{text-align:right}
table.dt td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
table.dt tr:hover td{background:var(--bg-raised)}
table.dt tr.click{cursor:pointer}
table.dt tr.open>td{background:var(--primary-subtle)}
.dt tr.rc-det>td{padding:0}
.dt tr.rc-open>td,.dt tr.rc-open:hover>td{background:var(--primary-subtle)}
.dt tr.rc-open>td:first-child{box-shadow:inset 3px 0 0 var(--primary)}
.dt tr.rc-open b{color:var(--primary-hover)}
.sctable td:first-child{min-width:300px;padding-top:9px;padding-bottom:10px}
.scname{display:flex;align-items:center;gap:8px}
.scname b{font-weight:600}
.sv-ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none}
.sv-ic svg{width:17px;height:17px}
.sv-gauge{min-width:140px;padding:2px 0}
.sv-gauge-pct{font-size:13px;font-weight:700;margin-bottom:5px}
.sv-gauge-track{position:relative;height:5px;background:var(--bg-page);border-radius:5px;margin:0 6px}
.sv-gauge-fill{position:absolute;left:0;top:0;height:100%;border-radius:5px;opacity:.35}
.sv-gauge-dot{position:absolute;top:50%;width:11px;height:11px;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 0 2px #fff,0 1px 3px rgba(11,11,11,.25)}
.sv-gauge-ends{display:flex;justify-content:space-between;font-size:9.5px;color:var(--text-muted);margin-top:4px}
.sv-sec-pill{display:inline-flex;align-items:center;padding:3px 11px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap}
.chev{width:19px;height:19px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:9px;line-height:1;flex:none;vertical-align:middle;background:var(--bg-page);color:var(--text-secondary);border:1px solid var(--border);transition:background .15s,color .15s,border-color .15s,box-shadow .15s}
.chev.open{background:var(--primary);color:#fff;border-color:var(--primary);box-shadow:0 1px 3px rgba(37,106,191,.35)}
.chev-x{display:inline-flex;width:19px;justify-content:center;color:var(--text-muted);opacity:.45;vertical-align:middle}
tr.click:hover .chev:not(.open),.tree .comprow:hover .chev:not(.open),.tree .subrow:hover .chev:not(.open),.grp-row:hover .chev:not(.open){background:var(--primary-subtle);color:var(--primary);border-color:rgba(37,106,191,.28)}
.tree td{white-space:nowrap}
.tree td:first-child{white-space:normal;min-width:320px}
.tree .nm{display:flex;align-items:center;gap:8px}
.tree .chev{margin:0}
.tree tr.comprow{cursor:pointer}
.tree tr.comprow>td{background:var(--bg-raised);border-bottom:1px solid var(--border)}
.tree tr.comprow:hover>td{background:rgba(37,106,191,.06)}
.tree tr.subrow{cursor:pointer}
.tree tr.subrow:hover>td{background:var(--bg-raised)}
.tree tr.total>td{font-weight:700;border-top:2px solid var(--border);background:var(--primary-subtle)}
.tree .muted-cell{color:var(--text-muted)}
.tree tr.det>td{padding:14px 16px;background:linear-gradient(135deg,rgba(37,106,191,.08) 0%,rgba(74,58,167,.06) 45%,rgba(27,175,122,.05) 100%)}
.tree thead th{position:static;vertical-align:bottom}
.tree tr.secrow>td{background:rgba(37,106,191,.06);font-weight:700;color:var(--primary-hover);font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;border-bottom:1px solid var(--border)}
.tree tr.secrow>td.num{color:var(--text-secondary)}
.tree .vname{font-weight:700}
.tree .subname{padding-left:22px;font-weight:600}
.tree tr.subrow.open>td,.tree tr.subrow.open:hover>td{background:var(--primary-subtle)}
.tree tr.subrow.open>td:first-child{box-shadow:inset 3px 0 0 var(--primary)}
.tree tr.subrow.open .nm{color:var(--primary-hover);font-weight:700}
.tree tr.comprow.open>td,.tree tr.comprow.open:hover>td{background:var(--primary-subtle)}
.tree tr.comprow.open .vname{color:var(--primary-hover)}
@keyframes drop{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.tree tr.subrow{animation:drop .22s ease}
.ubar{height:6px;border-radius:4px;background:var(--bg-page);overflow:hidden;margin-top:4px;min-width:52px;display:inline-block;width:100%;max-width:80px;vertical-align:middle}
.ubar>span{display:block;height:100%;border-radius:4px;background:var(--primary)}
.usage{max-height:290px;overflow:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--border);border-radius:8px}
.usage table{width:100%;border-collapse:collapse;font-size:12.5px}
.usage th{position:sticky;top:0;background:var(--bg-surface);text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);padding:7px 9px;border-bottom:1px solid var(--border);z-index:1}
.usage th.num,.usage td.num{text-align:right}
.usage td{padding:7px 9px;border-bottom:1px solid var(--border);vertical-align:top}
.usage .subc{white-space:normal;font-weight:600;color:var(--text-primary);font-size:12.5px}
.grp-item{border-bottom:1px solid var(--border)}
.grp-item:last-child{border-bottom:none}
.grp-row{cursor:pointer}
.grp-row .chev{margin-right:6px}
.grp-row.open .lab{color:var(--primary);font-weight:600}
.grp-drop{padding:12px 8px 14px;background:linear-gradient(135deg,rgba(37,106,191,.08) 0%,rgba(74,58,167,.06) 45%,rgba(27,175,122,.05) 100%);border-radius:12px;margin:4px 0 12px;animation:drop .3s cubic-bezier(.2,.7,.3,1)}
.grp-drop .usage{background:rgba(255,255,255,.82);backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3);border:1px solid var(--border);box-shadow:0 10px 26px rgba(16,24,40,.12),inset 0 1px 0 rgba(255,255,255,.04)}
.grp-drop .usage th{background:rgba(246,249,253,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.grp-drop .usage tbody tr:hover{background:rgba(37,106,191,.06)}
.grp-drop .usage tbody tr.txrow>td,.grp-drop .usage tbody tr.txrow:hover>td{padding:3px 6px 10px;background:rgba(246,249,253,.72)}
.txmini{width:100%;border-collapse:collapse;font-size:11.5px;background:var(--bg-surface);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.txmini th{text-align:left;font-size:9.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--text-muted);font-weight:600;padding:6px 9px;border-bottom:1px solid var(--border);background:var(--bg-raised)}
.txmini th.num{text-align:right}
.txmini td{padding:6px 9px;border-bottom:1px solid rgba(11,11,11,.06);vertical-align:top;color:var(--text-primary)}
.txmini td.num{text-align:right}
.txmini tbody tr:last-child td{border-bottom:none}
.txnar{font-size:10.5px;color:var(--text-secondary);font-weight:400;white-space:normal;line-height:1.35;margin-top:2px;max-width:440px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
table.dt .minibar{height:6px;border-radius:4px;background:var(--bg-page);overflow:hidden;margin-top:4px}
table.dt .minibar>span{display:block;height:100%;border-radius:4px}

.insight{display:flex;gap:11px;padding:11px 12px;border:1px solid var(--border);border-left-width:3px;border-radius:8px;margin-bottom:9px;background:var(--bg-raised);cursor:pointer}
.insight:hover{border-color:var(--primary)}
.insight .ico{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;flex:none;font-size:13px;color:#fff;font-weight:700}
.insight .tx{font-size:13px;color:var(--text-secondary);line-height:1.4}
.insight .tx b{color:var(--text-primary)}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px}
.b-crit{background:#fbeaea;color:#a52121}
.b-ser{background:#fdece1;color:#9a4116}
.b-warn{background:#fdf3d7;color:#8a6100}
.b-good{background:#e3f6e8;color:#12703f}
.b-mut{background:var(--bg-page);color:var(--text-secondary)}
.b-pri{background:var(--primary-subtle);color:var(--primary-hover)}
.hbadge{font-size:10.5px;padding:2px 8px 2px 6px;white-space:nowrap;font-weight:700;letter-spacing:.01em;box-shadow:inset 0 0 0 1px rgba(11,11,11,.04);cursor:default}
.hs-name-t{display:block}
.hs-name-h{margin-top:4px}
.hs-name-h .hbadge{font-size:10px;padding:1px 7px 1px 5px}

/* ---- Infrastructure MDSD utilisation table ---- */
.mdsd-tbl{width:100%}
.mdsd-thead,.mdsd-row{display:grid;grid-template-columns:minmax(180px,1.3fr) minmax(220px,320px) 108px 108px 108px 92px;gap:14px;align-items:center}
.mdsd-thead{padding:13px 20px;background:linear-gradient(180deg,rgba(37,106,191,.06),rgba(37,106,191,.02));border-bottom:1px solid var(--border);font-size:11.5px;font-weight:700;color:var(--text-secondary)}
.mdsd-thead .num{text-align:right}
.mdsd-th{display:flex;align-items:center;gap:6px}
.mdsd-th.num{justify-content:flex-end}
.mdsd-sort{display:inline-flex;flex-direction:column;gap:1px;line-height:0}
.mdsd-sbtn{border:none;background:none;padding:0;margin:0;cursor:pointer;color:var(--text-muted);font-size:7px;line-height:1;width:14px;height:8px;display:flex;align-items:center;justify-content:center;border-radius:2px;flex:none}
.mdsd-sbtn:hover{color:var(--primary);background:var(--primary-subtle)}
.mdsd-sbtn.on{color:var(--primary)}
.mdsd-row{padding:12px 20px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .12s}
.mdsd-row:last-of-type{border-bottom:none}
.mdsd-row:hover{background:var(--bg-raised)}
.mdsd-row.open{background:var(--primary-subtle)}
.mdsd-head{display:flex;align-items:center;gap:10px;min-width:0}
.mdsd-head b{font-weight:600;font-size:13.5px;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mdsd-row.open .mdsd-head b{color:var(--primary-hover)}
.mdsd-chev{width:22px;height:22px;border-radius:50%;border:1px solid var(--border);background:var(--bg-surface);display:inline-flex;align-items:center;justify-content:center;font-size:10px;color:var(--text-secondary);flex:none;transition:background .15s,color .15s,border-color .15s}
.mdsd-row:hover .mdsd-chev{border-color:var(--primary);color:var(--primary)}
.mdsd-row.open .mdsd-chev{background:var(--primary);border-color:var(--primary);color:#fff}
.mdsd-ic{width:26px;height:26px;border-radius:8px;background:var(--bg-page);display:grid;place-items:center;flex:none;color:var(--text-muted)}
.mdsd-ic svg{width:14px;height:14px}
.mdsd-ov{display:flex;align-items:center;gap:10px;min-width:0}
.mdsd-ov .badge{flex:none}
.mdsd-bar{flex:1;height:27px;border-radius:14px;background:var(--bg-page);display:flex;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(11,11,11,.05);min-width:56px}
.mdsd-bar>span{display:flex;align-items:center;justify-content:center;height:100%;font-size:10.5px;font-weight:700;color:#fff;white-space:nowrap;text-shadow:0 1px 1.5px rgba(0,0,0,.18);animation:growW .6s cubic-bezier(.2,.7,.3,1)}
.mdsd-seg-u{background:linear-gradient(180deg,rgba(255,255,255,.20),rgba(255,255,255,0)),var(--good)}
.mdsd-seg-b{background:linear-gradient(180deg,rgba(255,255,255,.20),rgba(255,255,255,0)),var(--serious)}
.mdsd-nums{display:contents}
.mdsd-num{text-align:right;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--text-primary)}
.mdsd-util{text-align:right}
.mdsd-mlbl{display:none}
.mdsd-legend{display:flex;align-items:center;justify-content:flex-end;flex-wrap:wrap;gap:8px 20px;padding:12px 20px;font-size:11.5px;color:var(--text-secondary);background:var(--bg-raised)}
.mdsd-legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:6px;vertical-align:-1px}
.mdsd-legend .lu{background:var(--good)}
.mdsd-legend .lb{background:var(--serious)}
.mdsd-drop{padding:14px 20px 16px;background:linear-gradient(135deg,rgba(37,106,191,.08) 0%,rgba(74,58,167,.06) 45%,rgba(27,175,122,.05) 100%);border-bottom:1px solid var(--border);animation:drop .22s ease}
@media(max-width:900px){
  .mdsd-thead,.mdsd-row{grid-template-columns:minmax(140px,1fr) minmax(160px,220px) 86px 86px 86px 78px;gap:9px;padding-left:14px;padding-right:14px}
}
@media(max-width:640px){
  .mdsd-thead{display:none}
  .mdsd-thead,.mdsd-row{grid-template-columns:1fr}
  .mdsd-row{display:flex;flex-direction:column;align-items:stretch;gap:9px;padding:13px 14px}
  .mdsd-nums{display:flex;flex-wrap:wrap;gap:8px 18px}
  .mdsd-mlbl{display:inline;color:var(--text-muted);font-weight:400}
  .mdsd-num,.mdsd-util{text-align:left;font-size:12px}
  .mdsd-legend{justify-content:flex-start}
}

.dki-note{display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,rgba(37,106,191,.06),rgba(74,58,167,.04));border:1px solid var(--border);border-radius:10px;padding:12px 14px;font-size:13px;color:var(--text-secondary);margin-bottom:16px;box-shadow:var(--elev-1)}
.dki-note b{color:var(--text-primary)}
.dki-note .ico{width:30px;height:30px;border-radius:8px;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:800;font-size:12px;flex:none}
/* cross-page reconciliation strip: bridges this page's centre-only expenditure to the
   scheme-wide "Expenditure to date" shown on Financial Overview / Component Tracker, so the
   two figures can never read as contradictory. */
.reco{display:flex;align-items:center;flex-wrap:wrap;gap:10px 14px;background:var(--bg-surface);border:1px solid var(--border);border-left:3px solid var(--primary);border-radius:10px;padding:11px 15px;margin:0 0 16px;font-size:13px;color:var(--text-secondary);box-shadow:var(--elev-1)}
.reco .rl{font-weight:700;color:var(--text-primary);white-space:nowrap}
.reco .op{color:var(--text-muted);font-weight:700}
.reco .rv{font-weight:700;color:var(--text-primary);white-space:nowrap}
.reco .rt{margin-left:auto;font-size:12px;color:var(--text-muted)}
.reco .rt b{color:var(--primary)}
@media(max-width:720px){.reco{font-size:12px;gap:6px 10px}.reco .rt{margin-left:0;flex-basis:100%}}
/* ---- SAI Format Summary: the finance wing's own statutory summary layout ----
   A bordered grid rather than the platform's borderless tables, because this panel exists to
   reproduce an established reporting format one-for-one. Typography, colours and interaction
   still come from the platform's design system. */
/* The summary is presented as a document sheet: capped and centred on the page rather than
   stretched edge to edge, which is what the format is meant to look like and keeps each
   figure near its label. The cap sits on a wrapper so the basis strip above the sheet and the
   drop-down panels inside it all share the same measure. */
.saif-page{max-width:1040px;margin:0 auto}
/* ---- Attention Centre: ageing releases, grouped by centre ---- */
.agc-sec{margin:0 0 18px}
.agc-band{display:flex;align-items:center;gap:13px;padding:12px 16px;border:1px solid var(--border);border-bottom:none;border-radius:12px 12px 0 0;background:linear-gradient(135deg,#fdf3f3,#fff)}
.agc-badge{width:34px;height:34px;border-radius:10px;background:#fbeaea;color:var(--critical);display:grid;place-items:center;flex:none}
.agc-badge svg{width:17px;height:17px}
.agc-id{min-width:0;flex:1}
.agc-name{font-size:15.5px;font-weight:700;color:var(--text-primary);letter-spacing:-.01em}
.agc-tag{font-size:12px;color:var(--text-muted);margin-top:2px}
.agc-right{margin-left:auto;text-align:right;flex:none}
.agc-rv{font-size:18px;font-weight:700;color:var(--critical)}
.agc-rl{font-size:11px;color:var(--text-muted);margin-top:1px}
.agc-body{border:1px solid var(--border);border-top:none;border-radius:0 0 12px 12px;background:var(--bg-surface);box-shadow:var(--elev-1);padding:0 0 2px}
/* Fixed layout with explicit column widths. Without it the long narration drives the whole
   table and squeezes the money columns until they wrap mid-figure. The clamp lives on an
   inner div, never on the cell: `display:-webkit-box` on a <td> takes it out of the table
   layout entirely and the text escapes its column. */
.agc-tbl{margin:0;table-layout:fixed;width:100%;min-width:840px}
.agc-tbl tbody tr:hover>td{background:var(--bg-app)}
.agc-tbl th,.agc-tbl td{vertical-align:middle;padding:9px 10px}
.agc-tbl th:nth-child(1),.agc-tbl td:nth-child(1){width:21%}
.agc-tbl th:nth-child(2),.agc-tbl td:nth-child(2){width:33%}
.agc-tbl th:nth-child(3),.agc-tbl td:nth-child(3){width:10%}
.agc-tbl th:nth-child(4),.agc-tbl td:nth-child(4){width:7%}
.agc-tbl th:nth-child(5),.agc-tbl td:nth-child(5){width:10%}
.agc-tbl th:nth-child(6),.agc-tbl td:nth-child(6){width:10%}
.agc-tbl th:nth-child(7),.agc-tbl td:nth-child(7){width:9%}
.agc-tbl td.num,.agc-tbl th.num{white-space:nowrap;font-variant-numeric:tabular-nums}
.agc-vn{font-size:13px;font-weight:700;color:var(--text-primary);overflow-wrap:anywhere}
.agc-sv{font-size:11.5px;color:var(--text-muted);font-weight:400;margin-top:2px;line-height:1.3;overflow-wrap:anywhere}
.agc-cp{margin-top:4px}
.agc-cp .sv-sec-pill{padding:1px 7px;font-size:9.5px;font-weight:700;letter-spacing:.015em;border-radius:16px}
.agc-det{font-size:11.5px;color:var(--text-secondary);line-height:1.4;font-weight:400;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.agc-tbl tfoot td{border-bottom:none;border-top:2px solid var(--border);background:var(--bg-app)}
.agc-age{display:inline-block;padding:1px 8px;border-radius:16px;background:#fdf3d7;color:#8a6100;font-size:11px;font-weight:700}
.agc-age.hot{background:#fbeaea;color:#a52121}
/* "Centres to talk to" — a ranked list inside a KPI card */
.agc-klist{margin-top:7px}
.agc-kl{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:12.5px;
  padding:2.5px 0;border-bottom:1px dashed var(--border-subtle)}
.agc-kl:last-child{border-bottom:none}
.agc-kl span{color:var(--text-secondary);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.agc-kl b{color:var(--critical);font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.agc-kl.more span,.agc-kl.more b{color:var(--text-muted);font-weight:600}
.saif-print{width:30px;height:30px;border:1px solid var(--border);background:var(--bg-surface);border-radius:8px;cursor:pointer;display:grid;place-items:center;color:var(--text-secondary);flex:none;padding:0;font-family:inherit;transition:background .12s,border-color .12s,color .12s}
.saif-print:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-subtle)}
.saif-print:active{transform:translateY(1px)}
.saif-print svg{width:15px;height:15px}
/* Print: strip the application chrome and put the summary sheet on the page on its own.
   Scoped to a body class set only for the duration of the print call, so printing from any
   other page is unaffected. Expanded drop-downs print as they appear on screen. */
@media print{
  @page{margin:12mm}
  body.print-saif{background:#fff}
  body.print-saif .sidebar,body.print-saif .topbar,body.print-saif .sbBackdrop,
  body.print-saif .sidebar-backdrop,body.print-saif #tip,body.print-saif .pagehead,
  body.print-saif .kpi-grid,body.print-saif .reco,body.print-saif .searchres{display:none!important}
  body.print-saif .app{display:block}
  body.print-saif .content{padding:0!important}
  body.print-saif .saif-page{max-width:none;margin:0}
  body.print-saif .saif-doc{border:1px solid #8a8a8a;box-shadow:none;border-radius:0;margin:0}
  body.print-saif .saif-scroll{overflow:visible}
  body.print-saif .saif{min-width:0;font-size:9.5pt}
  body.print-saif .saif td{border-color:#8a8a8a}
  body.print-saif .saif .car{display:none}
  body.print-saif .saif-inner{max-width:none}
  body.print-saif tr{page-break-inside:avoid}
  body.print-saif *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
.saif-doc{background:var(--bg-surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--elev-1);overflow:hidden;margin-bottom:16px}
.saif-scroll{overflow-x:auto}
.saif{width:100%;min-width:790px;border-collapse:collapse;font-size:13px;color:var(--text-primary)}
.saif td,.saif th{border:1px solid var(--border);padding:7px 11px;vertical-align:middle}
.saif .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;width:116px}
.saif .zero{color:var(--text-muted)}
.saif tr.doc-t>td{background:#f7f9fc;text-align:center;font-weight:700;font-size:14px;letter-spacing:.01em}
.saif tr.doc-t>td.meta{text-align:center;font-weight:600;font-size:12px;color:var(--text-secondary);letter-spacing:0}
.saif tr.colhd>td{background:var(--bg-app);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.045em;color:var(--text-secondary);text-align:center}
.saif tr.grant>td{font-weight:600}
.saif tr.blank>td{border-left:none;border-right:none;background:var(--bg-app);padding:5px}
.saif tr.band>td{background:#f7f9fc;font-weight:700}
.saif tr.grp>td{background:#fbfcfe;font-weight:700}
.saif tr.sub>td:first-child{padding-left:30px}
.saif tr.tot>td{background:var(--bg-app);font-weight:700}
.saif tr.bal>td{background:#fdf1f1;font-weight:700;color:var(--critical);border-color:#f2d6d6}
.saif tr.bal>td:first-child{color:var(--critical)}
.saif tr.click{cursor:pointer}
.saif tr.click:hover>td{background:var(--primary-subtle)}
.saif tr.open>td{background:var(--primary-subtle)}
.saif .car{display:inline-block;width:13px;color:var(--text-muted);font-size:9px;transition:transform .15s}
.saif tr.open .car{transform:rotate(90deg);color:var(--primary)}
.saif .newtag{display:inline-block;margin-left:8px;padding:1px 7px;border-radius:16px;background:#e9f0fb;color:#1b5fa8;font-size:9.5px;font-weight:700;letter-spacing:.015em;vertical-align:1px}
.saif-drop>td{padding:0!important;background:var(--bg-app)!important;border-top:none}
/* The drop-down is an inset detail panel, not a full-width table: capping it keeps each
   figure close to its label instead of stranding the numbers at the far right of a wide
   screen. One cap on the wrapper governs the heading, the table and any note, so every
   drop-down in the panel lines up to the same edge. */
.saif-inner{padding:13px 18px 15px;max-width:740px;margin:0 auto}
.saif-inner .ih{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);font-weight:700;margin-bottom:8px}
.rcmini{width:100%;border-collapse:collapse;table-layout:fixed;font-size:12.5px;background:var(--bg-surface);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.rcmini th:nth-child(1),.rcmini td:nth-child(1){width:40%}
.rcmini th:nth-child(2),.rcmini td:nth-child(2),
.rcmini th:nth-child(3),.rcmini td:nth-child(3),
.rcmini th:nth-child(4),.rcmini td:nth-child(4){width:20%}
.rcmini th,.rcmini td{padding:6px 11px;border-bottom:1px solid var(--border-subtle)}
.rcmini th{background:var(--bg-app);font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);font-weight:700;text-align:right}
.rcmini th:first-child{text-align:left}
.rcmini td{text-align:right;font-variant-numeric:tabular-nums}
.rcmini td:first-child{text-align:left}
.rcmini tr:last-child td{border-bottom:none}
.rcmini tr.t td{background:var(--bg-app);font-weight:700;border-top:1px solid var(--border)}
.rcmini .un{color:var(--critical);font-weight:600}
.rcmini .nilrow td{color:var(--text-muted);font-style:italic}
/* three-step expenditure build-up in every drop-down: centres only -> add DDO KI HQ-direct
   -> total, which always equals the component row above. Makes the HQ-direct component
   visible as an arithmetic step instead of a footnote. */
.rcmini tr.sub-t td{background:var(--bg-app);font-weight:700;border-top:1px solid var(--border);color:var(--text-primary)}
.rcmini tr.add-t td{background:#fbfcfe;font-weight:600;color:var(--text-secondary)}
.rcmini tr.add-t td:first-child{padding-left:24px}
.rcmini tr.add-t .plus{display:inline-block;width:15px;color:var(--primary);font-weight:800}
/* in the narrower column the qualifier and the tie-confirmation each take their own line
   rather than wrapping mid-phrase */
.rcmini tr.add-t .nb{display:block;margin-left:15px;margin-top:1px;color:var(--text-muted);font-weight:400;font-size:10.5px;line-height:1.35}
.rcmini tr.add-t.nilv td,.rcmini tr.add-t.nilv .plus{color:var(--text-muted)}
.rcmini tr.grand td{background:var(--primary-subtle);font-weight:800;color:var(--text-primary);border-top:2px solid var(--primary);border-bottom:none;padding-top:8px;padding-bottom:8px}
.rcmini tr.grand .tick{display:block;margin-top:2px;color:var(--good);font-weight:700;font-size:10.5px;white-space:nowrap}
.rcmini tr.dash td{color:var(--text-muted)}
@media(max-width:820px){.saif-inner{padding:10px 10px 12px 14px;max-width:none}.rcmini{font-size:11.5px}.rcmini th,.rcmini td{padding:5px 7px}}
.saif-note{font-size:12.5px;color:var(--text-secondary);background:var(--bg-surface);border:1px dashed var(--border);border-radius:8px;padding:10px 13px}
@media(max-width:720px){.saif{font-size:12px}.saif td,.saif th{padding:6px 7px}.saif .num{width:78px}}
/* ---- SAI KI 1 / KI 2 / Infra delivery blocks ---- */
.kig-sec{margin:0 0 24px}
.kig-band{display:flex;align-items:center;gap:14px;padding:14px 18px;border:1px solid var(--border);border-bottom:none;border-radius:12px 12px 0 0;background:var(--bg-surface)}
.kig-badge{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px;letter-spacing:.02em;flex:none;box-shadow:0 2px 8px rgba(0,0,0,.13)}
.kig-id{min-width:0;flex:1}
.kig-name{font-size:16.5px;font-weight:700;color:var(--text-primary);letter-spacing:-.01em}
.kig-tag{font-size:12.5px;color:var(--text-muted);margin-top:2px}
.kig-right{margin-left:auto;text-align:right;flex:none}
.kig-rv{font-size:19px;font-weight:700;letter-spacing:-.01em}
.kig-rl{font-size:11.5px;color:var(--text-muted);margin-top:1px}
.kig-body{border:1px solid var(--border);border-top:none;border-radius:0 0 12px 12px;background:var(--bg-surface);padding:16px 18px 18px;box-shadow:var(--elev-1)}
.kig-body .kpi-grid{margin:0 0 16px}
/* group read-out: three labelled stat tiles rather than one run-on sentence, so each figure
   has its own heading and the numbers stay scannable at a glance. */
.kig-read{display:flex;flex-wrap:wrap;margin:0 0 14px;background:var(--bg-app);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.kig-stat{flex:1 1 190px;min-width:0;padding:9px 14px;border-right:1px solid var(--border)}
.kig-stat:last-child{border-right:none}
.kig-sk{font-size:10px;text-transform:uppercase;letter-spacing:.055em;color:var(--text-muted);font-weight:700;margin-bottom:3px}
.kig-sv{font-size:13px;color:var(--text-primary);font-weight:600;line-height:1.35;overflow-wrap:anywhere}
.kig-sv .op{color:var(--text-muted);font-weight:600;margin:0 2px}
.kig-sv .mut{color:var(--text-secondary);font-weight:500}
.kig-sv .eq{color:var(--primary);font-weight:700}
/* utilisation bar: same segmented component the RC / KI Infra / Sub-Vertical tables use */
.kig-barwrap{margin:0 0 14px}
.kig-barhd{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:11.5px;color:var(--text-muted);margin-bottom:5px}
.kig-barhd b{color:var(--text-primary);font-weight:600}
.kig-cmp .mdsd-bar{height:20px;border-radius:10px;min-width:88px}
.kig-cmp .mdsd-bar>span{font-size:9.5px}
.kig-cmp td.barcell{width:190px;min-width:130px}
/* component cell: name on top, classification as a small pill underneath */
.kig-cn{display:flex;align-items:center;min-width:0}
.kig-cp{margin-top:3px;padding-left:17px}
/* compact classification pill, scoped to this panel - .sv-sec-pill is shared with
   Sub-Vertical Analysis, which keeps the full-size pill. */
.kig-cp .sv-sec-pill{padding:1px 7px;font-size:9.5px;font-weight:700;letter-spacing:.015em;border-radius:16px}
/* Balance is called out in red across this panel. A NEGATIVE balance means the component has
   spent beyond its assignment - a sharper exception than unspent money - so it is flagged too,
   with the minus sign carrying the meaning. Only a true nil balance stays muted. */
.bal-red{color:var(--critical);font-weight:600}
.bal-over{color:var(--critical);font-weight:700}
.bal-over::after{content:' ▲';font-size:9px;vertical-align:1px}
@media(max-width:720px){
  .kig-stat{flex:1 1 100%;border-right:none;border-bottom:1px solid var(--border)}
  .kig-stat:last-child{border-bottom:none}
  .kig-cmp td.barcell{display:none}.kig-cmp th.barcell{display:none}
}
.kig-share{display:flex;height:36px;border-radius:9px;overflow:hidden;border:1px solid var(--border);margin:2px 0 10px}
.kig-share span{display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700;min-width:0;overflow:hidden;white-space:nowrap;transition:flex-grow .2s}
.kig-cmp{width:100%;border-collapse:collapse;font-size:13px}
.kig-cmp th,.kig-cmp td{padding:9px 10px;border-bottom:1px solid var(--border-subtle);text-align:right;white-space:nowrap}
.kig-cmp th{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);font-weight:600}
.kig-cmp th:first-child,.kig-cmp td:first-child{text-align:left}
.kig-cmp tbody tr:last-child td{border-bottom:none}

/* ============================================================
   MOBILE HARDENING LAYER  (appended — phones & small tablets only)
   Every rule below lives inside a media query, so the desktop
   experience is byte-for-byte unchanged. Ordered widest → narrowest.
   ============================================================ */

/* ---- Tablet / large phone (<=980px): the sidebar-drawer breakpoint ---- */
@media(max-width:980px){
  /* Stop wide children (tables, charts) from creating a page-wide
     horizontal scroll. `clip` (not `hidden`) so it doesn't turn body
     into a scroll container and break the sticky topbar. */
  html,body{overflow-x:clip}
  .app,.main,.content{min-width:0;max-width:100%}

  /* Charts stack vertically and become fluid instead of fixed-width */
  .chartwrap{flex-direction:column;align-items:stretch;gap:12px}
  .chartwrap .cc{flex:1 1 auto;width:100%;max-width:360px;margin:0 auto}
  .chart-svg{width:100%;height:auto;max-width:100%}

  /* Wide "document format" summary tables scroll within their own panel
     rather than pushing the whole page sideways */
  .saif-inner,.saif-page{overflow-x:auto;-webkit-overflow-scrolling:touch}

  /* Roomier tap target for every drawer nav item */
  .navitem{padding:11px 12px;font-size:15px}

  /* Momentum scrolling + slim scrollbars on all horizontal table wrappers */
  .tscroll{scrollbar-width:thin}
  .tscroll::-webkit-scrollbar{height:6px}
  .tscroll::-webkit-scrollbar-thumb{background:rgba(16,24,40,.22);border-radius:3px}
}

/* ---- Phone (<=640px) ---- */
@media(max-width:640px){
  /* Search drops onto its own full-width row beneath the hamburger + filters */
  .topbar .search{order:9;flex:1 1 100%;max-width:none;min-width:0}

  /* Thumb-friendly controls (WCAG ~44px target where practical) */
  .btn,.fchip,.chip-sel{min-height:40px;display:inline-flex;align-items:center}
  .toggle button{padding:8px 14px;font-size:13px}
  .card-hd .link{padding:4px 0;display:inline-block}
  .hamburger{width:42px;height:42px}
  .navitem{padding:12px}

  /* Keep table cells legible while horizontally scrolling */
  table.dt th,table.dt td{padding:9px 10px}

  /* Hover tooltips are pointer-only; hide on touch so they can't stick */
  #tip{display:none!important}

  /* Action tools wrap to a full row instead of crushing against the edge */
  .tools{margin-left:0;width:100%;justify-content:flex-start;flex-wrap:wrap}
  .filterbar{gap:8px}
}

/* ---- Small phones (<=380px) ---- */
@media(max-width:380px){
  .content{padding:12px 10px 40px}
  .kpi{padding:12px 11px 10px}
  .kpi .val{font-size:20px}
  .kpi .val.sm{font-size:17px}
  .pagehead h1{font-size:18px}
  .pagehead .sub{font-size:12.5px}
  .brand .bt{font-size:13px}
  .brand .bs{font-size:10px}
  .card{padding:12px 11px}
  table.dt{font-size:12.5px}
  .fchip{padding:6px 9px;font-size:11px}
}

/* ---- Landscape phones: keep the drawer pattern, reclaim vertical space ---- */
@media(max-width:980px) and (orientation:landscape) and (max-height:520px){
  .topbar{padding-top:7px;padding-bottom:7px}
  .content{padding-top:12px}
  .kpi-grid,.kpi-grid.k3{grid-template-columns:repeat(3,1fr)}
}

/* ---- Honour reduced-motion preferences (accessibility) ---- */
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}

   + (off.length?`<tr class="nil"><td colspan="2">${off.join(' and ')} excluded by filter</td></tr>`:'')
   + `</table>`;
}
function vAgg(node){ if(node.leaf) return node.leaf; const a=sum(node.subs,s=>s.assign),e=sum(node.subs,s=>s.exp),b=sum(node.subs,s=>s.bal),idle=sum(node.subs,idleOf); return {assign:a,exp:e,bal:b,up:(a?e/a:0),idle}; }
/* ---- Attention Centre: ageing releases -------------------------------------------------
   One rule, applied at release (transaction) level rather than to rolled-up components:

       unspent balance on the release  >  AGE_MIN (Rs 50 lakh)
       AND the release is older than AGE_DAYS (15) days

   The second half is what makes it actionable. A large balance on money released this week is
   normal - the centre has not had time to spend it. A large balance on money released weeks
   ago is money genuinely parked. The age is measured from AS_OF, the data's own position date,
   not from today's clock, so the page reads identically whenever it is opened for a given
   dataset. Releases are scoped by the active Classification and centre chips like everything
   else, so an unticked DDO HQ / Infra-SAI removes its releases here too. */
const AGE_DAYS=15, AGE_MIN=5000000;
function ageRefDate(){ const p=String(AS_OF).split('.'); return new Date(+p[2],+p[1]-1,+p[0]); }
function ageCutoffISO(){ const d=ageRefDate(); d.setDate(d.getDate()-AGE_DAYS); return d.toISOString().slice(0,10); }
function ageDays(iso){ return Math.max(0,Math.round((ageRefDate()-new Date(iso))/864e5)); }
function ageingReleases(){
  const cut=ageCutoffISO(), ex=excludedCentres();
  const svIn=new Set(SV.filter(s=>!s.mdsd).map(s=>s.name));
  return TXN.filter(t=>t.bal>AGE_MIN && t.date && t.date<=cut
      && SECTIONS.includes(t.section) && ex.indexOf(t.rc)<0 && svIn.has(t.sv))
    .map(t=>Object.assign({},t,{age:ageDays(t.date)}))
    .sort((a,b)=>b.bal-a.bal);
}
function ageingByCentre(){
  const g=new Map();
  ageingReleases().forEach(t=>{ if(!g.has(t.rc)) g.set(t.rc,[]); g.get(t.rc).push(t); });
  return [...g.entries()].map(([rc,rows])=>({rc,rows,
      bal:sum(rows,r=>r.bal),net:sum(rows,r=>r.net),util:sum(rows,r=>r.util),
      oldest:Math.max.apply(null,rows.map(r=>r.age))}))
    .sort((a,b)=>b.bal-a.bal);
}
function attentionCount(){ return ageingReleases().length; }

/* ---- health score: every vertical / sub-vertical / centre gets a 🟢🟡🟠🔴 rating
   from three signals - Utilisation (weight 50), Idle fund (weight 30, the sharper
   execution-bottleneck signal: money already released but sitting unused), and
   Balance (weight 20, the macro unspent picture, which also captures amounts not
   yet released at all). Zero utilisation on a real assignment is always floored
   into Critical, however the weighted score computes. ---- */
const HEALTH_META={
  healthy:{emoji:'🟢',label:'Healthy',cls:'b-good'},
  moderate:{emoji:'🟡',label:'Moderate',cls:'b-warn'},
  delayed:{emoji:'🟠',label:'Delayed',cls:'b-ser'},
  critical:{emoji:'🔴',label:'Critical',cls:'b-crit'},
  na:{emoji:'-',label:'No Assignment',cls:'b-mut'}
};
function healthOf(assign,up,idle,bal){
  if(!assign||assign<=0) return Object.assign({score:null,up:0,idleR:0,balR:0,level:'na'},HEALTH_META.na);
  const idleR=Math.min(1,Math.max(0,idle)/assign), balR=Math.min(1,Math.max(0,bal)/assign);
  let score=(up*50)+((1-idleR)*30)+((1-balR)*20);
  if(up<=0) score=Math.min(score,12);
  score=Math.max(0,Math.min(100,score));
  const level = score>=75?'healthy':score>=50?'moderate':score>=25?'delayed':'critical';
  return Object.assign({score,up,idleR,balR,level},HEALTH_META[level]);
}
function healthForNode(x){ return healthOf(x.assign, x.assign?x.exp/x.assign:0, x.idle!=null?x.idle:idleOf(x), x.bal); }
function healthTip(h){
  return h.level==='na' ? 'No assignment recorded for this line - health not applicable.' :
    `<b>${h.emoji} ${h.label}</b><br>Utilisation ${pct(h.up,0)} · Idle ${pct(h.idleR,0)} of assignment · Balance ${pct(h.balR,0)}<br>Health score ${h.score.toFixed(0)}/100`;
}
function healthTattr(h){ const dt=String(healthTip(h)).replace(/"/g,'&quot;'); return ` data-tip="${dt}" onmousemove="event.stopPropagation();tipShow(event,this.getAttribute('data-tip'))" onmouseleave="event.stopPropagation();tipHide()"`; }
function healthBadge(h){ if(!h) return ''; return `<span class="badge hbadge ${h.cls}"${healthTattr(h)}>${h.emoji} ${h.label}</span>`; }
function healthPctPill(h,cls){ if(!h) return ''; return `<span class="badge ${h.cls} ${cls||''}"${healthTattr(h)}>${pct(h.up,0)}</span>`; }

/* ---- Regional Centre KPI cards ---------------------------------------------------
   Read from the SAME module-level filtered bindings (SV / G / SECTIONS) that the centre
   table below uses. render() always runs applyFilter() first, so a click on ANY top filter
   - the Classification dropdown, the DDO KI chip or the KI Infra chip - recomputes those
   bindings and repaints these cards in lockstep with the table. No second source of truth,
   no cached total anywhere in this component.

   *** DDO HQ IS TREATED AS AN ORDINARY CENTRE ***
   The workbook's "DDO HQ" row sits inside the centre block with its own Limit Assigned /
   Actual Exp. pair, so it is aggregated exactly like PATIALA or BHOPAL - no special-casing,
   no exclusion. That makes each card a true, hand-checkable column-total of the centre
   table rendered directly beneath it, across every active centre row:

     Card 1  Assignment to Centres  = Σ centreAgg().lim  = G.limit
     Card 2  Actual Exp. by Centres = Σ centreAgg().act  = G.actual
     Card 3  Idle with Centres      = Card 1 − Card 2    = Σ centreAgg().idle

   Filter response. All three cards move with the Classification dropdown. All three are
   correctly INERT to the DDO KI chip: "DDO KI · Direct Expenditure" is the workbook's own
   separate column (col D), money spent centrally that never entered any centre limit, so
   removing it cannot change what was issued to, or drawn by, the centres - deducting it
   here would double-count. That figure is not a KPI on this page; it is reported in the
   HQ-direct note above the cards, which does track the chip. The KI Infra chip moves none
   of the three: MDSD State/Institute grants are released direct and carry no centre limit.

   Do not confuse the workbook's two "DDO HQ"-ish figures - they are ~44x apart:
     - cols E/F "DDO HQ" Limit Assigned / Actual Exp. - the centre row counted in these cards;
     - col D    "DDO KI · Direct Expenditure" (G.ddoki) - outside the centre-limit system. */
function ddokiInScope(){
  /* classification-scoped DDO-KI total that deliberately ignores the DDO KI chip, so the
     HQ-direct note can state exactly what is being withheld while the chip is unticked.
     MDSD rows never carry DDO-KI, so DATA.subverticals is the complete population here. */
  return sum(DATA.subverticals.filter(s=>SECTIONS.includes(s.section)), s=>s.ddoki||0);
}

/* ---- cross-page expenditure reconciliation -----------------------------------------
   This page reports what the centres spent; Financial Overview / Component Tracker report
   what the SCHEME spent. They differ by DDO KI HQ-direct expenditure, which is real spend
   that never passed through a centre limit. Both are correct, but seeing ₹60.60 Cr here and
   ₹99.76 Cr there with no visible bridge reads as a contradiction, so the identity is now
   stated explicitly and recomputed live from the same filtered bindings:

       centre actual (G.actual) + DDO KI direct (G.ddoki) = ex-MDSD expenditure (G.ex.exp)

   and, when the KI Infra chip is on, + MDSD expenditure = G.exp - mirroring the "Incl. KI
   Infra" caption the Overview cards already carry. Asserted in both directions rather than
   hard-coded, so if a future dataset breaks the identity the strip says so instead of
   silently printing a wrong sum. */
function rcReco(){
  const act=G.actual, dk=G.ddoki, ex=G.ex.exp, mdsdExp=G.mdsdIncluded?MDSD.grand.exp:0, all=ex+mdsdExp;
  const ok=Math.abs((act+dk)-ex)<1;
  if(!ok) return `<div class="reco" style="border-left-color:var(--critical)"><span class="rl" style="color:var(--critical)">Reconciliation error</span><span>centre actual ${cr(act)} + DDO KI ${cr(dk)} = ${cr(act+dk)}, but scheme expenditure is ${cr(ex)} (Δ ${cr(ex-act-dk)}). Figures on this page and Financial Overview will not agree - the source dataset is inconsistent.</span></div>`;
  return `<div class="reco"${tattr(`<b>Why this page and Financial Overview differ</b><br>This page measures spend <b>by the centres</b>. Financial Overview measures spend <b>by the scheme</b>, which also includes DDO KI HQ-direct expenditure - money spent centrally that never passed through a centre limit.<br>${cr(act)} + ${cr(dk)} = <b>${cr(ex)}</b>${mdsdExp?`<br>+ KI Infra (States/UTs) ${cr(mdsdExp)} = <b>${cr(all)}</b>`:''}<br><span style="opacity:.75">Both figures are correct; they answer different questions.</span>`)}>
    <span class="rl">Expenditure bridge</span>
    <span>Centres <span class="rv">${cr(act)}</span></span><span class="op">+</span>
    <span>DDO KI HQ-direct <span class="rv">${cr(dk)}</span></span><span class="op">=</span>
    <span>Scheme total <span class="rv" style="color:var(--primary)">${cr(ex)}</span></span>
    ${mdsdExp?`<span class="op">+</span><span>KI Infra <span class="rv">${cr(mdsdExp)}</span><span class="op"> = </span><span class="rv">${cr(all)}</span></span>`:''}
    <span class="rt">matches <b>Expenditure to date</b> on Financial Overview</span>
  </div>`;
}

function saifSel(names){ const m=new Map(SV.map(s=>[s.name,s])); return (names||[]).map(n=>m.get(n)).filter(Boolean); }

/* Print the summary sheet on its own. The body class is added just before printing and
   removed on afterprint (with a timer fallback for browsers that fire it unreliably), so the
   print stylesheet can never leak into normal viewing or into printing another page. */
function printSAIFmt(){
  tipHide();

  const clean=()=>{ if(done) return; done=true; b.classList.remove('print-saif'); window.removeEventListener('afterprint',clean); };

/* ---- SAI KI 1 / KI 2 / Infra delivery blocks -----------------------------------------
   A third analytical lens over the SAME sub-vertical records the rest of the platform uses.
   It is a pure re-grouping: membership is declared by explicit sub-vertical name below, and
   the three blocks form an exact partition of every non-MDSD sub-vertical - so KI 1 + KI 2 +
   Infra reconciles, to the rupee, with the ex-MDSD grand total on Financial Overview.

   Membership follows the scheme's own delivery structure:
     KI 1  - Khelo India Games, Fit India Movement, and all four sub-verticals of
             "Promotion of Inclusiveness through Sports".
     KI 2  - Talent Identification & Development, Community Coaching & Development,
             Khelo India Centres and Sports Academies. The latter two each exist as BOTH a
             Recurring and a Non-Recurring record in the workbook; both are claimed, so the
             block stays whole no matter which Classification is selected.
     Infra - New Sports Infrastructure Projects only. Deliberately EXCLUDES the KI Infra
             States/UTs (MDSD) grants, which are released direct to States and Institutes
             and have their own page; the KI Infra chip therefore cannot move these figures.

   Because a silently unclaimed sub-vertical would understate a block without any visible
   symptom, kiUnassigned() re-derives the partition on every render and the page shows a
   loud warning strip rather than quietly dropping money. */
const KI_GROUPS=[
  {key:'KI1',tag:'KI 1',name:'Khelo India 1',col:'#2a78d6',
   note:'Games, mass participation & inclusiveness',
   members:['Khelo India Games','Fit India Movement','Sports for Peace and Development','Sports for rural/indigenous/tribal','Sports for disabled sportspersons','Sports for Women']},
  {key:'KI2',tag:'KI 2',name:'Khelo India 2',col:'#4a3aa7',
   note:'Talent pathway, coaching, centres & academies',
   members:['Talent Identification & Development','Community Coaching & Development','Khelo India Centres','Khelo India Centres (N-Rec)','Sports Academies','Sports Academies (Rec)']},
  {key:'INFRA',tag:'INFRA',name:'Infrastructure (SAI)',col:'#eb6834',
   note:'New sports infrastructure · excludes KI Infra States/UTs',
   members:['New Sports Infrastructure Projects']}
];
function kiGroupAgg(){
  const byName=new Map(SV.filter(s=>!s.mdsd).map(s=>[s.name,s]));
  return KI_GROUPS.map(g=>{
    const subs=g.members.map(n=>byName.get(n)).filter(Boolean);
    const assign=sum(subs,s=>s.assign), exp=sum(subs,s=>s.exp), bal=sum(subs,s=>s.bal);
    const lim=sum(subs,s=>s.totLim||0), act=sum(subs,s=>s.totAct||0);
    return Object.assign({},g,{subs,assign,exp,bal,lim,act,ddoki:sum(subs,s=>s.ddoki||0),
      idle:lim-act, up:assign?exp/assign:0});
  });
}
function kiUnassigned(){
  const claimed=new Set(KI_GROUPS.reduce((a,g)=>a.concat(g.members),[]));
  return SV.filter(s=>!s.mdsd && !claimed.has(s.name));
}

/* ============================================================================
   SAI live-sync module — parses the Google Sheet into the platform's DATA shape.
   Written as plain ES5-ish JS so the identical source runs both here (Node test)
   and inside the platform page.
   ========================================================================== */
function csvParse(text){
  const rows=[]; let row=[], f='', q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; }
      else f+=c;
    } else if(c==='"') q=true;
    else if(c===','){ row.push(f); f=''; }
    else if(c==='\n'){ row.push(f); rows.push(row); row=[]; f=''; }
    else if(c!=='\r') f+=c;
  }
  if(f!==''||row.length){ row.push(f); rows.push(row); }
  return rows;
}
/* "2,73,87,470" / "1,754,640" / "" / "-" -> Number. Indian or western grouping both fine. */
function nnum(v){
  if(v==null) return 0;
  const s=String(v).replace(/[₹\s,]/g,'').trim();
  if(!s||s==='-') return 0;
  const n=parseFloat(s);
  return isFinite(n)?n:0;
}
function nkey(s){ return String(s==null?'':s).replace(/\s+/g,' ').trim().toLowerCase(); }

/* Sheet3 component label -> platform sub-vertical name. Exact match after normalising,
   so vertical header rows ("Khelo India Centres and Sports Academies") never collide
   with the component row ("Khelo India Centres"). */
const SYNC_SVMAP={
 'khelo india games':'Khelo India Games',
 'talent identification & development':'Talent Identification & Development',
 'talent identification and development':'Talent Identification & Development',
 'community coaching & development':'Community Coaching & Development',
 'khelo india centres':'Khelo India Centres',
 'fit india movement':'Fit India Movement',
 'sports for peace and development':'Sports for Peace and Development',
 'sports for rural/indigenous/tribal':'Sports for rural/indigenous/tribal',
 'sports for disabled sportspersons':'Sports for disabled sportspersons',
 'sports for women':'Sports for Women',
 'new sports infrastructure projects':'New Sports Infrastructure Projects',
 'khelo india centres nr':'Khelo India Centres (N-Rec)',
 'sports academies':'Sports Academies'
};
/* transaction-tab Subvertical label -> platform name (head decides the KI Centres split) */
function syncTxSv(label,head){
  const k=nkey(label);
  if(k==='khelo india centres') return head==='Non-Recurring'?'Khelo India Centres (N-Rec)':'Khelo India Centres';
  if(k==='support to academies') return 'Sports Academies';
  if(k==='fit india') return 'Fit India Movement';
  if(k==='talent identification and development') return 'Talent Identification & Development';
  return SYNC_SVMAP[k]||null;
}
/* Sheet3 fixed column geometry: 4 = DDO-KI direct, then 14 centre lim/act pairs from 5. */
const SYNC_CEN0=5;
function parseSummary(csv,centres){ return parseSummaryRows(csvParse(csv),centres); }
function parseSummaryRows(rows,centres){
  const out={};
  for(let r=0;r<rows.length;r++){
    const name=SYNC_SVMAP[nkey(rows[r][1])];
    if(!name||out[name]) continue;
    const cells=rows[r];
    // a component row always carries a numeric DDO-KI cell or centre figures
    const bc={}; let lim=0,act=0;
    for(let i=0;i<centres.length;i++){
      const l=nnum(cells[SYNC_CEN0+i*2]), a=nnum(cells[SYNC_CEN0+i*2+1]);
      bc[centres[i]]={lim:Math.round(l),act:Math.round(a)}; lim+=l; act+=a;
    }
    out[name]={ddoki:Math.round(nnum(cells[4])),totLim:Math.round(lim),totAct:Math.round(act),
      byCentre:bc, shLim:Math.round(nnum(cells[33])), shAct:Math.round(nnum(cells[34])),
      shExp:Math.round(nnum(cells[35]))};
  }
  return out;
}
function parseTxTab(csv,rcName){ return parseTxRows(csvParse(csv),rcName); }
function parseTxRows(rows,rcName){
  const out=[];
  for(let r=1;r<rows.length;r++){
    const c=rows[r]; if(!c||c.length<16) continue;
    if(!/^\d+(\.0+)?$/.test(String(c[0]||'').trim())) continue;
    const label=String(c[5]||'').trim(); if(!label) continue;
    const head=String(c[4]||'').trim();
    const sv=syncTxSv(label,head); if(!sv) continue;
    const d=String(c[1]||'').trim();
    const m=/^(\d{2})[-/](\d{2})[-/](\d{4})$/.exec(d);
    const iso=m?m[3]+'-'+m[2]+'-'+m[1]:(/^\d{4}-\d{2}-\d{2}/.test(d)?d.slice(0,10):null);
    out.push({rc:rcName,sv:sv,head:head,date:iso,
      voucher:String(c[2]||'').trim(),sanction:String(c[3]||'').trim(),
      grantee:String(c[7]||'').trim(),nar:String(c[9]||'').trim(),
      net:Math.round(nnum(c[10])),util:Math.round(nnum(c[14])),bal:Math.round(nnum(c[15]))});
  }
  return out;
}

/* Spend-category classifier.
   `scat` is a descriptive label used for the Expenditure Detail filter and tooltips - it is
   NOT a source figure. Existing releases always keep the label they already carry (matched on
   centre+voucher+amount), so this only ever runs on releases appearing for the first time.
   Rules are ordered most-specific-first and read the sub-vertical as context, because the
   narration alone is often ambiguous (a KIC release "for 07 KICS" is coach salary; the same
   phrasing under Academies is academy support). Anything genuinely unrecognised is labelled
   "Unclassified" rather than guessed into a wrong bucket. */
function syncScat(nar,sv){
  const s=String(nar||'').toUpperCase(), v=String(sv||'');
  const has=re=>re.test(s);
  if(has(/MARATHON/)) return 'Marathons & Mass Participation Events';
  if(has(/CAPACITY BUILDING/)) return 'Capacity Building Programme';
  if(has(/BOARDING/)) return 'Boarding, Lodging & Travel';
  if(has(/SCIENTIFIC EQUIPMENT/)) return 'Sports Science Equipment';
  if(has(/ASSESSMENT CAMP|PERFORMANCE ASSESSMENT CAMP/)) return 'Talent Assessment Camps';
  if(has(/WORKFORCE|E-KHEL|DIGITAL COACHING|CONSULTANT/)) return 'Programme Workforce Salary';
  if(has(/TRAVEL GRANT|KIYG|KIWG|KIBG|KITG|YOUTH GAMES|WINTER GAMES|PARA GAMES/)) return 'Athlete Travel Grant';
  if(has(/NON-CONSUMABLE|SPORTS EQUIPMENT|SPORTS GOODS/)) return 'Sports Equipment';
  if(has(/CONSUMABLE/)) return 'Sports Consumables Grant';
  if(has(/KIAS GETTING TRAINED|NCOE/)) return 'Athlete Training Support (NCOE)';
  if(v==='Sports Academies'||v==='Sports Academies (Rec)') return 'Accredited Academy Support';
  if(v==='Khelo India Centres'||v==='Khelo India Centres (N-Rec)'){
    if(has(/MANPOWER|REMUNERATION|KISCE/)) return 'Manpower Remuneration (KISCE)';
    return 'Coach Salary (PCA)';
  }
  if(has(/PCA SALARY|PCA SALARIED|COACH/)) return 'Coach Salary (PCA)';
  if(has(/MANPOWER|REMUNERATION/)) return 'Manpower Remuneration (KISCE)';
  if(v==='Fit India Movement') return 'Accredited Academy Support';
  if(v==='Talent Identification & Development') return 'Accredited Academy Support';
  if(has(/PRIZE MONEY|ORGANIZING|TOURNAMENT|LEAGUE|CONDUCTING|EVENT/)) return 'Sports Events & Tournaments';
  if(has(/ACADEMY|ACADEMIES|FOUNDATION|TRUST|SOCIETY|CLUB/)) return 'Accredited Academy Support';
  return 'Unclassified';
}

/* ============================================================================================
   LIVE SYNC — Google Sheet -> platform, every 10 minutes
   Source: "SAI Expenditure SYNC" spreadsheet, read through the public CSV endpoint.

   Safety model. The sheet is never trusted blindly: a candidate dataset is built entirely
   off to the side, put through the same invariant checks used when the data was first
   loaded, and only swapped in if every one passes. A malformed, partially-saved or
   mid-edit sheet therefore leaves the platform showing the last good figures rather than
   corrupting them, and the status pill says so.

   What the sheet supplies : DDO-KI direct, per-centre limit/actual, every release row.
   What it does NOT supply : the Ministry assignment column is blank in this workbook, so
                             assignments are carried forward from the embedded baseline.
                             Same for the KI Infra (States/UTs) block, which lives elsewhere.
   ========================================================================================== */
const SYNC={
  id:'1crNcEBnf_h6n_ZhT-WfODXNoT0zD1tX-aNvnie3Bb7Q',
  summaryTab:'Sheet3',
  txTabs:['DDO HQ','PATIALA','BANGALORE','BHOPAL','CHANDIGARH','GANDHINAGAR','KOLKATA',
          'GUWAHATI','IMPHAL','LUCKNOW','MUMBAI','SONEPAT','TRIVANDRUM'],
  intervalMs:10*60*1000,
  status:'idle', last:null, lastTry:null, err:null, timer:null, applied:0, newPoints:[]
};
/* Transport. A page opened from the filesystem cannot fetch() a remote URL - Chrome blocks
   it outright, whatever CORS headers the server sends - so the sheet is pulled with a
   <script> tag instead, which has no such restriction. Google's visualization endpoint
   answers with executable JS that calls a known global, which we own. fetch() is still used
   when the page is served over http(s), where it is the cleaner path.
   Cells are read as their FORMATTED value (`f`) when present, so dates and grouped numbers
   arrive exactly as they do in the CSV the parsers were validated against. */
function gvizCell(c){
  if(c==null) return '';
  if(c.f!=null) return String(c.f);
  return c.v==null?'':String(c.v);
}
function gvizRows(o){
  const t=o&&o.table; if(!t||!t.rows) throw new Error('unexpected response shape');
  const w=(t.cols||[]).length;
  return t.rows.map(function(r){
    const c=r&&r.c||[], out=[];
    for(let i=0;i<Math.max(w,c.length);i++) out.push(gvizCell(c[i]));
    return out;
  });
}
function jsonpTab(tab){
  return new Promise(function(res,rej){
    let done=false;
    const el=document.createElement('script');
    const fin=function(){ SYNC._cb=null; clearTimeout(tid); if(el.parentNode) el.parentNode.removeChild(el); };
    const tid=setTimeout(function(){ if(done) return; done=true; fin(); rej(new Error(tab+': timed out')); },25000);
    SYNC._cb=function(o){ if(done) return; done=true; fin();
      try{ res(gvizRows(o)); }catch(e){ rej(new Error(tab+': '+e.message)); } };
    el.onerror=function(){ if(done) return; done=true; fin(); rej(new Error(tab+': could not reach the sheet')); };
    el.src='https://docs.google.com/spreadsheets/d/'+SYNC.id+'/gviz/tq?tqx=out:json&headers=0&sheet='+
           encodeURIComponent(tab)+'&_='+Date.now();
    document.head.appendChild(el);
  });
}
/* the endpoint's default callback - route it into whichever jsonpTab is in flight */
(function(){
  const g=window.google=window.google||{};
  g.visualization=g.visualization||{};
  const q=g.visualization.Query=g.visualization.Query||{};
  const prev=q.setResponse;
  q.setResponse=function(o){ if(SYNC._cb) SYNC._cb(o); else if(typeof prev==='function') prev(o); };
})();
/* tabs are pulled one at a time: a single shared callback cannot disambiguate parallel loads */
function loadAllTabs(){
  const tabs=[SYNC.summaryTab].concat(SYNC.txTabs), out=[];
  return tabs.reduce(function(chain,t){
    return chain.then(function(){ return jsonpTab(t); }).then(function(rows){ out.push(rows); });
  },Promise.resolve()).then(function(){ return out; });
}
/* Build a candidate DATA from the sheet. Pure - touches nothing live. */
function syncBuild(summaryRows,txRows){
  const CEN=DATA.centres.slice();
  const S=parseSummaryRows(summaryRows,CEN);
  if(Object.keys(S).length<10) throw new Error('summary tab parsed only '+Object.keys(S).length+' components');
  // position date from the sheet's own title row
  let asOf=DATA.asOf;
  const head=summaryRows.slice(0,8).map(function(r){return r.join(' ');}).join(' ');
  const m=/AS ON\s*([0-9]{2}[.\-/][0-9]{2}[.\-/][0-9]{4})/i.exec(head);
  if(m) asOf=m[1].replace(/[-/]/g,'.');
  // sub-verticals: identity + assignment preserved, every measure replaced
  const subs=DATA.subverticals.map(function(o){
    const n=o.name, m2=S[n];
    const bc={}; CEN.forEach(function(c){ bc[c]=m2?{lim:m2.byCentre[c].lim,act:m2.byCentre[c].act}:{lim:0,act:0}; });
    const ddoki=m2?m2.ddoki:0, totLim=m2?m2.totLim:0, totAct=m2?m2.totAct:0;
    const exp=ddoki+totAct;
    return {name:n,short:o.short,parent:o.parent,section:o.section,code:o.code,idx:o.idx,
      assign:o.assign,ddoki:ddoki,totLim:totLim,totAct:totAct,exp:exp,
      bal:o.assign-exp,up:o.assign?exp/o.assign:0,byCentre:bc};
  });
  const byName={}; subs.forEach(function(x){ byName[x.name]=x; });
  // releases: existing labels preserved on centre+voucher+amount, new ones classified
  const known={}; (DATA.txns||[]).forEach(function(t){ known[t.rc+'|'+t.voucher+'|'+t.net]=t.scat; });
  let tx=[];
  SYNC.txTabs.forEach(function(tab,i){ tx=tx.concat(parseTxRows(txRows[i],tab)); });
  const secOf={}; subs.forEach(function(x){ secOf[x.name]=x.section; });
  tx=tx.map(function(t){
    return {rc:t.rc,sv:t.sv,section:secOf[t.sv]||t.head,head:t.head,date:t.date,
      voucher:t.voucher,sanction:t.sanction,grantee:t.grantee,nar:t.nar,
      scat:known[t.rc+'|'+t.voucher+'|'+t.net]||syncScat(t.nar,t.sv),
      net:t.net,util:t.util,bal:t.bal};
  }).sort(function(a,b){ return (a.date||'').localeCompare(b.date||'')||a.rc.localeCompare(b.rc)||a.voucher.localeCompare(b.voucher); });
  const roll=function(rows){ const g={assign:0,exp:0,bal:0,limit:0,actual:0,ddoki:0};
    rows.forEach(function(x){ g.assign+=x.assign; g.exp+=x.exp; g.bal+=x.bal; g.limit+=x.totLim; g.actual+=x.totAct; g.ddoki+=x.ddoki; }); return g; };
  const sect={}; DATA.sections.forEach(function(sec){ sect[sec]=roll(subs.filter(function(x){return x.section===sec;})); });
  const dts=tx.map(function(t){return t.date;}).filter(Boolean).sort();
  return {asOf:asOf,subverticals:subs,byName:byName,txns:tx,sectionTotals:sect,grand:roll(subs),
    releasesMeta:{count:tx.length,net:tx.reduce(function(a,t){return a+t.net;},0),
      util:tx.reduce(function(a,t){return a+t.util;},0),bal:tx.reduce(function(a,t){return a+t.bal;},0),
      asOfMin:dts[0]||null,asOfMax:dts[dts.length-1]||null},
    summary:S};
}
/* The gate. Same invariants that were checked when the data was first loaded. */
function syncValidate(b){
  const e=[], CEN=DATA.centres;
  if(!b.subverticals.length) e.push('no sub-verticals');
  if(b.txns.length<50) e.push('only '+b.txns.length+' releases parsed');
  b.subverticals.forEach(function(s){
    let l=0,a=0; CEN.forEach(function(c){ l+=s.byCentre[c].lim; a+=s.byCentre[c].act; });
    if(Math.abs(l-s.totLim)>1) e.push(s.name+': centre limits do not sum to total');
    if(Math.abs(a-s.totAct)>1) e.push(s.name+': centre actuals do not sum to total');
    if(s.exp!==s.ddoki+s.totAct) e.push(s.name+': exp != ddoki + actual');
    if(s.bal!==s.assign-s.exp) e.push(s.name+': bal != assign - exp');
    if(s.assign<0||s.totLim<0||s.totAct<0) e.push(s.name+': negative figure');
    // the sheet states its own row totals - they must agree with what we summed
    const m=b.summary[s.name];
    if(m){
      if(m.totLim!==m.shLim) e.push(s.name+': sheet limit total disagrees with its own columns');
      if(m.totAct!==m.shAct) e.push(s.name+': sheet actual total disagrees with its own columns');
      if(m.ddoki+m.totAct!==m.shExp) e.push(s.name+': sheet expenditure total disagrees');
    }
  });
  const g=b.grand;
  if(g.exp!==g.ddoki+g.actual) e.push('grand: exp != ddoki + actual');
  if(g.bal!==g.assign-g.exp) e.push('grand: bal != assign - exp');
  let sa=0,se=0; Object.keys(b.sectionTotals).forEach(function(k){ sa+=b.sectionTotals[k].assign; se+=b.sectionTotals[k].exp; });
  if(Math.abs(sa-g.assign)>1) e.push('section assignments do not sum to grand');
  if(Math.abs(se-g.exp)>1) e.push('section expenditure does not sum to grand');
  b.txns.forEach(function(t){ if(t.net<0||t.util<0) e.push('release '+t.voucher+' has a negative amount'); });
  return {ok:e.length===0,errors:e.slice(0,6)};
}
function syncApply(b){
  /* Detect genuinely NEW releases (data points) before the live set is overwritten.
     Keyed exactly as syncBuild preserves labels: centre|voucher|amount. An amount
     change surfaces as a new point (old key drops, new key appears) - which is the
     "what changed" behaviour we want. Only replace SYNC.newPoints when this sync
     actually brought something new, so the tooltip keeps showing the latest arrivals. */
  var _prev={}; (DATA.txns||[]).forEach(function(t){ _prev[t.rc+'|'+t.voucher+'|'+t.net]=1; });
  var _fresh=(b.txns||[]).filter(function(t){ return !_prev[t.rc+'|'+t.voucher+'|'+t.net]; })
    .sort(function(x,y){ return (y.date||'').localeCompare(x.date||''); });   // newest first
  if(_fresh.length) SYNC.newPoints=_fresh.map(function(t){ return {name:pointName(t), amt:t.net}; });
  DATA.asOf=b.asOf; AS_OF=b.asOf;
  DATA.subverticals=b.subverticals;
  DATA.sectionTotals=b.sectionTotals; DATA.grand=b.grand;
  DATA.verticals.forEach(function(v){
    if(v.subs) v.subs=v.subs.map(function(o){ return b.byName[o.name]||o; });
    else if(v.leaf) v.leaf=b.byName[v.leaf.name]||v.leaf;
  });
  DATA.txns=b.txns;
  TXN.length=0; Array.prototype.push.apply(TXN,b.txns);
  Object.keys(b.releasesMeta).forEach(function(k){ RMETA[k]=b.releasesMeta[k]; });
  DATA.releasesMeta=b.releasesMeta;
  SYNC.applied++;
}
function syncNow(manual){
  if(SYNC.status==='syncing') return;
  SYNC.status='syncing'; renderSyncPill();
  Promise.resolve().then(loadAllTabs).then(function(all){
    const b=syncBuild(all[0],all.slice(1));
    const v=syncValidate(b);
    if(!v.ok) throw new Error('sheet failed validation - '+v.errors[0]+(v.errors.length>1?' (+'+(v.errors.length-1)+' more)':''));
    syncApply(b);
    SYNC.status='ok'; SYNC.last=new Date(); SYNC.err=null;
  }).catch(function(err){
    SYNC.status='error';
    SYNC.err=(''+(err&&err.message||err)).slice(0,180);
  }).then(function(){
    SYNC.lastTry=new Date();
    render();
  });
}
function syncAgo(d){
  if(!d) return 'never';
  const s=Math.round((Date.now()-d.getTime())/1000);
  if(s<60) return 'just now';
  if(s<3600) return Math.floor(s/60)+' min ago';
  return Math.floor(s/3600)+' hr ago';
}
/* A short, human label for a release, used in the Live-sync tooltip. Prefers the
   grantee, then the narration, then the component / centre. */
function pointName(t){
  var s=(t.grantee||t.nar||t.sv||t.rc||'Release');
  s=(''+s).replace(/\s+/g,' ').trim();
  return s.length>36 ? s.slice(0,34)+'…' : s;
}
function renderSyncPill(){
  const el=document.getElementById('syncPill'); if(!el) return;
  const st=SYNC.status;
  const cls=st==='ok'?'ok':st==='syncing'?'run':st==='error'?'err':'idle';
  const txt=st==='syncing'?'Syncing…'
      :st==='ok'?'Live · '+syncAgo(SYNC.last)
      :st==='error'?'Sync failed · showing last good data'
      :'Data as of '+AS_OF;
  const tip=(st==='error'||SYNC.err)
    ? '<b>Live sync could not update</b><br><span style="color:var(--critical)">'+esc(SYNC.err||'unknown error')+'</span>'+
      '<br><br>The platform is showing the last figures that passed validation (as on '+AS_OF+
      '). It will retry automatically every 10 minutes.<br><span style="opacity:.75">If this persists, the sheet may be unreachable from a file:// page - see the sync note in the folder.</span>'
    : (function(){
        /* Live-sync tooltip - shows exactly five things, in order:
           1) latest new data points (name + short amount)
           2) last successful sync   3) source
           4) updates made this session   5) latest position date */
        var np=SYNC.newPoints||[];
        var latest = np.length
          ? np.slice(0,3).map(function(p){ return esc(p.name)+' &middot; <b>'+esc(crShort(p.amt))+'</b>'; }).join('<br>')
            + (np.length>3 ? '<br><span style="opacity:.7">+'+(np.length-3)+' more</span>' : '')
          : '<span style="opacity:.7">None yet this session</span>';
        return '<b>Live sync</b>'
          + '<br>Latest new data:<br>'+latest
          + '<br>Last successful sync: '+(SYNC.last?SYNC.last.toLocaleString():'not yet')
          + '<br>Source: SAI Expenditure SYNC (Google Sheet)'
          + '<br>Updates this session: '+SYNC.applied
          + '<br>Position date: <b>'+esc(AS_OF)+'</b>'
          + '<br><span style="opacity:.7">Click to sync now.</span>';
      })();
  el.innerHTML='<span class="syncp"'+tattr(tip)+' onclick="syncNow(true)"><span class="dot '+cls+'"></span>'+txt+'<span class="rf">↻</span></span>';
}
function syncStart(){
  renderSyncPill();
  syncNow();
  if(SYNC.timer) clearInterval(SYNC.timer);
  SYNC.timer=setInterval(syncNow,SYNC.intervalMs);
  setInterval(renderSyncPill,60000);   // keep the "x min ago" honest between syncs
}

renderNav(); render(); syncStart();
</script>
