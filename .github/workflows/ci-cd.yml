name: CI/CD (dev)

# CI runs on every push/PR to dev. CD (build image → push ECR → roll the ECS
# Express service) runs only after CI passes on a push to `dev`.
# Auth to AWS is via GitHub OIDC — no static access keys stored in GitHub.
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

concurrency:
  group: cicd-dev-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write   # required for OIDC federation to AWS

env:
  AWS_REGION: ap-south-1
  ECR_REPO: 114171679953.dkr.ecr.ap-south-1.amazonaws.com/efip-dev
  ECS_SERVICE_ARN: arn:aws:ecs:ap-south-1:114171679953:service/default/efip-dev
  JWT_SECRET_ARN: arn:aws:secretsmanager:ap-south-1:114171679953:secret:efip-dev/JWT_SECRET-hQVgVX
  DATABASE_URL_ARN: arn:aws:secretsmanager:ap-south-1:114171679953:secret:efip-dev/DATABASE_URL-Wt6ser

jobs:
  # ── Continuous Integration ────────────────────────────────────────────────
  ci:
    name: Build · typecheck · audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: platform/package-lock.json
      - run: npm ci
      - name: Build shared (server/web resolve @efip/shared from dist)
        run: npm run build -w @efip/shared
      - name: Typecheck all workspaces
        run: npm run typecheck
      - name: Build the deploy artifact (shared + login SPA)
        run: npm run build:deploy
      - name: Security audit — fail on High/Critical
        run: npm audit --audit-level=high

  # ── Continuous Deployment (dev only) ──────────────────────────────────────
  deploy:
    name: Deploy to ECS Express (efip-dev)
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Show OIDC subject (debug)
        run: |
          TOKEN=$(curl -sH "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+' | { P=$(cat); L=$(( (4 - ${#P} % 4) % 4 )); printf '%s' "$P"; printf '=%.0s' $(seq 1 $L 2>/dev/null); } | base64 -d 2>/dev/null | jq '{sub, aud, repository, repository_owner, ref}'

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push image (tagged with the git SHA)
        run: |
          set -euo pipefail
          IMG="$ECR_REPO:${GITHUB_SHA::7}"
          docker buildx build --platform linux/amd64 --provenance=false \
            -f platform/Dockerfile -t "$IMG" --push .
          echo "IMG=$IMG" >> "$GITHUB_ENV"

      - name: Roll the ECS Express service to the new image
        run: |
          set -euo pipefail
          aws ecs update-express-gateway-service \
            --service-arn "$ECS_SERVICE_ARN" \
            --primary-container "{\"image\":\"$IMG\",\"containerPort\":8080,\"environment\":[{\"name\":\"NODE_ENV\",\"value\":\"production\"},{\"name\":\"PORT\",\"value\":\"8080\"},{\"name\":\"PGSSL_STRICT\",\"value\":\"false\"}],\"secrets\":[{\"name\":\"JWT_SECRET\",\"valueFrom\":\"$JWT_SECRET_ARN\"},{\"name\":\"DATABASE_URL\",\"valueFrom\":\"$DATABASE_URL_ARN\"}]}" \
            --monitor-resources
