/* ---- Per-panel default stream filters --------------------------------------
   A few panels open with a fixed selection of the four stream chips so their
   figures read consistently. The preset is applied only when the ACTIVE VIEW
   CHANGES, so a chip the user toggles while staying on a panel is preserved;
   it re-asserts the default the next time the panel is opened.
     • Regional Centres  -> DDO KI only            (DDO HQ + Infra-SAI excluded)
     • Financial Overview / Component Tracker /
       SAI KI 1, KI 2 & Infra -> DDO KI + DDO HQ + Infra-SAI  (KI Infra off)
     • SAI Format Summary -> all four streams ON   (full statutory picture)
     • KI Infra (States/UTs) -> KI Infra only      (the page is about MDSD
       grants alone, so the three SAI streams are switched off)
   Panels not listed here keep the platform's global, persistent filters
   (the previous behaviour), i.e. they inherit whatever the user last set.
--------------------------------------------------------------------------- */
const EXEC_FILTER_PRESET = { inclDdoki:true, inclMdsd:false, inclHQ:true,  inclInfraSai:true  };
const ALL_FILTER_PRESET  = { inclDdoki:true, inclMdsd:true,  inclHQ:true,  inclInfraSai:true  };
const MDSD_FILTER_PRESET = { inclDdoki:false, inclMdsd:true, inclHQ:false, inclInfraSai:false };
const VIEW_FILTER_PRESETS = {
  rc:       { inclDdoki:true, inclMdsd:false, inclHQ:false, inclInfraSai:false },
  command:  EXEC_FILTER_PRESET,
  tracker:  EXEC_FILTER_PRESET,
  kigroups: EXEC_FILTER_PRESET,
  saifmt:   ALL_FILTER_PRESET,
  mdsd:     MDSD_FILTER_PRESET,
  /* Attention Centre had no entry, so it inherited whatever the previous panel
     left behind - arriving from Regional Centres carried the RC streams in.
     That was survivable while the chips were on screen to correct it; with them
     hidden it would be an invisible inconsistency, so it is pinned explicitly. */
  exceptions: EXEC_FILTER_PRESET,
};
/* Regional-Centre mode is expressed through the four existing stream flags rather
   than a parallel calculation, so every KPI, chart, table, drill-down and export
   reaches it by the same code path the platform already uses - there is no second
   definition of the figures that could drift. Re-asserted on every render, so the
   mode survives navigation and outranks the per-panel defaults below. */
function rcOnlyOn(){ return state.rcOnly===true; }
function applyRcOnly(){
  state.inclDdoki=false;      // DDO KI Direct expenditure
  state.inclMdsd=false;       // KI Infra - States/UTs (MDSD)
  state.inclHQ=false;         // DDO HQ centre
  state.inclInfraSai=false;   // INFRA-SAI centre
}
function toggleRcOnly(){
  state.rcOnly=!state.rcOnly;
  if(state.rcOnly) applyRcOnly(); else Object.assign(state,EXEC_FILTER_PRESET);
  state._filtView=state.view;
  render();
}
function applyViewFilterDefaults(){
  /* The stream chips are no longer rendered, so a panel's preset is now the ONLY
     thing that sets these flags - and it is re-asserted on every render, not just
     when the panel changes. The old "same panel -> respect manual toggles" early
     return existed to preserve a viewer's clicks; with no control left to click it
     would instead let a stray flag persist invisibly, with nothing on screen able
     to correct it. Re-asserting makes each panel's streams a property of the panel.
     rcOnly is pinned off because its chip is gone and the mode is now unreachable. */
  state.rcOnly=false;
  const preset = VIEW_FILTER_PRESETS[state.view];
  if(preset) Object.assign(state, preset);
  state._filtView = state.view;
}

function render(){ applyViewFilterDefaults(); applyFilter(); renderNav(); renderTopFilters(); renderSyncPill(); const v=state.view;
  const html = v==='command'?viewCommand():v==='rc'?viewRC():v==='sv'?viewSV():v==='mdsd'?viewMDSD():v==='kigroups'?viewKI():v==='saifmt'?viewSAIFmt():v==='trend'?viewTrend():v==='exceptions'?viewExc():v==='detail'?viewDetail():v==='profile'?viewProfile():viewTracker();
  document.getElementById('content').innerHTML=html;
  labelTableCells();
  groupTreeSections();
  renderTabbar();
}

/* ---------------------------------------------------------------------------
   Scheme-component tree: sections as groups (phones only)
   ---------------------------------------------------------------------------
   Nine components under three headings is a long scroll on a phone, and the
   headings did nothing but sit there. They become the way you navigate instead:
   tap Recurring, Non-Recurring or Infrastructure to open its components.

   This is presentational only. The table is rendered in full either way and the
   rows are hidden here afterwards, so the desktop table — where nine rows cost
   nothing and a collapsed section would only get in the way — is untouched, and
   nothing downstream has to know the difference. The toggle no-ops above the
   phone breakpoint for the same reason.

   Each section carries its own colour from SECTCOL, the same one it already
   wears on the classification pill everywhere else in the platform, so a
   component is recognisable as Recurring or Infrastructure at a glance.
--------------------------------------------------------------------------- */
const TREE_SEC_OPEN=Object.create(null);
let treeSecReady=false;
function treeSectionsInit(){
  if(treeSecReady) return;
  treeSecReady=true;
  /* Recurring carries the bulk of the scheme, so that is the one worth landing
     on; the other two are a tap away. */
  const lead=SECTIONS.indexOf('Recurring')>=0?'Recurring':SECTIONS[0];
  SECTIONS.forEach(function(s){ TREE_SEC_OPEN[s]=(s===lead); });
}
function toggleTreeSection(sec){
  TREE_SEC_OPEN[sec]=!TREE_SEC_OPEN[sec];
  groupTreeSections();          /* re-marks in place — no re-render, no scroll jump */
}
const TREE_PHONE=window.matchMedia?window.matchMedia('(max-width:640px)'):null;
function groupTreeSections(){
  const tbl=document.querySelector('#content .treecards table.dt.tree');
  if(!tbl) return;
  treeSectionsInit();
  /* Above the phone breakpoint the headings are not controls and every section
     stays open, so the row is left exactly as the table rendered it. */
  const phone=TREE_PHONE?TREE_PHONE.matches:innerWidth<=640;
  const rows=tbl.querySelectorAll(':scope > tbody > tr');
  let sec=null;
  for(let i=0;i<rows.length;i++){
    const r=rows[i];
    if(r.classList.contains('total')){ sec=null; continue; }
    if(r.classList.contains('secrow')){
      const name=(r.children[0].textContent||'').trim();
      sec=name;
      paintSection(r,name);
      /* A dedicated class, not `open`: `table.dt tr.open` already means
         "expanded drill-down" and tints the row on every screen. */
      r.classList.toggle('sec-open',!!TREE_SEC_OPEN[name]);
      if(phone){
        r.setAttribute('role','button');
        r.setAttribute('aria-expanded',TREE_SEC_OPEN[name]?'true':'false');
        r.onclick=function(){ toggleTreeSection(name); };
      }else{
        r.removeAttribute('role'); r.removeAttribute('aria-expanded'); r.onclick=null;
      }
      continue;
    }
    if(!sec) continue;
    paintSection(r,sec);
    r.classList.toggle('sec-hidden',phone&&!TREE_SEC_OPEN[sec]);
  }
}
/* Crossing the breakpoint changes whether the headings are controls at all, so
   re-mark rather than leave a resized window in the other mode's state. */
if(TREE_PHONE&&TREE_PHONE.addEventListener) TREE_PHONE.addEventListener('change',groupTreeSections);
/* Hand the row its section's identity colour, pre-mixed, so the stylesheet can
   tint a card and a rule without needing to know how to blend a hex value. */
function paintSection(row,sec){
  const c=SECTCOL[sec]||'#88909f';
  row.setAttribute('data-sec',sec);
  row.style.setProperty('--sc',c);
  row.style.setProperty('--scbg',hexToRgba(c,.10));
  row.style.setProperty('--scbd',hexToRgba(c,.32));
}

/* ============================================================================
   Mobile presentation layer — phones only
   ---------------------------------------------------------------------------
   A dense financial table is unreadable on a 390px screen: today it survives by
   scrolling sideways, which hides the very columns (Balance, Unspent) a reader
   opens the page for. The phone stylesheet re-flows each row into its own card,
   but CSS alone cannot do that, because once the <thead> is hidden a cell has no
   way to say which column it came from.

   This pass supplies exactly that missing piece: it copies each column heading
   onto the cells beneath it as `data-label`, so the stylesheet can print the
   heading beside the value. It is deliberately narrow in what it touches —
   it writes attributes and marker classes only, never cell text or values —
   so the desktop rendering is unchanged and re-running it is harmless.

   Two shapes are left alone on purpose:
     • .tree  — the component hierarchy, where indentation is the meaning and a
                flat stack of cards would destroy the parent/child reading.
     • rows that span the grid (drill-downs, group headers, sub-tables), which
                already carry their own layout; they are marked .dt-span so the
                stylesheet lets them run full width.
   ========================================================================== */
/* Longest single text node in a cell — see the note in labelTableCells(). */
function longestTextRun(el){
  const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);
  let max=0,n;
  while((n=w.nextNode())) max=Math.max(max,(n.nodeValue||'').trim().length);
  return max;
}
function labelTableCells(){
  /* Three shapes get the treatment, each with its own marker so the stylesheet
     can lay them out differently: the panel tables, the component tree, and the
     drill-down that opens inside a row (`.usage`, shared by the component and
     regional-centre expansions). */
  const wraps=document.querySelectorAll('#content .tscroll, #content .usage');
  for(let w=0;w<wraps.length;w++){
    const wrap=wraps[w], tbl=wrap.querySelector('table');
    if(!tbl||(!tbl.classList.contains('dt')&&!wrap.classList.contains('usage'))) continue;
    /* The component tree becomes cards too, but of a different shape: its rows
       are a hierarchy, and the expander and the parent/child relationship have
       to survive. It gets its own marker so the stylesheet can lay it out as a
       name, a utilisation bar and three figures, with sub-verticals inset. */
    const isTree=tbl.classList.contains('tree');

    /* Column headings carry sort controls (▲▼) inside them; strip those from a
       throwaway clone so the label reads "Balance", not "Balance▲▼".

       Every selector here is scoped to the table's own direct children. A row
       can open a nested table inside one of its cells — the voucher list under
       an expanded centre does exactly that — and an unscoped `thead th` or
       `tbody tr` reaches straight into it, which would label the inner table's
       headings with the outer table's columns. */
    const ths=tbl.querySelectorAll(':scope > thead > tr > th'), labels=[];
    for(let i=0;i<ths.length;i++){
      const c=ths[i].cloneNode(true), sorts=c.querySelectorAll('.mdsd-sort');
      for(let j=0;j<sorts.length;j++) sorts[j].remove();
      labels.push((c.textContent||'').replace(/\s+/g,' ').trim());
    }
    if(!labels.length) continue;
    wrap.classList.add(wrap.classList.contains('usage')?'usagecards':isTree?'treecards':'cardify');

    const rows=tbl.querySelectorAll(':scope > tbody > tr, :scope > tfoot > tr');
    for(let r=0;r<rows.length;r++){
      const tds=rows[r].children;
      let spans=false;
      for(let c=0;c<tds.length;c++) if(tds[c].hasAttribute('colspan')) spans=true;
      if(spans||tds.length<labels.length){ rows[r].classList.add('dt-span'); continue; }
      /* A totals row often carries one trailing spacer cell beyond the headings;
         label what maps to a heading and leave any surplus unlabelled. */
      for(let c2=0;c2<tds.length;c2++){
        if(c2<labels.length && labels[c2]) tds[c2].setAttribute('data-label',labels[c2]);
        else tds[c2].classList.add('dt-extra');
        /* Prose — a narration, a description — cannot share a line with its
           heading on a phone without being squeezed into a few characters per
           line, so it is given the full width beneath the heading instead.

           What marks a cell as prose is one long *unbroken* run of text. Total
           length would misread a cell that merely stacks several short labels
           (a voucher above a sub-vertical above a pill), which is structure,
           not prose, and reads correctly as it is. The first cell is always the
           card's title, and numeric cells are never prose. */
        if(c2>0 && !tds[c2].classList.contains('num') && longestTextRun(tds[c2])>44)
          tds[c2].classList.add('dt-long');
      }
    }
    const foot=tbl.querySelector(':scope > tfoot');
    if(foot) foot.classList.add('dt-foot');
  }

  /* A drill-down row reads as a card on a phone, and a card here should look
     like the centre card it opened from: name, utilisation, then a bar split
     green/orange before the figures. The row already states its utilisation as
     a percentage in its last cell, so lifting that number onto the row as a
     custom property lets the stylesheet draw the bar with no change to any
     render function. Rows with no limit (a direct expenditure, say) show "-"
     and simply get no bar. */
  const ucards=document.querySelectorAll('#content .usagecards > table > tbody > tr');
  for(let i=0;i<ucards.length;i++){
    const row=ucards[i], cells=row.children;
    if(row.classList.contains('txrow')||!cells.length) continue;
    const m=/(\d+(?:\.\d+)?)\s*%/.exec(cells[cells.length-1].textContent||'');
    if(!m) continue;
    row.style.setProperty('--up',Math.max(0,Math.min(100,parseFloat(m[1]))));
    row.classList.add('ub');
  }

  /* The voucher list sits one level deeper again — inside a centre inside a
     sub-vertical — and is a table in its own right rather than a wrapped one,
     so it is picked up separately. Without this the deepest level of the
     drill-down would be the only thing left scrolling sideways. */
  const minis=document.querySelectorAll('#content table.txmini');
  for(let m=0;m<minis.length;m++){
    const t=minis[m], hs=t.querySelectorAll(':scope > thead > tr > th'), ls=[];
    for(let i=0;i<hs.length;i++) ls.push((hs[i].textContent||'').replace(/\s+/g,' ').trim());
    if(!ls.length) continue;
    t.classList.add('txcards');
    const rs=t.querySelectorAll(':scope > tbody > tr');
    for(let r=0;r<rs.length;r++){
      const cs=rs[r].children;
      if(cs.length!==ls.length) continue;
      for(let c=0;c<cs.length;c++) if(ls[c]) cs[c].setAttribute('data-label',ls[c]);
    }
  }
}

/* ============================================================================
   SAI live-sync module — parses the Google Sheet into the platform's DATA shape.
   Written as plain ES5-ish JS so the identical source runs both here (Node test)
   and inside the platform page.
   ========================================================================== */
function csvParse(text){
  const rows=[]; let row=[], f='', q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; }
      else f+=c;
    } else if(c==='"') q=true;
    else if(c===','){ row.push(f); f=''; }
    else if(c==='\n'){ row.push(f); rows.push(row); row=[]; f=''; }
    else if(c!=='\r') f+=c;
  }
  if(f!==''||row.length){ row.push(f); rows.push(row); }
  return rows;
}
/* "2,73,87,470" / "1,754,640" / "" / "-" -> Number. Indian or western grouping both fine. */
function nnum(v){
  if(v==null) return 0;
  const s=String(v).replace(/[₹\s,]/g,'').trim();
  if(!s||s==='-') return 0;
  const n=parseFloat(s);
  return isFinite(n)?n:0;
}
function nkey(s){ return String(s==null?'':s).replace(/\s+/g,' ').trim().toLowerCase(); }

/* Sheet3 component label -> platform sub-vertical name. Exact match after normalising,
   so vertical header rows ("Khelo India Centres and Sports Academies") never collide
   with the component row ("Khelo India Centres"). */
const SYNC_SVMAP={
 'khelo india games':'Khelo India Games',
 'talent identification & development':'Talent Identification & Development',
 'talent identification and development':'Talent Identification & Development',
 'community coaching & development':'Community Coaching & Development',
 'khelo india centres':'Khelo India Centres',
 'fit india movement':'Fit India Movement',
 'sports for peace and development':'Sports for Peace and Development',
 'sports for rural/indigenous/tribal':'Sports for rural/indigenous/tribal',
 'sports for disabled sportspersons':'Sports for disabled sportspersons',
 'sports for women':'Sports for Women',
 'new sports infrastructure projects':'New Sports Infrastructure Projects',
 'khelo india centres nr':'Khelo India Centres (N-Rec)',
 'sports academies':'Sports Academies'
};
/* transaction-tab Subvertical label -> platform name (head decides the KI Centres split) */
function syncTxSv(label,head){
  const k=nkey(label);
  if(k==='khelo india centres') return head==='Non-Recurring'?'Khelo India Centres (N-Rec)':'Khelo India Centres';
  if(k==='support to academies') return 'Sports Academies';
  if(k==='fit india') return 'Fit India Movement';
  if(k==='talent identification and development') return 'Talent Identification & Development';
  return SYNC_SVMAP[k]||null;
}
/* Sheet3 fixed column geometry: 4 = DDO-KI direct, then 14 centre lim/act pairs from 5. */
const SYNC_CEN0=5;
function parseSummary(csv,centres){ return parseSummaryRows(csvParse(csv),centres); }
function parseSummaryRows(rows,centres){
  const out={};
  for(let r=0;r<rows.length;r++){
    const name=SYNC_SVMAP[nkey(rows[r][1])];
    if(!name||out[name]) continue;
    const cells=rows[r];
    // a component row always carries a numeric DDO-KI cell or centre figures
    const bc={}; let lim=0,act=0;
    for(let i=0;i<centres.length;i++){
      const l=nnum(cells[SYNC_CEN0+i*2]), a=nnum(cells[SYNC_CEN0+i*2+1]);
      bc[centres[i]]={lim:Math.round(l),act:Math.round(a)}; lim+=l; act+=a;
    }
    out[name]={ddoki:Math.round(nnum(cells[4])),totLim:Math.round(lim),totAct:Math.round(act),
      byCentre:bc, shLim:Math.round(nnum(cells[33])), shAct:Math.round(nnum(cells[34])),
      shExp:Math.round(nnum(cells[35]))};
  }
  return out;
}
function parseTxTab(csv,rcName){ return parseTxRows(csvParse(csv),rcName); }
function parseTxRows(rows,rcName){
  const out=[];
  for(let r=1;r<rows.length;r++){
    const c=rows[r]; if(!c||c.length<16) continue;
    if(!/^\d+(\.0+)?$/.test(String(c[0]||'').trim())) continue;
    const label=String(c[5]||'').trim(); if(!label) continue;
    const head=String(c[4]||'').trim();
    const sv=syncTxSv(label,head); if(!sv) continue;
    const d=String(c[1]||'').trim();
    const m=/^(\d{2})[-/](\d{2})[-/](\d{4})$/.exec(d);
    const iso=m?m[3]+'-'+m[2]+'-'+m[1]:(/^\d{4}-\d{2}-\d{2}/.test(d)?d.slice(0,10):null);
    out.push({rc:rcName,sv:sv,head:head,date:iso,
      voucher:String(c[2]||'').trim(),sanction:String(c[3]||'').trim(),
      grantee:String(c[7]||'').trim(),nar:String(c[9]||'').trim(),
      etype:String(c[8]||'').trim(),
      net:Math.round(nnum(c[10])),util:Math.round(nnum(c[14])),bal:Math.round(nnum(c[15]))});
  }
  return out;
}

/* Spend-category classifier.
   `scat` is a descriptive label used for the Expenditure Detail filter and tooltips - it is
   NOT a source figure. Existing releases always keep the label they already carry (matched on
   centre+voucher+amount), so this only ever runs on releases appearing for the first time.
   Rules are ordered most-specific-first and read the sub-vertical as context, because the
   narration alone is often ambiguous (a KIC release "for 07 KICS" is coach salary; the same
   phrasing under Academies is academy support). Anything genuinely unrecognised is labelled
   "Unclassified" rather than guessed into a wrong bucket. */
function syncScat(nar,sv){
  const s=String(nar||'').toUpperCase(), v=String(sv||'');
  const has=re=>re.test(s);
  if(has(/MARATHON/)) return 'Marathons & Mass Participation Events';
  if(has(/CAPACITY BUILDING/)) return 'Capacity Building Programme';
  if(has(/BOARDING/)) return 'Boarding, Lodging & Travel';
  if(has(/SCIENTIFIC EQUIPMENT/)) return 'Sports Science Equipment';
  if(has(/ASSESSMENT CAMP|PERFORMANCE ASSESSMENT CAMP/)) return 'Talent Assessment Camps';
  if(has(/WORKFORCE|E-KHEL|DIGITAL COACHING|CONSULTANT/)) return 'Programme Workforce Salary';
  if(has(/TRAVEL GRANT|KIYG|KIWG|KIBG|KITG|YOUTH GAMES|WINTER GAMES|PARA GAMES/)) return 'Athlete Travel Grant';
  if(has(/NON-CONSUMABLE|SPORTS EQUIPMENT|SPORTS GOODS/)) return 'Sports Equipment';
  if(has(/CONSUMABLE/)) return 'Sports Consumables Grant';
  if(has(/KIAS GETTING TRAINED|NCOE/)) return 'Athlete Training Support (NCOE)';
  if(v==='Sports Academies'||v==='Sports Academies (Rec)') return 'Accredited Academy Support';
  if(v==='Khelo India Centres'||v==='Khelo India Centres (N-Rec)'){
    if(has(/MANPOWER|REMUNERATION|KISCE/)) return 'Manpower Remuneration (KISCE)';
    return 'Coach Salary (PCA)';
  }
  if(has(/PCA SALARY|PCA SALARIED|COACH/)) return 'Coach Salary (PCA)';
  if(has(/MANPOWER|REMUNERATION/)) return 'Manpower Remuneration (KISCE)';
  if(v==='Fit India Movement') return 'Accredited Academy Support';
  if(v==='Talent Identification & Development') return 'Accredited Academy Support';
  if(has(/PRIZE MONEY|ORGANIZING|TOURNAMENT|LEAGUE|CONDUCTING|EVENT/)) return 'Sports Events & Tournaments';
  if(has(/ACADEMY|ACADEMIES|FOUNDATION|TRUST|SOCIETY|CLUB/)) return 'Accredited Academy Support';
  return 'Unclassified';
}

/* ============================================================================================
   LIVE SYNC — Google Sheet -> platform, every 10 minutes
   Source: "SAI Expenditure SYNC" spreadsheet, read through the public CSV endpoint.

   Safety model. The sheet is never trusted blindly: a candidate dataset is built entirely
   off to the side, put through the same invariant checks used when the data was first
   loaded, and only swapped in if every one passes. A malformed, partially-saved or
   mid-edit sheet therefore leaves the platform showing the last good figures rather than
   corrupting them, and the status pill says so.

   What the sheet supplies : DDO-KI direct, per-centre limit/actual, every release row.
   What it does NOT supply : the Ministry assignment column is blank in this workbook, so
                             assignments are carried forward from the embedded baseline.
                             Same for the KI Infra (States/UTs) block, which lives elsewhere.
   ========================================================================================== */
const SYNC={
  id:'1crNcEBnf_h6n_ZhT-WfODXNoT0zD1tX-aNvnie3Bb7Q',
  summaryTab:'Sheet3',
  txTabs:['DDO HQ','PATIALA','BANGALORE','BHOPAL','CHANDIGARH','GANDHINAGAR','KOLKATA',
          'GUWAHATI','IMPHAL','LUCKNOW','MUMBAI','SONEPAT','TRIVANDRUM'],
  intervalMs:10*60*1000,
  status:'idle', last:null, lastTry:null, err:null, timer:null, applied:0, updates:0, newPoints:[],
  lastTxn:null, notes:[]
};
/* Transport. A page opened from the filesystem cannot fetch() a remote URL - Chrome blocks
   it outright, whatever CORS headers the server sends - so the sheet is pulled with a
   <script> tag instead, which has no such restriction. Google's visualization endpoint
   answers with executable JS that calls a known global, which we own. fetch() is still used
   when the page is served over http(s), where it is the cleaner path.
   Cells are read as their FORMATTED value (`f`) when present, so dates and grouped numbers
   arrive exactly as they do in the CSV the parsers were validated against. */
function gvizCell(c){
  if(c==null) return '';
  if(c.f!=null) return String(c.f);
  return c.v==null?'':String(c.v);
}
function gvizRows(o){
  const t=o&&o.table; if(!t||!t.rows) throw new Error('unexpected response shape');
  const w=(t.cols||[]).length;
  return t.rows.map(function(r){
    const c=r&&r.c||[], out=[];
    for(let i=0;i<Math.max(w,c.length);i++) out.push(gvizCell(c[i]));
    return out;
  });
}
function jsonpTabOnce(tab){
  return new Promise(function(res,rej){
    let done=false;
    const el=document.createElement('script');
    const fin=function(){ SYNC._cb=null; clearTimeout(tid); if(el.parentNode) el.parentNode.removeChild(el); };
    const tid=setTimeout(function(){ if(done) return; done=true; fin(); rej(new Error(tab+': timed out')); },25000);
    SYNC._cb=function(o){ if(done) return; done=true; fin();
      try{ res(gvizRows(o)); }catch(e){ rej(new Error(tab+': '+e.message)); } };
    el.onerror=function(){ if(done) return; done=true; fin();
      /* Flagged so jsonpTab knows this one is safe to retry - see there. */
      const e=new Error(tab+': could not reach the sheet'); e.transport=true; rej(e); };
    el.src='https://docs.google.com/spreadsheets/d/'+SYNC.id+'/gviz/tq?tqx=out:json&headers=0&sheet='+
           encodeURIComponent(tab)+'&_='+Date.now();
    document.head.appendChild(el);
  });
}
/* A sync is 14 sequential requests, every 10 minutes. One blip on any of them used to fail
   the whole run and drop the platform back to last-good data - a single dropped packet cost
   a full 10-minute cycle. Each tab now gets a couple of extra attempts.

   Only a hard transport failure (onerror) is retried. A timeout is deliberately NOT, because
   the tabs share one global callback: a timed-out request whose response is still in flight
   would land on whichever request is registered when it finally arrives, handing one tab's
   rows to another. onerror means the request definitively failed, so no late response can
   arrive and no such collision is possible. */
function jsonpTab(tab,tries){
  tries=(tries==null)?3:tries;
  return jsonpTabOnce(tab).catch(function(err){
    if(!err||!err.transport||tries<=1) throw err;
    return new Promise(function(r){ setTimeout(r,1200); }).then(function(){ return jsonpTab(tab,tries-1); });
  });
}
/* the endpoint's default callback - route it into whichever jsonpTab is in flight */
(function(){
  const g=window.google=window.google||{};
  g.visualization=g.visualization||{};
  const q=g.visualization.Query=g.visualization.Query||{};
  const prev=q.setResponse;
  q.setResponse=function(o){ if(SYNC._cb) SYNC._cb(o); else if(typeof prev==='function') prev(o); };
})();
/* tabs are pulled one at a time: a single shared callback cannot disambiguate parallel loads */
function loadAllTabs(){
  const tabs=[SYNC.summaryTab].concat(SYNC.txTabs), out=[];
  return tabs.reduce(function(chain,t){
    return chain.then(function(){ return jsonpTab(t); }).then(function(rows){ out.push(rows); });
  },Promise.resolve()).then(function(){ return out; });
}
/* Build a candidate DATA from the sheet. Pure - touches nothing live. */
function syncBuild(summaryRows,txRows){
  const CEN=DATA.centres.slice();
  const S=parseSummaryRows(summaryRows,CEN);
  if(Object.keys(S).length<10) throw new Error('summary tab parsed only '+Object.keys(S).length+' components');
  // position date from the sheet's own title row
  let asOf=DATA.asOf;
  const head=summaryRows.slice(0,8).map(function(r){return r.join(' ');}).join(' ');
  const m=/AS ON\s*([0-9]{2}[.\-/][0-9]{2}[.\-/][0-9]{4})/i.exec(head);
  if(m) asOf=m[1].replace(/[-/]/g,'.');
  // sub-verticals: identity + assignment preserved, every measure replaced
  const subs=DATA.subverticals.map(function(o){
    const n=o.name, m2=S[n];
    const bc={}; CEN.forEach(function(c){ bc[c]=m2?{lim:m2.byCentre[c].lim,act:m2.byCentre[c].act}:{lim:0,act:0}; });
    const ddoki=m2?m2.ddoki:0, totLim=m2?m2.totLim:0, totAct=m2?m2.totAct:0;
    const exp=ddoki+totAct;
    return {name:n,short:o.short,parent:o.parent,section:o.section,code:o.code,idx:o.idx,
      assign:o.assign,assignQ1:o.assignQ1,q2:o.q2,ddoki:ddoki,totLim:totLim,totAct:totAct,exp:exp,
      bal:o.assign-exp,up:o.assign?exp/o.assign:0,byCentre:bc};
  });
  const byName={}; subs.forEach(function(x){ byName[x.name]=x; });
  // releases: existing labels preserved on centre+voucher+amount, new ones classified
  const known={}; (DATA.txns||[]).forEach(function(t){ known[t.rc+'|'+t.voucher+'|'+t.net]=t.scat; });
  let tx=[];
  SYNC.txTabs.forEach(function(tab,i){ tx=tx.concat(parseTxRows(txRows[i],tab)); });
  const secOf={}; subs.forEach(function(x){ secOf[x.name]=x.section; });
  tx=tx.map(function(t){
    return {rc:t.rc,sv:t.sv,section:secOf[t.sv]||t.head,head:t.head,date:t.date,
      voucher:t.voucher,sanction:t.sanction,grantee:t.grantee,nar:t.nar,
      scat:known[t.rc+'|'+t.voucher+'|'+t.net]||syncScat(t.nar,t.sv),
      etype:t.etype,net:t.net,util:t.util,bal:t.bal};
  }).sort(function(a,b){ return (a.date||'').localeCompare(b.date||'')||a.rc.localeCompare(b.rc)||a.voucher.localeCompare(b.voucher); });
  const roll=function(rows){ const g={assign:0,exp:0,bal:0,limit:0,actual:0,ddoki:0};
    rows.forEach(function(x){ g.assign+=x.assign; g.exp+=x.exp; g.bal+=x.bal; g.limit+=x.totLim; g.actual+=x.totAct; g.ddoki+=x.ddoki; }); return g; };
  const sect={}; DATA.sections.forEach(function(sec){ sect[sec]=roll(subs.filter(function(x){return x.section===sec;})); });
  const dts=tx.map(function(t){return t.date;}).filter(Boolean).sort();
  return {asOf:asOf,subverticals:subs,byName:byName,txns:tx,sectionTotals:sect,grand:roll(subs),
    releasesMeta:{count:tx.length,net:tx.reduce(function(a,t){return a+t.net;},0),
      util:tx.reduce(function(a,t){return a+t.util;},0),bal:tx.reduce(function(a,t){return a+t.bal;},0),
      asOfMin:dts[0]||null,asOfMax:dts[dts.length-1]||null},
    summary:S};
}
/* The gate. Same invariants that were checked when the data was first loaded. */
function syncValidate(b){
  const e=[], CEN=DATA.centres;
  if(!b.subverticals.length) e.push('no sub-verticals');
  if(b.txns.length<50) e.push('only '+b.txns.length+' releases parsed');
  b.subverticals.forEach(function(s){
    let l=0,a=0; CEN.forEach(function(c){ l+=s.byCentre[c].lim; a+=s.byCentre[c].act; });
    if(Math.abs(l-s.totLim)>1) e.push(s.name+': centre limits do not sum to total');
    if(Math.abs(a-s.totAct)>1) e.push(s.name+': centre actuals do not sum to total');
    if(s.exp!==s.ddoki+s.totAct) e.push(s.name+': exp != ddoki + actual');
    if(s.bal!==s.assign-s.exp) e.push(s.name+': bal != assign - exp');
    if(s.assign<0||s.totLim<0||s.totAct<0) e.push(s.name+': negative figure');
    // the sheet states its own row totals - they must agree with what we summed
    const m=b.summary[s.name];
    if(m){
      if(m.totLim!==m.shLim) e.push(s.name+': sheet limit total disagrees with its own columns');
      if(m.totAct!==m.shAct) e.push(s.name+': sheet actual total disagrees with its own columns');
      if(m.ddoki+m.totAct!==m.shExp) e.push(s.name+': sheet expenditure total disagrees');
    }
  });
  const g=b.grand;
  if(g.exp!==g.ddoki+g.actual) e.push('grand: exp != ddoki + actual');
  if(g.bal!==g.assign-g.exp) e.push('grand: bal != assign - exp');
  let sa=0,se=0; Object.keys(b.sectionTotals).forEach(function(k){ sa+=b.sectionTotals[k].assign; se+=b.sectionTotals[k].exp; });
  if(Math.abs(sa-g.assign)>1) e.push('section assignments do not sum to grand');
  if(Math.abs(se-g.exp)>1) e.push('section expenditure does not sum to grand');
  /* A "Limit Withdraw" row records a limit being taken BACK, so its figures are negative by
     design - e.g. TSA/481 (SLKIC/06), withdrawing PCA salary limit from LNCPE Trivandrum.
     Only "Limit Assigned" rows are guaranteed non-negative; a negative one there is a keying
     error and must still stop the publish. Reading the expenditure type keeps that typo
     protection while letting a genuine recovery through - before this, one withdrawal row in
     the workbook blocked every sync and the platform silently served stale figures. */
  b.txns.forEach(function(t){
    if(/withdraw/i.test(t.etype||'')) return;
    if(t.net<0||t.util<0) e.push('release '+t.voucher+' has a negative amount');
  });
  return {ok:e.length===0,errors:e.slice(0,6)};
}
function syncApply(b){
  /* Detect genuinely NEW releases (data points) before the live set is overwritten.
     Keyed exactly as syncBuild preserves labels: centre|voucher|amount. An amount
     change surfaces as a new point (old key drops, new key appears) - which is the
     "what changed" behaviour we want. Only replace SYNC.newPoints when this sync
     actually brought something new, so the tooltip keeps showing the latest arrivals. */
  /* Transaction Record: diff this build against the stored baseline and log
     what changed, with the time of observation. Runs before DATA is replaced;
     it reads its own persisted baseline, so ordering here is not load-bearing. */
  txDetect(b);
  var _prev={}; (DATA.txns||[]).forEach(function(t){ _prev[t.rc+'|'+t.voucher+'|'+t.net]=1; });
  var _fresh=(b.txns||[]).filter(function(t){ return !_prev[t.rc+'|'+t.voucher+'|'+t.net]; })
    .sort(function(x,y){ return (y.date||'').localeCompare(x.date||''); });   // newest first
  /* First successful sync = baseline (SYNC.applied is still 0 here, bumped at the end).
     Differences against the build-time seed are not "updates"; only later syncs that bring
     genuine changes count, so a plain refresh with no new data never inflates the number. */
  if(SYNC.applied>0 && _fresh.length){ SYNC.newPoints=_fresh.map(function(t){ return {name:pointName(t), amt:t.net}; }); SYNC.updates++; }
  DATA.asOf=b.asOf; AS_OF=b.asOf;
  DATA.subverticals=b.subverticals;
  DATA.sectionTotals=b.sectionTotals; DATA.grand=b.grand;
  DATA.verticals.forEach(function(v){
    if(v.subs) v.subs=v.subs.map(function(o){ return b.byName[o.name]||o; });
    else if(v.leaf) v.leaf=b.byName[v.leaf.name]||v.leaf;
  });
  DATA.txns=b.txns;
  TXN.length=0; Array.prototype.push.apply(TXN,b.txns);
  Object.keys(b.releasesMeta).forEach(function(k){ RMETA[k]=b.releasesMeta[k]; });
  DATA.releasesMeta=b.releasesMeta;
  SYNC.applied++;
  // Recompute the derived facts against the data that was just applied.
  refreshSyncFacts();
}
function syncNow(manual){
  if(SYNC.status==='syncing') return;
  SYNC.status='syncing'; renderSyncPill();
  Promise.resolve().then(loadAllTabs).then(function(all){
    const b=syncBuild(all[0],all.slice(1));
    const v=syncValidate(b);
    if(!v.ok) throw new Error('sheet failed validation - '+v.errors[0]+(v.errors.length>1?' (+'+(v.errors.length-1)+' more)':''));
    syncApply(b);
    SYNC.status='ok'; SYNC.last=new Date(); SYNC.err=null;
  }).catch(function(err){
    SYNC.status='error';
    SYNC.err=(''+(err&&err.message||err)).slice(0,180);
  }).then(function(){
    SYNC.lastTry=new Date();
    render();
  });
}
function syncAgo(d){
  if(!d) return 'never';
  const s=Math.round((Date.now()-d.getTime())/1000);
  if(s<60) return 'just now';
  if(s<3600) return Math.floor(s/60)+' min ago';
  return Math.floor(s/3600)+' hr ago';
}
/* A short, human label for a release, used in the Live-sync tooltip. Prefers the
   grantee, then the narration, then the component / centre. */
function pointName(t){
  var s=(t.grantee||t.nar||t.sv||t.rc||'Release');
  s=(''+s).replace(/\s+/g,' ').trim();
  return s.length>36 ? s.slice(0,34)+'…' : s;
}

/* ---- Last update: the most recent release actually present in the data -------
   Taken from the applied dataset (not the filtered view), so the tooltip always
   reports what the sheet holds rather than what the current chips happen to show.
   Newest by date; voucher breaks ties so the pick is deterministic. */
function latestTxn(){
  var rows=(DATA.txns||[]);
  var best=null;
  for(var i=0;i<rows.length;i++){
    var t=rows[i]; if(!t) continue;
    if(!best) { best=t; continue; }
    var c=String(t.date||'').localeCompare(String(best.date||''));
    if(c>0 || (c===0 && String(t.voucher||'')>String(best.voucher||''))) best=t;
  }
  return best;
}
/** Compact "basic details" line for a release. */
function txnBrief(t){
  if(!t) return null;
  return {
    when: t.date ? fmtD(t.date) : '—',
    rc: t.rc||'—',
    voucher: t.voucher||'—',
    sv: (t.sv||t.scat||'—'),
    etype: t.etype||'',
    net: t.net, util: t.util
  };
}

/* ---- Data-integrity audit (non-blocking) ------------------------------------
   Scope, deliberately narrow: this reports ONLY sums that do not add up and
   arithmetic that contradicts itself. Business conditions are NOT errors and are
   never flagged here - a component spending beyond its assignment, or a centre
   drawing more than the limit released to it, are real operational states the
   Attention Centre already surfaces, not calculation faults.

   syncValidate() remains the hard gate that refuses a broken sheet outright.
   This is the soft pass over data that already passed it, so anything found here
   is shown as a NOTE and never blocks a sync.

   Two families of check:
     A. Internal arithmetic - identities that must hold within the summary
        (exp = DDO KI Direct + centre actual, balance = assignment − expenditure,
        centre columns roll up to their totals, parts sum to the grand total).
     B. Cross-tab reconciliation - the transaction tabs against the summary tab.
        This is what catches "the sheet was updated but the logic now defies":
        a release recorded as utilised while the summary still shows nil, or a
        summary edited without the matching release row.

   Only (component, centre) pairs that actually carry release rows are compared,
   because some components are funded outside the pulled transaction tabs and a
   missing tab must never be reported as a mismatch.
   Tolerance of ₹1 throughout, matching syncValidate, so rounding never trips it. */
function auditData(){
  var out=[], TOL=1;
  var subs=(DATA.subverticals||[]), rows=(DATA.txns||[]), g=(DATA.grand||{});
  var off=function(a,b){ return Math.abs((a||0)-(b||0))>TOL; };
  var sum=function(a,f){ var t=0; for(var i=0;i<a.length;i++) t+=(f(a[i])||0); return t; };
  var few=function(list){ return list.slice(0,2).join(', ')+(list.length>2?' +'+(list.length-2)+' more':''); };

  /* ---- A. internal arithmetic ---- */
  var idn=[], balErr=[], rollLim=[], rollAct=[];
  subs.forEach(function(s){
    if(off(s.exp,(s.ddoki||0)+(s.totAct||0))) idn.push(s.name);
    if(off(s.bal,(s.assign||0)-(s.exp||0)))   balErr.push(s.name);
    var bc=s.byCentre||{}, ks=Object.keys(bc);
    if(ks.length){
      if(off(sum(ks,function(k){return bc[k].lim;}), s.totLim)) rollLim.push(s.name);
      if(off(sum(ks,function(k){return bc[k].act;}), s.totAct)) rollAct.push(s.name);
    }
  });
  if(idn.length)     out.push('Expenditure ≠ DDO KI Direct + centre actual for '+few(idn)+'.');
  if(balErr.length)  out.push('Balance ≠ assignment − expenditure for '+few(balErr)+'.');
  if(rollLim.length) out.push('Centre limits do not add up to the component total for '+few(rollLim)+'.');
  if(rollAct.length) out.push('Centre expenditure does not add up to the component total for '+few(rollAct)+'.');

  var rowErr=0;
  rows.forEach(function(t){ if(off(t.bal,(t.net||0)-(t.util||0))) rowErr++; });
  if(rowErr) out.push(rowErr+' release'+(rowErr===1?'':'s')+' where balance ≠ released − utilised.');

  if(off(g.exp,(g.ddoki||0)+(g.actual||0))) out.push('Scheme total: expenditure ≠ DDO KI Direct + centre actual.');
  if(off(g.bal,(g.assign||0)-(g.exp||0)))   out.push('Scheme total: balance ≠ assignment − expenditure.');

  [['assignment','assign','assign'],['expenditure','exp','exp'],
   ['limit released','totLim','limit'],['centre expenditure','totAct','actual']
  ].forEach(function(p){
    var parts=sum(subs,function(s){ return s[p[1]]; }), whole=g[p[2]];
    if(off(parts,whole)) out.push('Components do not sum to the scheme '+p[0]+' (out by '+crShort(parts-whole)+').');
  });

  var st=DATA.sectionTotals||{}, sk=Object.keys(st);
  if(sk.length){
    if(off(sum(sk,function(k){return st[k].assign;}), g.assign)) out.push('Section assignments do not sum to the scheme total.');
    if(off(sum(sk,function(k){return st[k].exp;}),    g.exp))    out.push('Section expenditure does not sum to the scheme total.');
  }

  var m=DATA.releasesMeta;
  if(m){
    if(m.count!=null && m.count!==rows.length)
      out.push('Release count mismatch: sheet states '+m.count+', '+rows.length+' parsed.');
    if(off(m.net,  sum(rows,function(t){return t.net;})))  out.push('Stated released total does not match the sum of releases.');
    if(off(m.util, sum(rows,function(t){return t.util;}))) out.push('Stated utilised total does not match the sum of releases.');
  }

  /* ---- B. cross-tab reconciliation (transaction tabs vs summary tab) ---- */
  var agg={};
  rows.forEach(function(t){
    var k=t.sv+'␀'+t.rc;
    if(!agg[k]) agg[k]={net:0,util:0};
    agg[k].net+=(t.net||0); agg[k].util+=(t.util||0);
  });
  var cross=[], seen={};
  subs.forEach(function(s){
    var bc=s.byCentre||{};
    Object.keys(bc).forEach(function(c){
      var a=agg[s.name+'␀'+c];
      if(!a) return;                       // no releases pulled for this pair - not a mismatch
      if(off(a.net,bc[c].lim)){
        cross.push('“'+s.name+'” at '+c+': releases total '+crShort(a.net)+' but the summary shows '+
                   crShort(bc[c].lim)+' released (out by '+crShort(a.net-bc[c].lim)+').');
        seen[s.name]=1;
      }
      if(off(a.util,bc[c].act)){
        cross.push('“'+s.name+'” at '+c+': releases show '+crShort(a.util)+' utilised but the summary shows '+
                   crShort(bc[c].act)+' (out by '+crShort(a.util-bc[c].act)+').');
        seen[s.name]=1;
      }
    });
  });
  out=out.concat(cross);

  /* Component-level roll-up, only where no centre-level line already covers it. */
  var cAgg={};
  rows.forEach(function(t){ if(!cAgg[t.sv]) cAgg[t.sv]={net:0,util:0}; cAgg[t.sv].net+=(t.net||0); cAgg[t.sv].util+=(t.util||0); });
  subs.forEach(function(s){
    var a=cAgg[s.name];
    if(!a || seen[s.name]) return;
    if(off(a.net,s.totLim))  out.push('“'+s.name+'”: releases total '+crShort(a.net)+' against '+crShort(s.totLim)+' released in the summary.');
    if(off(a.util,s.totAct)) out.push('“'+s.name+'”: releases show '+crShort(a.util)+' utilised against '+crShort(s.totAct)+' in the summary.');
  });

  return out;
}
/* ============================================================================
   TRANSACTION RECORD - a log of what actually changed in the Google Sheet
   ============================================================================
   Purpose: track every new transaction and every change in value observed in
   the sync sheet, with the date and time it was recorded.

   HOW THE TIME IS ESTABLISHED - read this before trusting the timestamp.
   The Google Sheets gviz feed returns cell values only; it carries no per-cell
   edit history, so the sheet cannot tell us when a figure was typed. The time
   stored here is therefore the moment THIS PLATFORM OBSERVED the change during
   a sync - labelled "Recorded" throughout, never "edited". With the sync
   running every 10 minutes, an edit is observed within 10 minutes of being
   made, provided a session is open. The transaction's own date column from the
   sheet is kept alongside, so both are visible and never conflated.

   IDENTITY. Rows are keyed on centre + voucher, which is unique across the
   workbook (verified against the full release set). Keying on identity rather
   than on the amounts is what lets a changed figure be reported as an UPDATE
   with its before/after, instead of appearing as a brand-new transaction.

   BASELINE. The first successful sync of a browser records the sheet's current
   state as the baseline and logs nothing - the rows already in the sheet were
   not created at that instant, and dating them "now" would be false. Only what
   changes after that point is logged, so every entry is a genuine observation.

   STORAGE. The log persists in this browser (localStorage) so the record
   survives reloads; the platform holds no financial data server-side. It is
   therefore per-browser: a different machine starts its own baseline. A shared,
   permanent record needs the change log written server-side - the natural next
   step now that the platform has a backend.
   ========================================================================== */
const TLOG_KEY='sai.efip.txlog.v1', TBASE_KEY='sai.efip.txbase.v1', TLOG_MAX=5000;
const IST_MIN=330;                       // IST = UTC+5:30, no daylight saving

function lsGet(k){ try{ var s=localStorage.getItem(k); return s?JSON.parse(s):null; }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); return true; }catch(e){ return false; } }

let TXLOG = lsGet(TLOG_KEY) || {since:null, entries:[]};

/** Stable row identity - deliberately excludes the amounts, which may change. */
function txKey(t){ return (t.rc||'')+'|'+(t.voucher||''); }

/** Value snapshot used to diff one sync against the next. */
function txSnapshot(b){
  var s={t:{},a:{},c:{}};
  (b.txns||[]).forEach(function(t){ s.t[txKey(t)]={n:t.net||0,u:t.util||0,b:t.bal||0}; });
  (b.subverticals||[]).forEach(function(x){
    s.a[x.name]=x.assign||0;
    /* Summary-tab figures. These come from Sheet3 and can be typed straight into
       the workbook without any release row existing, so they must be snapshotted
       separately or a direct edit leaves no trace anywhere in the platform.
       Per-centre pairs are stored rather than the component totals, because the
       totals are just their sum - recording both would double-report one edit. */
    var bc=x.byCentre||{}, cc={};
    Object.keys(bc).forEach(function(k){ cc[k]=[bc[k].lim||0, bc[k].act||0]; });
    s.c[x.name]={dk:x.ddoki||0, bc:cc};
  });
  return s;
}

/** True for the 12 Regional Centres - DDO HQ and INFRA-SAI are not centres. */
function isRegionalCentre(c){
  return !!c && c!==HQ_KEY && c!==INFRA_KEY && (DATA.centres||[]).indexOf(c)>=0;
}

/* Compare an incoming build against the stored baseline and append what changed.
   Returns the number of entries added. Never throws into the sync path. */
/* Diff the summary-tab figures of one snapshot against a set of incoming components.
   Shared by both branches of txDetect so a Sheet3 edit is reported identically whether
   it is caught between two syncs or on the very first sync of a browser. Only per-centre
   pairs and DDO-KI are compared: the component totals are their sum, so reporting both
   would count one edit twice. */
function txSheetDiff(prevC, subs, now, syncDay, out){
  var TOL=1;
  (subs||[]).forEach(function(x){
    var pc=prevC&&prevC[x.name];
    if(!pc) return;                                   // component not previously seen
    if(Math.abs((pc.dk||0)-(x.ddoki||0))>TOL)
      out.push({ts:now,type:'sheet',sv:x.name,rc:'',voucher:'',scat:'',date:syncDay,
                field:'DDO-KI direct expenditure',pVal:pc.dk||0,val:x.ddoki||0,net:0,util:0,bal:0});
    var bc=x.byCentre||{};
    Object.keys(bc).forEach(function(cn){
      var pv=pc.bc&&pc.bc[cn];
      if(!pv) return;
      if(Math.abs(pv[0]-(bc[cn].lim||0))>TOL)
        out.push({ts:now,type:'sheet',sv:x.name,rc:cn,voucher:'',scat:'',date:syncDay,
                  field:'Limit assigned',pVal:pv[0],val:bc[cn].lim||0,net:0,util:0,bal:0});
      if(Math.abs(pv[1]-(bc[cn].act||0))>TOL)
        out.push({ts:now,type:'sheet',sv:x.name,rc:cn,voucher:'',scat:'',date:syncDay,
                  field:'Actual expenditure',pVal:pv[1],val:bc[cn].act||0,net:0,util:0,bal:0});
    });
  });
  return out;
}
function txDetect(b){
  try{
    var prev=lsGet(TBASE_KEY), snap=txSnapshot(b), now=Date.now();
    if(!prev){
      /* First sync in this browser. The release rows are adopted silently - the 275 rows
         already in the sheet were not created at this instant and dating them "now" would
         be false. The summary figures are different: the platform is on screen showing the
         build-time seed, so a Sheet3 figure that differs from it is a change the viewer is
         actually watching happen, and it is recorded. This is what catches an edit made
         between the build and the browser's first sync - the 14.09 -> 14.90 infrastructure
         move being exactly that case. */
      var seed=txSnapshot({txns:[],subverticals:DATA.subverticals||[]});
      var first=txSheetDiff(seed.c, b.subverticals, now, istDateStr(0), []);
      if(first.length){
        TXLOG.entries=TXLOG.entries.concat(first).slice(-TLOG_MAX);
        if(!TXLOG.since) TXLOG.since=now;
        lsSet(TLOG_KEY,TXLOG);
      }
      lsSet(TBASE_KEY,snap);
      if(!TXLOG.since){ TXLOG.since=now; lsSet(TLOG_KEY,TXLOG); }
      return first.length;
    }
    var add=[], TOL=1, seen={};
    (b.txns||[]).forEach(function(t){
      var k=txKey(t); seen[k]=1;
      var p=prev.t[k];
      var row={ts:now, rc:t.rc||'', voucher:t.voucher||'', sv:t.sv||'', scat:t.scat||'',
               date:t.date||'', grantee:t.grantee||'', net:t.net||0, util:t.util||0, bal:t.bal||0};
      if(!p){ row.type='new'; add.push(row); return; }
      if(Math.abs(p.n-row.net)>TOL || Math.abs(p.u-row.util)>TOL || Math.abs(p.b-row.bal)>TOL){
        row.type='update'; row.pNet=p.n; row.pUtil=p.u; row.pBal=p.b; add.push(row);
      }
    });
    Object.keys(prev.t).forEach(function(k){           // rows withdrawn from the sheet
      if(seen[k]) return;
      var p=prev.t[k], parts=k.split('|');
      add.push({ts:now,type:'removed',rc:parts[0]||'',voucher:parts[1]||'',sv:'',scat:'',date:'',
                net:0,util:0,bal:0,pNet:p.n,pUtil:p.u,pBal:p.b});
    });
    /* Sheet3 (summary tab) direct edits.
       Sheet3 carries no date column of its own, so an edit made straight into the
       summary - a corrected expenditure figure, a revised limit, a change to
       DDO-KI direct - cannot be dated from the workbook. Such entries are stamped
       with the date of the sync that observed them, which is the earliest point
       the change is known to exist. They are recorded for audit only and are
       deliberately kept out of the daily expenditure KPI: a release row edit
       moves both the transaction tab and the summary, so counting both would
       report the same rupee twice. */
    var syncDay=istDateStr(0);
    (b.subverticals||[]).forEach(function(x){
      var p=prev.a[x.name];
      if(p!=null && Math.abs(p-(x.assign||0))>TOL)
        add.push({ts:now,type:'assign',rc:'',voucher:'',sv:x.name,scat:'',date:syncDay,
                  net:0,util:0,bal:0,assign:x.assign||0,pAssign:p});

    });
    txSheetDiff(prev.c, b.subverticals, now, syncDay, add);
    if(add.length){
      TXLOG.entries=TXLOG.entries.concat(add).slice(-TLOG_MAX);
      if(!TXLOG.since) TXLOG.since=now;
      lsSet(TLOG_KEY,TXLOG);
    }
    lsSet(TBASE_KEY,snap);
    return add.length;
  }catch(e){ return 0; }
}

/* ---- IST calendar helpers ------------------------------------------------
   Computed from absolute epoch time and a fixed +5:30 offset, so the result is
   the same whatever timezone the viewing browser is set to. Shifting by the
   offset and then reading UTC fields is what makes the arithmetic exact. */
function istDayWindow(daysAgo){
  var shifted=new Date(Date.now()+IST_MIN*60000);
  var midnightShifted=Date.UTC(shifted.getUTCFullYear(),shifted.getUTCMonth(),shifted.getUTCDate())
                      - (daysAgo||0)*86400000;
  var start=midnightShifted - IST_MIN*60000;          // real epoch of that IST midnight
  return {start:start, end:start+86400000-1, dayShifted:midnightShifted};
}
/** Epoch -> IST calendar date, displayed as DD.MM.YYYY (date only, no clock time). */
function istStamp(ms){
  var d=new Date(ms+IST_MIN*60000), p=function(n){ return String(n).padStart(2,'0'); };
  return p(d.getUTCDate())+'.'+p(d.getUTCMonth()+1)+'.'+d.getUTCFullYear();
}
/** IST calendar day `daysAgo` back, as 'YYYY-MM-DD' - the form the sheet uses. */
function istDateStr(daysAgo){
  var d=new Date(istDayWindow(daysAgo).dayShifted), p=function(n){ return String(n).padStart(2,'0'); };
  return d.getUTCFullYear()+'-'+p(d.getUTCMonth()+1)+'-'+p(d.getUTCDate());
}
/** Sheet date 'YYYY-MM-DD' -> 'DD.MM.YYYY' for display. */
function sheetDMY(s){
  if(!s) return '—';
  var p=String(s).split('-');
  return p.length<3 ? String(s) : p[2]+'.'+p[1]+'.'+p[0];
}


/** Refresh the derived sync facts (latest release + integrity notes). */
function refreshSyncFacts(){
  try{ SYNC.lastTxn=txnBrief(latestTxn()); SYNC.notes=auditData(); }
  catch(e){ SYNC.notes=['Integrity check could not run: '+(e&&e.message||e)]; }
}
function renderSyncPill(){

  const st=SYNC.status;

      :st==='ok'?'Live · '+syncAgo(SYNC.last)

  /* ---- Live-sync hover card -------------------------------------------------

        const wd = lt && /withdraw/i.test(lt.etype||'');

              + '<div class="sy-fig'+(wd?' wd':'')+'"><div class="k">'+(wd?'Withdrawn':'Released')+'</div><div class="v">'+esc(crShort(wd?Math.abs(lt.net):lt.net))+'</div></div>'
              + '<div class="sy-fig used"><div class="k">Utilised</div><div class="v">'+esc(crShort(lt.util))+'</div></div>'

            + (np.length>2 ? '<br>+'+(np.length-2)+' more' : '')

             +(SYNC.last?esc(SYNC.last.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}))

                      :'<span class="mut">not yet</span>')+'</span></div>';

          ? '<div class="sy-note"><span class="ic">!</span><div class="nt">'
            + '<div class="nh">'+nt.length+' figure'+(nt.length===1?'':'s')+' need'+(nt.length===1?'s':'')+' checking</div>'
            + '<div class="nb">'+nt.slice(0,2).map(function(x){ return esc(x); }).join('<br><br>')
            + (nt.length>2 ? '<br><br>+'+(nt.length-2)+' more' : '')+'</div></div></div>'
          : '<div class="sy-note good"><span class="ic">✓</span><div class="nt">'
            + '<div class="nh">Figures reconcile</div>'
            + '<div class="nb">All totals and cross-checks add up.</div></div></div>';

        return '<div class="syncard">'
          + '<div class="sy-hd"><span class="dot '+pill[0]+'"></span><span class="sy-t">Live sync</span>'
            + '<span class="sy-pill '+pill[0]+'">'+pill[1]+'</span></div>'
          + '<div class="sy-sec"><div class="sy-lbl">Latest entry in sheet</div>'+last+'</div>'
          + '<div class="sy-sec">'+facts+'</div>'
          + note
          + '<div class="sy-foot">Click to sync now<span class="rf">↻</span></div>'
          + '</div>';
      })();
  el.innerHTML='<span class="syncp"'+tattr(tip)+' onclick="syncNow(true)"><span class="dot '+cls+'"></span>'+txt+'<span class="rf">↻</span></span>';
}
function syncStart(){

  SYNC.timer=setInterval(syncNow,SYNC.intervalMs);

if(viewHidden(state.view)){ var f=NAV.filter(function(x){return x.v&&!viewHidden(x.v);})[0]; if(f) state.view=f.v; }
/* ============================================================================
   GLOBAL SEARCH
   ============================================================================
   One box that reaches everything the platform holds: panels, sections, scheme
   components, Regional Centres, KI Infra States/UTs, spend categories, grantees,
   and every individual release down to its voucher, sanction number and the
   free text of its narration.

   Two decisions worth knowing:

   1. It searches the FULL dataset, not the filtered one. The classification
      chips change what the figures mean, not what exists; a global search that
      could not find a release because a chip was unticked would be a bug
      wearing a feature's clothes. The figures on each row are that record's
      own, so they never contradict whatever the chips are doing to page totals.

   2. Picking a result opens the row, not just the page. Centres, sections and
      KI Infra states all render through entityUtilTable, which expands whichever
      row matches state.hsOpen — so setting that before navigating lands the user
      on the actual thing, expanded and scrolled into view. A release resolves to
      its Regional Centre, because the Transaction Record panel is in
      HIDDEN_VIEWS and a result must never navigate somewhere unreachable.
      Categories and grantees own no panel, so they re-query in place instead,
      turning one result into its constituent releases.
   ---------------------------------------------------------------------------*/
const GS={open:false,sel:0,rows:[],terms:[],_src:null,_idx:null};
/* Kinds in the order they should read, each with a weight so a query like
   "kolkata" surfaces the centre above the 40 releases that merely mention it. */
const GS_KIND=[['Panel',60],['Section',52],['Centre',50],['Component',48],
               ['KI Infra',44],['Category',30],['Grantee',26],['Release',0]];
const GS_W=GS_KIND.reduce(function(m,k){ m[k[0]]=k[1]; return m; },{});

function gsBuild(){
  const ix=[], txns=DATA.txns||[];
  NAV.forEach(function(x){ if(x.v&&!viewHidden(x.v)&&moduleAllowed(x.v)) ix.push({k:'Panel',t:x.t,s:'Open panel',go:{v:x.v}}); });
  (DATA.sections||[]).forEach(function(n){
    const g=(DATA.sectionTotals||{})[n]||{};
    ix.push({k:'Section',t:n,s:'Financial classification',a:g.assign,u:g.exp,go:{v:'command',hs:'sectbl:'+n}});
  });
  (DATA.subverticals||[]).forEach(function(x){
    ix.push({k:'Component',t:x.name,s:(x.short?x.short+' · ':'')+(x.section||''),
      a:x.assign,u:x.exp,x:[x.short,x.parent,x.section,x.code],go:{v:'tracker'}});
  });
  (DATA.centres||[]).forEach(function(c){
    const r=txns.filter(function(t){ return t.rc===c; });
    ix.push({k:'Centre',t:c,s:'Regional Centre · '+r.length+' release'+(r.length===1?'':'s'),
      a:r.reduce(function(m,t){return m+t.net;},0),u:r.reduce(function(m,t){return m+t.util;},0),
      go:{v:'rc',hs:'rctbl:'+c}});
  });
  if(typeof MDSD!=='undefined'&&MDSD.items) MDSD.items.forEach(function(m){
    ix.push({k:'KI Infra',t:m.name,s:'KI Infra · '+(m.type==='institute'?'Institute':'State / UT'),
      a:m.assign,u:m.exp,x:[m.type,'states','uts','mdsd'],go:{v:'mdsd',hs:'mdsdtbl:'+m.name}});
  });
  const agg=function(f,kind){
    const m={};
    txns.forEach(function(t){ const v=t[f]; if(!v) return;
      if(!m[v]) m[v]={n:0,a:0,u:0}; m[v].n++; m[v].a+=t.net; m[v].u+=t.util; });
    Object.keys(m).forEach(function(v){
      ix.push({k:kind,t:v,s:m[v].n+' release'+(m[v].n===1?'':'s'),a:m[v].a,u:m[v].u,go:{q:v}}); });
  };
  agg('scat','Category'); agg('grantee','Grantee');
  txns.forEach(function(t){
    ix.push({k:'Release',t:t.voucher||'Release',
      s:[t.date?fmtD(t.date):'',t.rc,t.sv].filter(Boolean).join(' · '),
      n:t.nar,a:t.net,u:t.util,
      x:[t.sanction,t.grantee,t.scat,t.head,t.section,t.etype,t.date,t.nar],
      go:{v:'rc',hs:'rctbl:'+t.rc}});
  });
  ix.forEach(function(o){
    o._t=String(o.t||'').toLowerCase();
    o._h=(o._t+' '+(o.s||'')+' '+(o.n||'')+' '+(o.x||[]).join(' ')+' '+o.k).toLowerCase();
  });
  return ix;
}
/* syncApply replaces DATA.txns wholesale, so identity is a reliable staleness
   check — the index rebuilds itself on the first search after any sync. */
function gsIndex(){
  if(!GS._idx||GS._src!==DATA.txns){ GS._idx=gsBuild(); GS._src=DATA.txns; }
  return GS._idx;
}
function gsRx(t){ return t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }

function gsFind(q){
  const terms=String(q||'').toLowerCase().split(/\s+/).filter(Boolean);
  GS.terms=terms;
  if(!terms.length) return [];
  const hits=[];
  gsIndex().forEach(function(o){
    let sc=0;
    for(let i=0;i<terms.length;i++){
      const tm=terms[i], inT=o._t.indexOf(tm);
      if(o._h.indexOf(tm)<0) return;                     // every term must appear
      if(o._t===tm) sc+=180; else if(inT===0) sc+=90; else if(inT>0) sc+=45; else sc+=14;
      if(new RegExp('\\b'+gsRx(tm)).test(o._h)) sc+=10;  // word-start beats mid-word
    }
    hits.push({o:o,sc:sc+(GS_W[o.k]||0)});
  });
  hits.sort(function(x,y){ return y.sc-x.sc||(y.o.a||0)-(x.o.a||0)||x.o._t.localeCompare(y.o._t); });
  return hits.map(function(h){ return h.o; });
}
/* Escape and highlight in one pass over the RAW string: escaping first and
   highlighting after would let a query like "amp" match inside &amp;. */
function gsHl(str,terms){
  const v=String(str==null?'':str);
  if(!terms.length) return esc(v);
  const re=new RegExp('('+terms.map(gsRx).join('|')+')','ig');
  return v.split(re).map(function(piece,i){
    return i%2 ? '<mark class="gs-mk">'+esc(piece)+'</mark>' : esc(piece);
  }).join('');
}

const GS_CAP={Release:8,Category:5,Grantee:5};   // per-group cap; the rest are counted
function gsRender(q){
  const box=document.getElementById('gsP'); if(!box) return;
  const found=gsFind(q), tms=GS.terms;
  GS.rows=[];
  if(!tms.length){
    box.innerHTML='<div class="gs-e">Search panels, components, centres, KI Infra states,<br>categories, grantees, vouchers, sanctions and narrations.</div>';
    gsAria(); return;
  }
  if(!found.length){
    box.innerHTML='<div class="gs-e">Nothing matches <b>'+esc(q)+'</b>.<br>Try a voucher, a centre, or a word from a narration.</div>';
    gsAria(); return;
  }
  let html='';
  GS_KIND.forEach(function(pair){
    const kind=pair[0], all=found.filter(function(o){ return o.k===kind; });
    if(!all.length) return;
    const cap=GS_CAP[kind]||6, show=all.slice(0,cap);
    html+='<div class="gs-g">'+esc(kind)+(all.length>show.length?' · '+all.length:'')+'</div>';
    show.forEach(function(o){
      const i=GS.rows.length; GS.rows.push(o);
      html+='<div class="gs-r'+(i===GS.sel?' sel':'')+'" id="gsr'+i+'" role="option" aria-selected="'+(i===GS.sel)+'"'
          + ' onmousedown="event.preventDefault()" onclick="gsPick('+i+')" onmouseenter="gsHover('+i+')">'
          + '<div class="gs-b"><div class="gs-t">'+gsHl(o.t,tms)+'</div>'
          + '<div class="gs-s">'+gsHl(o.s||'',tms)+'</div>'
          + (o.n?'<div class="gs-n">'+gsHl(o.n,tms)+'</div>':'')
          + '</div>'
          + (o.a==null?'':'<div class="gs-v"><div class="a">'+esc(crShort(o.a))+'</div>'
             + (o.u?'<div class="u">'+esc(crShort(o.u))+' used</div>':'')+'</div>')
          + '</div>';
    });
    if(all.length>show.length)
      html+='<div class="gs-more">+'+(all.length-show.length)+' more '+esc(kind.toLowerCase())+' matches — keep typing to narrow</div>';
  });
  html+='<div class="gs-ft"><span><b>↑↓</b> move</span><span><b>↵</b> open</span><span><b>esc</b> close</span></div>';
  box.innerHTML=html;
  gsAria();
}
function gsAria(){
  const i=document.getElementById('gsI'); if(!i) return;
  i.setAttribute('aria-expanded',GS.open?'true':'false');
  if(GS.rows.length&&document.getElementById('gsr'+GS.sel)) i.setAttribute('aria-activedescendant','gsr'+GS.sel);
  else i.removeAttribute('aria-activedescendant');
}
function gsShow(){
  GS.open=true;
  document.getElementById('gs').classList.add('on');
  gsRender(document.getElementById('gsI').value);
}
function gsHide(){
  GS.open=false;
  const g=document.getElementById('gs'); if(g) g.classList.remove('on');
  gsAria();
}
function gsType(v){
  GS.sel=0;
  const g=document.getElementById('gs');
  g.classList.toggle('has',!!v);
  g.classList.add('on'); GS.open=true;
  gsRender(v);
}
function gsClear(){ const i=document.getElementById('gsI'); i.value=''; gsType(''); i.focus(); }
function gsHover(i){ if(i===GS.sel) return; GS.sel=i; gsPaint(); }
function gsPaint(){
  GS.rows.forEach(function(_,i){
    const el=document.getElementById('gsr'+i); if(!el) return;
    el.classList.toggle('sel',i===GS.sel);
    el.setAttribute('aria-selected',i===GS.sel);
  });
  const a=document.getElementById('gsr'+GS.sel);
  if(a&&a.scrollIntoView) a.scrollIntoView({block:'nearest'});
  gsAria();
}
function gsKey(e){
  if(e.key==='Escape'){
    const i=document.getElementById('gsI');
    if(i.value){ gsClear(); } else { gsHide(); i.blur(); }
    e.stopPropagation(); return;
  }
  if(!GS.open||!GS.rows.length){ if(e.key==='ArrowDown') gsShow(); return; }
  if(e.key==='ArrowDown'){ e.preventDefault(); GS.sel=(GS.sel+1)%GS.rows.length; gsPaint(); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); GS.sel=(GS.sel-1+GS.rows.length)%GS.rows.length; gsPaint(); }
  else if(e.key==='Enter'){ e.preventDefault(); gsPick(GS.sel); }
}
function gsPick(i){
  const o=GS.rows[i]; if(!o) return;
  const g=o.go||{};
  if(g.q!=null){                                  // category / grantee: drill in place
    const el=document.getElementById('gsI');
    el.value=g.q; gsType(g.q); el.focus(); return;
  }
  if(g.hs) state.hsOpen=g.hs;                     // expand the row we are landing on
  gsHide();
  document.getElementById('gsI').blur();
  if(g.v) go(g.v);
  if(g.hs) setTimeout(function(){
    const r=document.querySelector('.mdsd-row.open');
    if(r&&r.scrollIntoView) r.scrollIntoView({block:'center',behavior:'smooth'});
  },60);
}
function gsInit(){
  document.addEventListener('click',function(e){
    const g=document.getElementById('gs');
    if(g&&GS.open&&!g.contains(e.target)) gsHide();
  });
  /* "/" and Ctrl/Cmd-K focus the box, but never while the user is typing
     somewhere else — including the platform's own selects. */
  document.addEventListener('keydown',function(e){
    const t=e.target, tag=t&&t.tagName;
    const typing = tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT'||(t&&t.isContentEditable);
    const combo=(e.key==='k'||e.key==='K')&&(e.metaKey||e.ctrlKey);
    if(combo||(e.key==='/'&&!typing&&!e.metaKey&&!e.ctrlKey&&!e.altKey)){
      const i=document.getElementById('gsI'); if(!i) return;
      e.preventDefault(); i.focus(); i.select(); gsShow();
    }
  });
}

/* ============================================================================
   MY PROFILE — a panel, not a separate application
   ============================================================================
   This lives in the dashboard shell alongside Financial Overview and the rest,
   so it inherits the sidebar, the header and the page furniture rather than
   reproducing them. It used to be a React screen at /profile with its own frame;
   two frames for one platform is how designs drift apart, and a user should not
   feel they have left the product to change their phone number.

   Only the rendering is here. Everything it shows comes from GET /api/auth/me
   and everything it changes goes through PATCH /api/me and POST /api/me/password
   — the server decides what a user may alter about themselves, and it accepts
   exactly four fields, so no crafted request turns a profile edit into a
   privilege change.

   Deliberately absent: the "Your access" list. Which modules a user holds is an
   administrator's decision, and showing users a read-only inventory of their own
   permissions invites a conversation the panel cannot resolve. The Super Admin's
   Manage Access screen is where that belongs.
   ---------------------------------------------------------------------------*/

/* Mirrors ROLE_LABELS in @efip/shared. The dashboard is a standalone document
   and imports nothing, so the labels are restated; anything unrecognised falls
   back to a readable form of the raw value rather than showing a blank. */
const PF_ROLE = {
  super_admin: 'Super Administrator',
  admin: 'Administrator',
  minister: 'Minister',
  secretary: 'Secretary',
  joint_secretary: 'Joint Secretary',
  director: 'Director',
  finance_officer: 'Finance Officer (maker)',
  senior_finance: 'Senior Finance (checker)',
  analyst: 'Analyst',
  auditor: 'Auditor',
};
function pfRoleLabel(r) {
  if (PF_ROLE[r]) return PF_ROLE[r];
  return String(r || '—')
    .split('_')
    .map(function (w) { return w ? w.charAt(0).toUpperCase() + w.slice(1) : w; })
    .join(' ');
}

function pfField(label, id, value, opts) {
  opts = opts || {};
  return (
    '<div>' +
    '<label class="pf-lb" for="' + id + '">' + esc(label) + '</label>' +
    '<input class="pf-in" id="' + id + '" type="' + (opts.type || 'text') + '"' +
    ' value="' + esc(value == null ? '' : value) + '"' +
    (opts.disabled ? ' disabled' : '') +
    (opts.required ? ' required' : '') +
    (opts.autocomplete ? ' autocomplete="' + opts.autocomplete + '"' : '') +
    (opts.placeholder ? ' placeholder="' + esc(opts.placeholder) + '"' : '') +
    '>' +
    (opts.hint ? '<div class="pf-hint">' + esc(opts.hint) + '</div>' : '') +
    '</div>'
  );
}

function viewProfile() {
  const u = ME || {};
  return (
    pageHead('My Profile', 'Your contact details. Role and access are set by an administrator.') +
    '<div class="pf-grid">' +
      '<div class="card">' +
        '<div class="card-hd"><h3>Your details</h3></div>' +
        '<div id="pfMsg"></div>' +
        '<form id="pfForm" onsubmit="return pfSave(event)" novalidate>' +
          '<div class="pf-f">' +
            pfField('Name', 'pfName', u.name, { required: true, autocomplete: 'name' }) +
            pfField('Designation', 'pfDesig', u.designation, { placeholder: 'e.g. Officer on Special Duty' }) +
            pfField('Email ID', 'pfEmail', u.email, { type: 'email', autocomplete: 'email' }) +
            pfField('Phone Number', 'pfPhone', u.phone, { autocomplete: 'tel', placeholder: 'e.g. +91 98765 43210' }) +
            pfField('Username', 'pfUser', u.username, { disabled: true, hint: 'Your login identifier. Only an administrator can change this.' }) +
            pfField('Role', 'pfRole', pfRoleLabel(u.role), { disabled: true, hint: 'Set by an administrator.' }) +
          '</div>' +
          '<div class="pf-act"><button class="pf-btn" type="submit" id="pfSaveBtn">Save changes</button></div>' +
        '</form>' +
      '</div>' +
      '<div class="card">' +
        '<div class="card-hd"><h3>Change password</h3></div>' +
        '<div id="pfPwMsg"></div>' +
        '<form id="pfPwForm" onsubmit="return pfPassword(event)" novalidate>' +
          '<div class="pf-stack">' +
            pfField('Current password', 'pfCur', '', { type: 'password', required: true, autocomplete: 'current-password' }) +
            pfField('New password', 'pfNew', '', { type: 'password', required: true, autocomplete: 'new-password', hint: 'At least 8 characters.' }) +
            pfField('Confirm new password', 'pfConf', '', { type: 'password', required: true, autocomplete: 'new-password' }) +
          '</div>' +
          '<div class="pf-act"><button class="pf-btn wide" type="submit" id="pfPwBtn">Change password</button></div>' +
        '</form>' +
      '</div>' +
    '</div>'
  );
}

function pfVal(id) { const el = document.getElementById(id); return el ? el.value.trim() : ''; }
function pfNote(slot, kind, text) {
  const el = document.getElementById(slot);
  if (el) el.innerHTML = text ? '<div class="pf-msg ' + kind + '">' + esc(text) + '</div>' : '';
}
/** Read the server's message when it sends one; fall back otherwise. */
function pfSend(url, method, body) {
  return fetch(url, {
    method: method,
    credentials: 'include',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  }).then(function (r) {
    return r.text().then(function (t) {
      let parsed = null;
      try { parsed = t ? JSON.parse(t) : null; } catch (e) { parsed = null; }
      if (!r.ok) throw new Error((parsed && parsed.message) || 'Request failed (' + r.status + ').');
      return parsed;
    });
  });
}

function pfSave(e) {
  e.preventDefault();
  const btn = document.getElementById('pfSaveBtn');
  if (!pfVal('pfName')) { pfNote('pfMsg', 'err', 'Name cannot be empty.'); return false; }
  btn.disabled = true; btn.textContent = 'Saving…';
  pfNote('pfMsg', '', '');
  pfSend('/api/me', 'PATCH', {
    name: pfVal('pfName'),
    designation: pfVal('pfDesig'),
    email: pfVal('pfEmail'),
    phone: pfVal('pfPhone'),
  })
    .then(function (me) {
      /* Adopt the server's copy rather than the form's: it is the record that
         was actually stored, trimmed and validated. No re-render — that would
         discard the confirmation the user is reading. */
      if (me) ME = me;
      pfNote('pfMsg', 'ok', 'Profile updated.');
    })
    .catch(function (err) { pfNote('pfMsg', 'err', err.message); })
    .then(function () { btn.disabled = false; btn.textContent = 'Save changes'; });
  return false;
}

function pfPassword(e) {
  e.preventDefault();
  const cur = pfVal('pfCur'), next = pfVal('pfNew'), confirm = pfVal('pfConf');
  if (!cur || !next || !confirm) { pfNote('pfPwMsg', 'err', 'Fill in all three fields.'); return false; }
  /* Caught here purely to save a round trip; the server still validates length
     and that the current password is right. */
  if (next !== confirm) { pfNote('pfPwMsg', 'err', 'The two new passwords do not match.'); return false; }
  if (next.length < 8) { pfNote('pfPwMsg', 'err', 'The new password must be at least 8 characters.'); return false; }
  const btn = document.getElementById('pfPwBtn');
  btn.disabled = true; btn.textContent = 'Saving…';
  pfNote('pfPwMsg', '', '');
  pfSend('/api/me/password', 'POST', { current: cur, next: next })
    .then(function () {
      ['pfCur', 'pfNew', 'pfConf'].forEach(function (id) {
        const el = document.getElementById(id); if (el) el.value = '';
      });
      pfNote('pfPwMsg', 'ok', 'Password changed.');
    })
    .catch(function (err) { pfNote('pfPwMsg', 'err', err.message); })
    .then(function () { btn.disabled = false; btn.textContent = 'Change password'; });
  return false;
}

/* ============================================================================
   PER-USER MODULE ACCESS
   ============================================================================
   The signed-in user's allowed panels come from GET /api/auth/me, which resolves
   them from the database on every request. The Super Admin's toggles are the
   source of truth; this file only obeys them.

   Honest scope: this hides panels. It is not a data boundary, and the
   architecture cannot make it one — the dashboard is a single document that
   loads the whole dataset into the browser and reads the sheet client-side, so
   anyone with developer tools can still reach figures for a panel they are not
   shown. Enforcing that properly would mean serving each panel's data from the
   server per request, which is a different platform. What IS enforced
   server-side is everything that mutates: /api/admin/* refuses non-Super-Admins
   outright, and a deactivated account is refused at login and on every request.

   Until /me answers, nothing is hidden: a network hiccup must not blank the menu
   for a user who is entitled to it. Denial only ever comes from a real answer. */
var ME = null;

function moduleAllowed(v) {
  /* Everyone has a profile. It is not a module a Super Admin grants, so it is
     never in ME.modules and must not be caught by the lookup below. */
  if (v === 'profile') return true;
  if (!v || !ME || !ME.modules) return true;
  return ME.modules[v] !== false;
}

function isSuperAdmin() {
  return !!(ME && ME.role === 'super_admin');
}

/* Landing on a panel that is no longer permitted moves to the first that is,
   rather than showing an empty frame. */
function firstAllowedView() {
  for (var i = 0; i < NAV.length; i++) {
    var it = NAV[i];
    if (it.v && !viewHidden(it.v) && moduleAllowed(it.v)) return it.v;
  }
  return null;
}

function applyAccess() {
  if (!ME || !ME.modules) return;
  if (!moduleAllowed(state.view)) {
    var next = firstAllowedView();
    if (next) state.view = next;
  }
  renderAccountLinks();
  render();
}

function renderAccountLinks() {
  var slot = document.getElementById('acctLinks');
  if (!slot) return;
  var html = '';
  if (isSuperAdmin()) {
    html +=
      '<a class="navitem" href="/admin/users" title="Manage users and access">' +
      '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
      '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>' +
      'Administration</a>';
  }
  /* No Profile link here any more: it is a panel in the sidebar above, reached
     like every other panel. Administration stays a link because it is a separate
     application surface, not a panel of this dashboard. */
  slot.innerHTML = html;
}

function loadMe() {
  return fetch('/api/auth/me', { credentials: 'include' })
    .then(function (r) {
      return r.ok ? r.json() : null;
    })
    .then(function (u) {
      if (!u) return;
      ME = u;
      applyAccess();
    })
    .catch(function () {
      /* Offline or a blip: leave the menu exactly as it is. */
    });
}

/* Deep link: /profile now redirects here as /?panel=profile, so an old
   bookmark still lands on the panel rather than the default view. Only names a
   view that exists and is visible, so a hand-typed value cannot open a hidden
   panel or leave the app on a blank frame. */
(function(){
  var m = /[?&]panel=([A-Za-z]+)/.exec(location.search);
  var v = m && m[1];
  if (v && NAV.some(function(it){ return it.v === v; }) && !viewHidden(v)) state.view = v;
})();
renderNav(); refreshSyncFacts(); renderAccountLinks(); render(); syncStart(); gsInit(); loadMe();
</script>
