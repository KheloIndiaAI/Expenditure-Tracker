<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8"/>
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>SAI · Executive Financial Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg-page:#f4f6fa; --bg-surface:#ffffff; --bg-raised:#ffffff;
  --bg-app:#eef2f8;
  --text-primary:#141a24; --text-secondary:#4d5666; --text-muted:#88909f;
  --border:#e3e8f0; --border-subtle:#eef1f6; --grid:#e8ecf3;
  --primary:#256abf; --primary-hover:#1d5aa6; --primary-subtle:#e9f0fb;
  --good:#1b9e63; --warn:#c98a00; --serious:#d4622a; --critical:#c62d2d;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
  --radius-sm:8px; --radius-md:12px; --radius-lg:16px;
  --elev-1:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.08);
  --elev-2:0 4px 14px rgba(16,24,40,.10);
  --elev-3:0 12px 34px rgba(16,24,40,.14);
  --sans:'Inter',system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --glass-bg:rgba(255,255,255,.80); --glass-border:#e3e8f0;
}
::selection{background:rgba(37,106,191,.22);color:#0b1220}
html{scroll-behavior:smooth}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(16,24,40,.20);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:rgba(16,24,40,.32)}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg-page);color:var(--text-primary);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.tnum{font-variant-numeric:tabular-nums}
a{color:var(--primary);text-decoration:none}
button{font-family:inherit}

/* layout */
.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.sidebar{background:var(--glass-bg);backdrop-filter:blur(24px) saturate(1.3);-webkit-backdrop-filter:blur(24px) saturate(1.3);border-right:1px solid var(--glass-border);position:sticky;top:0;height:100vh;overflow-y:auto;padding:18px 12px;display:flex;flex-direction:column}
.brand{display:flex;gap:10px;align-items:center;padding:6px 10px 16px}
.brand .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--primary),#4a3aa7);color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px;flex:none;box-shadow:0 0 24px rgba(37,106,191,.35),0 0 8px rgba(37,106,191,.2)}
.brand .bt{font-weight:700;font-size:14px;line-height:1.15}
.brand .bs{font-size:11px;color:var(--text-muted)}
.navgroup{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);padding:14px 12px 6px;font-weight:600}
.navitem{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;color:var(--text-secondary);cursor:pointer;font-size:14px;font-weight:500;border:none;background:none;width:100%;text-align:left}
.navitem:hover{background:var(--bg-page)}
.navitem.active{background:var(--primary-subtle);color:var(--primary-hover);font-weight:600}
.navitem.feat{position:relative;margin:3px 0;background:linear-gradient(135deg,rgba(37,106,191,.1),rgba(74,58,167,.08));color:var(--primary-hover);font-weight:600;box-shadow:inset 0 0 0 1px rgba(37,106,191,.18)}
.navitem.feat:hover{background:linear-gradient(135deg,rgba(37,106,191,.16),rgba(74,58,167,.12))}
.navitem.feat.active{background:linear-gradient(135deg,rgba(37,106,191,.2),rgba(74,58,167,.15));box-shadow:inset 0 0 0 1px rgba(37,106,191,.35)}
.navitem.feat .ic-chip{width:25px;height:25px;border-radius:8px;background:linear-gradient(135deg,var(--primary),#4a3aa7);display:grid;place-items:center;flex:none;box-shadow:0 2px 8px rgba(37,106,191,.4)}
.navitem.feat .ic-chip svg{width:14px;height:14px;color:#fff}
.navitem .ic{width:18px;height:18px;flex:none;opacity:.9}
.navitem .badge-n{margin-left:auto;font-size:11px;background:var(--critical);color:#fff;border-radius:20px;padding:1px 7px;font-weight:700}
.navlogout{margin-top:auto;color:var(--critical);border-top:1px solid var(--border-subtle);border-radius:0;padding-top:12px}
.navlogout:hover{background:#fbeaea;border-radius:8px}
.navlogout .ic{opacity:.9}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.86);backdrop-filter:blur(20px) saturate(1.2);-webkit-backdrop-filter:blur(20px) saturate(1.2);border-bottom:1px solid var(--glass-border);padding:12px 28px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;row-gap:10px}
.topfilters{display:flex;align-items:center;gap:7px;flex-wrap:wrap;flex:1 1 auto;min-width:0}
.fchip{border:1px solid var(--border);background:var(--bg-surface);border-radius:20px;padding:7px 12px;font-size:12.5px;font-weight:600;color:var(--text-secondary);cursor:pointer;white-space:nowrap;font-family:inherit;transition:background .12s,border-color .12s,box-shadow .12s,color .12s}
.fchip:hover{border-color:var(--primary);color:var(--primary)}
.fchip.on{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:700;box-shadow:0 2px 12px rgba(37,106,191,.35),inset 0 0 0 1px rgba(255,255,255,.14)}
.fchip.on:hover{color:#fff}
.fchip-rc{border-color:var(--primary);color:var(--primary-hover);background:var(--primary-subtle);display:inline-flex;flex-direction:column;align-items:flex-start;gap:1px;padding:6px 14px;line-height:1.25}
.fchip-rc.on{background:var(--primary);border-color:var(--primary);color:#fff}
.fchip.lk{opacity:.4;pointer-events:none;filter:grayscale(.5)}
.fchip.fchip-2l{display:inline-flex;flex-direction:column;align-items:flex-start;gap:1px;padding:6px 14px;line-height:1.25}
.fchip-main{font-size:12.5px;font-weight:inherit}
.fchip-sub{font-size:9.5px;font-weight:500;opacity:.75}
.verchip{margin-left:auto;font-size:12px;color:var(--text-secondary);background:var(--bg-surface);border:1px solid var(--border);border-radius:20px;padding:5px 12px;white-space:nowrap}
/* four filter chips plus the Classification select need the room on laptop widths, so the
   data-as-of chip (duplicated in every page sub-heading) yields first. */
@media(max-width:1320px){.verchip{display:none}}
/* ---- Global search ---------------------------------------------------------
   A finder, not a filter. It searches the whole dataset regardless of which
   classification chips are on, so nothing is ever invisible merely because a
   chip is unticked - a search that silently hides what you asked for is worse
   than no search. Picking a result navigates to the panel that owns it AND
   opens that row (state.hsOpen), which is what makes it a drill rather than a
   jump to a page you then have to scan by hand. */
/* Flexible, not fixed: the chip row already fills the bar at laptop widths, so a
   fixed box pushed the filters onto a second row and made the sticky header 111px
   tall. Basis 140 keeps it on the line, it grows into whatever the chips leave, and
   caps at 216 so it never sprawls on a wide monitor. */
.gs{position:relative;flex:1 1 140px;min-width:118px;max-width:216px}
.gs-f{display:flex;align-items:center;gap:7px;height:34px;padding:0 9px 0 11px;background:var(--bg-surface);border:1px solid var(--border);border-radius:20px;transition:border-color .12s,box-shadow .12s}
.gs-f:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-subtle)}
.gs-i{flex:1;min-width:0;border:0;outline:0;background:none;font-family:inherit;font-size:12.5px;font-weight:500;color:var(--text-primary);padding:0}
.gs-i::placeholder{color:var(--text-muted);font-weight:500}
.gs-ic{width:14px;height:14px;flex:none;color:var(--text-muted)}
.gs-f:focus-within .gs-ic{color:var(--primary)}
.gs-k{flex:none;font:700 10px/1 inherit;color:var(--text-muted);background:var(--bg-app);border:1px solid var(--border);border-radius:4px;padding:3px 5px}
.gs-x{flex:none;border:0;background:none;padding:0;margin:0;cursor:pointer;color:var(--text-muted);display:none;line-height:0}
.gs-x:hover{color:var(--text-primary)}
.gs.has .gs-k{display:none}
.gs.has .gs-x{display:block}
.gs-p{position:absolute;top:calc(100% + 9px);left:0;width:min(580px,84vw);max-height:min(64vh,510px);overflow:auto;overscroll-behavior:contain;background:var(--bg-surface);border:1px solid var(--border);border-radius:12px;box-shadow:0 18px 48px rgba(11,11,11,.16),0 2px 8px rgba(11,11,11,.06);padding:6px;display:none;z-index:70}
.gs.on .gs-p{display:block}
.gs-g{padding:9px 10px 4px;font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted)}
.gs-r{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer}
.gs-r:hover{background:var(--bg-app)}
.gs-r.sel{background:var(--primary-subtle)}
.gs-b{flex:1;min-width:0}
.gs-t{font-size:13px;font-weight:600;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gs-s{font-size:11px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.gs-n{font-size:11px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.gs-v{flex:none;text-align:right;padding-left:4px}
.gs-v .a{font-size:12.5px;font-weight:700;color:var(--text-primary);font-variant-numeric:tabular-nums}
.gs-v .u{font-size:10.5px;color:var(--good);font-variant-numeric:tabular-nums;margin-top:1px}
.gs-mk{background:rgba(250,178,25,.32);color:inherit;border-radius:2px;padding:0 1px}
.gs-e{padding:20px 14px;text-align:center;color:var(--text-muted);font-size:12.5px;line-height:1.6}
.gs-more{padding:2px 10px 8px;font-size:11px;color:var(--text-muted)}
.gs-ft{display:flex;gap:13px;justify-content:flex-end;padding:7px 10px 3px;border-top:1px solid var(--border-subtle);margin-top:4px;font-size:10.5px;color:var(--text-muted)}
.gs-ft b{font-weight:700;color:var(--text-secondary)}
@media(max-width:1320px){.gs{flex-basis:132px;max-width:172px}}
@media(max-width:980px){.gs{flex:1 1 130px;max-width:none}.gs-k{display:none}.gs-p{width:min(560px,92vw)}}
@media(max-width:520px){.gs-p{position:fixed;left:8px;right:8px;width:auto;top:auto;margin-top:9px}.gs-v{display:none}}
/* live-sync status pill */
.syncp{display:inline-flex;align-items:center;gap:7px;cursor:pointer;user-select:none}
.syncp .dot{width:7px;height:7px;border-radius:50%;flex:none}
.syncp .dot.ok{background:var(--good);box-shadow:0 0 0 3px rgba(27,158,99,.16)}
.syncp .dot.run{background:var(--primary);animation:pulseD 1s ease-in-out infinite}
.syncp .dot.err{background:var(--critical);box-shadow:0 0 0 3px rgba(198,45,45,.16)}
.syncp .dot.idle{background:var(--text-muted)}
.syncp b{color:var(--text-primary);font-weight:600}
.syncp .rf{color:var(--primary);font-weight:700;font-size:11px}
@keyframes pulseD{0%,100%{opacity:.35}50%{opacity:1}}
.rolechip{font-size:12px;color:#fff;background:var(--primary);border-radius:20px;padding:5px 12px;font-weight:600}

.content{padding:22px 28px 60px;max-width:1440px;width:100%}
.pagehead{margin:2px 0 4px}
.pagehead h1{font-size:26px;font-weight:700;margin:0}
.pagehead .sub{color:var(--text-secondary);font-size:14px;margin-top:3px}
.breadcrumb{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--text-muted);margin:10px 0 2px}
.breadcrumb .cr{background:var(--bg-surface);border:1px solid var(--border);border-radius:16px;padding:3px 10px;cursor:pointer;color:var(--text-secondary);display:inline-flex;gap:6px;align-items:center}
.breadcrumb .cr:hover{border-color:var(--primary);color:var(--primary)}

.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:16px 0}
.kpi-grid.k3{grid-template-columns:repeat(3,1fr)}
/* Two cards, one of which is a list of centres: give the list the wider half. */
.kpi-grid.k2{grid-template-columns:minmax(0,1fr) minmax(0,1.35fr)}
/* Five across, so the budget ceiling sits on the same line as the figures it
   frames rather than wrapping onto a row of its own. */
.kpi-grid.k5{grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.kpi{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:16px 16px 14px;box-shadow:var(--elev-1);min-width:0;transition:transform .2s,box-shadow .2s,border-color .2s}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--elev-2);border-color:rgba(37,106,191,.30)}
.kpi .lbl{font-size:12.5px;color:var(--text-muted);font-weight:500;display:flex;align-items:center;gap:6px}
.kpi .val{font-size:28px;font-weight:700;margin-top:8px;letter-spacing:-.01em}
/* Two of the five cards carry their sub on two lines (the Q2 tranche under the
   previous assignment, the two denominators under the spend). A tighter leading
   keeps that pair from towering over the three single-line cards beside them. */
.kpi .sub{font-size:12.5px;color:var(--text-secondary);margin-top:3px;line-height:1.45}
/* The spend rates sit last on their card, under the KI Infra caption, so they
   need a little more air than a sub that follows the headline directly. */
.kpi .sub.kpi-rates{margin-top:6px}

/* Every card in the band closes with the same footer: a dashed rule, a muted
   label, one figure and an optional rate. Giving the Budget Estimate card one
   too is what squares the row up — it used to carry a single short line while
   its four neighbours each carried two, so it read as unfinished.
   Deliberately no auto-margin trickery to bottom-align the rules: it needs
   :has() to spare the one card whose footer is not last, and every card now
   carries the same two rows, so they line up on their own. */
.kpi .sub.kpi-foot{
  margin-top:7px;padding-top:6px;
  border-top:1px dashed var(--border);
  color:var(--text-muted);font-size:11px;line-height:1.5}
.kpi .sub.kpi-foot b{color:var(--text-secondary);font-weight:700}
.kpi .sub.kpi-foot .kpi-foot-x{color:var(--text-muted);font-weight:600;white-space:nowrap}
.kpi .val.sm{font-size:23px}
.kpi .val.neg{color:var(--critical)}
.kpi.accent{background:linear-gradient(180deg,#f4f8fe,#ffffff)}
.kpi-top{display:flex;align-items:flex-start;gap:12px}
.kpi-txt{min-width:0;flex:1}
.kpi-ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none}
.kpi-ic svg{width:19px;height:19px}
.kpi-ic.ic-blue{background:var(--primary-subtle);color:var(--primary)}
.kpi-ic.ic-green{background:#e3f6e8;color:var(--good)}
.kpi-ic.ic-orange{background:#fdece1;color:var(--serious)}
.kpi-ic.ic-purple{background:#ece8fa;color:#4a3aa7}

.grid2{display:grid;grid-template-columns:1.35fr 1fr;gap:16px;margin-top:4px}
.grid2b{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:16px 18px;box-shadow:var(--elev-1);margin-bottom:16px;min-width:0;transition:box-shadow .2s,border-color .2s}
.card:hover{border-color:rgba(37,106,191,.30)}
.card h3{margin:0;font-size:15px;font-weight:600}
.card .qh{font-size:12.5px;color:var(--text-muted);margin:2px 0 12px}
.card-hd{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
/* ---- My Profile panel: the platform's only form surface --------------------
   The dashboard had no input styling because it never took input. These follow
   the sign-in page so the two form surfaces agree: 8px radius, hairline border,
   primary ring on focus. */
.pf-grid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr) 340px;align-items:start}
@media(max-width:1100px){.pf-grid{grid-template-columns:1fr}}
.pf-f{display:grid;gap:13px;grid-template-columns:1fr 1fr}
@media(max-width:620px){.pf-f{grid-template-columns:1fr}}
.pf-stack{display:grid;gap:13px}
.pf-lb{display:block;font-size:12px;font-weight:600;color:var(--text-secondary);margin-bottom:5px}
.pf-in{width:100%;height:38px;border:1px solid var(--border);border-radius:8px;background:var(--bg-surface);padding:0 11px;font-family:inherit;font-size:13.5px;color:var(--text-primary);outline:0;transition:border-color .12s,box-shadow .12s}
.pf-in:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-subtle)}
.pf-in:disabled{background:var(--bg-app);color:var(--text-muted);cursor:not-allowed}
.pf-hint{font-size:11px;color:var(--text-muted);margin-top:4px;line-height:1.4}
.pf-act{display:flex;justify-content:flex-end;margin-top:15px}
.pf-btn{border:1px solid var(--primary);background:var(--primary);color:#fff;border-radius:8px;padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:background .12s,border-color .12s}
.pf-btn:hover{background:var(--primary-hover);border-color:var(--primary-hover)}
.pf-btn[disabled]{opacity:.6;cursor:default}
.pf-btn.wide{width:100%}
.pf-msg{border-radius:8px;padding:9px 12px;font-size:12.5px;margin:10px 0 2px;line-height:1.45}
.pf-msg.ok{background:rgba(27,158,99,.09);color:var(--good);border:1px solid rgba(27,158,99,.28)}
.pf-msg.err{background:rgba(198,45,45,.07);color:var(--critical);border:1px solid rgba(198,45,45,.26)}
.card-hd .link{font-size:12.5px;font-weight:600;cursor:pointer}

.barrow{display:grid;grid-template-columns:170px 1fr 96px;gap:10px;align-items:center;padding:5px 0;cursor:pointer}
.barrow:hover .lab{color:var(--primary)}
.barrow .lab{font-size:13px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barrow .track{background:var(--bg-page);border-radius:5px;height:20px;overflow:hidden;position:relative}
.barrow .fill{height:100%;border-radius:5px}
.barrow .amt{font-size:13px;text-align:right;font-weight:600}
.barrow .amt small{display:block;font-weight:400;color:var(--text-muted);font-size:11px}

table.dt{width:100%;border-collapse:collapse;font-size:13px}
table.dt th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--border);cursor:pointer;white-space:nowrap;position:sticky;top:0;background:var(--bg-surface);backdrop-filter:blur(8px)}
table.dt th.num,table.dt td.num{text-align:right}
table.dt td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
table.dt tr:hover td{background:var(--bg-raised)}
table.dt tr.click{cursor:pointer}
/* No blanket `tr.open` rule here on purpose. `open` means "this row's drill-down
   is expanded", and the rows that use it — the tree's components and
   sub-verticals, and the SAI Format rows — each say so themselves below, at a
   higher specificity. A catch-all on `table.dt` only lay in wait for the next
   row type that happened to be called open and tinted it by accident. */
.dt tr.rc-det>td{padding:0}
.dt tr.rc-open>td,.dt tr.rc-open:hover>td{background:var(--primary-subtle)}
.dt tr.rc-open>td:first-child{box-shadow:inset 3px 0 0 var(--primary)}
.dt tr.rc-open b{color:var(--primary-hover)}
.sctable td:first-child{min-width:300px;padding-top:9px;padding-bottom:10px}
.scname{display:flex;align-items:center;gap:8px}
.scname b{font-weight:600}
.sv-ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none}
.sv-ic svg{width:17px;height:17px}
.sv-gauge{min-width:140px;padding:2px 0}
.sv-gauge-pct{font-size:13px;font-weight:700;margin-bottom:5px}
.sv-gauge-track{position:relative;height:5px;background:var(--bg-page);border-radius:5px;margin:0 6px}
.sv-gauge-fill{position:absolute;left:0;top:0;height:100%;border-radius:5px;opacity:.35}
.sv-gauge-dot{position:absolute;top:50%;width:11px;height:11px;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 0 2px #fff,0 1px 3px rgba(11,11,11,.25)}
.sv-gauge-ends{display:flex;justify-content:space-between;font-size:9.5px;color:var(--text-muted);margin-top:4px}
.sv-sec-pill{display:inline-flex;align-items:center;padding:3px 11px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap}
.chev{width:19px;height:19px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:9px;line-height:1;flex:none;vertical-align:middle;background:var(--bg-page);color:var(--text-secondary);border:1px solid var(--border);transition:background .15s,color .15s,border-color .15s,box-shadow .15s}
.chev.open{background:var(--primary);color:#fff;border-color:var(--primary);box-shadow:0 1px 3px rgba(37,106,191,.35)}
.chev-x{display:inline-flex;width:19px;justify-content:center;color:var(--text-muted);opacity:.45;vertical-align:middle}

/* ---- SAI Format Summary: the finance wing's own statutory summary layout ----
   A bordered grid rather than the platform's borderless tables, because this panel exists to
   reproduce an established reporting format one-for-one. Typography, colours and interaction
   still come from the platform's design system. */
/* The summary is presented as a document sheet: capped and centred on the page rather than
   stretched edge to edge, which is what the format is meant to look like and keeps each
   figure near its label. The cap sits on a wrapper so the basis strip above the sheet and the
   drop-down panels inside it all share the same measure. */
.saif-page{max-width:1040px;margin:0 auto}
/* ---- Attention Centre: ageing releases, grouped by centre ---- */
.agc-sec{margin:0 0 18px}
.agc-band{display:flex;align-items:center;gap:13px;padding:12px 16px;border:1px solid var(--border);border-bottom:none;border-radius:12px 12px 0 0;background:linear-gradient(135deg,#fdf3f3,#fff)}
.agc-badge{width:34px;height:34px;border-radius:10px;background:#fbeaea;color:var(--critical);display:grid;place-items:center;flex:none}
.agc-badge svg{width:17px;height:17px}
.agc-id{min-width:0;flex:1}
.agc-name{font-size:15.5px;font-weight:700;color:var(--text-primary);letter-spacing:-.01em}
.agc-tag{font-size:12px;color:var(--text-muted);margin-top:2px}
.agc-right{margin-left:auto;text-align:right;flex:none}
.agc-rv{font-size:18px;font-weight:700;color:var(--critical)}
.agc-rl{font-size:11px;color:var(--text-muted);margin-top:1px}
.agc-body{border:1px solid var(--border);border-top:none;border-radius:0 0 12px 12px;background:var(--bg-surface);box-shadow:var(--elev-1);padding:0 0 2px}
/* Fixed layout with explicit column widths. Without it the long narration drives the whole
   table and squeezes the money columns until they wrap mid-figure. The clamp lives on an
   inner div, never on the cell: `display:-webkit-box` on a <td> takes it out of the table
   layout entirely and the text escapes its column. */
.agc-tbl{margin:0;table-layout:fixed;width:100%;min-width:840px}
.agc-tbl tbody tr:hover>td{background:var(--bg-app)}
.agc-tbl th,.agc-tbl td{vertical-align:middle;padding:9px 10px}
.agc-tbl th:nth-child(1),.agc-tbl td:nth-child(1){width:21%}
.agc-tbl th:nth-child(2),.agc-tbl td:nth-child(2){width:33%}
.agc-tbl th:nth-child(3),.agc-tbl td:nth-child(3){width:10%}
.agc-tbl th:nth-child(4),.agc-tbl td:nth-child(4){width:7%}
.agc-tbl th:nth-child(5),.agc-tbl td:nth-child(5){width:10%}
.agc-tbl th:nth-child(6),.agc-tbl td:nth-child(6){width:10%}
.agc-tbl th:nth-child(7),.agc-tbl td:nth-child(7){width:9%}
.agc-tbl td.num,.agc-tbl th.num{white-space:nowrap;font-variant-numeric:tabular-nums}
.agc-vn{font-size:13px;font-weight:700;color:var(--text-primary);overflow-wrap:anywhere}
.agc-sv{font-size:11.5px;color:var(--text-muted);font-weight:400;margin-top:2px;line-height:1.3;overflow-wrap:anywhere}
.agc-cp{margin-top:4px}
.agc-cp .sv-sec-pill{padding:1px 7px;font-size:9.5px;font-weight:700;letter-spacing:.015em;border-radius:16px}
.agc-det{font-size:11.5px;color:var(--text-secondary);line-height:1.4;font-weight:400;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.agc-tbl tfoot td{border-bottom:none;border-top:2px solid var(--border);background:var(--bg-app)}
.agc-age{display:inline-block;padding:1px 8px;border-radius:16px;background:#fdf3d7;color:#8a6100;font-size:11px;font-weight:700}
.agc-age.hot{background:#fbeaea;color:#a52121}
/* "Centres to talk to" — a ranked list inside a KPI card */
.agc-klist{margin-top:7px}
.agc-kl{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:12.5px;
  padding:2.5px 0;border-bottom:1px dashed var(--border-subtle)}
.agc-kl:last-child{border-bottom:none}
.agc-kl span{color:var(--text-secondary);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.agc-kl b{color:var(--critical);font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.agc-kl.more span,.agc-kl.more b{color:var(--text-muted);font-weight:600}
.saif-print{width:30px;height:30px;border:1px solid var(--border);background:var(--bg-surface);border-radius:8px;cursor:pointer;display:grid;place-items:center;color:var(--text-secondary);flex:none;padding:0;font-family:inherit;transition:background .12s,border-color .12s,color .12s}
.saif-print:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-subtle)}
.saif-print:active{transform:translateY(1px)}

/* Print: strip the application chrome and put the summary sheet on the page on its own.
   Scoped to a body class set only for the duration of the print call, so printing from any
   other page is unaffected. Expanded drop-downs print as they appear on screen. */
@media print{
  @page{margin:12mm}
  body.print-saif{background:#fff}
  body.print-saif .sidebar,body.print-saif .topbar,body.print-saif .sbBackdrop,
  body.print-saif .sidebar-backdrop,body.print-saif #tip,body.print-saif .pagehead,
  body.print-saif .kpi-grid,body.print-saif .reco{display:none!important}
  body.print-saif .app{display:block}
  body.print-saif .content{padding:0!important}
  body.print-saif .saif-page{max-width:none;margin:0}
  body.print-saif .saif-doc{border:1px solid #8a8a8a;box-shadow:none;border-radius:0;margin:0}
  body.print-saif .saif-scroll{overflow:visible}
  body.print-saif .saif{min-width:0;font-size:9.5pt}
  body.print-saif .saif td{border-color:#8a8a8a}
  body.print-saif .saif .car{display:none}
  body.print-saif .saif-inner{max-width:none}
  body.print-saif tr{page-break-inside:avoid}
  body.print-saif *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

/* The drop-down is an inset detail panel, not a full-width table: capping it keeps each

   screen. One cap on the wrapper governs the heading, the table and any note, so every

.saif-inner{padding:13px 18px 15px;max-width:740px;margin:0 auto}

.rcmini{width:100%;border-collapse:collapse;table-layout:fixed;font-size:12.5px;background:var(--bg-surface);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.rcmini th:nth-child(1),.rcmini td:nth-child(1){width:40%}
.rcmini th:nth-child(2),.rcmini td:nth-child(2),
.rcmini th:nth-child(3),.rcmini td:nth-child(3),
.rcmini th:nth-child(4),.rcmini td:nth-child(4){width:20%}
.rcmini th,.rcmini td{padding:6px 11px;border-bottom:1px solid var(--border-subtle)}
.rcmini th{background:var(--bg-app);font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);font-weight:700;text-align:right}
.rcmini th:first-child{text-align:left}
.rcmini td{text-align:right;font-variant-numeric:tabular-nums}
.rcmini td:first-child{text-align:left}
.rcmini tr:last-child td{border-bottom:none}
.rcmini tr.t td{background:var(--bg-app);font-weight:700;border-top:1px solid var(--border)}
.rcmini .un{color:var(--critical);font-weight:600}
.rcmini .nilrow td{color:var(--text-muted);font-style:italic}
/* three-step expenditure build-up in every drop-down: centres only -> add DDO KI Direct
   -> total, which always equals the component row above. Makes the DDO KI Direct component
   visible as an arithmetic step instead of a footnote. */
.rcmini tr.sub-t td{background:var(--bg-app);font-weight:700;border-top:1px solid var(--border);color:var(--text-primary)}
.rcmini tr.add-t td{background:#fbfcfe;font-weight:600;color:var(--text-secondary)}
.rcmini tr.add-t td:first-child{padding-left:24px}
.rcmini tr.add-t .plus{display:inline-block;width:15px;color:var(--primary);font-weight:800}
/* in the narrower column the qualifier and the tie-confirmation each take their own line
   rather than wrapping mid-phrase */
.rcmini tr.add-t .nb{display:block;margin-left:15px;margin-top:1px;color:var(--text-muted);font-weight:400;font-size:10.5px;line-height:1.35}
.rcmini tr.add-t.nilv td,.rcmini tr.add-t.nilv .plus{color:var(--text-muted)}
.rcmini tr.grand td{background:var(--primary-subtle);font-weight:800;color:var(--text-primary);border-top:2px solid var(--primary);border-bottom:none;padding-top:8px;padding-bottom:8px}
.rcmini tr.grand .tick{display:block;margin-top:2px;color:var(--good);font-weight:700;font-size:10.5px;white-space:nowrap}
.rcmini tr.dash td{color:var(--text-muted)}
@media(max-width:820px){.saif-inner{padding:10px 10px 12px 14px;max-width:none}.rcmini{font-size:11.5px}.rcmini th,.rcmini td{padding:5px 7px}}
.saif-note{font-size:12.5px;color:var(--text-secondary);background:var(--bg-surface);border:1px dashed var(--border);border-radius:8px;padding:10px 13px}
@media(max-width:720px){.saif{font-size:12px}.saif td,.saif th{padding:6px 7px}.saif .num{width:78px}}
/* ---- SAI KI 1 / KI 2 / Infra delivery blocks ---- */
/* ---- KI 1 / KI 2 / Infra: pick a block, then look inside it ---------------
   Each pill wears its block's colour, the same one the comparison bar and the
   band header use, so the pill and the section it opens read as one thing. */
.kig-pills{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 16px}
.kig-pill{
  display:flex;align-items:center;gap:9px;flex:1 1 190px;min-width:0;
  padding:11px 14px;border:1px solid var(--border);border-radius:12px;
  background:var(--bg-surface);box-shadow:var(--elev-1);cursor:pointer;
  font-family:inherit;font-size:13.5px;font-weight:600;color:var(--text-secondary);
  text-align:left;transition:border-color .14s,background .14s,box-shadow .14s;
  -webkit-tap-highlight-color:transparent}
.kig-pill:hover{border-color:var(--kcbd);color:var(--text-primary)}
.kig-pill.on{
  border-color:var(--kc);background:var(--kcbg);color:var(--text-primary);
  box-shadow:inset 0 0 0 1px var(--kcbd),var(--elev-1)}
.kig-pill-dot{width:11px;height:11px;border-radius:50%;background:var(--kc);flex:none}
.kig-pill-t{white-space:nowrap}
.kig-pill-v{margin-left:auto;color:var(--text-muted);font-weight:700;font-size:12.5px;white-space:nowrap}
.kig-pill.on .kig-pill-v{color:var(--kc)}
/* Chevron drawn rather than marked up, so the control carries no stray glyph. */
.kig-pill-c{
  flex:none;width:0;height:0;border-left:5.5px solid currentColor;
  border-top:4.5px solid transparent;border-bottom:4.5px solid transparent;
  opacity:.55;transition:transform .18s ease;transform-origin:35% 50%}
.kig-pill.on .kig-pill-c{transform:rotate(90deg);opacity:1;color:var(--kc)}

.kig-hint{
  padding:22px 18px;border:1px dashed var(--border);border-radius:12px;
  background:var(--bg-surface);color:var(--text-muted);font-size:13.5px;text-align:center}

/* The component table inside an open block, behind its own control. */
.kig-comp{margin-top:15px;border-top:1px solid var(--border-subtle);padding-top:13px}
.kig-comp-hd{
  display:flex;align-items:center;gap:9px;width:100%;padding:10px 12px;
  border:1px solid var(--border);border-radius:10px;background:var(--bg-page);
  cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;
  color:var(--text-secondary);text-align:left;transition:border-color .14s,color .14s,background .14s}
.kig-comp-hd:hover{border-color:var(--primary);color:var(--primary)}
.kig-comp-hd.on{border-color:var(--primary);background:var(--primary-subtle);color:var(--primary-hover)}
.kig-comp-c{
  flex:none;width:0;height:0;border-left:5.5px solid currentColor;
  border-top:4.5px solid transparent;border-bottom:4.5px solid transparent;
  transition:transform .18s ease;transform-origin:35% 50%}
.kig-comp-hd.on .kig-comp-c{transform:rotate(90deg)}
.kig-comp-n{
  margin-left:auto;display:inline-grid;place-items:center;min-width:20px;height:20px;
  padding:0 6px;border-radius:10px;background:var(--border);color:var(--text-secondary);
  font-size:11px;font-weight:700}
.kig-comp-hd.on .kig-comp-n{background:var(--primary);color:#fff}
.kig-comp-body{margin-top:11px;animation:drop .22s ease}

.kig-sec{margin:0 0 24px}
.kig-band{display:flex;align-items:center;gap:14px;padding:14px 18px;border:1px solid var(--border);border-bottom:none;border-radius:12px 12px 0 0;background:var(--bg-surface)}
.kig-badge{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px;letter-spacing:.02em;flex:none;box-shadow:0 2px 8px rgba(0,0,0,.13)}
.kig-id{min-width:0;flex:1}
.kig-name{font-size:16.5px;font-weight:700;color:var(--text-primary);letter-spacing:-.01em}
.kig-tag{font-size:12.5px;color:var(--text-muted);margin-top:2px}
.kig-right{margin-left:auto;text-align:right;flex:none}
.kig-rv{font-size:19px;font-weight:700;letter-spacing:-.01em}
.kig-rl{font-size:11.5px;color:var(--text-muted);margin-top:1px}
.kig-body{border:1px solid var(--border);border-top:none;border-radius:0 0 12px 12px;background:var(--bg-surface);padding:16px 18px 18px;box-shadow:var(--elev-1)}
.kig-body .kpi-grid{margin:0 0 16px}
/* group read-out: three labelled stat tiles rather than one run-on sentence, so each figure
   has its own heading and the numbers stay scannable at a glance. */
.kig-read{display:flex;flex-wrap:wrap;margin:0 0 14px;background:var(--bg-app);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.kig-stat{flex:1 1 190px;min-width:0;padding:9px 14px;border-right:1px solid var(--border)}
.kig-stat:last-child{border-right:none}
.kig-sk{font-size:10px;text-transform:uppercase;letter-spacing:.055em;color:var(--text-muted);font-weight:700;margin-bottom:3px}
.kig-sv{font-size:13px;color:var(--text-primary);font-weight:600;line-height:1.35;overflow-wrap:anywhere}
.kig-sv .op{color:var(--text-muted);font-weight:600;margin:0 2px}
.kig-sv .mut{color:var(--text-secondary);font-weight:500}
.kig-sv .eq{color:var(--primary);font-weight:700}
/* utilisation bar: same segmented component the RC / KI Infra / Sub-Vertical tables use */
.kig-barwrap{margin:0 0 14px}
.kig-barhd{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:11.5px;color:var(--text-muted);margin-bottom:5px}
.kig-barhd b{color:var(--text-primary);font-weight:600}
.kig-cmp .mdsd-bar{height:20px;border-radius:10px;min-width:88px}
.kig-cmp .mdsd-bar>span{font-size:9.5px}
.kig-cmp td.barcell{width:190px;min-width:130px}
/* component cell: name on top, classification as a small pill underneath */
.kig-cn{display:flex;align-items:center;min-width:0}
.kig-cp{margin-top:3px;padding-left:17px}
/* compact classification pill, scoped to this panel - .sv-sec-pill is shared with
   Sub-Vertical Analysis, which keeps the full-size pill. */
.kig-cp .sv-sec-pill{padding:1px 7px;font-size:9.5px;font-weight:700;letter-spacing:.015em;border-radius:16px}
/* Balance is called out in red across this panel. A NEGATIVE balance means the component has
   spent beyond its assignment - a sharper exception than unspent money - so it is flagged too,
   with the minus sign carrying the meaning. Only a true nil balance stays muted. */
.bal-red{color:var(--critical);font-weight:600}
.bal-over{color:var(--critical);font-weight:700}
.bal-over::after{content:' ▲';font-size:9px;vertical-align:1px}
@media(max-width:720px){
  .kig-stat{flex:1 1 100%;border-right:none;border-bottom:1px solid var(--border)}
  .kig-stat:last-child{border-bottom:none}
  .kig-cmp td.barcell{display:none}.kig-cmp th.barcell{display:none}
}
.kig-share{display:flex;height:36px;border-radius:9px;overflow:hidden;border:1px solid var(--border);margin:2px 0 10px}
.kig-share span{display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700;min-width:0;overflow:hidden;white-space:nowrap;transition:flex-grow .2s}
.kig-cmp{width:100%;border-collapse:collapse;font-size:13px}
.kig-cmp th,.kig-cmp td{padding:9px 10px;border-bottom:1px solid var(--border-subtle);text-align:right;white-space:nowrap}
.kig-cmp th{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);font-weight:600}
.kig-cmp th:first-child,.kig-cmp td:first-child{text-align:left}
.kig-cmp tbody tr:last-child td{border-bottom:none}
.kig-cmp tfoot td{border-top:2px solid var(--border);border-bottom:none;font-weight:700;color:var(--text-primary);padding-top:11px}
.kig-dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:8px;vertical-align:middle}
.kig-warn{background:#fbeaea;border:1px solid #e9b8b8;color:#8f1d1d;border-radius:10px;padding:11px 14px;font-size:13px;margin-bottom:16px}
@media(max-width:720px){
  .kig-band{padding:12px 13px;gap:11px}
  .kig-badge{width:38px;height:38px;border-radius:10px;font-size:12px}
  .kig-name{font-size:14.5px}
  .kig-body{padding:13px 12px 15px}
  .kig-rv{font-size:16px}
}

.kpi-ic.ic-red{background:rgba(198,45,45,.12);color:var(--critical)}

/* ---- Attention Centre: queue tabs + priority list ---- */

.chip-sel.dfind input:focus{outline:none}
.tools{display:flex;gap:10px;align-items:center;margin-left:auto}

/* ---- Live-sync hover card -------------------------------------------------
   A structured card rather than a list of label: value lines, so the state of
   the feed reads at a glance: status in the header, the latest movement given
   the most visual weight, supporting facts in a quiet key/value block, and any
   data problem as a distinct alert. #tip drops its own padding for this one so
   the card can run its sections full-bleed. */
/* ---- Trend Analytics ---- */
.ta-top{align-items:center;gap:8px;background:var(--bg-surface);border:1px solid var(--border);border-radius:10px;padding:9px 12px;box-shadow:var(--elev-1);margin-bottom:14px}

.ta-hd{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:4px}
.ta-hd h3{margin:0;font-size:15.5px;font-weight:700}
.ta-hd .qh{margin:2px 0 0}
.ta-seg{margin-left:auto;display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;flex:none}
.ta-seg button{border:none;background:var(--bg-surface);padding:6px 12px;font-size:12px;font-weight:600;color:var(--text-secondary);cursor:pointer;font-family:inherit;border-right:1px solid var(--border)}
.ta-seg button:last-child{border-right:none}
.ta-seg button:hover{background:var(--primary-subtle);color:var(--primary-hover)}
.ta-seg button.on{background:var(--primary);color:#fff}
.ta-picks{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0 4px}
.ta-pick{display:inline-flex;flex-direction:column;align-items:flex-start;gap:1px;border:1px solid var(--border);background:var(--bg-surface);border-radius:9px;padding:6px 11px;cursor:pointer;font-family:inherit;text-align:left;transition:background .12s,border-color .12s,box-shadow .12s}
.ta-pick:hover{border-color:var(--primary);background:var(--primary-subtle)}
.ta-pick.on{background:var(--primary);border-color:var(--primary);box-shadow:0 2px 10px rgba(37,106,191,.30)}
.ta-pick .nm{font-size:12px;font-weight:600;color:var(--text-secondary);max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ta-pick .vv{font-size:11px;font-weight:700;color:var(--text-primary);font-variant-numeric:tabular-nums}
.ta-pick.on .nm,.ta-pick.on .vv{color:#fff}
.ta-subs{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin:10px 0 2px;padding-top:10px;border-top:1px dashed var(--border-subtle)}
.ta-legend{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin:14px 0 6px}

.ta-lg i{width:11px;height:11px;border-radius:3px;display:inline-block}
.ta-cov{margin-left:auto;font-size:11px;color:var(--text-muted)}
@media(max-width:720px){
  .ta-seg{margin-left:0;width:100%}
  .ta-seg button{flex:1}
  .ta-pick .nm{max-width:120px}
  .ta-legend{gap:10px}
  .ta-cov{margin-left:0;flex-basis:100%}
}

     supporting figures stay two-up rather than becoming a long column of
     near-identical tiles, so the type steps down instead of the grid. */

  .kpi-grid>.kpi .lbl{font-size:10.5px}

/* ============================================================
   MOBILE HARDENING LAYER  (appended — phones & small tablets only)
   Every rule below lives inside a media query, so the desktop
   experience is byte-for-byte unchanged. Ordered widest → narrowest.
   ============================================================ */

/* ---- Tablet / large phone (<=980px): the sidebar-drawer breakpoint ---- */
@media(max-width:980px){
  /* Stop wide children (tables, charts) from creating a page-wide
     horizontal scroll. `clip` (not `hidden`) so it doesn't turn body
     into a scroll container and break the sticky topbar. */
  html,body{overflow-x:clip}
  .app,.main,.content{min-width:0;max-width:100%}

  /* Charts stack vertically and become fluid instead of fixed-width */
  .chartwrap{flex-direction:column;align-items:stretch;gap:12px}
  .chartwrap .cc{flex:1 1 auto;width:100%;max-width:360px;margin:0 auto}
  .chart-svg{width:100%;height:auto;max-width:100%}

  /* Wide "document format" summary tables scroll within their own panel
     rather than pushing the whole page sideways */
  .saif-inner,.saif-page{overflow-x:auto;-webkit-overflow-scrolling:touch}

  /* Roomier tap target for every drawer nav item */
  .navitem{padding:11px 12px;font-size:15px}

  /* Momentum scrolling + slim scrollbars on all horizontal table wrappers */
  .tscroll{scrollbar-width:thin}
  .tscroll::-webkit-scrollbar{height:6px}
  .tscroll::-webkit-scrollbar-thumb{background:rgba(16,24,40,.22);border-radius:3px}
}

/* ---- Phone (<=640px) ---- */
@media(max-width:640px){
  /* Thumb-friendly controls (WCAG ~44px target where practical) */
  .btn,.fchip,.chip-sel{min-height:40px;display:inline-flex;align-items:center}
  .toggle button{padding:8px 14px;font-size:13px}
  .card-hd .link{padding:4px 0;display:inline-block}
  .hamburger{width:42px;height:42px}
  .navitem{padding:12px}

  /* Keep table cells legible while horizontally scrolling */
  table.dt th,table.dt td{padding:9px 10px}

  /* Hover tooltips are pointer-only; hide on touch so they can't stick. The
     same content is reachable by tapping the card — see .tipsheet below. */
  #tip{display:none!important}

  /* ---- Card detail sheet -------------------------------------------------
     A KPI card whose detail is a tap away says so: it takes a pointer, an
     active state and a chevron in its corner, so it does not look like the
     inert cards beside it.                                                  */
  .kpi[data-tip]{cursor:pointer;position:relative;-webkit-tap-highlight-color:transparent}
  .kpi[data-tip]:active{background:var(--bg-page)}
  .kpi[data-tip]::after{
    content:'';position:absolute;top:14px;right:13px;
    width:0;height:0;border-left:5px solid var(--text-muted);
    border-top:4px solid transparent;border-bottom:4px solid transparent;opacity:.5}

  .tipsheet{
    display:block;position:fixed;left:0;right:0;bottom:0;z-index:65;
    padding:0 16px calc(18px + env(safe-area-inset-bottom));
    background:var(--bg-surface);border-top:1px solid var(--border);
    border-radius:18px 18px 0 0;box-shadow:var(--elev-3);
    max-height:82vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
    transform:translateY(101%);transition:transform .24s cubic-bezier(.4,0,.2,1);
    visibility:hidden}
  body.tip-open .tipsheet{transform:translateY(0);visibility:visible}
  /* Set larger than the hover card: a tooltip is glanced at, a sheet is read. */
  .tipsheet-b{font-size:13.5px;line-height:1.55;color:var(--text-secondary);padding-bottom:4px}
  .tipsheet-b b{color:var(--text-primary)}
  .tipsheet-b .tipbd{font-size:13px}
  .tipsheet-b .tipbd td{padding:3px 0}
  .tipsheet-b .tipbd-h{font-size:13.5px;margin:12px 0 6px;padding-top:10px}

  /* Action tools wrap to a full row instead of crushing against the edge */
  .tools{margin-left:0;width:100%;justify-content:flex-start;flex-wrap:wrap}
  .filterbar{gap:8px}
}

/* ---- Phone (<=640px): dense tables become one card per row ----------------
   Sideways scrolling hides the columns a reader opens the page for (Balance,
   Unspent sit furthest right). Each row instead becomes a self-contained card:
   the first cell is its title, every other cell prints its column heading
   beside the value. `labelTableCells()` supplies those headings at render time.
   The component tree is excluded — see the note on that function.            */
@media(max-width:640px){
  .tscroll.cardify{overflow-x:visible}
  .cardify table.dt{display:block;width:100%;min-width:0}
  .cardify table.dt thead{display:none}
  .cardify table.dt tbody,.cardify table.dt tfoot{display:block}

  .cardify table.dt tr{
    display:block;background:var(--bg-surface);border:1px solid var(--border);
    border-radius:var(--radius-md);padding:11px 13px;margin:0 0 10px;
    box-shadow:var(--elev-1)}
  .cardify table.dt tr:hover td{background:transparent}

  /* Every cell after the first is a heading/value line. Percentage column
     widths (the Attention Centre pins all seven) have no meaning once the row
     is a card, so they are released here. */
  .cardify table.dt td{
    display:flex;align-items:baseline;justify-content:space-between;gap:14px;
    width:auto;min-width:0;padding:5px 0;border:0;
    border-bottom:1px solid var(--border-subtle);text-align:right}
  .cardify table.dt td:last-child{border-bottom:0}
  .cardify table.dt td::before{
    content:attr(data-label);flex:none;text-align:left;font-size:10.5px;
    letter-spacing:.04em;text-transform:uppercase;font-weight:600;
    color:var(--text-muted)}

  /* The first cell is the card's title and runs the full width. */
  .cardify table.dt td:first-child{
    display:block;text-align:left;font-size:14px;font-weight:600;
    width:auto;min-width:0;padding:0 0 9px;margin-bottom:5px;
    border-bottom:1px solid var(--border)}
  .cardify table.dt td:first-child::before{display:none}
  /* A title cell that is itself prose stays a title, not a stacked paragraph. */
  .cardify table.dt td:first-child.dt-long{
    font-size:14px;font-weight:600;color:var(--text-primary);padding-top:0}

  /* Utilisation bars read better full width beneath the numbers. */
  .cardify table.dt td.barcell{display:block;width:auto;text-align:left;padding-top:9px}
  .cardify table.dt td.barcell::before{display:block;margin-bottom:6px}

  /* Prose gets the full width beneath its heading instead of being squeezed
     into a right-hand column a few characters wide. */
  .cardify table.dt td.dt-long{
    display:block;text-align:left;padding-top:7px;
    font-size:12.5px;line-height:1.45;color:var(--text-secondary)}
  .cardify table.dt td.dt-long::before{display:block;margin-bottom:4px}

  /* ---- Narrations are set in full inside a card ---------------------------
     Both places that carry a release's narration clamp it on a desktop row —
     to three lines in the Attention Centre, two in the voucher list — because
     there it shares a cell with four money columns. A card has the whole width
     and nothing competing for it, so clamping only hid the half of the sentence
     that says what the money was actually for. Note it is `display:block` that
     lifts the clamp: -webkit-line-clamp only bites inside a -webkit-box.
     Both are set identically, so the same sentence reads the same way wherever
     it appears.                                                             */
  .cardify .agc-det,table.txcards .txnar{
    display:block;max-width:none;overflow:visible;
    font-size:12.5px;line-height:1.45;color:var(--text-secondary);
    overflow-wrap:anywhere}

  /* Cells carrying nothing shouldn't leave an empty line behind. */
  .cardify table.dt td:empty,.cardify table.dt td.dt-extra:empty{display:none}

  /* Drill-downs, group headers and sub-tables keep their own layout. */
  .cardify table.dt tr.dt-span{
    display:block;padding:0;margin:0 0 9px;border:0;background:transparent;box-shadow:none}
  .cardify table.dt tr.dt-span td{display:block;padding:0;border:0;text-align:left}
  .cardify table.dt tr.dt-span td::before{display:none}

  /* The totals row is the one card meant to stand out, and stays in view. */
  .cardify table.dt tfoot.dt-foot tr{
    background:var(--primary-subtle);border-color:var(--primary);
    position:sticky;bottom:8px;box-shadow:var(--elev-2)}
  .cardify table.dt tfoot.dt-foot td:first-child{border-bottom-color:var(--primary)}

  /* ---- The component tree as cards -------------------------------------
     Its rows are a hierarchy, not records, so it cannot use the layout above:
     the expander has to stay tappable and a sub-vertical has to keep looking
     like a child of the component above it. Each row becomes three bands —
     the name, the utilisation, then the three figures side by side — and the
     nesting is carried by an inset rather than by indentation, which a phone
     has no width to spare for.                                              */
  .tscroll.treecards{overflow-x:visible}
  .treecards table.dt.tree{display:block;width:100%;min-width:0}
  .treecards table.dt.tree thead{display:none}
  .treecards table.dt.tree tbody{display:block}

  .treecards table.dt.tree tr{
    display:grid;grid-template-columns:1fr 1fr 1fr;
    grid-template-areas:"nm nm nm" "ut ut ut" "as ex ba";
    gap:9px 10px;margin:0 0 9px;padding:11px 12px;
    background:var(--bg-surface);border:1px solid var(--border);
    border-radius:var(--radius-md);box-shadow:var(--elev-1)}
  .treecards table.dt.tree tr:not(.det)>td{
    display:block;padding:0;border:0;background:transparent;
    white-space:normal;min-width:0;width:auto;text-align:left}
  .treecards table.dt.tree td:nth-child(1){grid-area:nm}
  .treecards table.dt.tree td:nth-child(2){grid-area:as}
  .treecards table.dt.tree td:nth-child(3){grid-area:ex}
  .treecards table.dt.tree td:nth-child(4){grid-area:ba}
  /* The totals row ends in a spacer cell left over from the table layout. It
     has no named area, so left alone the grid would auto-place it and open a
     stray fourth band under the figures. */
  .treecards table.dt.tree tr:not(.det)>td:nth-child(n+6){display:none}

  /* Assignment / Expenditure / Balance carry their heading above the figure. */
  .treecards table.dt.tree td:nth-child(n+2):nth-child(-n+4){
    font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums}
  .treecards table.dt.tree td:nth-child(n+2):nth-child(-n+4)::before{
    content:attr(data-label);display:block;font-size:9.5px;letter-spacing:.04em;
    text-transform:uppercase;font-weight:600;color:var(--text-muted);margin-bottom:2px}

  /* Utilisation reads as a percentage followed by a bar across the card. */
  .treecards table.dt.tree tr:not(.det)>td:nth-child(5){
    grid-area:ut;display:flex;align-items:center;gap:10px;
    font-size:12px;font-weight:700;color:var(--text-secondary)}
  .treecards table.dt.tree td:nth-child(5) .ubar{
    flex:1;width:auto;max-width:none;margin:0;height:7px}

  /* The name wraps in full rather than being clipped to a column width. */
  .treecards table.dt.tree td:nth-child(1) .nm{
    max-width:none;white-space:normal;overflow:visible;text-overflow:clip;
    align-items:flex-start;gap:7px;font-size:13.5px;color:var(--text-primary)}
  .treecards table.dt.tree .vname{font-weight:700}
  .treecards table.dt.tree .subname{padding-left:0}
  .treecards table.dt.tree .chev{margin:1px 0 0}

  /* ---- Sections are the navigation ---------------------------------------
     Each wears its own colour from SECTCOL — the same one it carries on the
     classification pill elsewhere — as a tinted card, and that colour runs
     down the left edge of everything belonging to it, so a component is
     placeable at a glance without reading back up to the heading.          */
  .treecards table.dt.tree tr.sec-hidden{display:none}

  .treecards table.dt.tree tr.secrow{
    background:var(--scbg);border-color:var(--scbd);box-shadow:none;
    cursor:pointer;margin-bottom:8px;-webkit-tap-highlight-color:transparent}
  .treecards table.dt.tree tr.secrow.sec-open{margin-bottom:10px}
  .treecards table.dt.tree tr.secrow:active{background:var(--scbg);filter:brightness(.97)}
  .treecards table.dt.tree tr.secrow>td:nth-child(1){
    display:flex;align-items:center;gap:8px;
    font-size:11.5px;font-weight:800;text-transform:uppercase;
    letter-spacing:.05em;color:var(--sc)}
  /* The chevron is drawn rather than marked up, so the desktop row — which is
     not a control — gains nothing it should not have. */
  .treecards table.dt.tree tr.secrow>td:nth-child(1)::before{
    content:'';flex:none;width:0;height:0;
    border-left:5.5px solid currentColor;
    border-top:4.5px solid transparent;border-bottom:4.5px solid transparent;
    transition:transform .18s ease;transform-origin:35% 50%}
  .treecards table.dt.tree tr.secrow.sec-open>td:nth-child(1)::before{transform:rotate(90deg)}
  .treecards table.dt.tree tr.secrow>td:nth-child(5) .ubar>span{background:var(--sc)}

  /* Components and sub-verticals sit inside their section's colour. */
  .treecards table.dt.tree tr.comprow{
    margin-left:10px;border-left:3px solid var(--scbd)}
  .treecards table.dt.tree tr.subrow{
    margin-left:22px;border-left:3px solid var(--scbd)}
  .treecards table.dt.tree tr.comprow.open,
  .treecards table.dt.tree tr.subrow.open{
    border-color:var(--sc);border-left-color:var(--sc);
    box-shadow:var(--elev-2)}
  .treecards table.dt.tree tr.comprow.open>td:nth-child(1),
  .treecards table.dt.tree tr.subrow.open>td:nth-child(1){color:var(--sc)}
  .treecards table.dt.tree tr.comprow>td:nth-child(5) .ubar>span,
  .treecards table.dt.tree tr.subrow>td:nth-child(5) .ubar>span{background:var(--sc)}

  /* The opened detail keeps its own layout, tucked under the row it belongs to. */
  .treecards table.dt.tree tr.det{
    display:block;margin:-6px 0 10px 22px;padding:0;
    background:transparent;border:0;box-shadow:none}
  .treecards table.dt.tree tr.det>td{
    display:block;padding:11px 12px;
    border:1px solid var(--scbd);border-top:0;border-left:3px solid var(--sc);
    border-radius:0 0 var(--radius-md) var(--radius-md)}

  /* The grand total is no longer pinned to the bottom of the screen. A card
     floating over the list cost a strip of every scroll and repeated what the
     figures above already add up to; it now simply ends the list. */
  .treecards table.dt.tree tr.total{
    background:var(--primary-subtle);border-color:var(--primary);margin-top:2px}
  .treecards table.dt.tree tr.total>td:nth-child(1){
    font-size:12px;font-weight:800;letter-spacing:.04em}

  /* ---- The drill-down that opens inside a row -----------------------------
     Same five columns as the tree, so it gets the same three-band card, one
     per centre. It is the innermost thing on the page, so it stays flatter:
     no shadow, a lighter border, and the height cap lifted, since a phone
     scrolls the page rather than a 290px box inside it.                     */
  .usage.usagecards{max-height:none;overflow:visible;border:0;box-shadow:none;
    background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none}
  .usage.usagecards table{display:block;width:100%}
  .usage.usagecards thead{display:none}
  .usage.usagecards tbody{display:block}
  .usage.usagecards tbody tr:not(.txrow){
    display:grid;grid-template-columns:1fr 1fr 1fr;
    grid-template-areas:"nm nm pct" "as ex ba";
    gap:7px 10px;margin:0 0 8px;padding:11px 12px;
    background:var(--bg-surface);border:1px solid var(--border);border-radius:12px}
  /* Rows that state a utilisation get the split bar between name and figures,
     so the card matches the centre card it was opened from. */
  .usage.usagecards tbody tr.ub{grid-template-areas:"nm nm pct" "bar bar bar" "as ex ba"}
  .usage.usagecards tbody tr.ub::after{
    content:'';grid-area:bar;height:9px;border-radius:5px;
    background:linear-gradient(90deg,
      var(--good) 0 calc(var(--up,0)*1%),
      var(--serious) calc(var(--up,0)*1%) 100%)}
  .usage.usagecards tbody tr:not(.txrow):hover{background:var(--bg-surface)}
  .usage.usagecards tbody tr:not(.txrow)>td,
  .usage.usagecards tbody tr:not(.txrow):hover>td{
    display:block;padding:0;border:0;background:transparent;
    text-align:left;vertical-align:baseline;white-space:normal}
  .usage.usagecards tbody tr:not(.txrow)>td:nth-child(1){
    grid-area:nm;font-size:13px;font-weight:600;color:var(--text-primary)}
  .usage.usagecards tbody tr:not(.txrow)>td:nth-child(2){grid-area:as}
  .usage.usagecards tbody tr:not(.txrow)>td:nth-child(3){grid-area:ex}
  .usage.usagecards tbody tr:not(.txrow)>td:nth-child(4){grid-area:ba}
  /* "Used" reads as a pill in the top-right corner rather than taking a column
     of its own, which would squeeze the three figures below. */
  .usage.usagecards tbody tr:not(.txrow)>td:nth-child(5){
    grid-area:pct;justify-self:end;align-self:start;
    padding:2px 9px;border-radius:20px;white-space:nowrap;
    background:var(--bg-page);color:var(--text-secondary);
    font-size:11px;font-weight:700;font-variant-numeric:tabular-nums}
  .usage.usagecards tbody tr:not(.txrow)>td:nth-child(n+2):nth-child(-n+4){
    font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums}
  .usage.usagecards tbody tr:not(.txrow)>td:nth-child(n+2):nth-child(-n+4)::before{
    content:attr(data-label);display:block;font-size:9px;letter-spacing:.03em;
    text-transform:uppercase;font-weight:600;color:var(--text-muted);margin-bottom:1px}
  /* The voucher list an expanded centre reveals keeps its own full-width layout. */
  .usage.usagecards tbody tr.txrow{display:block;margin:-5px 0 9px;padding:0;background:transparent}
  .usage.usagecards tbody tr.txrow>td,
  .usage.usagecards tbody tr.txrow:hover>td{
    display:block;padding:0;border:0;background:transparent}

  /* ---- The voucher list, deepest level of the drill-down ----------------- */
  table.txcards{display:block;width:100%;min-width:0}
  table.txcards thead{display:none}
  table.txcards tbody{display:block}
  table.txcards tbody tr{
    display:block;margin:0 0 7px;padding:9px 10px;
    background:var(--bg-surface);border:1px solid var(--border);border-radius:10px}
  table.txcards tbody td{
    display:flex;align-items:baseline;justify-content:space-between;gap:12px;
    width:auto;padding:3px 0;border:0;text-align:right;font-size:12.5px}
  table.txcards tbody td::before{
    content:attr(data-label);flex:none;text-align:left;font-size:9px;
    letter-spacing:.03em;text-transform:uppercase;font-weight:600;color:var(--text-muted)}
  /* The voucher line and its narration lead the card, full width. */
  table.txcards tbody td:first-child{
    display:block;text-align:left;padding:0 0 8px;margin-bottom:5px;
    border-bottom:1px solid var(--border-subtle);font-size:12.5px}
  table.txcards tbody td:first-child::before{display:none}
  table.txcards .txnar{margin-top:6px}

  /* ---- The KPI band leads with one hero figure, then supporting numbers ---- */
  .kpi-grid,.kpi-grid.k3,.kpi-grid.k5{grid-template-columns:repeat(2,1fr);gap:10px}
  /* A two-card band stacks: half a phone's width is too narrow for a list of
     centre names and amounts to sit side by side with anything. */
  .kpi-grid.k2{grid-template-columns:1fr}
  .kpi-grid>.kpi:first-child{grid-column:1/-1}
  .kpi-grid>.kpi:first-child .val{font-size:30px;letter-spacing:-.02em}
  .kpi-grid>.kpi:first-child .kpi-ic{width:36px;height:36px}
  .kpi-grid>.kpi:first-child .kpi-ic svg{width:18px;height:18px}
}

/* ---- Filters bottom sheet (phones) --------------------------------------
   Five chips plus a select consume most of a phone's first screen and push the
   figures below the fold. They move into a sheet that slides up on demand; the
   trigger keeps the current state visible as a count (or "RC" when the
   Regional-Centres-only mode is on). Desktop never sees any of this: the
   trigger, header and sheet chrome are display:none outside this breakpoint. */
.filtbtn{display:none}
.sheet-hd{display:none}
.tabbar{display:none}
.tipsheet{display:none}
.sheet-backdrop{display:none;position:fixed;inset:0;background:rgba(16,24,40,.45);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:64}

@media(max-width:640px){
  /* A backdrop-filter on an ancestor makes position:fixed resolve against that
     ancestor instead of the viewport, which would trap the sheet inside the
     topbar. The phone topbar therefore uses a solid background rather than
     glass — also one less continuously-repainted layer while scrolling. */
  .topbar{backdrop-filter:none;-webkit-backdrop-filter:none;background:rgba(255,255,255,.98)}

  /* The topbar is a stacking context (sticky + z-index), so the sheet nested
     inside it cannot paint above anything the topbar itself sits below — the
     dimming backdrop included. Lifting the topbar while the sheet is open
     carries the sheet with it; it also keeps the trigger tappable to close. */
  body.filters-open .topbar{z-index:66}

  .filtbtn{
    display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 12px;
    border:1px solid var(--border);background:var(--bg-surface);border-radius:20px;
    font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text-secondary);
    cursor:pointer;flex:none}
  .filtbtn:hover,.filtbtn[aria-expanded="true"]{border-color:var(--primary);color:var(--primary)}
  .filtbtn-n{
    display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;
    border-radius:9px;background:var(--primary);color:#fff;font-size:10.5px;font-weight:700}
  .filtbtn-n.rc{background:var(--good)}
  .filtbtn-n.off{display:none}
  .sheet-backdrop.show{display:block}

  /* The chip row becomes the sheet body. */
  .topfilters{
    position:fixed;left:0;right:0;bottom:0;z-index:65;
    display:block;padding:0 16px calc(18px + env(safe-area-inset-bottom));
    background:var(--bg-surface);border-top:1px solid var(--border);
    border-radius:18px 18px 0 0;box-shadow:var(--elev-3);
    max-height:78vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
    transform:translateY(101%);transition:transform .24s cubic-bezier(.4,0,.2,1);
    visibility:hidden}
  body.filters-open .topfilters{transform:translateY(0);visibility:visible}

  .sheet-hd{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    position:sticky;top:0;z-index:1;margin:0 -16px 12px;padding:14px 16px 11px;
    background:var(--bg-surface);border-bottom:1px solid var(--border);
    border-radius:18px 18px 0 0;font-size:15px;font-weight:700}
  .sheet-done{
    border:0;background:transparent;color:var(--primary);font-family:inherit;
    font-size:14px;font-weight:600;cursor:pointer;padding:6px 2px;min-height:40px}

  /* Inside the sheet the controls stack full width and become tap targets. */
  .topfilters .chip-sel{display:flex;width:100%;justify-content:space-between;padding:10px 12px;margin-bottom:10px}
  .topfilters .chip-sel .muted{display:inline}
  .topfilters #filtSel{max-width:none;flex:1;font-size:16px;text-align:right}
  .topfilters .fchip{
    display:flex;width:100%;align-items:center;justify-content:flex-start;gap:6px;
    margin-bottom:8px;padding:12px 14px;border-radius:12px;font-size:14px;text-align:left}
  .topfilters .fchip .fchip-sub{margin-left:auto;opacity:.75}

  /* The sheet clears the tab bar rather than sitting under it. */
  .topfilters{padding-bottom:calc(80px + env(safe-area-inset-bottom))}

  /* ---- Tab bar: the four panels that carry the day, plus the drawer ------- */
  /* Sits above the page but below the drawer's dimming layer (55), so opening
     "More" — or the filter sheet — greys the bar out with everything else. */
  .tabbar{
    display:flex;position:fixed;left:0;right:0;bottom:0;z-index:54;
    background:var(--bg-surface);border-top:1px solid var(--border);
    box-shadow:0 -2px 14px rgba(16,24,40,.08);
    padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .tab{
    flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:6px 2px 4px;border:0;background:transparent;cursor:pointer;
    font-family:inherit;font-size:10.5px;font-weight:600;line-height:1.2;
    color:var(--text-muted);-webkit-tap-highlight-color:transparent}
  .tab-ic{position:relative;display:grid;place-items:center;width:26px;height:26px}
  .tab-ic svg{width:21px;height:21px}
  .tab-t{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tab.on{color:var(--primary)}
  .tab-badge{
    position:absolute;top:-4px;left:52%;min-width:16px;height:16px;padding:0 4px;
    border-radius:8px;background:var(--critical);color:#fff;
    font-size:9.5px;font-weight:700;display:grid;place-items:center;
    border:1.5px solid var(--bg-surface)}

  /* Give the page a floor so the bar never covers the last row of figures. */
  .content{padding-bottom:calc(86px + env(safe-area-inset-bottom))}

  /* A totals row pinned to the bottom must clear the bar too. */
  .cardify table.dt tfoot.dt-foot tr{bottom:calc(78px + env(safe-area-inset-bottom))}
}

/* ---- Small phones (<=380px) ---- */
@media(max-width:380px){
  .content{padding:12px 10px 40px}
  .kpi{padding:12px 11px 10px}
  .kpi .val{font-size:20px}
  .kpi .val.sm{font-size:17px}
  .pagehead h1{font-size:18px}
  .pagehead .sub{font-size:12.5px}
  .brand .bt{font-size:13px}
  .brand .bs{font-size:10px}
  .card{padding:12px 11px}
  table.dt{font-size:12.5px}
  .fchip{padding:6px 9px;font-size:11px}
}

/* ---- Landscape phones: keep the drawer pattern, reclaim vertical space ---- */
@media(max-width:980px) and (orientation:landscape) and (max-height:520px){
  .topbar{padding-top:7px;padding-bottom:7px}
  .content{padding-top:12px}
  .kpi-grid,.kpi-grid.k3{grid-template-columns:repeat(3,1fr)}
}

/* ---- Honour reduced-motion preferences (accessibility) ---- */
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}
</style>

   so "All / Recurring / Non-Recurring / Infrastructure" means exactly one thing everywhere.

function mdsdAsSubverticals(){

   included DDO-KI to begin with) instead of exp = ddoki + totAct, and a fully-excluded

   they can be taken out of the picture entirely.

   Excluding a centre withdraws the WHOLE of that centre from the picture at sub-vertical
   level, before any rollup - the money earmarked to it as well as the money it spent:
       assign -= centre limit    (the share of the assignment earmarked to that centre)
       totLim -= centre limit,  totAct -= centre actual
       exp     = ddoki + totAct  (expenditure falls by what that centre drew)
       bal     = assign - exp    (so balance falls by exactly that centre's UNSPENT amount)

   stranded in the totals and overstate Balance, so assignment moves with it. A centre's limit
   is the portion of the assignment released to it, which is the only assignment figure that
   exists at centre level. The identity assign - exp = bal therefore holds at every step, and
   the balance change equals the excluded centre's idle amount - nothing appears or vanishes.

/* ---- Attention Centre: ageing releases -------------------------------------------------
   One rule, applied at release (transaction) level rather than to rolled-up components:

       AND the release is older than AGE_DAYS (15) days

   The second half is what makes it actionable. A large balance on money released this week is
   normal - the centre has not had time to spend it. A large balance on money released weeks
   ago is money genuinely parked. The age is measured from AS_OF, the data's own position date,
   not from today's clock, so the page reads identically whenever it is opened for a given

const AGE_DAYS=15, AGE_MIN=5000000;
/* The position date is the date the sheet was last synced into the platform - the same
   figure every panel subtitle prints - so the 15-day window moves with each sync rather
   than with the "AS ON" title typed into the workbook, which can sit unchanged for weeks.
   syncedAsOf() falls back to that title date until the first sync completes, so the
   window is always defined. Returned as local midnight of that calendar date; every
   consumer compares calendar dates only, so no offset can shift the result. */
function ageRefDate(){ const p=String(syncedAsOf()).split('.'); return new Date(+p[2],+p[1]-1,+p[0]); }

  critical:{emoji:'🔴',label:'Critical',cls:'b-crit'},

function healthOf(assign,up,idle,bal){
  if(!assign||assign<=0) return Object.assign({score:null,up:0,idleR:0,balR:0,level:'na'},HEALTH_META.na);
  const idleR=Math.min(1,Math.max(0,idle)/assign), balR=Math.min(1,Math.max(0,bal)/assign);
  let score=(up*50)+((1-idleR)*30)+((1-balR)*20);
  if(up<=0) score=Math.min(score,12);
  score=Math.max(0,Math.min(100,score));
  const level = score>=75?'healthy':score>=50?'moderate':score>=25?'delayed':'critical';
  return Object.assign({score,up,idleR,balR,level},HEALTH_META[level]);
}
function healthForNode(x){ return healthOf(x.assign, x.assign?x.exp/x.assign:0, x.idle!=null?x.idle:idleOf(x), x.bal); }

    `<b>${h.emoji} ${h.label}</b><br>Utilisation ${pct(h.up,0)} · Idle ${pct(h.idleR,0)} of assignment · Balance ${pct(h.balR,0)}<br>Health score ${h.score.toFixed(0)}/100`;
}

function pol(cx,cy,r,a){return [cx+r*Math.cos(a),cy+r*Math.sin(a)];}
function arcPath(cx,cy,rO,rI,a0,a1){const large=(a1-a0)>Math.PI?1:0;const A=pol(cx,cy,rO,a0),B=pol(cx,cy,rO,a1),C=pol(cx,cy,rI,a1),D=pol(cx,cy,rI,a0);return `M${A[0]} ${A[1]}A${rO} ${rO} 0 ${large} 1 ${B[0]} ${B[1]}L${C[0]} ${C[1]}A${rI} ${rI} 0 ${large} 0 ${D[0]} ${D[1]}Z`;}

function tipMove(e){ const r=TIP.getBoundingClientRect(),p=14; let x=e.clientX+p,y=e.clientY+p; if(x+r.width>innerWidth)x=e.clientX-r.width-p; if(y+r.height>innerHeight)y=e.clientY-r.height-p; TIP.style.left=Math.max(4,x)+'px'; TIP.style.top=Math.max(4,y)+'px'; }

/* Budget Estimate for the scheme, FY 2026-27 — the ceiling the Ministry set,
   against which the assignment is released in tranches. It is a fixed
   scheme-level figure, not something the expenditure sheet carries, so it is
   stated here rather than derived; the sheet only ever reports what has been
   assigned and spent. Held in rupees like every other amount in the platform. */
const BUDGET_BE=924.35e7;

/* Both panels that show this band — Financial Overview and the Component
   Tracker — lead with the Budget Estimate, so it is unconditional rather than
   opted into. The two were briefly allowed to differ; there is no reading of
   the figures that benefits from the ceiling being present on one and absent on
   the other. */
function kpiScheme(){
  const ex=G.ex, inc=G.mdsdIncluded;
  const exUp=ex.assign?ex.exp/ex.assign:0;
  /* KI Infra (States/UTs) totals. Added to the ex-MDSD rollup rather than read
     off G: `G.ex` is always ex-MDSD while `G` only carries KI Infra when the
     chip is ticked, so adding holds whichever way the chip is set and cannot
     double-count. Everything below that needs a scheme-wide figure — the card
     captions and the spend measured against the BE — draws on these, so the two
     can never drift apart.

     They answer to the classification filter but not to the chip: KI Infra sits
     inside Infrastructure and drops out with it, at which point the caption goes
     quiet rather than repeating the headline. */
  const infraIn=SECTIONS.indexOf('Infrastructure')>=0;
  const mAssign=infraIn?MDSD.grand.assign:0;
  const mExp=infraIn?MDSD.grand.exp:0;
  const mBal=infraIn?MDSD.grand.bal:0;

  /* The caption is shown whether or not the chip is on. The scheme-wide figure
     is a fact about the scheme, not about which pills happen to be lit, and a
     reader comparing panels should not have to remember what state they left
     the chips in. */
  /* One footer treatment for every card in the band, so the dashed rules line up
     across the row instead of appearing on four cards and not the fifth. */
  const capRow=(label,v,tail)=>`<div class="sub kpi-foot">${label} <b class="tnum">${cr(v)}</b>${tail?` <span class="kpi-foot-x">${tail}</span>`:''}</div>`;
  const cap=(v)=>infraIn?capRow('Incl. KI Infra',v):'';

  /* The BE is a scheme-wide ceiling that covers KI Infra, so the spend measured
     against it counts KI Infra too — otherwise part of the outlay would be
     compared with all of the budget. */
  const expBE=ex.exp+mExp;
  const beUp=BUDGET_BE?expBE/BUDGET_BE:0;
  /* Q2 inside the CURRENT scope, so the tile's "Previous" figure is always the
     headline minus the tranche under the very same chips and classification.
     Deriving it by subtraction rather than summing assignQ1 is deliberate: when a
     chip withdraws a centre, svWithoutCentres reduces assign by that centre's
     limit, and subtraction carries the reduction through, whereas a raw assignQ1
     sum would report a base the headline no longer matches. */
  const q2In=sum(SV,function(x){ return x.q2||0; });
  const tipIdle=`<b>Unspent by Centre</b><br>${cr(ex.idle)} (Regional Centres + DDO HQ)${inc?`<br>+ Infrastructure-MDSD unspent ₹${(G.mdsdIdle/1e7).toFixed(2)} Cr = ${cr(G.idle)}`:''}${idleTipRows(SV)}`;
  const asgBE=ex.assign+mAssign;
  return `<div class="kpi-grid k5">
    <div class="kpi"><div class="kpi-top"><span class="kpi-ic ic-purple">${kpiIcon('bank')}</span><div class="kpi-txt"><div class="lbl">Budget Allotment</div><div class="val tnum">${cr(BUDGET_BE)}</div></div></div><div class="sub">Budget Estimates · ${esc(FY)}</div>${capRow('Assigned',asgBE,pct(BUDGET_BE?asgBE/BUDGET_BE:0,1)+' of BE')}</div>
    <div class="kpi accent"><div class="kpi-top"><span class="kpi-ic ic-blue">${kpiIcon('wallet')}</span><div class="kpi-txt"><div class="lbl">Total Assignment</div><div class="val tnum">${cr(ex.assign)}</div></div></div><div class="sub">Previous ${cr(ex.assign-q2In)}<br><b>Q2 Limit: ${cr(q2In)}</b></div>${cap(ex.assign+mAssign)}</div>
    <div class="kpi"><div class="kpi-top"><span class="kpi-ic ic-green">${kpiIcon('coins')}</span><div class="kpi-txt"><div class="lbl">Expenditure to date</div><div class="val tnum">${cr(ex.exp)}</div></div></div>${cap(ex.exp+mExp)}<div class="sub kpi-rates" style="color:var(--serious)">${pct(beUp,1)} of Budget allotment<br>${pct(exUp,1)} of assignment</div></div>
    <div class="kpi"><div class="kpi-top"><span class="kpi-ic ic-orange">${kpiIcon('scale')}</span><div class="kpi-txt"><div class="lbl">Balance</div><div class="val tnum">${cr(ex.bal)}</div></div></div><div class="sub">${pct(ex.assign?ex.bal/ex.assign:0,1)} unspent</div>${cap(ex.bal+mBal)}</div>
    <div class="kpi"${tattr(tipIdle)}><div class="kpi-top"><span class="kpi-ic ic-purple">${kpiIcon('gauge')}</span><div class="kpi-txt"><div class="lbl">Unspent by Centre</div><div class="val tnum neg">${cr(ex.idle)}</div></div></div><div class="sub">limit assigned, not spent</div>${cap(ex.idle+mBal)}</div>
  </div>`;
}
function donutChart(items){
  const T=sum(items,r=>r.value)||1,cx=110,cy=110,rO=98,rI=60;let a=-Math.PI/2;
  const segs=items.map(it=>{const ang=Math.max(it.value/T*2*Math.PI,0.0002),p=arcPath(cx,cy,rO,rI,a,a+ang);a+=ang;
    return `<path class="arc" d="${p}" fill="${it.color}"${tattr('<b>'+esc(it.key)+'</b><br>'+crShort(it.value)+' · '+pct(it.value/T,0))}/>`;}).join('');
  return `<svg class="chart-svg" viewBox="0 0 220 220" width="188" height="188" style="flex:none">${segs}<text x="110" y="106" text-anchor="middle" font-size="20" font-weight="800" fill="var(--text-primary)">${(T/1e7).toFixed(0)} Cr</text><text x="110" y="125" text-anchor="middle" font-size="11" fill="var(--text-muted)">assignment</text></svg>`;

function centreDetail(s){
  if(s.mdsd) return mdsdDetail(s);
  const rows=[];
  if(s.ddoki>0) rows.push({name:'DDO KI Direct',lim:null,act:s.ddoki});
  ACTIVE_CENTRES.forEach(c=>{ const b=s.byCentre[c]; if(b&&(b.lim>0||b.act>0)) rows.push({name:c,lim:b.lim,act:b.act}); });
  rows.sort((a,b)=>(b.act-a.act)||((b.lim||0)-(a.lim||0)));
  const body=rows.map(r=>{
    const idle=r.lim==null?null:r.lim-r.act, up=r.lim?r.act/r.lim:null;
    const tx=txForSVCentre(s.name,r.name), has=tx.length>0, k='C|'+s.name+'|'+r.name, open=has&&state.cdOpen===k;
    const chev=has?`<span class="chev${open?' open':''}" style="margin-right:6px">${open?'▾':'▸'}</span>`:'<span style="display:inline-block;width:25px"></span>';
    let out=`<tr${has?` class="click" style="cursor:pointer${open?';background:rgba(37,106,191,.10)':''}" onclick="event.stopPropagation();cdToggle(${jstr(k)})"`:''}>`
     +`<td class="subc">${chev}${esc(r.name)}${has?` <span class="muted" style="font-weight:400;font-size:10.5px">· ${tx.length} txn${tx.length>1?'s':''}</span>`:''}</td>`
     +`<td class="num tnum">${r.lim==null?'<span class="muted">-</span>':crShort(r.lim)}</td>`
     +`<td class="num tnum" style="color:${r.act===0?'var(--text-muted)':'var(--text-primary)'}">${crShort(r.act)}</td>`
     +`<td class="num tnum" style="color:${idle>0?'var(--serious)':'var(--text-muted)'}">${idle==null?'-':crShort(idle)}</td>`
     +`<td class="num tnum">${up==null?'-':pct(up,0)}</td></tr>`;
    if(open) out+=`<tr class="txrow"><td colspan="5" onclick="event.stopPropagation()">${txnList(tx)}</td></tr>`;
    return out;
  }).join('');
  const anyTx=txForSV(s.name).length;

    <div class="small" style="margin:0 4px 7px;font-weight:600">Sub-component detail · where ${esc(s.name)} is spent <span class="muted" style="font-weight:400">· ${rows.length} spending points${anyTx?` · ${anyTx} classified release${anyTx>1?'s':''} - click a centre with a ▸ for its vouchers`:''}</span></div>

    <div class="small" style="margin-top:9px;color:var(--text-secondary)">Assignment <b>${crShort(s.assign)}</b> &nbsp;·&nbsp; Expenditure <b>${crShort(s.exp)}</b> &nbsp;·&nbsp; Balance <b>${crShort(s.bal)}</b> &nbsp;·&nbsp; Utilisation <b>${pct(s.up,1)}</b></div>
  </div>`;
}
function svDetailForCentre(centre){

  const body=rows.map(x=>{ const b=x.b,idle=b.lim-b.act,up=b.lim?b.act/b.lim:0;
    const tx=txForSVCentre(x.s.name,centre), has=tx.length>0, k='R|'+centre+'|'+x.s.name, open=has&&state.cdOpen===k;

     +`<td class="subc">${chev}${esc(x.s.name)}${has?` <span class="muted" style="font-weight:400;font-size:10.5px">· ${tx.length} txn${tx.length>1?'s':''}</span>`:''}<div class="muted" style="font-size:11px;font-weight:400;padding-left:${has?'25px':'25px'}">${esc(x.s.section)}</div></td>`

  </div>`;

/* ---- Regional Centre KPI cards ---------------------------------------------------
   Read from the SAME module-level filtered bindings (SV / G / SECTIONS) that the centre

   The workbook's "DDO HQ" row sits inside the centre block with its own Limit Assigned /

   no exclusion. That makes each card a true, hand-checkable column-total of the centre
   table rendered directly beneath it, across every active centre row:

     Card 1  Assignment to Centres  = Σ centreAgg().lim  = G.limit
     Card 2  Actual Exp. by Centres = Σ centreAgg().act  = G.actual
     Card 3  Idle with Centres      = Card 1 − Card 2    = Σ centreAgg().idle

   correctly INERT to the DDO KI chip: "DDO KI · Direct Expenditure" is the workbook's own
   separate column (col D), money spent centrally that never entered any centre limit, so
   removing it cannot change what was issued to, or drawn by, the centres - deducting it
