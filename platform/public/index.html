const SECTION_CFG={ns:'sectbl',sortField:'sectSort',nameLabel:'Section',sancLabel:'Assigned',usedLabel:'Expenditure',balLabel:'Balance',barUsedWord:'Utilised',barBalWord:'Balance',icon:x=>sectionIcon(x.name),detail:x=>sectionDetail(x.name)};
function sectionUtilTable(){ return entityUtilTable(utilSorted(sectionUtilItems(),state.sectSort),SECTION_CFG); }
const RC_CFG={ns:'rctbl',sortField:'rcSort',nameLabel:'Regional Centre',sancLabel:'Limit Assigned',usedLabel:'Actual Exp.',balLabel:'Unspent',barUsedWord:'Used',barBalWord:'Balance',icon:()=>mdsdIcon('institute'),detail:x=>svDetailForCentre(x.name)};
/* ---- Regional Centre KPI cards ---------------------------------------------------
   Read from the SAME module-level filtered bindings (SV / G / SECTIONS) that the centre
   table below uses. render() always runs applyFilter() first, so a click on ANY top filter
   - the Classification dropdown, the DDO KI chip or the KI Infra chip - recomputes those
   bindings and repaints these cards in lockstep with the table. No second source of truth,
   no cached total anywhere in this component.

   *** DDO HQ IS TREATED AS AN ORDINARY CENTRE ***
   The workbook's "DDO HQ" row sits inside the centre block with its own Limit Assigned /
   Actual Exp. pair, so it is aggregated exactly like PATIALA or BHOPAL - no special-casing,
   no exclusion. That makes each card a true, hand-checkable column-total of the centre
   table rendered directly beneath it, across every active centre row:

     Card 1  Assignment to Centres  = Σ centreAgg().lim  = G.limit
     Card 2  Actual Exp. by Centres = Σ centreAgg().act  = G.actual
     Card 3  Idle with Centres      = Card 1 − Card 2    = Σ centreAgg().idle

   Filter response. All three cards move with the Classification dropdown. All three are
   correctly INERT to the DDO KI chip: "DDO KI · Direct Expenditure" is the workbook's own
   separate column (col E), money spent centrally that never entered any centre limit, so
   removing it cannot change what was issued to, or drawn by, the centres - deducting it
   here would double-count. That figure is not a KPI on this page; it is reported in the
   DDO KI Direct note above the cards, which does track the chip. The KI Infra chip moves none
   of the three: MDSD State/Institute grants are released direct and carry no centre limit.

   Do not confuse the workbook's two "DDO HQ"-ish figures - they are ~44x apart:
     - cols F/G "DDO HQ" Limit Assigned / Actual Exp. - the centre row counted in these cards;
     - col E    "DDO KI · Direct Expenditure" (G.ddoki) - outside the centre-limit system.
   These letters are prose only, and the tab has already moved them once. The code does not
   read either figure at a fixed column: summaryBase() locates the money from the tab's own
   arithmetic on every sync. Trust that, and see parseSummaryRows. */
function ddokiInScope(){
  /* classification-scoped DDO-KI total that deliberately ignores the DDO KI chip, so the
     DDO KI Direct note can state exactly what is being withheld while the chip is unticked.
     MDSD rows never carry DDO-KI, so DATA.subverticals is the complete population here. */
  return sum(DATA.subverticals.filter(s=>SECTIONS.includes(s.section)), s=>s.ddoki||0);
}
function rcKpis(){
  const agg=centreAgg(), n=agg.length;
  const lim=sum(agg,c=>c.lim), act=sum(agg,c=>c.act), idle=lim-act;
  const actUp=lim?act/lim:0, idleUp=lim?idle/lim:0;
  const funded=agg.filter(c=>c.lim>0).length, drawing=agg.filter(c=>c.act>0).length;
  const scope=(state.filt==='All')?'all classifications':state.filt;
  const inc=[G.inclHQ?centreLabel(HQ_KEY):null,G.inclInfraSai?centreLabel(INFRA_KEY):null].filter(Boolean);
  const exOut=(G.exCentres||[]);
  /* Every tooltip on this page follows one shape: the bridge equation first, then a
     single short line of scope, then the itemised centre table with its subtotal,
     total and filter note. No prose paragraphs. */
  const eq=function(hl){
    const w=function(k,v){ return hl===k ? '<b>'+cr(v)+'</b>' : cr(v); };
    return w('lim',lim)+' limit − '+w('act',act)+' actual = '+w('idle',idle)+' unspent';
  };
  const tipAssign=`<b>${rcScopeTitle('Assignment to Centres')}</b><br>${eq('lim')}`
    + `<br><span style="opacity:.75">Limit released to centres, not expenditure.</span>`
    + rcTipRows('lim','Assignment by centre');
  const tipAct=`<b>${rcScopeTitle('Actual Expenditure by Centres')}</b><br>${eq('act')}`
    + `<br><span style="opacity:.75">Drawn by centres against limit released.</span>`
    + rcTipRows('act','Expenditure by centre');
  const tipIdle=`<b>${rcScopeTitle('Unspent by Centre')}</b><br>${eq('idle')}`
    + `<br><span style="opacity:.75">Released to centres, not yet spent.</span>`
    + rcTipRows('idle','Unspent by centre');

/* ---- cross-page expenditure reconciliation -----------------------------------------
   This page reports what the centres spent; Financial Overview / Component Tracker report
   what the SCHEME spent. They differ by DDO KI Direct expenditure, which is real spend that
   never passed through a centre limit:

       centre actual (G.actual) + DDO KI direct (G.ddoki) = ex-MDSD expenditure (G.ex.exp)

   That identity used to be printed as a standing "Expenditure bridge" strip at the head of
   this page. It is no longer: it restated on every visit something that is only worth
   saying when it stops being true, and the DDO-KI Direct note further down the page already
   carries the figure the strip existed to explain.

   The CHECK stays, and only the check. The identity is still recomputed live from the same
   filtered bindings on every render, and if a future dataset ever breaks it the page says so
   in red rather than letting this page and Financial Overview quietly disagree. Silence here
   means the two reconcile. */
function rcReco(){
  const act=G.actual, dk=G.ddoki, ex=G.ex.exp;
  if(Math.abs((act+dk)-ex)<1) return '';
  return `<div class="reco" style="border-left-color:var(--critical)"><span class="rl" style="color:var(--critical)">Reconciliation error</span><span>centre actual ${cr(act)} + DDO KI ${cr(dk)} = ${cr(act+dk)}, but scheme expenditure is ${cr(ex)} (Δ ${cr(ex-act-dk)}). Figures on this page and Financial Overview will not agree - the source dataset is inconsistent.</span></div>`;
}

/* ---- SAI KI 1 / KI 2 / Infra delivery blocks -----------------------------------------

   It is a pure re-grouping: membership is declared by explicit sub-vertical name below, and
   the three blocks form an exact partition of every non-MDSD sub-vertical - so KI 1 + KI 2 +
   Infra reconciles, to the rupee, with the ex-MDSD grand total on Financial Overview.

   Membership follows the scheme's own delivery structure:
     KI 1  - Khelo India Games, Fit India Movement, and all four sub-verticals of
             "Promotion of Inclusiveness through Sports".
     KI 2  - Talent Identification & Development, Community Coaching & Development,
             Khelo India Centres and Sports Academies. The latter two each exist as BOTH a
             Recurring and a Non-Recurring record in the workbook; both are claimed, so the
             block stays whole no matter which Classification is selected.
     Infra - New Sports Infrastructure Projects only. Deliberately EXCLUDES the KI Infra
             States/UTs (MDSD) grants, which are released direct to States and Institutes
             and have their own page; the KI Infra chip therefore cannot move these figures.

   Because a silently unclaimed sub-vertical would understate a block without any visible
   symptom, kiUnassigned() re-derives the partition on every render and the page shows a
   loud warning strip rather than quietly dropping money. */
const KI_GROUPS=[
  {key:'KI1',tag:'KI 1',name:'Khelo India 1',col:'#2a78d6',
   note:'Games, mass participation & inclusiveness',
   members:['Khelo India Games','Fit India Movement','Sports for Peace and Development','Sports for rural/indigenous/tribal','Sports for disabled sportspersons','Sports for Women']},
  {key:'KI2',tag:'KI 2',name:'Khelo India 2',col:'#4a3aa7',
   note:'Talent pathway, coaching, centres & academies',
   members:['Talent Identification & Development','Community Coaching & Development','Khelo India Centres','Khelo India Centres (N-Rec)','Sports Academies','Sports Academies (Rec)']},
  {key:'INFRA',tag:'INFRA',name:'Infrastructure (SAI)',col:'#eb6834',
   note:'New sports infrastructure · excludes KI Infra States/UTs',
   members:['New Sports Infrastructure Projects']}
];
function kiGroupAgg(){
  const byName=new Map(SV.filter(s=>!s.mdsd).map(s=>[s.name,s]));
  return KI_GROUPS.map(g=>{
    const subs=g.members.map(n=>byName.get(n)).filter(Boolean);
    const assign=sum(subs,s=>s.assign), exp=sum(subs,s=>s.exp), bal=sum(subs,s=>s.bal);
    const lim=sum(subs,s=>s.totLim||0), act=sum(subs,s=>s.totAct||0);
    return Object.assign({},g,{subs,assign,exp,bal,lim,act,ddoki:sum(subs,s=>s.ddoki||0),

function kiUnassigned(){
  const claimed=new Set(KI_GROUPS.reduce((a,g)=>a.concat(g.members),[]));

/* platform-standard segmented utilisation bar. Identical markup, colours and label
   thresholds to the bar entityUtilTable() renders on Regional Centres, KI Infra and
   Sub-Vertical Analysis, so the same visual carries the same meaning everywhere. */
/* utilBar() lived here. Its only two callers were the KI panel's block comparison
   and component tables, both of which now stop at Balance, so it went with them.
   KI Infra and Regional Centres are unaffected: they never called it - each
   builds its own .mdsd-bar from its own segments. */
function kiCompTable(g){
  const rows=g.subs.slice().sort((a,b)=>b.assign-a.assign);
  if(!rows.length) return '';
  /* Classification rides as a small pill directly under the component name rather than
     occupying its own column - it is an attribute of the component, not a measure. */
  /* Three money columns, asking the same three questions in the same order the block's own
     cards ask them: what was assigned, what was spent, what is left.

     Unspent and Utilisation are deliberately not among them. Unspent was a centre-level
     figure (limit released to centres, less what they drew) sitting in a component-level
     table, so it answered a different question from the three beside it and never summed
     the way a reader would expect a column to. Utilisation restated the Balance column
     next to it as a percentage of the Assignment column next to that - a third rendering
     of two figures already on the row.

     Balance is rendered red wherever it is genuinely outstanding; a nil balance stays
     muted so red always means "money still unspent", and a negative one - a component
     that has spent past its assignment - keeps its own marker. Head, body and foot all
     carry four cells: the foot used to carry a fifth, empty one, which made the browser
     lay the total row out against a column the header never declared. */
  return `<div class="tscroll"><table class="dt"><thead><tr><th>Component</th><th class="num">Assignment</th><th class="num">Expenditure</th><th class="num">Balance</th></tr></thead><tbody>
    ${rows.map(s=>`<tr><td><div class="kig-cn"><span class="kig-dot" style="background:${SVCOL[s.name]||g.col}"></span>${esc(s.name)}</div><div class="kig-cp">${secPill(s.section)}</div></td>
      <td class="num tnum">${crShort(s.assign)}</td><td class="num tnum">${crShort(s.exp)}</td><td class="num tnum${Math.round(s.bal)===0?'':(s.bal<0?' bal-over':' bal-red')}">${crShort(s.bal)}</td></tr>`).join('')}
  </tbody><tfoot><tr><td><b>${g.tag} total</b></td><td class="num tnum"><b>${crShort(g.assign)}</b></td><td class="num tnum"><b>${crShort(g.exp)}</b></td><td class="num tnum${Math.round(g.bal)===0?'':(g.bal<0?' bal-over':' bal-red')}"><b>${crShort(g.bal)}</b></td></tr></tfoot></table></div>`;
}
function kiGroupBlock(g){
  const tint=hexToRgba(g.col,.09);

    <div class="kig-band" style="background:linear-gradient(135deg,${tint},var(--bg-surface))"><span class="kig-badge" style="background:${g.col}">${g.tag}</span>
      <div class="kig-id"><div class="kig-name">${g.name}</div><div class="kig-tag">${g.note}</div></div></div>

  const funded=g.subs.filter(s=>s.assign>0);
  const dkShare=g.exp?g.ddoki/g.exp:0;
  const tipA=`<b>${g.tag} · Assignment</b><br>Sum of the Ministry assignment for ${funded.length} funded component${funded.length===1?'':'s'}.<br><span style="opacity:.75">${pct(G.ex.assign?g.assign/G.ex.assign:0,1)} of the ${cr(G.ex.assign)} scheme total (ex-KI Infra).</span>`;
  const tipE=`<b>${g.tag} · Expenditure</b><br>Centre actual ${cr(g.act)} + DDO KI Direct ${cr(g.ddoki)} = <b>${cr(g.exp)}</b>.<br>DDO KI is ${pct(dkShare,1)} of this block's spend.<br><span style="opacity:.75">Same build-up as every other page - DDO KI Direct is spend that never passed through a centre limit.</span>`;
  const tipB=`<b>${g.tag} · Balance</b><br>${cr(g.assign)} assigned − ${cr(g.exp)} spent = <b>${cr(g.bal)}</b> still unspent (${pct(g.assign?g.bal/g.assign:0,1)}).`;
  /* The expenditure build-up rides in the card whose figure it explains - in
     PLACE of that card's utilisation line, not under it.

     Nothing is lost by replacing it: the rate was already on the screen twice
     over, once in this block's own band header and once as its complement on
     the Balance card beside it, so the block stated a figure three times and
     the build-up not at all. And a fourth line on one card of four is not free.
     The grid stretches every card to the tallest, so an extra line here leaves
     the three cards beside it holding framed empty space - 30px of it at desk
     widths, and enough at 375px to read as a card that failed to load. That is
     the raggedness the .kpi-foot rule warns about, arriving from the other end.

     way to make the line tie would be to move a lakh of real money, which this

  const expSub = g.exp > 0
    ? `<b class="tnum">${crShort(g.act)}</b> centres + <b class="tnum">${crShort(g.ddoki)}</b> DDO KI Direct`
    : `${pct(g.up,1)} of assignment used`;
  return `<div class="kig-sec">

        <div class="kpi"${tattr(tipE)}><div class="kpi-top"><span class="kpi-ic ic-green">${kpiIcon('coins')}</span><div class="kpi-txt"><div class="lbl">${g.tag} Expenditure</div><div class="val tnum">${cr(g.exp)}</div></div></div><div class="sub">${expSub}</div></div>
        <div class="kpi"${tattr(tipB)}><div class="kpi-top"><span class="kpi-ic ic-orange">${kpiIcon('scale')}</span><div class="kpi-txt"><div class="lbl">${g.tag} Balance</div><div class="val tnum">${cr(g.bal)}</div></div></div><div class="sub">${pct(g.assign?g.bal/g.assign:0,1)} still unspent</div></div>
      </div>
      ${kiCompGroup(g)}
    </div></div>`;
}

/* ---------------------------------------------------------------------------
   The component table, folded away behind its own control
   ---------------------------------------------------------------------------
   A block's headline figures answer "how is this block doing"; the component
   table answers "which component inside it". Those are two different questions
   and the second is much the longer answer, so it opens on request rather than
   pushing the next block off the screen by default.
--------------------------------------------------------------------------- */
function kiCompGroup(g){
  const on=!!state.kiComp;
  /* The block used to carry a red "Zero-spend components" tile in its read-out
     strip. The strip is gone, but the warning it carried could not simply go
     with it: a component holding an assignment it has drawn nothing against is
     flagged NOWHERE else on this platform. The Attention Centre reasons from
     release rows and these components have none, Sub-Vertical Analysis is a
     hidden view, and the component table below prints every non-nil balance in
     red, so red there no longer singles anything out.
     So the count rides on the control that opens the evidence for it, as one
     more chip beside the component count, and only when there is something to
     say. No strip, nothing added to the cards. */
  const zero=g.subs.filter(s=>s.assign>0&&s.exp===0);
  const zchip=zero.length
    ? `<span class="kig-comp-z" title="${esc(zero.map(s=>s.name).join(' · '))}">${zero.length} with no spend</span>`
    : '';
  return `<div class="kig-comp">
    <button class="kig-comp-hd${on?' on':''}" onclick="toggleKiComp()" aria-expanded="${on?'true':'false'}">
      <span class="kig-comp-c"></span>
      <span>Components of ${esc(g.tag)}</span>
      ${zchip}
      <span class="kig-comp-n">${g.subs.length}</span>
    </button>
    ${on?`<div class="kig-comp-body">${kiCompTable(g)}</div>`:''}
  </div>`;
}
/* Opening a block closes the other two — three blocks' worth of KPI cards and
   tables at once is a page nobody reads. Tapping the open one shuts it, so the
   comparison above can be read on its own. The component fold resets with each
   change of block: carried over, it would spring open on a block the reader has
   not asked to see inside yet. */
function setKiOpen(tag){
  state.kiOpen = state.kiOpen===tag ? null : tag;

}
function toggleKiComp(){ state.kiComp=!state.kiComp; render(); }
function viewKI(){

  const shown=groups.filter(g=>g.assign>0);

/* Aggregate the sheet's own release rows for one IST calendar day (YYYY-MM-DD). */
function sheetDayStats(day){
  const o={n:0,net:0,util:0,rc:0,rcN:0};
  (DATA.txns||[]).forEach(function(t){
    if(t.date!==day) return;
    o.n++; o.net+=t.net||0; o.util+=t.util||0;
    if(isRegionalCentre(t.rc)){ o.rc+=t.net||0; o.rcN++; }
  });
  return o;
}
/* Assignment revisions observed in a window - the one figure the sheet cannot date. */
function assignStats(win){
  let n=0, amt=0;
  (TXLOG.entries||[]).forEach(function(x){
    if(x.type!=='assign' || x.ts<win.start || x.ts>win.end) return;
    n++; const d=(x.assign||0)-(x.pAssign||0); if(d>0) amt+=d;
  });
  return {n:n, amt:amt};
}
/* Change annotation for a sheet row, if a revision has been observed for it. */
function txChangeFor(t){
  const k=txKey(t), e=(TXLOG.entries||[]);
  for(let i=e.length-1;i>=0;i--){
    const x=e[i];
    if(x.type==='update' && (x.rc+'|'+x.voucher)===k) return txChange(x);
    if(x.type==='new'    && (x.rc+'|'+x.voucher)===k) return '<span style="color:var(--good);font-weight:600">Newly recorded</span>';
  }
  return '<span class="muted">—</span>';
}
/** Human before -> after for an observed revision. */
function txChange(x){
  if(x.type==='sheet')
    return esc(x.field)+': '+esc(crShort(x.pVal))+' → <b>'+esc(crShort(x.val))+'</b> '+txDelta((x.val||0)-(x.pVal||0));
  if(x.type==='new')     return '<span style="color:var(--good);font-weight:600">Newly recorded</span>';
  if(x.type==='removed') return '<span class="muted">Row withdrawn (was '+esc(crShort(x.pNet))+' released)</span>';
  if(x.type==='assign'){
    return esc(crShort(x.pAssign))+' → <b>'+esc(crShort(x.assign))+'</b> '+txDelta((x.assign||0)-(x.pAssign||0));
  }
  var bits=[];
  if(Math.abs((x.net||0)-(x.pNet||0))>1)
    bits.push('Released '+esc(crShort(x.pNet))+' → <b>'+esc(crShort(x.net))+'</b> '+txDelta((x.net||0)-(x.pNet||0)));
  if(Math.abs((x.util||0)-(x.pUtil||0))>1)
    bits.push('Utilised '+esc(crShort(x.pUtil))+' → <b>'+esc(crShort(x.util))+'</b> '+txDelta((x.util||0)-(x.pUtil||0)));
  if(!bits.length && Math.abs((x.bal||0)-(x.pBal||0))>1)
    bits.push('Balance '+esc(crShort(x.pBal))+' → <b>'+esc(crShort(x.bal))+'</b>');
  return bits.join('<br>')||'<span class="muted">—</span>';
}
function txDelta(d){
  var up=d>0;
  return '<span style="color:'+(up?'var(--good)':'var(--critical)')+';font-weight:700">('+
         (up?'+':'−')+esc(crShort(Math.abs(d)))+')</span>';
}
/** Most recent observed value revisions, newest first. */
function txRecentUpdates(){
  return (TXLOG.entries||[]).filter(function(x){
      return x.type==='update'||x.type==='removed'||x.type==='sheet'||x.type==='assign'; })

/** Where a logged revision came from, for the Transaction Record table. */
function txSource(t){

/* ============================================================================
   TREND ANALYTICS
   ============================================================================
   Three modules over one engine: overall, by Regional Centre, and by component
   / sub-component. Each can be grouped Daily, 3-Day, Weekly or Monthly; the
   metric filter and the per-period/cumulative switch apply across all three.

   WHAT IS PLOTTED, AND WHY IT IS ONLY THIS.
   Only the release rows carry a date, so they are the only thing that can
   honestly sit on a timeline. All three metrics are therefore read from dated
   releases and reconcile exactly to one another:
       Assigned limit = amount released in the period   (release "net")
       Expenditure    = amount utilised in the period   (release "util")
       Balance        = released - utilised, i.e. money released but not drawn
   Component assignment (Rs 219.84 Cr) has no date column anywhere in the
   workbook and is deliberately NOT inferred onto the timeline.

   COVERAGE. Dated releases cover Rs 89.20 Cr of the Rs 99.80 Cr the summary
   reports as released. The gap is one component - New Sports Infrastructure
   Projects - whose releases are not itemised in the transaction tabs, plus
   DDO KI Direct expenditure which has no release rows by design. Rather than
   spread those over dates that do not exist, the panel charts what is dated
   and states the coverage on screen, so the trend can never silently
   contradict the totals on the other pages.
   ========================================================================== */
const TA_METRICS={
  exp:{f:'util', label:'Expenditure',    color:'#1baf7a', tip:'Utilised on releases dated in the period'},
  lim:{f:'net',  label:'Assigned limit', color:'#2a78d6', tip:'Limit released to centres in the period'},
  bal:{f:'bal',  label:'Balance',        color:'#eb6834', tip:'Released minus utilised - money released but not yet drawn'}
};
const TA_BUCKETS=[['D','Daily'],['3D','3-Day'],['W','Weekly'],['M','Monthly']];

/** Earliest dated release in the FULL dataset - anchors 3-day blocks so the
    bucket edges never shift when a filter changes. */
function taEpoch(){
  let min='';
  (DATA.txns||[]).forEach(function(t){ if(t.date && (!min||t.date<min)) min=t.date; });
  return min||'2026-04-01';
}
function taDay(s){ return new Date(s+'T00:00:00Z'); }
function taISO(d){ return d.toISOString().slice(0,10); }

/** The bucket a date belongs to, expressed as the bucket's start key. */
function taKeyOf(date,b){
  if(b==='D') return date;
  if(b==='M') return date.slice(0,7);
  const d=taDay(date);
  if(b==='W'){ d.setUTCDate(d.getUTCDate()-((d.getUTCDay()+6)%7)); return taISO(d); }   // Monday start
  const e=taDay(taEpoch());
  const n=Math.floor((d-e)/86400000);
  return taISO(new Date(e.getTime()+Math.floor(n/3)*3*86400000));
}
/** Every bucket key from `from` to `to` inclusive, so quiet periods show as gaps. */
function taKeysBetween(from,to,b){
  const out=[];
  if(b==='M'){
    let y=+from.slice(0,4), m=+from.slice(5,7);
    const ey=+to.slice(0,4), em=+to.slice(5,7);
    while(y<ey||(y===ey&&m<=em)){ out.push(y+'-'+String(m).padStart(2,'0')); m++; if(m>12){m=1;y++;} }
    return out;
  }
  const step=b==='D'?1:b==='3D'?3:7;
  let d=taDay(taKeyOf(from,b)); const end=taDay(taKeyOf(to,b));
  let guard=0;
  while(d<=end && guard++<4000){ out.push(taISO(d)); d=new Date(d.getTime()+step*86400000); }
  return out;
}
function taLabel(key,b){
  if(b==='M'){ const p=key.split('-'); return MON[(+p[1])-1]+' '+p[0].slice(2); }
  const d=taDay(key), dd=d.getUTCDate(), mm=MON[d.getUTCMonth()];
  if(b==='D') return dd+' '+mm;
  if(b==='W') return dd+' '+mm;
  const e=new Date(d.getTime()+2*86400000);
  return dd+'–'+e.getUTCDate()+' '+(e.getUTCMonth()===d.getUTCMonth()?mm:MON[e.getUTCMonth()]);
}
function taRangeLabel(key,b){
  if(b==='M'){ const p=key.split('-'); return MON[(+p[1])-1]+' '+p[0]; }
  const d=taDay(key);
  const span=b==='D'?0:b==='W'?6:2;
  const e=new Date(d.getTime()+span*86400000);
  const f=function(x){ return x.getUTCDate()+' '+MON[x.getUTCMonth()]; };
  return span? f(d)+' – '+f(e) : f(d);
}

/** Bucket a set of dated releases. Returns points in chronological order. */
function taSeries(rows,b){
  const dated=rows.filter(function(t){ return !!t.date; });
  if(!dated.length) return [];
  const m={};
  let lo='', hi='';
  dated.forEach(function(t){
    if(!lo||t.date<lo) lo=t.date;
    if(!hi||t.date>hi) hi=t.date;
    const k=taKeyOf(t.date,b);
    if(!m[k]) m[k]={key:k,net:0,util:0,n:0};
    m[k].net+=t.net||0; m[k].util+=t.util||0; m[k].n++;
  });
  return taKeysBetween(lo,hi,b).map(function(k){
    const v=m[k]||{key:k,net:0,util:0,n:0};
    v.bal=v.net-v.util;
    return v;
  });
}
/** Running totals - the cumulative view. */
function taCumulate(pts){
  let n=0,u=0,c=0;
  return pts.map(function(p){
    n+=p.net; u+=p.util; c+=p.bal;
    return {key:p.key,n:p.n,net:n,util:u,bal:c};
  });
}
function taActiveMetrics(){
  const m=state.taMetric||'all';
  return m==='all' ? ['lim','exp','bal'] : [m];
}

/* ---- Chart ---------------------------------------------------------------
   Hand-drawn SVG: one path per metric, an area wash when a single metric is
   selected, and a full-height hit zone per bucket carrying the hover detail so
   the pointer never has to find a 3px line. */
function taChart(pts,id){
  if(!pts.length) return '<div class="dt-empty"><div class="e-ic">📈</div><div class="e-t">No dated releases in this selection</div>'
    + '<div class="e-s">Only itemised release rows carry a date and can be plotted.</div></div>';
  const cum=!!state.taCum, b=state.taBucket&&state.taBucket[id]||'W';
  const data=cum?taCumulate(pts):pts;
  const keys=taActiveMetrics();
  const W=780,H=252,L=64,R=16,T=16,B=34;
  const iw=W-L-R, ih=H-T-B;
  let max=0;
  data.forEach(function(p){ keys.forEach(function(k){ const v=p[TA_METRICS[k].f]; if(v>max) max=v; }); });
  if(max<=0) max=1;
  const nice=Math.pow(10,Math.floor(Math.log10(max)));
  const top=Math.ceil(max/nice*4)/4*nice;
  const n=data.length;
  const x=function(i){ return n===1 ? L+iw/2 : L+(i*iw)/(n-1); };
  const y=function(v){ return T+ih-(v/top)*ih; };

  let grid='';
  for(let g=0;g<=4;g++){
    const gy=T+ih-(g/4)*ih, gv=top*g/4;
    grid+=`<line x1="${L}" y1="${gy.toFixed(1)}" x2="${W-R}" y2="${gy.toFixed(1)}" stroke="var(--grid)" stroke-width="1"/>`
        + `<text x="${L-8}" y="${(gy+3.5).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--text-muted)">${esc(crShort(gv))}</text>`;
  }
  let series='';
  keys.forEach(function(k){
    const c=TA_METRICS[k], f=c.f;
    const pathD=data.map(function(p,i){ return (i?'L':'M')+x(i).toFixed(1)+' '+y(p[f]).toFixed(1); }).join(' ');
    if(keys.length===1){
      series+=`<path d="${pathD} L ${x(n-1).toFixed(1)} ${(T+ih).toFixed(1)} L ${x(0).toFixed(1)} ${(T+ih).toFixed(1)} Z" fill="${c.color}" opacity=".12"/>`;
    }
    series+=`<path d="${pathD}" fill="none" stroke="${c.color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`;
    if(n<=40) data.forEach(function(p,i){
      series+=`<circle cx="${x(i).toFixed(1)}" cy="${y(p[f]).toFixed(1)}" r="2.6" fill="#fff" stroke="${c.color}" stroke-width="1.8"/>`;
    });
  });
  // x labels, thinned so they never collide
  const every=Math.max(1,Math.ceil(n/12));
  let xl='';
  data.forEach(function(p,i){
    if(i%every && i!==n-1) return;
    xl+=`<text x="${x(i).toFixed(1)}" y="${H-12}" text-anchor="middle" font-size="10" fill="var(--text-muted)">${esc(taLabel(p.key,b))}</text>`;
  });
  // hover zones
  const bw=n>1?iw/(n-1):iw;
  let hits='';
  data.forEach(function(p,i){
    const raw=pts[i];
    const tip='<b>'+esc(taRangeLabel(p.key,b))+'</b>'
      +(cum?' <span style="opacity:.7">(cumulative)</span>':'')
      +'<br>'+raw.n+' release'+(raw.n===1?'':'s')+' in period'
      +'<br>Assigned limit: <b>'+esc(crShort(p.net))+'</b>'
      +'<br>Expenditure: <b>'+esc(crShort(p.util))+'</b>'
      +'<br>Balance: <b>'+esc(crShort(p.bal))+'</b>'
      +(cum?'<br><span style="opacity:.7">This period alone: '+esc(crShort(raw.net))+' released · '+esc(crShort(raw.util))+' utilised</span>':'');
    hits+=`<rect x="${(x(i)-bw/2).toFixed(1)}" y="${T}" width="${bw.toFixed(1)}" height="${ih}" fill="transparent" style="cursor:crosshair"${tattr(tip)}/>`;
  });
  const legend=keys.map(function(k){
    return `<span class="ta-lg"><i style="background:${TA_METRICS[k].color}"></i>${TA_METRICS[k].label}</span>`;
  }).join('');
  return `<div class="ta-legend">${legend}<span class="ta-cov">${data.length} ${b==='M'?'months':b==='W'?'weeks':b==='3D'?'blocks':'days'}</span></div>`
    + `<svg class="chart-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:252px">${grid}${series}${xl}${hits}</svg>`;
}

/* ---- KPI strip - recomputed for whatever the module has selected ---- */
function taKpis(rows,scope){
  const net=sum(rows,function(t){return t.net;}), util=sum(rows,function(t){return t.util;});
  const b=state.taBucket&&state.taBucket[scope.id]||'W';
  const pts=taSeries(rows,b);
  let peak=null;
  pts.forEach(function(p){ if(!peak||p.util>peak.util) peak=p; });
  const active=pts.filter(function(p){ return p.n>0; }).length;
  const rate=active?util/active:0;
  return `<div class="kpi-grid">
    <div class="kpi accent"${tattr('<b>Assigned limit released</b><br>Total released to '+esc(scope.name)+' across every dated release in view.')}>
      <div class="kpi-top"><span class="kpi-ic ic-blue">${kpiIcon('wallet')}</span><div class="kpi-txt">
      <div class="lbl">Assigned limit</div><div class="val tnum">${crShort(net)}</div></div></div>
      <div class="sub">${rows.length} release${rows.length===1?'':'s'}</div></div>
    <div class="kpi"${tattr('<b>Expenditure</b><br>Utilised against those releases - '+pct(net?util/net:0,1)+' of the limit released.')}>
      <div class="kpi-top"><span class="kpi-ic ic-green">${kpiIcon('coins')}</span><div class="kpi-txt">
      <div class="lbl">Expenditure</div><div class="val tnum">${crShort(util)}</div></div></div>
      <div class="sub">${pct(net?util/net:0,1)} of limit released</div></div>
    <div class="kpi"${tattr('<b>Balance</b><br>Released but not yet drawn: '+esc(crShort(net))+' − '+esc(crShort(util))+'.')}>
      <div class="kpi-top"><span class="kpi-ic ic-orange">${kpiIcon('scale')}</span><div class="kpi-txt">
      <div class="lbl">Balance</div><div class="val tnum${net-util>0?' neg':''}">${crShort(net-util)}</div></div></div>
      <div class="sub">released, not drawn</div></div>
    <div class="kpi"${tattr('<b>Busiest period</b><br>The '+(b==='M'?'month':b==='W'?'week':b==='3D'?'3-day block':'day')+' with the highest utilisation.<br><span style="opacity:.75">Average across active periods: '+esc(crShort(rate))+'.</span>')}>
      <div class="kpi-top"><span class="kpi-ic ic-purple">${kpiIcon('gauge')}</span><div class="kpi-txt">
      <div class="lbl">Busiest period</div><div class="val tnum sm">${peak&&peak.util>0?esc(crShort(peak.util)):'—'}</div></div></div>
      <div class="sub">${peak&&peak.util>0?esc(taRangeLabel(peak.key,b)):'no activity'}</div></div>
  </div>`;
}

function taBucketBar(id){
  return '<div class="ta-seg">'+TA_BUCKETS.map(function(o){
    const on=(state.taBucket&&state.taBucket[id]||'W')===o[0];
    return `<button class="${on?'on':''}" onclick="setTaBucket('${id}','${o[0]}')">${o[1]}</button>`;
  }).join('')+'</div>';
}

/* ---- The panel ---- */
function viewTrend(){
  const scoped=detailScopedTxn();                 // honours classification + centre chips
  const metric=state.taMetric||'all';
  const mChip=function(k,l){ return `<button class="fchip${metric===k?' on':''}" onclick="setTaMetric('${k}')">${l}</button>`; };

  const controls=`<div class="filterbar ta-top">
      <span class="ta-cap">Measure</span>
      ${mChip('all','All')}${mChip('exp','Expenditure')}${mChip('lim','Assigned limit')}${mChip('bal','Balance')}
      <div class="tools">
        <div class="toggle"><button class="${!state.taCum?'on':''}" onclick="setTaCum(0)">Per period</button>
        <button class="${state.taCum?'on':''}" onclick="setTaCum(1)">Cumulative</button></div>
      </div></div>`;

  const covered=sum(scoped,function(t){return t.net;});
  const cov=`<div class="dki-note"><div class="ico">i</div><div>
      Trends are built from <b>itemised release rows</b>, the only records in the workbook that carry a date.
      In the current filter that is <b>${crShort(covered)}</b> across ${scoped.length} releases.
      Component assignment has no date column and is never inferred onto the timeline; DDO KI Direct expenditure
      and the New Sports Infrastructure Projects releases are not itemised, so they sit outside these curves.
      <span class="muted">Figures here reconcile to the release tables, not to the scheme-wide assignment total.</span>
    </div></div>`;

  /* Module 1 - overall, under the site's own filters */
  const m1=`<div class="card ta-mod">
      <div class="ta-hd"><div><h3>1 · Overall</h3>
        <div class="qh">Every release in scope of the filters set at the top of the platform</div></div>
        ${taBucketBar('m1')}</div>
      ${taKpis(scoped,{id:'m1',name:'the current filter'})}
      ${taChart(taSeries(scoped,state.taBucket.m1),'m1')}</div>`;

  /* Module 2 - Regional Centre */
  const centres=ACTIVE_CENTRES.filter(function(c){ return isRegionalCentre(c); });
  const byRc={}; scoped.forEach(function(t){ if(!byRc[t.rc]) byRc[t.rc]={net:0,util:0,n:0};
    byRc[t.rc].net+=t.net||0; byRc[t.rc].util+=t.util||0; byRc[t.rc].n++; });
  const ranked=centres.slice().sort(function(a,b){ return (byRc[b]?byRc[b].net:0)-(byRc[a]?byRc[a].net:0); });
  if(!state.taRc || ranked.indexOf(state.taRc)<0) state.taRc=ranked[0]||'';
  const rcRows=scoped.filter(function(t){ return t.rc===state.taRc; });
  const rcPicker=ranked.map(function(c){
    const v=byRc[c]||{net:0,util:0,n:0};
    return `<button class="ta-pick${state.taRc===c?' on':''}" onclick="setTaRc('${esc(c)}')"
      ${tattr('<b>'+esc(c)+'</b><br>Released '+esc(crShort(v.net))+'<br>Utilised '+esc(crShort(v.util))+'<br>'+v.n+' releases')}>
      <span class="nm">${esc(c)}</span><span class="vv">${crShort(v.net)}</span></button>`;
  }).join('');
  const m2=`<div class="card ta-mod">
      <div class="ta-hd"><div><h3>2 · Regional Centre</h3>
        <div class="qh">Pick a centre to see how its releases and spending moved over time</div></div>
        ${taBucketBar('m2')}</div>
      <div class="ta-picks">${rcPicker}</div>
      ${state.taRc?taKpis(rcRows,{id:'m2',name:state.taRc})+taChart(taSeries(rcRows,state.taBucket.m2),'m2'):''}</div>`;

  /* Module 3 - component, then sub-component */
  const comps={}; scoped.forEach(function(t){ if(!comps[t.sv]) comps[t.sv]={net:0,util:0,n:0};
    comps[t.sv].net+=t.net||0; comps[t.sv].util+=t.util||0; comps[t.sv].n++; });
  const compList=Object.keys(comps).sort(function(a,b){ return comps[b].net-comps[a].net; });
  if(!state.taComp || compList.indexOf(state.taComp)<0){ state.taComp=compList[0]||''; state.taSub=''; }
  let cRows=scoped.filter(function(t){ return t.sv===state.taComp; });
  const subs={}; cRows.forEach(function(t){ const k=t.scat||'(Unspecified)';
    if(!subs[k]) subs[k]={net:0,util:0,n:0}; subs[k].net+=t.net||0; subs[k].util+=t.util||0; subs[k].n++; });
  const subList=Object.keys(subs).sort(function(a,b){ return subs[b].net-subs[a].net; });
  if(state.taSub && subList.indexOf(state.taSub)<0) state.taSub='';
  const rows3=state.taSub?cRows.filter(function(t){ return (t.scat||'(Unspecified)')===state.taSub; }):cRows;
  const compPicker=compList.map(function(c){
    const v=comps[c];
    return `<button class="ta-pick${state.taComp===c?' on':''}" onclick="setTaComp('${esc(c).replace(/'/g,"\\'")}')"
      ${tattr('<b>'+esc(c)+'</b><br>Released '+esc(crShort(v.net))+'<br>Utilised '+esc(crShort(v.util))+'<br>'+v.n+' releases')}>
      <span class="nm">${esc(c)}</span><span class="vv">${crShort(v.net)}</span></button>`;
  }).join('');
  const subPicker=subList.length>1?`<div class="ta-subs"><span class="ta-cap">Sub-component</span>
      <button class="fchip${!state.taSub?' on':''}" onclick="setTaSub('')">All</button>
      ${subList.map(function(s){ return `<button class="fchip${state.taSub===s?' on':''}" onclick="setTaSub('${esc(s).replace(/'/g,"\\'")}')">${esc(s)} <span style="opacity:.65">${crShort(subs[s].net)}</span></button>`; }).join('')}</div>`:'';
  const m3=`<div class="card ta-mod">
      <div class="ta-hd"><div><h3>3 · Component &amp; sub-component</h3>
        <div class="qh">Pick a component, then narrow to a sub-component</div></div>
        ${taBucketBar('m3')}</div>
      <div class="ta-picks">${compPicker}</div>
      ${subPicker}
      ${state.taComp?taKpis(rows3,{id:'m3',name:state.taSub||state.taComp})+taChart(taSeries(rows3,state.taBucket.m3),'m3'):''}</div>`;

  return pageHead('Trend Analytics','How releases and spending have moved over time · '+(state.taCum?'cumulative':'per period'))
   + controls + cov + m1 + m2 + m3;
}
function setTaMetric(v){ state.taMetric=v; render(); }

/* ---- generic entity utilisation table (Sanctioned/Used/Balance/Utilisation with sortable
   headers + health-rated rows) - shared, single implementation used by both Infrastructure
   MDSD (States/Institutes) and Regional Centres, so the two panels stay pixel-for-pixel
   consistent and any future refinement only has to happen once. cfg fields:
   {ns, sortField, nameLabel, sancLabel, usedLabel, balLabel, icon(x), detail(x)} */
function entityUtilTable(items,cfg){
  const barU=cfg.barUsedWord||cfg.usedLabel, barB=cfg.barBalWord||cfg.balLabel;
  const rows=items.map(x=>{
    const key=cfg.ns+':'+x.name, open=state.hsOpen===key;
    const h=healthOf(x.assign, x.assign?x.exp/x.assign:0, x.bal, x.bal);
    const upPct=Math.max(0,Math.min(100,(x.up||0)*100)), balPct=100-upPct;
    const labU = upPct>=20?`${pct(x.up,0)} ${barU}`:upPct>=10?pct(x.up,0):'';
    const labB = balPct>=20?`${pct(1-x.up,0)} ${barB}`:balPct>=10?pct(1-x.up,0):'';
    const segU=upPct>0?`<span class="mdsd-seg-u" style="width:${upPct.toFixed(2)}%">${labU}</span>`:'';
    const segB=balPct>0?`<span class="mdsd-seg-b" style="width:${balPct.toFixed(2)}%">${labB}</span>`:'';
    return `<div class="mdsd-row${open?' open':''}" onclick="hsToggle(${jstr(key)})">
      <div class="mdsd-head"><span class="mdsd-chev">${open?'▾':'▸'}</span><span class="mdsd-ic">${cfg.icon(x)}</span><b title="${esc(x.name)}">${esc(x.name)}</b></div>
      <div class="mdsd-ov">${healthPctPill(h,'mdsd-pill')}<div class="mdsd-bar">${segU}${segB}</div></div>
      <div class="mdsd-nums">
        <div class="mdsd-num"><span class="mdsd-mlbl">${cfg.sancLabel} </span>${crShort(x.assign)}</div>
        <div class="mdsd-num" style="color:${x.exp>0?'var(--good)':'var(--text-muted)'}"><span class="mdsd-mlbl">${cfg.usedLabel} </span>${crShort(x.exp)}</div>
        <div class="mdsd-num" style="color:${x.bal>0?'var(--serious)':'var(--text-muted)'}"><span class="mdsd-mlbl">${cfg.balLabel} </span>${crShort(x.bal)}</div>
        <div class="mdsd-util">${healthPctPill(h)}</div>
      </div>
    </div>${open?`<div class="mdsd-drop">${cfg.detail(x)}</div>`:''}`;
  }).join('');
  const s=state[cfg.sortField]||{key:'assign',dir:-1};
  const th=(key,label,numeric)=>{
    const ascOn=s.key===key&&s.dir===1, descOn=s.key===key&&s.dir===-1;
    return `<div class="mdsd-th${numeric?' num':''}"><span>${label}</span><span class="mdsd-sort">
      <button class="mdsd-sbtn${ascOn?' on':''}" onclick="event.stopPropagation();setUtilSort('${cfg.sortField}','${key}',1)" title="Sort ${label} ascending" aria-label="Sort ascending">▲</button>
      <button class="mdsd-sbtn${descOn?' on':''}" onclick="event.stopPropagation();setUtilSort('${cfg.sortField}','${key}',-1)" title="Sort ${label} descending" aria-label="Sort descending">▼</button>
    </span></div>`;
  };
  return `<div class="mdsd-tbl">
    <div class="mdsd-thead">${th('name',cfg.nameLabel)}<div>Utilisation Overview</div>${th('assign',cfg.sancLabel,true)}${th('exp',cfg.usedLabel,true)}${th('bal',cfg.balLabel,true)}${th('up','Utilisation',true)}</div>
    ${rows}
    <div class="mdsd-legend"><span><i class="lu"></i>${barU} (Utilised)</span><span><i class="lb"></i>${barB} (Unutilised)</span><span class="muted">Amounts in ₹ (Indian Rupees)</span></div>
  </div>`;
}
const MDSD_CFG={ns:'mdsdtbl',sortField:'mdsdSort',nameLabel:'State / Institute',sancLabel:'Sanctioned',usedLabel:'Used',balLabel:'Balance',icon:x=>mdsdIcon(x.type),detail:x=>mdsdDetail(x)};
function viewMDSD(){
  /* The "KI Infra is excluded" empty state that stood here is gone. This panel's
     preset forces inclMdsd:true on every render, so the branch was unreachable -
     and it both named the filter chip and offered a link to re-enable it, which is
     precisely the control this panel is meant to have no visible trace of. */
  const items=utilSorted(MDSD.items,state.mdsdSort), Gm=MDSD.grand;
  const kpis=`<div class="kpi-grid">
    <div class="kpi accent"><div class="kpi-top"><span class="kpi-ic ic-blue">${kpiIcon('wallet')}</span><div class="kpi-txt"><div class="lbl">KI Infra Assignment</div><div class="val tnum">${cr(Gm.assign)}</div></div></div><div class="sub">${items.length} States / Institutes funded</div></div>
    <div class="kpi"><div class="kpi-top"><span class="kpi-ic ic-green">${kpiIcon('coins')}</span><div class="kpi-txt"><div class="lbl">KI Infra Expenditure</div><div class="val tnum">${cr(Gm.exp)}</div></div></div><div class="sub" style="color:var(--serious)">${pct(Gm.up,1)} utilised</div></div>
    <div class="kpi"><div class="kpi-top"><span class="kpi-ic ic-orange">${kpiIcon('scale')}</span><div class="kpi-txt"><div class="lbl">KI Infra Balance</div><div class="val tnum">${cr(Gm.bal)}</div></div></div><div class="sub">${pct(Gm.assign?Gm.bal/Gm.assign:0,1)} unspent</div></div>
    <div class="kpi"><div class="kpi-top"><span class="kpi-ic ic-purple">${kpiIcon('gauge')}</span><div class="kpi-txt"><div class="lbl">Zero-Utilisation Entities</div><div class="val tnum">${MDSD.zeroCount} <span class="small muted" style="font-weight:500">of ${items.length}</span></div></div></div><div class="sub">have not drawn down any sanctioned funds</div></div>
  </div>`;

  const secItems=items.map((x,i)=>({key:x.name,value:x.assign,color:SVCOL[x.name]||SERIES[i%SERIES.length]}));

  /* Order: KPI cards -> the State / Institute utilisation table -> the assignment
     split. The Executive insights list has been withdrawn: every line it produced
     was already legible from the table directly above it. With it gone the donut
     takes the full width rather than sitting in a half column, so the chart is
     larger and its legend has room to run in two columns instead of one. */
  return pageHead('KI Infra (States/UTs)','')
   + kpis
   + `<div class="card" style="padding:0;overflow:hidden"><div class="card-hd" style="padding:16px 18px 0"><h3>State / Institute utilisation</h3></div>${entityUtilTable(items,MDSD_CFG)}</div>`
   + `<div class="card"><h3>Assignment by State / Institute</h3><div class="qh">share of the ${cr(Gm.assign)} KI Infra total</div>
      <div class="chartwrap mdsd-split"><div class="cc">${donutChart(secItems)}</div>
      <div class="lg-fill">${legendRich(secItems)}</div></div></div>`;
}

function renderTopFilters(){
  /* Classification filters the scheme's figures. My Profile has none, and nor
     does Administration - people and sign-ins are not scheme expenditure - so
     the control is withdrawn rather than left sitting there doing nothing. */
  if(state.view==='profile'||ADMIN_VIEWS.indexOf(state.view)>=0){
    document.getElementById('topFilters').innerHTML=''; syncFilterBadge(); return;
  }
  const f=state.filt;
  document.getElementById('topFilters').innerHTML = `
    <div class="sheet-hd"><span>Filters</span><button class="sheet-done" onclick="closeFilterSheet()">Done</button></div>

      <span class="muted">Classification</span>
      <select id="filtSel" onchange="setFilt(this.value)">
        <option value="All"${f==='All'?' selected':''}>All</option>
        <option value="Recurring"${f==='Recurring'?' selected':''}>Recurring</option>
        <option value="Non-Recurring"${f==='Non-Recurring'?' selected':''}>Non-Recurring</option>
        <option value="Infrastructure"${f==='Infrastructure'?' selected':''}>Infrastructure</option>
      </select>
    </div>
    <!-- The five stream chips (Regional Centres only / DDO KI / KI Infra / DDO HQ /
         Infra-SAI) used to sit here. They are deliberately NOT rendered: each panel
         now carries a fixed preset, re-asserted on every render by
         applyViewFilterDefaults(), so the streams are a property of the panel rather
         than something a viewer sets. The toggle functions are kept so the presets
         and rcOnly logic still read clearly, but nothing in the UI calls them. -->
  `;
  syncFilterBadge();
}

/* ---------------------------------------------------------------------------
   Filters as a bottom sheet (phones)
   The chips are the same elements in the same place in the DOM — only their
   position changes — so every handler, every per-panel preset and the rcOnly
   mode behave exactly as they do on desktop. The trigger carries a count of the
   streams currently included, so the filter state stays legible while shut.
--------------------------------------------------------------------------- */
function syncFilterBadge(){
  const n=document.getElementById('filtBtnN'); if(!n) return;
  /* This used to count the stream chips. They are no longer shown, so counting them
     would advertise hidden state and mean nothing to whoever is reading it. The
     sheet now holds exactly one control - Classification - so the badge marks only
     whether that has been narrowed away from All, and is otherwise absent. */
  const narrowed = state.filt && state.filt!=='All';
  n.textContent = narrowed ? '1' : '';
  n.className = 'filtbtn-n' + (narrowed ? '' : ' off');
}
function openFilterSheet(){
  document.body.classList.add('filters-open');
  const b=document.getElementById('filtBtn'); if(b) b.setAttribute('aria-expanded','true');
  const bd=document.getElementById('filtBackdrop'); if(bd) bd.classList.add('show');
}
function closeFilterSheet(){
  document.body.classList.remove('filters-open');
  const b=document.getElementById('filtBtn'); if(b) b.setAttribute('aria-expanded','false');
  const bd=document.getElementById('filtBackdrop'); if(bd) bd.classList.remove('show');
}
function toggleFilterSheet(){
  document.body.classList.contains('filters-open')?closeFilterSheet():openFilterSheet();
}
/* ---------------------------------------------------------------------------
   Card detail on a phone
   ---------------------------------------------------------------------------
   The KPI tooltips are pointer-only, and the phone stylesheet hides them
   outright — a tooltip that follows a cursor has nothing to follow on a touch
   screen, and left enabled it would open on first touch and stick there. So on
   a phone the same content is put behind a tap instead, in the bottom sheet the
   filters already use.

   Bound to `.kpi[data-tip]` rather than to every `[data-tip]` on purpose: the
   utilisation badges carry tooltips too, and they sit inside rows that expand
   when tapped. Catching those would fire the drill-down and the sheet from one
   tap. A KPI card has no other click behaviour, so it is unambiguous.
--------------------------------------------------------------------------- */
const TIP_PHONE=window.matchMedia?window.matchMedia('(max-width:640px)'):null;
function tipPhone(){ return TIP_PHONE?TIP_PHONE.matches:innerWidth<=640; }
function openTipSheet(card){
  const html=card.getAttribute('data-tip'); if(!html) return;
  const lbl=card.querySelector('.lbl');
  document.getElementById('tipSheetT').textContent=lbl?lbl.textContent.trim():'Detail';
  document.getElementById('tipSheetB').innerHTML=html;
  document.body.classList.add('tip-open');
  const bd=document.getElementById('tipBackdrop'); if(bd) bd.classList.add('show');
}
function closeTipSheet(){
  document.body.classList.remove('tip-open');
  const bd=document.getElementById('tipBackdrop'); if(bd) bd.classList.remove('show');
}
document.getElementById('content').addEventListener('click',function(e){
  if(!tipPhone()) return;
  const card=e.target.closest?e.target.closest('.kpi[data-tip]'):null;
  if(card){ e.stopPropagation(); openTipSheet(card); }
});

/* Escape closes whichever sheet is open, matching the navigation drawer. */
document.addEventListener('keydown',function(e){
  if(e.key!=='Escape') return;
  if(document.body.classList.contains('tip-open')) closeTipSheet();
  else if(document.body.classList.contains('filters-open')) closeFilterSheet();
});

/* ---------------------------------------------------------------------------
   Phone tab bar
   Reaching a panel on a phone meant opening the drawer every time. The four
   panels that carry the day sit on a fixed bar instead, with everything else —
   the delivery blocks, KI Infra, and any panel currently hidden — one tap away
   under "More", which opens the same drawer as before.

   TABS is filtered through viewHidden(), so a panel that is hidden from the
   sidebar cannot reappear here; if one is ever unhidden it needs no change.
--------------------------------------------------------------------------- */
const TABS=[
  {v:'command',   t:'Overview',   d:'M4 20V10M10 20V4M16 20v-7M22 20H2'},
  {v:'tracker',   t:'Components', d:'m12 2 9 5-9 5-9-5 9-5M3 12l9 5 9-5M3 17l9 5 9-5'},
  {v:'rc',        t:'Centres',    d:'M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z'},
  {v:'exceptions',t:'Alerts',     d:'M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0', badge:1}
];
function renderTabbar(){
  const el=document.getElementById('tabbar'); if(!el) return;
  const n=attentionCount();
  const tabs=TABS.filter(function(t){ return !viewHidden(t.v)&&moduleAllowed(t.v); }).map(function(t){
    const on=state.view===t.v;
    return `<button class="tab${on?' on':''}" onclick="go('${t.v}')"${on?' aria-current="page"':''}>
      <span class="tab-ic">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="${t.d}"/></svg>
        ${t.badge&&n?`<span class="tab-badge">${n>9?'9+':n}</span>`:''}
      </span><span class="tab-t">${t.t}</span></button>`;
  }).join('');
  /* "More" reflects the drawer's state rather than a panel, so it is marked
     current whenever the open panel isn't one of the four above. */
  const other=!TABS.some(function(t){ return t.v===state.view && !viewHidden(t.v) && moduleAllowed(t.v); });
  el.innerHTML=tabs+`<button class="tab${other?' on':''}" onclick="toggleSidebar()" aria-label="More panels">
      <span class="tab-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></span>
      <span class="tab-t">More</span></button>`;
}

/* ---- Per-panel default stream filters --------------------------------------
   A few panels open with a fixed selection of the four stream chips so their
   figures read consistently. The preset is applied only when the ACTIVE VIEW
   CHANGES, so a chip the user toggles while staying on a panel is preserved;
   it re-asserts the default the next time the panel is opened.
     • Regional Centres  -> DDO KI only            (DDO HQ + Infra-SAI excluded)
     • Financial Overview / Component Tracker /
       SAI KI 1, KI 2 & Infra -> DDO KI + DDO HQ + Infra-SAI  (KI Infra off)
     • SAI Format Summary -> all four streams ON   (full statutory picture)
     • KI Infra (States/UTs) -> KI Infra only      (the page is about MDSD
       grants alone, so the three SAI streams are switched off)
   Panels not listed here keep the platform's global, persistent filters
   (the previous behaviour), i.e. they inherit whatever the user last set.
--------------------------------------------------------------------------- */
const EXEC_FILTER_PRESET = { inclDdoki:true, inclMdsd:false, inclHQ:true,  inclInfraSai:true  };
const ALL_FILTER_PRESET  = { inclDdoki:true, inclMdsd:true,  inclHQ:true,  inclInfraSai:true  };
const MDSD_FILTER_PRESET = { inclDdoki:false, inclMdsd:true, inclHQ:false, inclInfraSai:false };
const VIEW_FILTER_PRESETS = {
  rc:       { inclDdoki:true, inclMdsd:false, inclHQ:false, inclInfraSai:false },
  command:  EXEC_FILTER_PRESET,
  tracker:  EXEC_FILTER_PRESET,
  kigroups: EXEC_FILTER_PRESET,
  saifmt:   ALL_FILTER_PRESET,
  mdsd:     MDSD_FILTER_PRESET,
  /* Attention Centre had no entry, so it inherited whatever the previous panel
     left behind - arriving from Regional Centres carried the RC streams in.
     That was survivable while the chips were on screen to correct it; with them
     hidden it would be an invisible inconsistency, so it is pinned explicitly. */
  exceptions: EXEC_FILTER_PRESET,
};
/* Regional-Centre mode is expressed through the four existing stream flags rather
   than a parallel calculation, so every KPI, chart, table, drill-down and export
   reaches it by the same code path the platform already uses - there is no second
   definition of the figures that could drift. Re-asserted on every render, so the
   mode survives navigation and outranks the per-panel defaults below. */
function rcOnlyOn(){ return state.rcOnly===true; }
function applyRcOnly(){
  state.inclDdoki=false;      // DDO KI Direct expenditure
  state.inclMdsd=false;       // KI Infra - States/UTs (MDSD)
  state.inclHQ=false;         // DDO HQ centre
  state.inclInfraSai=false;   // INFRA-SAI centre
}
function toggleRcOnly(){
  state.rcOnly=!state.rcOnly;
  if(state.rcOnly) applyRcOnly(); else Object.assign(state,EXEC_FILTER_PRESET);
  state._filtView=state.view;
  render();
}
function applyViewFilterDefaults(){
  /* The stream chips are no longer rendered, so a panel's preset is now the ONLY
     thing that sets these flags - and it is re-asserted on every render, not just
     when the panel changes. The old "same panel -> respect manual toggles" early
     return existed to preserve a viewer's clicks; with no control left to click it
     would instead let a stray flag persist invisibly, with nothing on screen able
     to correct it. Re-asserting makes each panel's streams a property of the panel.
     rcOnly is pinned off because its chip is gone and the mode is now unreachable. */
  state.rcOnly=false;
  const preset = VIEW_FILTER_PRESETS[state.view];
  if(preset) Object.assign(state, preset);
  state._filtView = state.view;
}

function render(){ applyViewFilterDefaults(); applyFilter(); renderNav(); renderTopFilters(); renderSyncPill(); const v=state.view;
  const html = v==='command'?viewCommand():v==='rc'?viewRC():v==='sv'?viewSV():v==='mdsd'?viewMDSD():v==='kigroups'?viewKI():v==='saifmt'?viewSAIFmt():v==='trend'?viewTrend():v==='exceptions'?viewExc():v==='detail'?viewDetail():v==='profile'?viewProfile():v==='yday'?viewYday():v==='admin'?viewAdminUsers():v==='access'?viewAdminAccess():v==='logs'?viewAdminLogs():viewTracker();
  document.getElementById('content').innerHTML=html;
  labelTableCells();
  groupTreeSections();
  renderTabbar();
}

/* ---------------------------------------------------------------------------
   Scheme-component tree: sections as groups (phones only)
   ---------------------------------------------------------------------------
   Nine components under three headings is a long scroll on a phone, and the
   headings did nothing but sit there. They become the way you navigate instead:
   tap Recurring, Non-Recurring or Infrastructure to open its components.

   This is presentational only. The table is rendered in full either way and the
   rows are hidden here afterwards, so the desktop table — where nine rows cost
   nothing and a collapsed section would only get in the way — is untouched, and
   nothing downstream has to know the difference. The toggle no-ops above the
   phone breakpoint for the same reason.

   Each section carries its own colour from SECTCOL, the same one it already
   wears on the classification pill everywhere else in the platform, so a
   component is recognisable as Recurring or Infrastructure at a glance.
--------------------------------------------------------------------------- */
const TREE_SEC_OPEN=Object.create(null);
let treeSecReady=false;
function treeSectionsInit(){
  if(treeSecReady) return;
  treeSecReady=true;
  /* Recurring carries the bulk of the scheme, so that is the one worth landing
     on; the other two are a tap away. */
  const lead=SECTIONS.indexOf('Recurring')>=0?'Recurring':SECTIONS[0];
  SECTIONS.forEach(function(s){ TREE_SEC_OPEN[s]=(s===lead); });
}
/**
 * Open one section, and only one.
 *
 * Sections were independent switches, so a reader working down the page ended
 * with all three open and a very long scroll - and no way to see, at a glance,
 * which one they were actually reading. An accordion keeps the page the length
 * of one section and makes the open heading the answer to "where am I".
 *
 * Closing a section also closes whatever was open inside it, for the same reason
 * a closed component closes its sub-vertical: expansion nobody can see is
 * expansion nobody chose.
 */
function toggleTreeSection(sec){
  const open=!!TREE_SEC_OPEN[sec];
  Object.keys(TREE_SEC_OPEN).forEach(function(k){ TREE_SEC_OPEN[k]=false; });
  if(!open) TREE_SEC_OPEN[sec]=true;
  /* Components live under a section, so a section closing closes them. Their
     keys are prefixed with the section name - see viewTracker. */
  /* Everything the reader had opened belonged to the section they just left, so
     it all closes with it. A leaf component expands through state.trSub rather
     than state.tr, so checking only the latter would leave a sub-vertical
     expanded under a section nobody can see - and springing back open, at a
     place they never left it, the next time that section is opened. */
  let touched=!!state.trSub||!!state.cdOpen;
  Object.keys(state.tr).forEach(function(k){
    if(state.tr[k]){ delete state.tr[k]; touched=true; }
  });
  state.trSub=null; state.cdOpen=null;
  /* The heading the reader tapped stays put. Without this, closing the section
     above it pulls it hundreds of pixels up the screen the instant it is
     touched - the one row that must not move is the one being used. */
  keepInPlace(
    function(){ return document.querySelector('#content tr.secrow[data-sec="'+sec.replace(/"/g,'\\"')+'"]'); },
    function(){ if(touched) render(); else groupTreeSections(); }
  );
}
const TREE_PHONE=window.matchMedia?window.matchMedia('(max-width:640px)'):null;
function groupTreeSections(){
  const tbl=document.querySelector('#content .treecards table.dt.tree');
  if(!tbl) return;
  treeSectionsInit();
  /* Above the phone breakpoint the headings are not controls and every section
     stays open, so the row is left exactly as the table rendered it. */
  const phone=TREE_PHONE?TREE_PHONE.matches:innerWidth<=640;
  const rows=tbl.querySelectorAll(':scope > tbody > tr');
  let sec=null;
  for(let i=0;i<rows.length;i++){
    const r=rows[i];
    if(r.classList.contains('total')){ sec=null; continue; }
    if(r.classList.contains('secrow')){
      const name=(r.children[0].textContent||'').trim();
      sec=name;
      paintSection(r,name);
      /* A dedicated class, not `open`: `table.dt tr.open` already means
         "expanded drill-down" and tints the row on every screen. */
      r.classList.toggle('sec-open',!!TREE_SEC_OPEN[name]);
      if(phone){
        r.setAttribute('role','button');
        r.setAttribute('aria-expanded',TREE_SEC_OPEN[name]?'true':'false');
        r.onclick=function(){ toggleTreeSection(name); };
      }else{
        r.removeAttribute('role'); r.removeAttribute('aria-expanded'); r.onclick=null;
      }
      continue;
    }
    if(!sec) continue;
    paintSection(r,sec);
    r.classList.toggle('sec-hidden',phone&&!TREE_SEC_OPEN[sec]);
  }
}
/* Crossing the breakpoint changes whether the headings are controls at all, so
   re-mark rather than leave a resized window in the other mode's state. */
if(TREE_PHONE&&TREE_PHONE.addEventListener) TREE_PHONE.addEventListener('change',groupTreeSections);
/* Hand the row its section's identity colour, pre-mixed, so the stylesheet can
   tint a card and a rule without needing to know how to blend a hex value. */
function paintSection(row,sec){
  const c=SECTCOL[sec]||'#88909f';
  row.setAttribute('data-sec',sec);
  row.style.setProperty('--sc',c);
  /* A ladder of one hue, not three colours.
     Depth is carried by how much of the section's own colour a card holds:
     the section is the strongest, a component lighter, a sub-vertical lighter
     still. Indentation alone was doing this job and could not - twelve pixels
     between two white cards is not a difference a reader sees, so a component
     and the sub-vertical inside it read as siblings. Tint answers "how deep am
     I" before the eye reaches the indent, and because every step is the same
     hue it also answers "which section is this" at the same time.
     The steps roughly halve, which is what keeps three levels apart at a glance
     while leaving the deepest one barely tinted rather than muddy. */
  row.style.setProperty('--scbg',hexToRgba(c,.10));    // section
  row.style.setProperty('--scbg2',hexToRgba(c,.052));  // component
  row.style.setProperty('--scbg3',hexToRgba(c,.024));  // sub-vertical
  row.style.setProperty('--scbd',hexToRgba(c,.32));    // section edge
  row.style.setProperty('--scbd2',hexToRgba(c,.26));   // component edge
  row.style.setProperty('--scbd3',hexToRgba(c,.16));   // sub-vertical edge
  /* Open is brighter than the same level at rest, and still lighter than the
     level above it. Two rules are in play and they can fight: hierarchy says
     deeper is lighter, emphasis says active is stronger. Letting emphasis win
     outright inverts the ladder - an open component came out darker than its
     own section - so open moves a row UP its own rung and never past its
     parent. The previous code sidestepped this by giving both levels the same
     --primary-subtle, which cost the distinction entirely. */
  row.style.setProperty('--scop2',hexToRgba(c,.08));   // component, open
  row.style.setProperty('--scop3',hexToRgba(c,.045));  // sub-vertical, open
}

/* ============================================================================
   Mobile presentation layer — phones only
   ---------------------------------------------------------------------------
   A dense financial table is unreadable on a 390px screen: today it survives by
   scrolling sideways, which hides the very columns (Balance, Unspent) a reader
   opens the page for. The phone stylesheet re-flows each row into its own card,
   but CSS alone cannot do that, because once the <thead> is hidden a cell has no
   way to say which column it came from.

   This pass supplies exactly that missing piece: it copies each column heading
   onto the cells beneath it as `data-label`, so the stylesheet can print the
   heading beside the value. It is deliberately narrow in what it touches —
   it writes attributes and marker classes only, never cell text or values —
   so the desktop rendering is unchanged and re-running it is harmless.

   Two shapes are left alone on purpose:
     • .tree  — the component hierarchy, where indentation is the meaning and a
                flat stack of cards would destroy the parent/child reading.
     • rows that span the grid (drill-downs, group headers, sub-tables), which
                already carry their own layout; they are marked .dt-span so the
                stylesheet lets them run full width.
   ========================================================================== */
/* Longest single text node in a cell — see the note in labelTableCells(). */
function longestTextRun(el){
  const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);
  let max=0,n;
  while((n=w.nextNode())) max=Math.max(max,(n.nodeValue||'').trim().length);
  return max;
}
function labelTableCells(){
  /* Three shapes get the treatment, each with its own marker so the stylesheet
     can lay them out differently: the panel tables, the component tree, and the
     drill-down that opens inside a row (`.usage`, shared by the component and
     regional-centre expansions). */
  const wraps=document.querySelectorAll('#content .tscroll, #content .usage');
  for(let w=0;w<wraps.length;w++){
    const wrap=wraps[w], tbl=wrap.querySelector('table');
    if(!tbl||(!tbl.classList.contains('dt')&&!wrap.classList.contains('usage'))) continue;
    /* The component tree becomes cards too, but of a different shape: its rows
       are a hierarchy, and the expander and the parent/child relationship have
       to survive. It gets its own marker so the stylesheet can lay it out as a
       name, a utilisation bar and three figures, with sub-verticals inset. */
    const isTree=tbl.classList.contains('tree');

    /* Column headings carry sort controls (▲▼) inside them; strip those from a
       throwaway clone so the label reads "Balance", not "Balance▲▼".

       Every selector here is scoped to the table's own direct children. A row
       can open a nested table inside one of its cells — the voucher list under
       an expanded centre does exactly that — and an unscoped `thead th` or
       `tbody tr` reaches straight into it, which would label the inner table's
       headings with the outer table's columns. */
    const ths=tbl.querySelectorAll(':scope > thead > tr > th'), labels=[];
    for(let i=0;i<ths.length;i++){
      const c=ths[i].cloneNode(true), sorts=c.querySelectorAll('.mdsd-sort');
      for(let j=0;j<sorts.length;j++) sorts[j].remove();
      labels.push((c.textContent||'').replace(/\s+/g,' ').trim());
    }
    if(!labels.length) continue;
    wrap.classList.add(wrap.classList.contains('usage')?'usagecards':isTree?'treecards':'cardify');

    const rows=tbl.querySelectorAll(':scope > tbody > tr, :scope > tfoot > tr');
    for(let r=0;r<rows.length;r++){
      const tds=rows[r].children;
      let spans=false;
      for(let c=0;c<tds.length;c++) if(tds[c].hasAttribute('colspan')) spans=true;
      if(spans||tds.length<labels.length){ rows[r].classList.add('dt-span'); continue; }
      /* A totals row often carries one trailing spacer cell beyond the headings;
         label what maps to a heading and leave any surplus unlabelled. */
      for(let c2=0;c2<tds.length;c2++){
        if(c2<labels.length && labels[c2]) tds[c2].setAttribute('data-label',labels[c2]);
        else tds[c2].classList.add('dt-extra');
        /* Prose — a narration, a description — cannot share a line with its
           heading on a phone without being squeezed into a few characters per
           line, so it is given the full width beneath the heading instead.

           What marks a cell as prose is one long *unbroken* run of text. Total
           length would misread a cell that merely stacks several short labels
           (a voucher above a sub-vertical above a pill), which is structure,
           not prose, and reads correctly as it is. The first cell is always the
           card's title, and numeric cells are never prose. */
        if(c2>0 && !tds[c2].classList.contains('num') && longestTextRun(tds[c2])>44)
          tds[c2].classList.add('dt-long');
      }
    }
    const foot=tbl.querySelector(':scope > tfoot');
    if(foot) foot.classList.add('dt-foot');
  }

  /* A drill-down row reads as a card on a phone, and a card here should look
     like the centre card it opened from: name, utilisation, then a bar split
     green/orange before the figures. The row already states its utilisation as
     a percentage in its last cell, so lifting that number onto the row as a
     custom property lets the stylesheet draw the bar with no change to any
     render function. Rows with no limit (a direct expenditure, say) show "-"
     and simply get no bar. */
  const ucards=document.querySelectorAll('#content .usagecards > table > tbody > tr');
  for(let i=0;i<ucards.length;i++){
    const row=ucards[i], cells=row.children;
    if(row.classList.contains('txrow')||!cells.length) continue;
    const m=/(\d+(?:\.\d+)?)\s*%/.exec(cells[cells.length-1].textContent||'');
    if(!m) continue;
    row.style.setProperty('--up',Math.max(0,Math.min(100,parseFloat(m[1]))));
    row.classList.add('ub');
  }

  /* The voucher list sits one level deeper again — inside a centre inside a
     sub-vertical — and is a table in its own right rather than a wrapped one,
     so it is picked up separately. Without this the deepest level of the
     drill-down would be the only thing left scrolling sideways. */
  const minis=document.querySelectorAll('#content table.txmini');
  for(let m=0;m<minis.length;m++){
    const t=minis[m], hs=t.querySelectorAll(':scope > thead > tr > th'), ls=[];
    for(let i=0;i<hs.length;i++) ls.push((hs[i].textContent||'').replace(/\s+/g,' ').trim());
    if(!ls.length) continue;
    t.classList.add('txcards');
    const rs=t.querySelectorAll(':scope > tbody > tr');
    for(let r=0;r<rs.length;r++){
      const cs=rs[r].children;
      if(cs.length!==ls.length) continue;
      for(let c=0;c<cs.length;c++) if(ls[c]) cs[c].setAttribute('data-label',ls[c]);
    }
  }
}

/* ============================================================================
   SAI live-sync module — parses the Google Sheet into the platform's DATA shape.
   Written as plain ES5-ish JS so the identical source runs both here (Node test)
   and inside the platform page.
   ========================================================================== */
function csvParse(text){
  const rows=[]; let row=[], f='', q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; }
      else f+=c;
    } else if(c==='"') q=true;
    else if(c===','){ row.push(f); f=''; }
    else if(c==='\n'){ row.push(f); rows.push(row); row=[]; f=''; }
    else if(c!=='\r') f+=c;
  }
  if(f!==''||row.length){ row.push(f); rows.push(row); }
  return rows;
}
/* "2,73,87,470" / "1,754,640" / "" / "-" -> Number. Indian or western grouping both fine. */
function nnum(v){
  if(v==null) return 0;
  const s=String(v).replace(/[₹\s,]/g,'').trim();
  if(!s||s==='-') return 0;
  const n=parseFloat(s);
  return isFinite(n)?n:0;
}
function nkey(s){ return String(s==null?'':s).replace(/\s+/g,' ').trim().toLowerCase(); }

/* Sheet3 component label -> platform sub-vertical name. Exact match after normalising,
   so vertical header rows ("Khelo India Centres and Sports Academies") never collide
   with the component row ("Khelo India Centres"). */
const SYNC_SVMAP={
 'khelo india games':'Khelo India Games',
 'talent identification & development':'Talent Identification & Development',
 'talent identification and development':'Talent Identification & Development',
 'community coaching & development':'Community Coaching & Development',
 'khelo india centres':'Khelo India Centres',
 'fit india movement':'Fit India Movement',
 'sports for peace and development':'Sports for Peace and Development',
 'sports for rural/indigenous/tribal':'Sports for rural/indigenous/tribal',
 'sports for disabled sportspersons':'Sports for disabled sportspersons',
 'sports for women':'Sports for Women',
 'new sports infrastructure projects':'New Sports Infrastructure Projects',
 'khelo india centres nr':'Khelo India Centres (N-Rec)',

    It used to carry one row, labelled "Sports Academies", holding the
    NON-recurring money - so that label mapped to the non-recurring component.
    A recurring row has since been added under Khelo India Centres and Sports
    Academies, and the older row renamed to "Sports Academies NR", following the
    same NR suffix Khelo India Centres already uses.
    Both labels are therefore mapped, and the bare one now means the recurring
    component. Mapping only the bare label would be quietly expensive: the
    recurring row's figures would land on the non-recurring component, and the
    renamed row would match nothing and be skipped, taking its expenditure off
    the platform without failing a single check - every remaining total would
    still reconcile with itself. */
 'sports academies nr':'Sports Academies',
