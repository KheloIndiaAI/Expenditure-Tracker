function pfVal(id) { const el = document.getElementById(id); return el ? el.value.trim() : ''; }
function pfNote(slot, kind, text) {
  const el = document.getElementById(slot);
  if (el) el.innerHTML = text ? '<div class="pf-msg ' + kind + '">' + esc(text) + '</div>' : '';
}
/** Read the server's message when it sends one; fall back otherwise. */
function pfSend(url, method, body) {
  return fetch(url, {
    method: method,
    credentials: 'include',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  }).then(function (r) {
    return r.text().then(function (t) {
      let parsed = null;
      try { parsed = t ? JSON.parse(t) : null; } catch (e) { parsed = null; }
      if (!r.ok) throw new Error((parsed && parsed.message) || 'Request failed (' + r.status + ').');
      return parsed;
    });
  });
}

function pfSave(e) {
  e.preventDefault();
  const btn = document.getElementById('pfSaveBtn');
  if (!pfVal('pfName')) { pfNote('pfMsg', 'err', 'Name cannot be empty.'); return false; }
  btn.disabled = true; btn.textContent = 'Saving…';
  pfNote('pfMsg', '', '');
  pfSend('/api/me', 'PATCH', {
    name: pfVal('pfName'),
    designation: pfVal('pfDesig'),
    email: pfVal('pfEmail'),
    phone: pfVal('pfPhone'),
  })
    .then(function (me) {
      /* Adopt the server's copy rather than the form's: it is the record that
         was actually stored, trimmed and validated. No re-render — that would
         discard the confirmation the user is reading. */
      if (me) ME = me;
      pfNote('pfMsg', 'ok', 'Profile updated.');
    })
    .catch(function (err) { pfNote('pfMsg', 'err', err.message); })
    .then(function () { btn.disabled = false; btn.textContent = 'Save changes'; });
  return false;
}

function pfPassword(e) {
  e.preventDefault();
  const cur = pfVal('pfCur'), next = pfVal('pfNew'), confirm = pfVal('pfConf');
  if (!cur || !next || !confirm) { pfNote('pfPwMsg', 'err', 'Fill in all three fields.'); return false; }
  /* Caught here purely to save a round trip; the server still validates length
     and that the current password is right. */
  if (next !== confirm) { pfNote('pfPwMsg', 'err', 'The two new passwords do not match.'); return false; }
  if (next.length < 8) { pfNote('pfPwMsg', 'err', 'The new password must be at least 8 characters.'); return false; }
  const btn = document.getElementById('pfPwBtn');
  btn.disabled = true; btn.textContent = 'Saving…';
  pfNote('pfPwMsg', '', '');
  pfSend('/api/me/password', 'POST', { current: cur, next: next })
    .then(function () {
      ['pfCur', 'pfNew', 'pfConf'].forEach(function (id) {
        const el = document.getElementById(id); if (el) el.value = '';
      });
      pfNote('pfPwMsg', 'ok', 'Password changed.');
    })
    .catch(function (err) { pfNote('pfPwMsg', 'err', err.message); })
    .then(function () { btn.disabled = false; btn.textContent = 'Change password'; });
  return false;
}

/* ============================================================================
   ADMINISTRATION — User Management, Roles & Access, User Logs
   ============================================================================
   These were a separate React application at /admin. They are panels of this
   dashboard now, for the reason My Profile moved before them: an administrator
   adding a user was being thrown out of the product they were working in, into
   a different one, and back again through a full page load.

   Nothing here is a permission. Every endpoint under /api/admin/* resolves the
   caller from their cookie and refuses a non-administrator with a 403, so this
   code decides what to draw and never what is allowed. The panels are hidden
   from anyone else only so the menu tells the truth.

   The gesture throughout is the one the scheme panels already use: a row opens
   in place to reveal its detail. There is no modal in this dashboard and this
   did not introduce one — an editor that unfolds under the row it belongs to
   keeps the list on screen, which a dialog covering it would not. */

var ADM = { users: null, loading: false, err: null, logs: null, logsErr: null, seen: {} };

/** Read the admin API. Same shape as pfSend, which is the file's fetch idiom. */
function admGet(url) {
  return fetch(url, { credentials: 'include' }).then(function (r) {
    return r.text().then(function (t) {
      var parsed = null;
      try { parsed = t ? JSON.parse(t) : null; } catch (e) { parsed = null; }
      if (!r.ok) throw new Error((parsed && parsed.message) || 'Request failed (' + r.status + ').');
      return parsed;
    });
  });
}
/** Load the user list. Re-entrant: a second call while one is in flight is ignored. */
function admLoadUsers(force) {
  if (ADM.loading || (ADM.users && !force)) return;
  ADM.loading = true; ADM.err = null;
  admGet('/api/admin/users')
    .then(function (list) { ADM.users = Array.isArray(list) ? list : []; })
    .catch(function (err) { ADM.err = err.message; })
    .then(function () { ADM.loading = false; render(); });
}
/** Load the sign-in log for the current filters, plus each person's last visit. */
function admLoadLogs(force) {
  if (ADM.logs && !force) return;
  ADM.logsErr = null;
  var q = '/api/admin/logins?limit=300';
  if (state.logOutcome) q += '&outcome=' + encodeURIComponent(state.logOutcome);
  if (state.logDays) q += '&days=' + encodeURIComponent(state.logDays);
  admGet(q)
    .then(function (r) {
      ADM.logs = (r && r.events) || [];
      ADM.logTotal = (r && r.total) || 0;
      ADM.seen = {};
      ((r && r.lastSeen) || []).forEach(function (s) { ADM.seen[s.user_id] = s.at; });
    })
    .catch(function (err) { ADM.logsErr = err.message; ADM.logs = []; })
    .then(function () { render(); });
}

/* ---- shared bits ---------------------------------------------------------- */

/** Every role the platform knows, for the role picker. Mirrors ROLES/ROLE_LABELS. */
const ADM_ROLES = ['minister','secretary','joint_secretary','director','finance_officer',
                   'senior_finance','analyst','auditor','admin','super_admin'];
/* The Regional Centres a login can be assigned to. Mirrors RC_SHEET_NAMES in
   @efip/shared - the worksheet tab names, which are what every transaction's
   `rc` is stamped with. Deliberately NOT DATA.centres, which also holds
   INFRA-SAI: that has no worksheet tab and therefore no vouchers, so assigning
   someone to it would grant the right to comment on nothing. */
/* DDO HQ is deliberately absent. It is a worksheet tab and it does have
   vouchers, but the Regional Centres panel pins inclHQ:false in its own filter
   preset, so DDO HQ rows never appear there and a login assigned to it would
   hold a right it could never exercise. It is also, in this platform's own
   vocabulary, not a regional centre - isRegionalCentre() excludes it - and
   these comments are a centre's query TO headquarters. Offering it would be a
   permission that quietly does nothing. */
const ADM_RC = ['PATIALA','BANGALORE','BHOPAL','CHANDIGARH','GANDHINAGAR',
                'GUWAHATI','IMPHAL','KOLKATA','LUCKNOW','MUMBAI','SONEPAT','TRIVANDRUM'];
/* Mirrors ASSIGNABLE_CENTRES in @efip/shared. This document imports nothing, so
   the list is restated; the server validates against its own copy, so a value
   missing here can only ever hide an option, never admit an invalid one. */
function admRcOpts(){
  return [{v:'',t:'— None —'}].concat(ADM_RC.map(function(c){ return {v:c,t:c}; }));
}
/** The panels a grant can cover. Mirrors MODULES in @efip/shared.
    `r:1` marks a restricted panel — off unless granted, rather than on unless
    withdrawn — so the toggle can say which way round it is. */
const ADM_MODULES = [
  { k:'command',    t:'Financial Overview' },
  { k:'yday',       t:"Yesterday's Expenditure", r:1 },
  { k:'tracker',    t:'Component Tracker' },
  { k:'kigroups',   t:'SAI KI 1, KI 2 & Infra' },
  { k:'saifmt',     t:'SAI Format Summary', r:1 },
  { k:'mdsd',       t:'KI Infra (States/UTs)' },
  { k:'rc',         t:'Regional Centres' },
  { k:'exceptions', t:'Attention Centre' },
];
function admIsAdminRole(r) { return r === 'admin' || r === 'super_admin'; }
function admSelect(id, value, opts, o) {
  o = o || {};
  return '<div><label class="pf-lb" for="' + id + '">' + esc(o.label || '') + '</label>' +
    '<select class="pf-sel" id="' + id + '"' + (o.disabled ? ' disabled' : '') + '>' +
    opts.map(function (op) {
      return '<option value="' + esc(op.v) + '"' + (op.v === value ? ' selected' : '') + '>' + esc(op.t) + '</option>';
    }).join('') + '</select>' +
    (o.hint ? '<div class="pf-hint">' + esc(o.hint) + '</div>' : '') + '</div>';
}
/** "3 minutes ago" / "on 12.08.2026" — the log is scanned for recency first. */
function admAgo(iso) {
  if (!iso) return '';
  var t = Date.parse(iso); if (!isFinite(t)) return '';
  var s = Math.round((Date.now() - t) / 1000);
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s / 60) + ' min ago';
  if (s < 86400) return Math.floor(s / 3600) + ' hr ago';
  var d = Math.floor(s / 86400);
  return d === 1 ? 'yesterday' : d + ' days ago';
}
/** Date and clock time in IST, which is the timezone the platform reports in. */
function admWhen(iso) {
  var t = Date.parse(iso); if (!isFinite(t)) return '—';
  var d = new Date(t + IST_MIN * 60000), p = function (n) { return String(n).padStart(2, '0'); };
  return p(d.getUTCDate()) + '.' + p(d.getUTCMonth() + 1) + '.' + d.getUTCFullYear() +
    ' · ' + p(d.getUTCHours()) + ':' + p(d.getUTCMinutes());
}
function admHead(title, sub) { return pageHead(title, sub); }
/* The three administration panels, offered as one control at the head of each.
   They used to be three sidebar entries, which read as three destinations when
   they are really one job - the people on the platform - seen from three sides.
   As tabs they sit together, and the menu loses a group it did not need.

   Each remains its own view: selecting one is an ordinary go(), so the deep
   link, the browser-less ?panel= entry point, the server's /admin/* redirects
   and the global search result for each panel all keep working untouched.
   Rendered as part of the head, so it is still there to escape with when the
   panel underneath is showing an error or still loading. */
var ADM_TABS = [['admin', 'User Management'], ['access', 'Roles & Access'], ['logs', 'User Logs']];
function admTabs(cur) {
  return '<div class="ta-seg ad-tabs">' + ADM_TABS.map(function (t) {
    return '<button class="' + (t[0] === cur ? 'on' : '') + '"' +
      (t[0] === cur ? ' aria-current="page"' : '') +
      ' onclick="go(\'' + t[0] + '\')">' + esc(t[1]) + '</button>';
  }).join('') + '</div>';
}
/** Shown when a non-administrator reaches one of these panels by URL. */
function admDenied() {
  return '<div class="card"><div class="dt-empty"><div class="e-ic">🔒</div>' +
    '<div class="e-t">Administration is restricted</div>' +
    '<div class="e-s">This area is available to administrators. If you need access, ask one to grant it.</div>' +
    '</div></div>';
}
function admBusy(what) {
  return '<div class="card"><div class="dt-empty"><div class="e-ic">◌</div>' +
    '<div class="e-t">Loading ' + esc(what) + '…</div>' +
    '<div class="e-s">Reading from the platform\'s own store.</div></div></div>';
}
function admError(msg) {
  return '<div class="card"><div class="dt-empty"><div class="e-ic">!</div>' +
    '<div class="e-t">Could not load</div><div class="e-s">' + esc(msg) + '</div></div></div>';
}

/* ---- User Management ------------------------------------------------------ */

function admMatch(u, q) {
  if (!q) return true;
  q = q.toLowerCase();
  return [u.name, u.username, u.designation, u.email, u.phone, u.regional_centre, pfRoleLabel(u.role)]
    .some(function (f) { return String(f || '').toLowerCase().indexOf(q) >= 0; });
}
function viewAdminUsers() {
  if (!isSuperAdmin()) return admDenied();
  admLoadUsers();
  /* The list's "Last sign-in" column comes out of the sign-in log's summary,
     which is not filtered by the Logs panel's chips - so whichever panel loads
     it first, both are served. Without this the column reads "Never" for
     everyone until the administrator happens to open User Logs. */
  admLoadLogs();
  var head = admHead('User Management', 'Every login on the platform. Roles decide capability; access decides which panels open.') + admTabs('admin');
  if (ADM.err) return head + admError(ADM.err);
  if (!ADM.users) return head + admBusy('users');

  var q = state.admQ || '';
  var rows = ADM.users.filter(function (u) { return admMatch(u, q); });
  var active = ADM.users.filter(function (u) { return u.is_active !== false; }).length;

  var body = rows.map(function (u) {
    var open = state.admOpen === u.id;
    var me = ME && ME.id === u.id;
    var on = u.is_active !== false;
    var seen = ADM.seen[u.id];
    return '<tr class="ad-row' + (open ? ' open' : '') + '" onclick="admToggle(' + jstr(u.id) + ')">' +
      '<td><div class="ad-nm"><span class="chev' + (open ? ' open' : '') + '">' + (open ? '▾' : '▸') + '</span>' +
        '<span style="min-width:0"><b>' + esc(u.name || u.username) + '</b>' +
        (me ? '<span class="ad-you">You</span>' : '') +
        '<div class="un">' + esc(u.username) + '</div></span></div></td>' +
      '<td>' + (u.designation ? esc(u.designation) : '<span class="muted">—</span>') + '</td>' +
      '<td>' + esc(pfRoleLabel(u.role)) + '</td>' +
      '<td>' + (u.regional_centre ? esc(u.regional_centre) : '<span class="muted">—</span>') + '</td>' +
      '<td><span class="ad-pill ' + (on ? 'on' : 'off') + '"><i></i>' + (on ? 'Active' : 'Deactivated') + '</span></td>' +
      '<td class="small">' + (seen ? esc(admAgo(seen)) : '<span class="muted">Never</span>') + '</td></tr>' +
      (open ? '<tr class="ad-drop"><td colspan="6" onclick="event.stopPropagation()">' + admEditor(u) + '</td></tr>' : '');
  }).join('');

  var table = rows.length
    ? '<div class="tscroll"><table class="dt ad-tbl"><thead><tr>' +
        '<th>Name</th><th>Designation</th><th>Role</th><th>Centre</th><th>Status</th><th>Last sign-in</th>' +
      '</tr></thead><tbody>' + body + '</tbody></table></div>'
    : '<div class="dt-empty"><div class="e-ic">🔍</div><div class="e-t">No user matches “' + esc(q) + '”</div>' +
      '<div class="e-s">Try a name, username, designation or role.</div></div>';

  return head +
    '<div class="ad-bar">' +
      '<div class="ad-search">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>' +
        '<input class="pf-in" id="admQ" type="search" placeholder="Filter by name, username, designation or role" ' +
          'value="' + esc(q) + '" oninput="admFilter(this.value)" autocomplete="off">' +
      '</div>' +
      '<button class="pf-btn" onclick="admNewToggle()">' + (state.admNew ? 'Cancel' : '+  Add user') + '</button>' +
      '<span class="ad-count">' + ADM.users.length + ' user' + (ADM.users.length === 1 ? '' : 's') +
        ' · ' + active + ' active</span>' +
    '</div>' +
    (state.admNew ? admNewCard() : '') +
    '<div class="card" style="padding:0;overflow:hidden">' + table + '</div>';
}

/** The editor that unfolds under a user's row. */
function admEditor(u) {
  var me = ME && ME.id === u.id;
  var lockRole = me;                      // the server refuses a self-demotion too
  return '<div class="ad-edit"><div class="ad-two">' +
    '<div>' +
      '<div class="ad-sec">Details</div>' +
      '<div id="admMsg-' + esc(u.id) + '"></div>' +
      '<form onsubmit="return admSave(event,' + jstr(u.id) + ')" novalidate>' +
        '<div class="pf-f">' +
          pfField('Name', 'ae-name-' + u.id, u.name, { required: true }) +
          pfField('Designation', 'ae-desig-' + u.id, u.designation) +
          pfField('Email ID', 'ae-email-' + u.id, u.email, { type: 'email' }) +
          pfField('Phone Number', 'ae-phone-' + u.id, u.phone) +
          admSelect('ae-role-' + u.id, u.role, ADM_ROLES.map(function (r) { return { v: r, t: pfRoleLabel(r) }; }),
            { label: 'Role', disabled: lockRole,
              hint: lockRole ? 'You cannot change your own role.' : 'Administrator and Super Administrator both reach this area.' }) +
          admSelect('ae-active-' + u.id, u.is_active === false ? 'no' : 'yes',
            [{ v: 'yes', t: 'Active' }, { v: 'no', t: 'Deactivated' }],
            { label: 'Status', disabled: me,
              hint: me ? 'You cannot deactivate your own account.' : 'A deactivated account is refused at sign-in.' }) +
          admSelect('ae-rc-' + u.id, u.regional_centre || '', admRcOpts(),
            { label: 'Regional Centre',
              hint: 'The centre whose vouchers this user may comment on. None means they may comment nowhere.' }) +
        '</div>' +
        '<div class="pf-act"><button class="pf-btn" type="submit" id="ae-btn-' + esc(u.id) + '">Save changes</button></div>' +
      '</form>' +
    '</div>' +
    '<div>' +
      '<div class="ad-sec">Set a new password</div>' +
      '<div id="admPwMsg-' + esc(u.id) + '"></div>' +
      '<form onsubmit="return admSetPw(event,' + jstr(u.id) + ')" novalidate>' +
        '<div class="pf-stack">' +
          pfField('New password', 'ae-pw-' + u.id, '', { type: 'password', autocomplete: 'new-password', hint: 'At least 8 characters. The user is not told — pass it on yourself.' }) +
          pfField('Confirm', 'ae-pw2-' + u.id, '', { type: 'password', autocomplete: 'new-password' }) +
        '</div>' +
        '<div class="pf-act"><button class="pf-btn wide" type="submit" id="ae-pwbtn-' + esc(u.id) + '">Set password</button></div>' +
      '</form>' +
      '<div class="ad-sec mt">Username</div>' +
      '<div class="pf-hint" style="margin-top:-4px">' + esc(u.username) +
        ' — a login identifier cannot be changed once issued. Create a new account instead.</div>' +
    '</div>' +
  '</div></div>';
}

function admNewCard() {
  return '<div class="card"><div class="card-hd"><h3>Add a user</h3></div>' +
    '<div id="admNewMsg"></div>' +
    '<form onsubmit="return admCreate(event)" novalidate>' +
      '<div class="pf-f">' +
        pfField('Username', 'an-user', '', { required: true, autocomplete: 'off', hint: 'Letters, numbers, dot, dash or underscore. This is what they sign in with, and it is permanent.' }) +
        pfField('Name', 'an-name', '', { required: true }) +
        pfField('Designation', 'an-desig', '') +
        pfField('Email ID', 'an-email', '', { type: 'email' }) +
        pfField('Phone Number', 'an-phone', '') +
        admSelect('an-role', 'analyst', ADM_ROLES.map(function (r) { return { v: r, t: pfRoleLabel(r) }; }), { label: 'Role' }) +
        admSelect('an-rc', '', admRcOpts(),
          { label: 'Regional Centre', hint: 'Only needed for a centre login that will comment on its own vouchers.' }) +
        pfField('Password', 'an-pw', '', { type: 'password', required: true, autocomplete: 'new-password', hint: 'At least 8 characters.' }) +
      '</div>' +
      '<div class="pf-act"><button class="pf-btn" type="submit" id="an-btn">Create user</button></div>' +
    '</form></div>';
}

function admFilter(v) {
  /* Re-render would rebuild the box and drop the caret, so the list alone is
     redrawn and the input left exactly as the user is typing in it. */
  state.admQ = v;
  var host = document.querySelector('#content .ad-tbl');
  var card = host && host.closest('.card');
  if (!card) { render(); return; }
  var q = (v || '').toLowerCase();
  var shown = 0;
  ADM.users.forEach(function (u) {
    var tr = card.querySelector('tr[onclick*="' + u.id + '"]');
    if (!tr) return;
    var hit = admMatch(u, q);
    tr.style.display = hit ? '' : 'none';
    var drop = tr.nextElementSibling;
    if (drop && drop.classList.contains('ad-drop')) drop.style.display = hit ? '' : 'none';
    if (hit) shown++;
  });
  if (!shown) render();
}
function admToggle(id) { state.admOpen = state.admOpen === id ? null : id; render(); }
function admNewToggle() { state.admNew = !state.admNew; render(); }

function admSave(e, id) {
  e.preventDefault();
  var slot = 'admMsg-' + id, btn = document.getElementById('ae-btn-' + id);
  var name = pfVal('ae-name-' + id);
  if (!name) { pfNote(slot, 'err', 'Name cannot be empty.'); return false; }
  var roleEl = document.getElementById('ae-role-' + id);
  var actEl = document.getElementById('ae-active-' + id);
  var patch = {
    name: name,
    designation: pfVal('ae-desig-' + id),
    email: pfVal('ae-email-' + id),
    phone: pfVal('ae-phone-' + id),
  };
  /* A disabled control is not sent at all. Omitting the field is not the same as
     sending it unchanged: it keeps a self-edit from ever carrying a role or an
     is_active the server would have to refuse. */
  if (roleEl && !roleEl.disabled) patch.role = roleEl.value;
  if (actEl && !actEl.disabled) patch.is_active = actEl.value === 'yes';
  const rcEl = document.getElementById('ae-rc-' + id);
  if (rcEl) patch.regional_centre = rcEl.value;
  btn.disabled = true; btn.textContent = 'Saving…';
  pfNote(slot, '', '');
  pfSend('/api/admin/users/' + encodeURIComponent(id), 'PATCH', patch)
    .then(function (saved) {
      /* Adopt the server's record, then repaint the list so the row's role and
         status agree with what was stored. The notice is re-applied after the
         repaint, which would otherwise discard it. */
      if (saved) ADM.users = ADM.users.map(function (x) { return x.id === id ? Object.assign({}, x, saved) : x; });
      render();
      pfNote(slot, 'ok', 'Saved.');
    })
    .catch(function (err) {
      pfNote(slot, 'err', err.message);
      btn.disabled = false; btn.textContent = 'Save changes';
    });
  return false;
}

function admSetPw(e, id) {
  e.preventDefault();
  var slot = 'admPwMsg-' + id, btn = document.getElementById('ae-pwbtn-' + id);
  var pw = pfVal('ae-pw-' + id), pw2 = pfVal('ae-pw2-' + id);
  if (!pw || !pw2) { pfNote(slot, 'err', 'Fill in both fields.'); return false; }
  if (pw !== pw2) { pfNote(slot, 'err', 'The two passwords do not match.'); return false; }
  if (pw.length < 8) { pfNote(slot, 'err', 'The password must be at least 8 characters.'); return false; }
  btn.disabled = true; btn.textContent = 'Saving…';
  pfNote(slot, '', '');
  pfSend('/api/admin/users/' + encodeURIComponent(id) + '/password', 'POST', { password: pw })
    .then(function () {
      ['ae-pw-' + id, 'ae-pw2-' + id].forEach(function (f) {
        var el = document.getElementById(f); if (el) el.value = '';
      });
      pfNote(slot, 'ok', 'Password set. Pass it to the user yourself — it is not sent to them.');
    })
    .catch(function (err) { pfNote(slot, 'err', err.message); })
    .then(function () { btn.disabled = false; btn.textContent = 'Set password'; });
  return false;
}

function admCreate(e) {
  e.preventDefault();
  var btn = document.getElementById('an-btn');
  var body = {
    username: pfVal('an-user'),
    name: pfVal('an-name'),
    designation: pfVal('an-desig'),
    email: pfVal('an-email'),
    phone: pfVal('an-phone'),
    role: (document.getElementById('an-role') || {}).value || 'analyst',
    regional_centre: (document.getElementById('an-rc') || {}).value || '',
    password: pfVal('an-pw'),
  };
  if (!body.username || !body.name) { pfNote('admNewMsg', 'err', 'Username and name are both required.'); return false; }
  if (body.password.length < 8) { pfNote('admNewMsg', 'err', 'The password must be at least 8 characters.'); return false; }
  btn.disabled = true; btn.textContent = 'Creating…';
  pfNote('admNewMsg', '', '');
  pfSend('/api/admin/users', 'POST', body)
    .then(function () {
      state.admNew = false;
      /* Refetch rather than push the new record on: the list carries resolved
         module access per user, which only the server can work out. */
      admLoadUsers(true);
    })
    .catch(function (err) {
      pfNote('admNewMsg', 'err', err.message);
      btn.disabled = false; btn.textContent = 'Create user';
    });
  return false;
}

/* ---- Roles & Access ------------------------------------------------------- */

function viewAdminAccess() {
  if (!isSuperAdmin()) return admDenied();
  admLoadUsers();
  var head = admHead('Roles & Access',
    'Which panels each user may open. Turning one off removes it on their next request, not merely from their menu.') + admTabs('access');
  if (ADM.err) return head + admError(ADM.err);
  if (!ADM.users) return head + admBusy('users');

  var body = ADM.users.map(function (u) {
    var open = state.accOpen === u.id;
    var lock = admIsAdminRole(u.role);
    var mods = u.modules || {};
    var n = ADM_MODULES.filter(function (m) { return m.r ? mods[m.k] === true : mods[m.k] !== false; }).length;
    return '<tr class="ad-row' + (open ? ' open' : '') + '" onclick="accToggle(' + jstr(u.id) + ')">' +
      '<td><div class="ad-nm"><span class="chev' + (open ? ' open' : '') + '">' + (open ? '▾' : '▸') + '</span>' +
        '<span style="min-width:0"><b>' + esc(u.name || u.username) + '</b>' +
        '<div class="un">' + esc(u.username) + '</div></span></div></td>' +
      '<td>' + esc(pfRoleLabel(u.role)) + '</td>' +
      '<td>' + (lock
        ? '<span class="ad-pill on"><i></i>Every panel</span>'
        : (n === ADM_MODULES.length
            ? '<span class="ad-pill on"><i></i>All ' + n + '</span>'
            : '<span class="ad-pill off"><i></i>' + n + ' of ' + ADM_MODULES.length + '</span>')) + '</td></tr>' +
      (open ? '<tr class="ad-drop"><td colspan="3" onclick="event.stopPropagation()">' + admAccessEditor(u, lock) + '</td></tr>' : '');
  }).join('');

  return head +
    '<div class="card" style="padding:0;overflow:hidden"><div class="tscroll"><table class="dt ad-tbl"><thead><tr>' +
      '<th>User</th><th>Role</th><th>Panels allowed</th>' +
    '</tr></thead><tbody>' + body + '</tbody></table></div></div>';
}

function admAccessEditor(u, lock) {
  var mods = u.modules || {};
  var grid = ADM_MODULES.map(function (m) {
    /* A restricted panel is held only on an explicit true; every other panel is
       held unless explicitly false. Reading them the same way would show a
       restricted panel as already granted to everyone who has no stored row. */
    var on = m.r ? mods[m.k] === true : mods[m.k] !== false;
    return '<div class="ad-mod' + (on ? ' on' : '') + (lock ? ' lock' : '') + '" id="am-' + esc(u.id) + '-' + m.k + '"' +
      (lock ? '' : ' onclick="accFlip(' + jstr(u.id) + ',' + jstr(m.k) + ')"') +
      '><span class="ad-sw"></span><span class="nm">' + esc(m.t) +
      (m.r ? '<span class="ad-req">By request</span>' : '') + '</span></div>';
  }).join('');
  return '<div class="ad-edit">' +
    '<div class="ad-sec">Panels ' + esc(u.name || u.username) + ' may open</div>' +
    '<div id="accMsg-' + esc(u.id) + '"></div>' +
    (lock
      ? '<div class="pf-msg ok" style="margin-top:0">' + esc(pfRoleLabel(u.role)) +
        ' — always has every panel, whatever is stored. Change the role first if that should not be the case.</div>'
      : '') +
    '<div class="ad-mods" style="margin-top:10px">' + grid + '</div>' +
    (lock ? '' :
      '<div class="pf-act"><button class="pf-btn" id="acc-btn-' + esc(u.id) + '" onclick="accSave(' + jstr(u.id) + ')">Save access</button></div>') +
  '</div>';
}

function accToggle(id) { state.accOpen = state.accOpen === id ? null : id; render(); }
/* Flipped on the element, not in the data: a re-render would collapse the row
   the administrator is working in. The set is read back off the DOM on save. */
function accFlip(id, key) {
  var el = document.getElementById('am-' + id + '-' + key);
  if (el && !el.classList.contains('lock')) el.classList.toggle('on');
}
function accSave(id) {
  var slot = 'accMsg-' + id, btn = document.getElementById('acc-btn-' + id);
  var body = {};
  ADM_MODULES.forEach(function (m) {
    var el = document.getElementById('am-' + id + '-' + m.k);
    body[m.k] = !!(el && el.classList.contains('on'));
  });
  btn.disabled = true; btn.textContent = 'Saving…';
  pfNote(slot, '', '');
  pfSend('/api/admin/users/' + encodeURIComponent(id) + '/access', 'PUT', body)
    .then(function (saved) {
      if (saved) ADM.users = ADM.users.map(function (x) { return x.id === id ? Object.assign({}, x, { modules: saved }) : x; });
      /* If an administrator has just changed their OWN access, the sidebar is
         now out of date; /me is the only thing that can correct it. */
      if (ME && ME.id === id) { loadMe(); return; }
      pfNote(slot, 'ok', 'Access saved.');
    })
    .catch(function (err) { pfNote(slot, 'err', err.message); })
    .then(function () {
      if (!btn.isConnected) return;
      btn.disabled = false; btn.textContent = 'Save access';
    });
}

/* ---- User Logs ------------------------------------------------------------ */

const LOG_EV = {
  success: { t: 'Signed in',  g: '✓' },
  failed:  { t: 'Failed',     g: '✕' },
  blocked: { t: 'Blocked',    g: '!' },
  logout:  { t: 'Signed out', g: '→' },
};
function viewAdminLogs() {
  if (!isSuperAdmin()) return admDenied();
  admLoadLogs();
  var head = admHead('User Logs', 'Who reached the platform, when, and from where. Refused attempts are kept as well as successful ones.') + admTabs('logs');
  if (ADM.logsErr) return head + admError(ADM.logsErr);
  if (!ADM.logs) return head + admBusy('the sign-in log');

  var ev = ADM.logs;
  var count = function (k) { return ev.filter(function (e) { return e.outcome === k; }).length; };
  var people = {};
  ev.forEach(function (e) { if (e.outcome === 'success') people[e.user_id || e.username] = 1; });

  var chip = function (v, l) {
    return '<button class="fchip' + ((state.logOutcome || '') === v ? ' on' : '') + '" onclick="logSetOutcome(' + jstr(v) + ')">' + esc(l) + '</button>';
  };
  var dchip = function (v, l) {
    return '<button class="fchip' + ((state.logDays || '') === v ? ' on' : '') + '" onclick="logSetDays(' + jstr(v) + ')">' + esc(l) + '</button>';
  };

  var body = ev.map(function (e) {
    var k = LOG_EV[e.outcome] || { t: e.outcome, g: '·' };
    var known = !!e.name;
    return '<tr>' +
      '<td class="lg-when" style="white-space:nowrap"><b>' + esc(admWhen(e.at)) + '</b>' +
        '<span class="ago">' + esc(admAgo(e.at)) + '</span></td>' +
      '<td><b>' + esc(known ? e.name : e.username) + '</b>' +
        (known ? '<div class="un" style="font-size:11px;color:var(--text-muted)">' + esc(e.username) + '</div>'
               : '<div class="un" style="font-size:11px;color:var(--text-muted)">No such account</div>') + '</td>' +
      '<td>' + (e.role ? esc(pfRoleLabel(e.role)) : '<span class="muted">—</span>') + '</td>' +
      '<td><span class="lg-ev ' + esc(e.outcome) + '"><i>' + k.g + '</i>' + esc(k.t) + '</span></td>' +
      '<td class="lg-ip">' + (e.ip ? esc(e.ip) : '<span class="muted">—</span>') + '</td></tr>';
  }).join('');

  var table = ev.length
    ? '<div class="tscroll"><table class="dt ad-tbl"><thead><tr>' +
        '<th>When (IST)</th><th>User</th><th>Role</th><th>Event</th><th>From</th>' +
      '</tr></thead><tbody>' + body + '</tbody></table></div>'
    : '<div class="dt-empty"><div class="e-ic">🕘</div><div class="e-t">Nothing recorded for this filter</div>' +
      '<div class="e-s">Sign-ins have been recorded since this feature was installed; anything before that is not in the log.</div></div>';

  return head +
    '<div class="lg-sum">' +
      '<div class="lg-card"><div class="k">Sign-ins</div><div class="v" style="color:var(--good)">' + count('success') + '</div></div>' +
      '<div class="lg-card"><div class="k">Failed attempts</div><div class="v" style="color:' + (count('failed') ? 'var(--critical)' : 'var(--text-muted)') + '">' + count('failed') + '</div></div>' +
      '<div class="lg-card"><div class="k">Blocked accounts</div><div class="v" style="color:' + (count('blocked') ? 'var(--serious)' : 'var(--text-muted)') + '">' + count('blocked') + '</div></div>' +
      '<div class="lg-card"><div class="k">People seen</div><div class="v">' + Object.keys(people).length + '</div></div>' +
    '</div>' +
    '<div class="filterbar">' +
      dchip('1', 'Today') + dchip('7', 'Last 7 days') + dchip('30', 'Last 30 days') + dchip('', 'All time') +
      '<span style="width:10px"></span>' +
      chip('', 'Everything') + chip('success', 'Sign-ins') + chip('failed', 'Failed') + chip('blocked', 'Blocked') + chip('logout', 'Sign-outs') +
      '<div class="tools"><button class="btn" onclick="logExport()">Export CSV</button></div>' +
    '</div>' +
    '<div class="card" style="padding:0;overflow:hidden">' + table + '</div>';
}
function logSetOutcome(v) { state.logOutcome = v; admLoadLogs(true); }
function logSetDays(v) { state.logDays = v; admLoadLogs(true); }
function logExport() {
  var rows = [['When (IST)', 'Username', 'Name', 'Role', 'Event', 'From']];
  (ADM.logs || []).forEach(function (e) {
    rows.push([admWhen(e.at), e.username, e.name || '', e.role ? pfRoleLabel(e.role) : '',
               (LOG_EV[e.outcome] || {}).t || e.outcome, e.ip || '']);
  });
  var csv = rows.map(function (r) {
    return r.map(function (c) { return '"' + String(c == null ? '' : c).replace(/"/g, '""') + '"'; }).join(',');
  }).join('\r\n');
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = 'sai-user-logs-' + istDateStr(0) + '.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
}

/* ============================================================================
   PER-USER MODULE ACCESS
   ============================================================================
   The signed-in user's allowed panels come from GET /api/auth/me, which resolves
   them from the database on every request. The Super Admin's toggles are the
   source of truth; this file only obeys them.

   Honest scope: this hides panels. It is not a data boundary, and the
   architecture cannot make it one — the dashboard is a single document that
   loads the whole dataset into the browser and reads the sheet client-side, so
   anyone with developer tools can still reach figures for a panel they are not
   shown. Enforcing that properly would mean serving each panel's data from the
   server per request, which is a different platform. What IS enforced
   server-side is everything that mutates: /api/admin/* refuses non-administrators
   outright, and a deactivated account is refused at login and on every request.

   Until /me answers, nothing is hidden: a network hiccup must not blank the menu
   for a user who is entitled to it. Denial only ever comes from a real answer. */
var ME = null;

function moduleAllowed(v) {
  /* Everyone has a profile. It is not a module an administrator grants, so it is
     never in ME.modules and must not be caught by the lookup below. */
  if (v === 'profile') return true;
  /* Administration answers to the role, not to the module grants — those panels
     are not in MODULES, so ME.modules will never speak for them.
     Note this is hidden until /me answers, the opposite default to the panels
     below, and deliberately so: showing every user an Administration menu for a
     moment is a worse failure than showing an administrator theirs a moment
     late. Nothing is protected by it either way — the server refuses. */
  if (ADMIN_VIEWS.indexOf(v) >= 0) return isSuperAdmin();
  /* A restricted panel is withheld until it is granted, which reverses the rule
     below in both halves: an administrator always holds it, and everyone else
     needs an explicit true — not merely the absence of a false. That also means
     it stays hidden until /me answers, which is the right way round here: a
     panel that flashes into the menu and vanishes reads as a fault, and one that
     nobody has been given yet has nothing to lose by arriving a moment late. */
  if (RESTRICTED_VIEWS.indexOf(v) >= 0) {
    return isSuperAdmin() || !!(ME && ME.modules && ME.modules[v] === true);
  }
  if (!v || !ME || !ME.modules) return true;
  return ME.modules[v] !== false;
}

/* Mirrors ADMIN_ROLES in @efip/shared. This document is served as static HTML
   and cannot import from the workspace, so the list is repeated by hand - the
   one place in the platform where it is. Keep the two in step: the server is
   what actually refuses, so a role missing here only hides a link the holder is
   entitled to, and a role wrongly added here shows a link that 403s. */
function isSuperAdmin() {
  return !!(ME && (ME.role === 'super_admin' || ME.role === 'admin'));
}

/* Landing on a panel that is no longer permitted moves to the first that is,
   rather than showing an empty frame. */
function firstAllowedView() {
  for (var i = 0; i < NAV.length; i++) {
    var it = NAV[i];
    if (it.v && !viewHidden(it.v) && moduleAllowed(it.v)) return it.v;
  }
  return null;
}

function applyAccess() {
  if (!ME || !ME.modules) return;
  if (!moduleAllowed(state.view)) {
    var next = firstAllowedView();
    if (next) state.view = next;
  }
  renderAccountLinks();
  render();
}

/* The foot of the sidebar: everything about the person signed in rather than
   about the scheme. My Profile lives here now instead of in the panel list, so
   it sits next to Sign out where someone goes looking for it, and the list above
   is one group shorter.
   Driven off the NAV entries marked foot:1 rather than hard-coded markup, so the
   label, icon and access rule stay defined in exactly one place. Called from
   renderNav() on every navigation, which is what keeps .active correct. */
function renderAccountLinks() {
  var slot = document.getElementById('acctLinks');
  if (!slot) return;
  slot.innerHTML = NAV.filter(function (it) {
    return it.foot && !viewHidden(it.v) && moduleAllowed(it.v);
  }).map(function (it) {
    var active = state.view === it.v ? ' active' : '';
    return '<button class="navitem' + active + '" onclick="go(\'' + it.v + '\')">' +
      svgIcon(it.i) + it.t + '</button>';
  }).join('');
}

function loadMe() {
  return fetch('/api/auth/me', { credentials: 'include' })
    .then(function (r) {
      return r.ok ? r.json() : null;
    })
    .then(function (u) {
      if (!u) return;
      ME = u;
      applyAccess();
    })
    .catch(function () {
      /* Offline or a blip: leave the menu exactly as it is. */
    });
}

/* Deep link: /profile now redirects here as /?panel=profile, so an old
   bookmark still lands on the panel rather than the default view. Only names a
   view that exists and is visible, so a hand-typed value cannot open a hidden
   panel or leave the app on a blank frame. */
(function(){
  var m = /[?&]panel=([A-Za-z]+)/.exec(location.search);
  var v = m && m[1];
  if (v && NAV.some(function(it){ return it.v === v; }) && !viewHidden(v)) state.view = v;
})();
renderNav(); refreshSyncFacts(); renderAccountLinks(); render(); syncStart(); gsInit(); loadMe();
</script>
