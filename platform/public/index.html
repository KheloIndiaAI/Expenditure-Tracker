/* ============================================================
   MOBILE HARDENING LAYER  (appended — phones & small tablets only)
   Every rule below lives inside a media query, so the desktop
   experience is byte-for-byte unchanged. Ordered widest → narrowest.
   ============================================================ */

/* ---- Tablet / large phone (<=980px): the sidebar-drawer breakpoint ---- */
@media(max-width:980px){
  /* Stop wide children (tables, charts) from creating a page-wide
     horizontal scroll. `clip` (not `hidden`) so it doesn't turn body
     into a scroll container and break the sticky topbar. */
  html,body{overflow-x:clip}
  .app,.main,.content{min-width:0;max-width:100%}

  /* Charts stack vertically and become fluid instead of fixed-width */
  .chartwrap{flex-direction:column;align-items:stretch;gap:12px}
  .chartwrap .cc{flex:1 1 auto;width:100%;max-width:360px;margin:0 auto}
  .chart-svg{width:100%;height:auto;max-width:100%}

  /* Wide "document format" summary tables scroll within their own panel
     rather than pushing the whole page sideways */
  .saif-inner,.saif-page{overflow-x:auto;-webkit-overflow-scrolling:touch}

  /* Roomier tap target for every drawer nav item */
  .navitem{padding:11px 12px;font-size:15px}

  /* Momentum scrolling + slim scrollbars on all horizontal table wrappers */
  .tscroll{scrollbar-width:thin}
  .tscroll::-webkit-scrollbar{height:6px}
  .tscroll::-webkit-scrollbar-thumb{background:rgba(16,24,40,.22);border-radius:3px}
}

/* ---- Phone (<=640px) ---- */
@media(max-width:640px){
  /* Thumb-friendly controls (WCAG ~44px target where practical) */
  .btn,.fchip,.chip-sel{min-height:40px;display:inline-flex;align-items:center}
  .toggle button{padding:8px 14px;font-size:13px}
  .card-hd .link{padding:4px 0;display:inline-block}
  .hamburger{width:42px;height:42px}
  .navitem{padding:12px}

  /* Keep table cells legible while horizontally scrolling */
  table.dt th,table.dt td{padding:9px 10px}

  /* Hover tooltips are pointer-only; hide on touch so they can't stick. The
     same content is reachable by tapping the card — see .tipsheet below. */
  #tip{display:none!important}

  /* ---- Card detail sheet -------------------------------------------------
     A KPI card whose detail is a tap away says so: it takes a pointer, an
     active state and a chevron in its corner, so it does not look like the
     inert cards beside it.                                                  */
  .kpi[data-tip]{cursor:pointer;position:relative;-webkit-tap-highlight-color:transparent}
  .kpi[data-tip]:active{background:var(--bg-page)}
  .kpi[data-tip]::after{
    content:'';position:absolute;top:14px;right:13px;
    width:0;height:0;border-left:5px solid var(--text-muted);
    border-top:4px solid transparent;border-bottom:4px solid transparent;opacity:.5}

  .tipsheet{
    display:block;position:fixed;left:0;right:0;bottom:0;z-index:65;
    padding:0 16px calc(18px + env(safe-area-inset-bottom));
    background:var(--bg-surface);border-top:1px solid var(--border);
    border-radius:18px 18px 0 0;box-shadow:var(--elev-3);
    max-height:82vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
    transform:translateY(101%);transition:transform .24s cubic-bezier(.4,0,.2,1);
    visibility:hidden}
  body.tip-open .tipsheet{transform:translateY(0);visibility:visible}
  /* Set larger than the hover card: a tooltip is glanced at, a sheet is read. */
  .tipsheet-b{font-size:13.5px;line-height:1.55;color:var(--text-secondary);padding-bottom:4px}
  .tipsheet-b b{color:var(--text-primary)}
  .tipsheet-b .tipbd{font-size:13px}
  .tipsheet-b .tipbd td{padding:3px 0}
  .tipsheet-b .tipbd-h{font-size:13.5px;margin:12px 0 6px;padding-top:10px}

  /* Action tools wrap to a full row instead of crushing against the edge */
  .tools{margin-left:0;width:100%;justify-content:flex-start;flex-wrap:wrap}
  .filterbar{gap:8px}
}

/* ---- Phone (<=640px): dense tables become one card per row ----------------
   Sideways scrolling hides the columns a reader opens the page for (Balance,
   Unspent sit furthest right). Each row instead becomes a self-contained card:
   the first cell is its title, every other cell prints its column heading
   beside the value. `labelTableCells()` supplies those headings at render time.
   The component tree is excluded — see the note on that function.            */
@media(max-width:640px){
  .tscroll.cardify{overflow-x:visible}
  .cardify table.dt{display:block;width:100%;min-width:0}
  .cardify table.dt thead{display:none}
  .cardify table.dt tbody,.cardify table.dt tfoot{display:block}

  .cardify table.dt tr{
    display:block;background:var(--bg-surface);border:1px solid var(--border);
    border-radius:var(--radius-md);padding:11px 13px;margin:0 0 10px;
    box-shadow:var(--elev-1)}
  .cardify table.dt tr:hover td{background:transparent}

  /* Every cell after the first is a heading/value line. Percentage column
     widths (the Attention Centre pins all seven) have no meaning once the row
     is a card, so they are released here. */
  .cardify table.dt td{
    display:flex;align-items:baseline;justify-content:space-between;gap:14px;
    width:auto;min-width:0;padding:5px 0;border:0;
    border-bottom:1px solid var(--border-subtle);text-align:right}
  .cardify table.dt td:last-child{border-bottom:0}
  .cardify table.dt td::before{
    content:attr(data-label);flex:none;text-align:left;font-size:10.5px;
    letter-spacing:.04em;text-transform:uppercase;font-weight:600;
    color:var(--text-muted)}

  /* The first cell is the card's title and runs the full width. */
  .cardify table.dt td:first-child{
    display:block;text-align:left;font-size:14px;font-weight:600;
    width:auto;min-width:0;padding:0 0 9px;margin-bottom:5px;
    border-bottom:1px solid var(--border)}
  .cardify table.dt td:first-child::before{display:none}
  /* A title cell that is itself prose stays a title, not a stacked paragraph. */
  .cardify table.dt td:first-child.dt-long{
    font-size:14px;font-weight:600;color:var(--text-primary);padding-top:0}

  /* Prose gets the full width beneath its heading instead of being squeezed
     into a right-hand column a few characters wide. */
  .cardify table.dt td.dt-long{
    display:block;text-align:left;padding-top:7px;
    font-size:12.5px;line-height:1.45;color:var(--text-secondary)}
  .cardify table.dt td.dt-long::before{display:block;margin-bottom:4px}

  /* ---- Narrations are set in full inside a card ---------------------------
     Both places that carry a release's narration clamp it on a desktop row —
     to three lines in the Attention Centre, two in the voucher list — because
     there it shares a cell with four money columns. A card has the whole width
     and nothing competing for it, so clamping only hid the half of the sentence
     that says what the money was actually for. Note it is `display:block` that
     lifts the clamp: -webkit-line-clamp only bites inside a -webkit-box.
     Both are set identically, so the same sentence reads the same way wherever
     it appears.                                                             */
  .cardify .agc-det,table.txcards .txnar{
    display:block;max-width:none;overflow:visible;
    font-size:12.5px;line-height:1.45;color:var(--text-secondary);
    overflow-wrap:anywhere}

  /* Cells carrying nothing shouldn't leave an empty line behind. */
  .cardify table.dt td:empty,.cardify table.dt td.dt-extra:empty{display:none}

  /* Drill-downs, group headers and sub-tables keep their own layout. */
  .cardify table.dt tr.dt-span{
    display:block;padding:0;margin:0 0 9px;border:0;background:transparent;box-shadow:none}
  .cardify table.dt tr.dt-span td{display:block;padding:0;border:0;text-align:left}
  .cardify table.dt tr.dt-span td::before{display:none}

  /* The totals row is the one card meant to stand out, and stays in view. */
  .cardify table.dt tfoot.dt-foot tr{
    background:var(--primary-subtle);border-color:var(--primary);
    position:sticky;bottom:8px;box-shadow:var(--elev-2)}
  .cardify table.dt tfoot.dt-foot td:first-child{border-bottom-color:var(--primary)}

  /* ---- The component tree as cards -------------------------------------
     Its rows are a hierarchy, not records, so it cannot use the layout above:
     the expander has to stay tappable and a sub-vertical has to keep looking
     like a child of the component above it. Each row becomes three bands —
     the name, the utilisation, then the three figures side by side — and the
     nesting is carried by an inset rather than by indentation, which a phone
     has no width to spare for.                                              */
  .tscroll.treecards{overflow-x:visible}
  .treecards table.dt.tree{display:block;width:100%;min-width:0}
  .treecards table.dt.tree thead{display:none}
  .treecards table.dt.tree tbody{display:block}

  .treecards table.dt.tree tr{
    display:grid;grid-template-columns:1fr 1fr 1fr;
    grid-template-areas:"nm nm nm" "ut ut ut" "as ex ba";
    gap:9px 10px;margin:0 0 9px;padding:11px 12px;
    background:var(--bg-surface);border:1px solid var(--border);
    border-radius:var(--radius-md);box-shadow:var(--elev-1)}
  .treecards table.dt.tree tr:not(.det)>td{
    display:block;padding:0;border:0;background:transparent;
    white-space:normal;min-width:0;width:auto;text-align:left}
  .treecards table.dt.tree td:nth-child(1){grid-area:nm}
  .treecards table.dt.tree td:nth-child(2){grid-area:as}
  .treecards table.dt.tree td:nth-child(3){grid-area:ex}
  .treecards table.dt.tree td:nth-child(4){grid-area:ba}
  /* The totals row ends in a spacer cell left over from the table layout. It
     has no named area, so left alone the grid would auto-place it and open a
     stray fourth band under the figures. */
  .treecards table.dt.tree tr:not(.det)>td:nth-child(n+6){display:none}

  /* Assignment / Expenditure / Balance carry their heading above the figure. */
  .treecards table.dt.tree td:nth-child(n+2):nth-child(-n+4){
    font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums}
  .treecards table.dt.tree td:nth-child(n+2):nth-child(-n+4)::before{
    content:attr(data-label);display:block;font-size:9.5px;letter-spacing:.04em;
    text-transform:uppercase;font-weight:600;color:var(--text-muted);margin-bottom:2px}

  /* Utilisation reads as a percentage followed by a bar across the card. */
  .treecards table.dt.tree tr:not(.det)>td:nth-child(5){
    grid-area:ut;display:flex;align-items:center;gap:10px;
    font-size:12px;font-weight:700;color:var(--text-secondary)}
  .treecards table.dt.tree td:nth-child(5) .ubar{
    flex:1;width:auto;max-width:none;margin:0;height:7px}

  /* The name wraps in full rather than being clipped to a column width. */
  .treecards table.dt.tree td:nth-child(1) .nm{
    max-width:none;white-space:normal;overflow:visible;text-overflow:clip;
    align-items:flex-start;gap:7px;font-size:13.5px;color:var(--text-primary)}
  .treecards table.dt.tree .vname{font-weight:700}
  .treecards table.dt.tree .subname{padding-left:0}
  .treecards table.dt.tree .chev{margin:1px 0 0}

  /* ---- Sections are the navigation ---------------------------------------
     Each wears its own colour from SECTCOL — the same one it carries on the
     classification pill elsewhere — as a tinted card, and that colour runs
     down the left edge of everything belonging to it, so a component is
     placeable at a glance without reading back up to the heading.          */
  .treecards table.dt.tree tr.sec-hidden{display:none}

  .treecards table.dt.tree tr.secrow{
    background:var(--scbg);border-color:var(--scbd);box-shadow:none;
    cursor:pointer;margin-bottom:8px;-webkit-tap-highlight-color:transparent}
  .treecards table.dt.tree tr.secrow.sec-open{margin-bottom:10px}
  .treecards table.dt.tree tr.secrow:active{background:var(--scbg);filter:brightness(.97)}
  .treecards table.dt.tree tr.secrow>td:nth-child(1){
    display:flex;align-items:center;gap:8px;
    font-size:11.5px;font-weight:800;text-transform:uppercase;
    letter-spacing:.05em;color:var(--sc)}
  /* The chevron is drawn rather than marked up, so the desktop row — which is
     not a control — gains nothing it should not have. */
  .treecards table.dt.tree tr.secrow>td:nth-child(1)::before{
    content:'';flex:none;width:0;height:0;
    border-left:5.5px solid currentColor;
    border-top:4.5px solid transparent;border-bottom:4.5px solid transparent;
    transition:transform .18s ease;transform-origin:35% 50%}
  .treecards table.dt.tree tr.secrow.sec-open>td:nth-child(1)::before{transform:rotate(90deg)}
  .treecards table.dt.tree tr.secrow>td:nth-child(5) .ubar>span{background:var(--sc)}

  /* Components and sub-verticals sit inside their section's colour, each a
     lighter tint of it than the level above - see paintSection. The left edge
     steps down with the fill and the indent grows, so three cues agree on the
     same answer instead of one carrying it alone. */
  .treecards table.dt.tree tr.comprow{
    margin-left:10px;background:var(--scbg2);
    border-color:var(--scbd3);border-left:3px solid var(--scbd2)}
  .treecards table.dt.tree tr.subrow{
    margin-left:22px;background:var(--scbg3);
    border-color:var(--scbd3);border-left:2px solid var(--scbd3)}
  .treecards table.dt.tree tr.comprow.open,
  .treecards table.dt.tree tr.subrow.open{
    border-color:var(--sc);border-left-color:var(--sc);
    box-shadow:var(--elev-2)}
  .treecards table.dt.tree tr.comprow.open>td:nth-child(1),
  .treecards table.dt.tree tr.subrow.open>td:nth-child(1){color:var(--sc)}
  .treecards table.dt.tree tr.comprow>td:nth-child(5) .ubar>span,
  .treecards table.dt.tree tr.subrow>td:nth-child(5) .ubar>span{background:var(--sc)}

  /* The drill-down is the CONTENTS of the row above, not another rung: it takes
     the faintest tint of the same hue and a hairline, so the ladder reads
     section - component - sub-vertical and then stops. */
  .treecards table.dt.tree tr.det .grp-drop{
    background:var(--scbg3);border:1px solid var(--scbd3)}
  /* The opened detail keeps its own layout, tucked under the row it belongs to. */
  .treecards table.dt.tree tr.det{
    display:block;margin:-6px 0 10px 22px;padding:0;
    background:transparent;border:0;box-shadow:none}
  .treecards table.dt.tree tr.det>td{
    display:block;padding:11px 12px;
    border:1px solid var(--scbd);border-top:0;border-left:3px solid var(--sc);
    border-radius:0 0 var(--radius-md) var(--radius-md)}

  /* The grand total is no longer pinned to the bottom of the screen. A card
     floating over the list cost a strip of every scroll and repeated what the
     figures above already add up to; it now simply ends the list. */
  .treecards table.dt.tree tr.total{
    background:var(--primary-subtle);border-color:var(--primary);margin-top:2px}
  .treecards table.dt.tree tr.total>td:nth-child(1){
    font-size:12px;font-weight:800;letter-spacing:.04em}

  /* ---- The drill-down that opens inside a row -----------------------------
     Same five columns as the tree, so it gets the same three-band card, one
     per centre. It is the innermost thing on the page, so it stays flatter:
     no shadow, a lighter border, and the height cap lifted, since a phone
     scrolls the page rather than a 290px box inside it.                     */
  /* Every selector below is scoped with `>` to this wrapper's OWN table. An
     expanded row nests a second table (the voucher list) inside a cell, and as
     descendant selectors these rules reached it too - imposing a three-column
     grid built for a five-cell centre row onto its six cells, which collapsed
     every one of them to zero width and printed the narration one letter per
     line. The child combinators are what keep the two tables apart. */
  .usage.usagecards{max-height:none;overflow:visible;border:0;box-shadow:none;
    background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none}
  .usage.usagecards > table{display:block;width:100%}
  .usage.usagecards > table > thead{display:none}
  .usage.usagecards > table > tbody{display:block}
  .usage.usagecards > table > tbody > tr:not(.txrow){
    display:grid;grid-template-columns:1fr 1fr 1fr;
    grid-template-areas:"nm nm pct" "as ex ba";
    gap:7px 10px;margin:0 0 8px;padding:11px 12px;
    background:var(--bg-surface);border:1px solid var(--border);border-radius:12px}
  /* Rows that state a utilisation get the split bar between name and figures,
     so the card matches the centre card it was opened from. */
  .usage.usagecards > table > tbody > tr.ub{grid-template-areas:"nm nm pct" "bar bar bar" "as ex ba"}
  .usage.usagecards > table > tbody > tr.ub::after{
    content:'';grid-area:bar;height:9px;border-radius:5px;
    background:linear-gradient(90deg,
      var(--good) 0 calc(var(--up,0)*1%),
      var(--serious) calc(var(--up,0)*1%) 100%)}
  .usage.usagecards > table > tbody > tr:not(.txrow):hover{background:var(--bg-surface)}
  .usage.usagecards > table > tbody > tr:not(.txrow)>td,
  .usage.usagecards > table > tbody > tr:not(.txrow):hover>td{
    display:block;padding:0;border:0;background:transparent;
    text-align:left;vertical-align:baseline;white-space:normal}
  .usage.usagecards > table > tbody > tr:not(.txrow)>td:nth-child(1){
    grid-area:nm;font-size:13px;font-weight:600;color:var(--text-primary)}
  .usage.usagecards > table > tbody > tr:not(.txrow)>td:nth-child(2){grid-area:as}
  .usage.usagecards > table > tbody > tr:not(.txrow)>td:nth-child(3){grid-area:ex}
  .usage.usagecards > table > tbody > tr:not(.txrow)>td:nth-child(4){grid-area:ba}
  /* "Used" reads as a pill in the top-right corner rather than taking a column
     of its own, which would squeeze the three figures below. */
  .usage.usagecards > table > tbody > tr:not(.txrow)>td:nth-child(5){
    grid-area:pct;justify-self:end;align-self:start;
    padding:2px 9px;border-radius:20px;white-space:nowrap;
    background:var(--bg-page);color:var(--text-secondary);
    font-size:11px;font-weight:700;font-variant-numeric:tabular-nums}
  .usage.usagecards > table > tbody > tr:not(.txrow)>td:nth-child(n+2):nth-child(-n+4){
    font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums}
  .usage.usagecards > table > tbody > tr:not(.txrow)>td:nth-child(n+2):nth-child(-n+4)::before{
    content:attr(data-label);display:block;font-size:9px;letter-spacing:.03em;
    text-transform:uppercase;font-weight:600;color:var(--text-muted);margin-bottom:1px}
  /* The voucher list an expanded centre reveals keeps its own full-width layout. */
  .usage.usagecards > table > tbody > tr.txrow{display:block;margin:-5px 0 9px;padding:0;background:transparent}
  .usage.usagecards > table > tbody > tr.txrow>td,
  .usage.usagecards > table > tbody > tr.txrow:hover>td{
    display:block;padding:0;border:0;background:transparent}

  /* ---- The voucher list, deepest level of the drill-down ----------------- */
  /* Three nested panels each carry generous side padding. That reads well at
     desktop width and costs 56px of a 375px screen by the time the voucher list
     is reached, wrapping a narration at thirty characters a line. The drill-down
     keeps its indentation on a phone; it just gets a third as much of it. */
  .mdsd-drop{padding-left:8px;padding-right:8px}
  .grp-drop{padding-left:6px;padding-right:6px}
  table.txcards{display:block;width:100%;min-width:0}
  table.txcards thead{display:none}
  table.txcards tbody{display:block}
  table.txcards tbody tr{
    display:block;margin:0 0 7px;padding:9px 10px;
    background:var(--bg-surface);border:1px solid var(--border);border-radius:10px}
  table.txcards tbody td{
    display:flex;align-items:baseline;justify-content:space-between;gap:12px;
    width:auto;padding:3px 0;border:0;text-align:right;font-size:12.5px}
  table.txcards tbody td::before{
    content:attr(data-label);flex:none;text-align:left;font-size:9px;
    letter-spacing:.03em;text-transform:uppercase;font-weight:600;color:var(--text-muted)}
  /* The voucher line and its narration lead the card, full width. */
  table.txcards tbody td:first-child{
    display:block;text-align:left;padding:0 0 8px;margin-bottom:5px;
    border-bottom:1px solid var(--border-subtle);font-size:12.5px}
  table.txcards tbody td:first-child::before{display:none}
  table.txcards .txnar{margin-top:6px}
  /* A comment is prose, not a figure: the right-aligned label/value row every
     other cell uses would squeeze it into a column two words wide. */
  table.txcards tbody td.cmtcell{display:block;text-align:left;padding:5px 0 3px}
  table.txcards tbody td.cmtcell::before{display:block;margin-bottom:4px}
  table.txcards .txcmt{-webkit-line-clamp:6}
  /* The editor row carries a colspan, so labelTableCells leaves it unlabelled
     and it must not inherit the card padding meant for a data row. */
  table.txcards tbody tr.cmtrow{padding:0;border:0;background:none;margin:0 0 7px}
  table.txcards tbody tr.cmtrow td{display:block;text-align:left;padding:0}
  table.txcards tbody tr.cmtrow td::before{display:none}
  .cmt-act{flex-wrap:wrap}
  .cmt-act .pf-hint{margin-right:0;flex-basis:100%;order:-1}

  /* ---- The KPI band leads with one hero figure, then supporting numbers ---- */
  .kpi-grid,.kpi-grid.k3,.kpi-grid.k5{grid-template-columns:repeat(2,1fr);gap:10px}
  /* A two-card band stacks: half a phone's width is too narrow for a list of
     centre names and amounts to sit side by side with anything. */
  .kpi-grid.k2{grid-template-columns:1fr}
  .kpi-grid>.kpi:first-child{grid-column:1/-1}
  .kpi-grid>.kpi:first-child .val{font-size:30px;letter-spacing:-.02em}
  .kpi-grid>.kpi:first-child .kpi-ic{width:36px;height:36px}
  .kpi-grid>.kpi:first-child .kpi-ic svg{width:18px;height:18px}
}

/* ---- Filters bottom sheet (phones) --------------------------------------
   Five chips plus a select consume most of a phone's first screen and push the
   figures below the fold. They move into a sheet that slides up on demand; the
   trigger keeps the current state visible as a count (or "RC" when the
   Regional-Centres-only mode is on). Desktop never sees any of this: the
   trigger, header and sheet chrome are display:none outside this breakpoint. */
.filtbtn{display:none}
.sheet-hd{display:none}
.tabbar{display:none}
.tipsheet{display:none}
.sheet-backdrop{display:none;position:fixed;inset:0;background:rgba(16,24,40,.45);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:64}

@media(max-width:640px){
  /* A backdrop-filter on an ancestor makes position:fixed resolve against that
     ancestor instead of the viewport, which would trap the sheet inside the
     topbar. The phone topbar therefore uses a solid background rather than
     glass — also one less continuously-repainted layer while scrolling. */
  .topbar{backdrop-filter:none;-webkit-backdrop-filter:none;background:rgba(255,255,255,.98)}

  /* The topbar is a stacking context (sticky + z-index), so the sheet nested
     inside it cannot paint above anything the topbar itself sits below — the
     dimming backdrop included. Lifting the topbar while the sheet is open
     carries the sheet with it; it also keeps the trigger tappable to close. */
  body.filters-open .topbar{z-index:66}

  .filtbtn{
    display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 12px;
    border:1px solid var(--border);background:var(--bg-surface);border-radius:20px;
    font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text-secondary);
    cursor:pointer;flex:none}
  .filtbtn:hover,.filtbtn[aria-expanded="true"]{border-color:var(--primary);color:var(--primary)}
  .filtbtn-n{
    display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;
    border-radius:9px;background:var(--primary);color:#fff;font-size:10.5px;font-weight:700}
  .filtbtn-n.rc{background:var(--good)}
  .filtbtn-n.off{display:none}
  .sheet-backdrop.show{display:block}

  /* The chip row becomes the sheet body. */
  .topfilters{
    position:fixed;left:0;right:0;bottom:0;z-index:65;
    display:block;padding:0 16px calc(18px + env(safe-area-inset-bottom));
    background:var(--bg-surface);border-top:1px solid var(--border);
    border-radius:18px 18px 0 0;box-shadow:var(--elev-3);
    max-height:78vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
    transform:translateY(101%);transition:transform .24s cubic-bezier(.4,0,.2,1);
    visibility:hidden}
  body.filters-open .topfilters{transform:translateY(0);visibility:visible}

  .sheet-hd{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    position:sticky;top:0;z-index:1;margin:0 -16px 12px;padding:14px 16px 11px;
    background:var(--bg-surface);border-bottom:1px solid var(--border);
    border-radius:18px 18px 0 0;font-size:15px;font-weight:700}
  .sheet-done{
    border:0;background:transparent;color:var(--primary);font-family:inherit;
    font-size:14px;font-weight:600;cursor:pointer;padding:6px 2px;min-height:40px}

  /* Inside the sheet the controls stack full width and become tap targets. */
  .topfilters .chip-sel{display:flex;width:100%;justify-content:space-between;padding:10px 12px;margin-bottom:10px}
  .topfilters .chip-sel .muted{display:inline}
  .topfilters #filtSel{max-width:none;flex:1;font-size:16px;text-align:right}
  .topfilters .fchip{
    display:flex;width:100%;align-items:center;justify-content:flex-start;gap:6px;
    margin-bottom:8px;padding:12px 14px;border-radius:12px;font-size:14px;text-align:left}
  .topfilters .fchip .fchip-sub{margin-left:auto;opacity:.75}

  /* The sheet clears the tab bar rather than sitting under it. */
  .topfilters{padding-bottom:calc(80px + env(safe-area-inset-bottom))}

  /* ---- Tab bar: the four panels that carry the day, plus the drawer ------- */
  /* Sits above the page but below the drawer's dimming layer (55), so opening
     "More" — or the filter sheet — greys the bar out with everything else. */
  .tabbar{
    display:flex;position:fixed;left:0;right:0;bottom:0;z-index:54;
    background:var(--bg-surface);border-top:1px solid var(--border);
    box-shadow:0 -2px 14px rgba(16,24,40,.08);
    padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .tab{
    flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:6px 2px 4px;border:0;background:transparent;cursor:pointer;
    font-family:inherit;font-size:10.5px;font-weight:600;line-height:1.2;
    color:var(--text-muted);-webkit-tap-highlight-color:transparent}
  .tab-ic{position:relative;display:grid;place-items:center;width:26px;height:26px}
  .tab-ic svg{width:21px;height:21px}
  .tab-t{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tab.on{color:var(--primary)}
  .tab-badge{
    position:absolute;top:-4px;left:52%;min-width:16px;height:16px;padding:0 4px;
    border-radius:8px;background:var(--critical);color:#fff;
    font-size:9.5px;font-weight:700;display:grid;place-items:center;
    border:1.5px solid var(--bg-surface)}

  /* Give the page a floor so the bar never covers the last row of figures. */
  .content{padding-bottom:calc(86px + env(safe-area-inset-bottom))}

  /* A totals row pinned to the bottom must clear the bar too. */
  .cardify table.dt tfoot.dt-foot tr{bottom:calc(78px + env(safe-area-inset-bottom))}
}

/* ---- Small phones (<=380px) ---- */
@media(max-width:380px){
  .content{padding:12px 10px 40px}
  .kpi{padding:12px 11px 10px}
  .kpi .val{font-size:20px}
  .kpi .val.sm{font-size:17px}
  .pagehead h1{font-size:18px}
  .pagehead .sub{font-size:12.5px}
  .brand .bt{font-size:13px}
  .brand .bs{font-size:10px}
  .card{padding:12px 11px}
  table.dt{font-size:12.5px}
  .fchip{padding:6px 9px;font-size:11px}
}

/* ---- Landscape phones: keep the drawer pattern, reclaim vertical space ---- */
@media(max-width:980px) and (orientation:landscape) and (max-height:520px){
  .topbar{padding-top:7px;padding-bottom:7px}
  .content{padding-top:12px}
  .kpi-grid,.kpi-grid.k3{grid-template-columns:repeat(3,1fr)}
}

/* ---- Honour reduced-motion preferences (accessibility) ---- */
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}
</style>

/* ---- KI Infra (States/UTs) from the sheet ----------------------------------
   The block sits at the foot of the summary tab the sync already fetches, so it
   costs no extra request. It is located by its "KI Infra (States/UTs)" label
   rather than a fixed row number: rows get inserted above it, and a hard-coded
   offset would silently read the wrong cells the first time that happened.

   A data row is one that carries a serial number in column A and a name in
   column B; the run ends at the "Total" row, whose figures are kept to check
   the rows against. The three money columns are NOT assumed to sit at a fixed
   offset - see mdsdMoneyCols for why, and how they are found.

   MONEY IS NEVER ROUNDED INTO SHAPE HERE. Every figure is read as whole rupees
   straight from the cell — no percentage is turned back into an amount, and no
   total is derived from a rounded part. The grand total the platform shows is
   the sum of the rows, so it cannot drift from them; the sheet's own printed
   total is then checked against that sum by syncValidate. Rounding appears only
   at display time, where crShort renders crore to two decimals. */
function mdsdKey(s) { return String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); }
function mdsdTitle(s) {
  return String(s || '').toLowerCase().replace(/\b[a-z]/g, function (c) { return c.toUpperCase(); });
}

/* Which columns carry the money. They used to start at C; a spacer column has
   since been inserted between the name and the figures and they now start at D.
   Reading them at a fixed offset broke the moment that happened - the same
   failure the row search was written to avoid, one axis over - and it broke
   loudly: every row failed "assigned less expenditure does not equal unspent",
   which rejects the whole candidate, so the platform stopped updating AT ALL
   behind a "sync failed" pill until someone read the sheet by hand.

   The header labels cannot be used to find them. Google's endpoint types a
   column from its data, so the text sitting above a column of numbers comes
   back empty and "Limit Assigned" is simply not there to match on.

   What the block does carry, on every row and on its Total, is its own
   arithmetic: assigned - expenditure = unspent. The three columns that satisfy
   it ARE the money columns, so they are found by that rather than assumed, and
   a spacer inserted tomorrow costs nothing. The 1-rupee tolerance is the same
   formatting allowance used everywhere else here.

   EVERY reconciling triple is collected, not just the first, and the block is
   only read when there is exactly one. A sheet can carry a second self-
   consistent triple - "Sanction Order Amount / Released / Balance to release"
   beside the limit figures would be one - and taking the leftmost by array order
   would publish that instead, quietly, with the platform none the wiser. Where
   more than one reconciles the block is flagged ambiguous and syncValidate
   rejects it, because a frozen panel that says so beats a confident wrong total.

   TWO columns, no triple. The tab has since stopped printing Limit Assigned for
   this block and now shows Expenditure and Limit Unspent only, in that order -
   the same order they sat in when the assignment column was still in front of
   them. Nothing is lost: the two still add up to the assignment row by row, and
   their totals still add up to the ₹52.80 Cr the block was assigned. So the
   assignment is DERIVED here rather than read, and assign:-1 is what says so.
   Be aware of what that costs: the assigned-less-expenditure-equals-unspent
   check downstream becomes true by construction, so this shape leans on the
   remaining checks - no negatives, expenditure not exceeding the assignment, and
   the rows summing to the totals the tab still prints.

   If nothing reconciles and the shape is neither of those, the first three
   columns carrying figures are used, so a genuinely inconsistent block still
   reaches syncValidate and is reported there as the keying error it is. Fewer
   than two columns carry figures only if the block is unrecognisable, and the
   original C/D/E is then as good a guess as any: the row checks will reject it. */
function mdsdMoneyCols(body, total) {
  const NAME = 1, LAST = 12;              // column M, the last the block can reach
  const val = function (c, i) { return String((c && c[i]) == null ? '' : c[i]).trim(); };
  const cols = [];
  for (let i = NAME + 1; i <= LAST; i++) {
    if (val(total, i) !== '' || body.some(function (c) { return val(c, i) !== ''; })) cols.push(i);
  }
  const holds = function (c, a, e, b) { return Math.abs((nnum(c[a]) - nnum(c[e])) - nnum(c[b])) <= 1; };
  const hit = [];
  for (let i = 0; i + 2 < cols.length; i++) {
    const a = cols[i], e = cols[i + 1], b = cols[i + 2];
    if (nnum(total[a]) > 0 && holds(total, a, e, b) &&
        body.every(function (c) { return holds(c, a, e, b); })) hit.push({ assign: a, exp: e, bal: b });
  }
  if (hit.length === 1) return hit[0];
  if (!hit.length && cols.length === 2 && (nnum(total[cols[0]]) > 0 || nnum(total[cols[1]]) > 0))
    return { assign: -1, exp: cols[0], bal: cols[1] };
  const guess = cols.length >= 3 ? { assign: cols[0], exp: cols[1], bal: cols[2] }
                                 : { assign: 2, exp: 3, bal: 4 };
  if (hit.length > 1) guess.ambiguous = true;
  return guess;
}

function parseMdsdRows(rows) {
  let start = -1;
  for (let i = 0; i < rows.length; i++) {
    if (/KI\s*INFRA/i.test(String((rows[i] || [])[1] || ''))) { start = i; break; }
  }
  if (start < 0) return null;

  /* The rows are collected before a single figure is read: the money columns are
     found from the block as a whole, which needs every data row and the Total
     row in hand first. */
  const body = [];
  let total = null;
  for (let r = start + 1; r < rows.length; r++) {
    const c = rows[r] || [];
    const name = String(c[1] || '').trim();
    if (/^total$/i.test(name)) { total = c; break; }
    const serial = /^\d+(\.0+)?$/.test(String(c[0] || '').trim());
    if (!name || !serial) {
      if (body.length) break;    // ran past the block
      continue;                  // header/spacer before it
    }
    body.push(c);
  }
  if (!body.length || !total) return null;

  const col = mdsdMoneyCols(body, total);
  /* col.assign of -1 means the tab no longer prints the assignment and it is the
     two figures either side of it added together - see mdsdMoneyCols. */
  const rd = function (c, i) { return Math.round(nnum(c[i])); };
  const money = function (c) {
    const exp = rd(c, col.exp), bal = rd(c, col.bal);
    return { assign: col.assign < 0 ? exp + bal : rd(c, col.assign), exp: exp, bal: bal };
  };
  const items = body.map(function (c) {
    return Object.assign({ name: String(c[1]).trim() }, money(c));
  });
  const stated = money(total);

  /* The sheet carries neither a display name nor the state/institute
     distinction — names arrive shouted ("UTTAR PRADESH") and typeless. Both are
     carried across from the embedded baseline where a row matches, so the panel
     keeps reading "Uttar Pradesh" and IISER keeps its institute icon. Anything
     the baseline does not know is title-cased and typed by its name. */
  const base = (DATA.mdsd && DATA.mdsd.items) || [];
  items.forEach(function (it, i) {
    const k = mdsdKey(it.name);
    let match = null;
    for (let j = 0; j < base.length; j++) {
      const bk = mdsdKey(base[j].name);
      if (bk === k || k.indexOf(bk) === 0 || bk.indexOf(k) === 0) { match = base[j]; break; }
    }
    it.no = i + 1;
    it.name = match ? match.name : mdsdTitle(it.name);
    it.type = match
      ? match.type
      : (/IIT|IISER|NIT|INSTITUTE|UNIVERSITY|COLLEGE|ACADEMY/.test(k) ? 'institute' : 'state');
  });
  /* Carried out to syncValidate rather than resolved here: the parser can see
     that two column triples both reconcile, but only the gate can refuse to
     publish over it. */
  return { items: items, stated: stated, ambiguous: !!col.ambiguous };
}

function mdsdDerive(m) {
  m.items.forEach(function (x, i) {

       boot the two are the same, but this runs again on every sync - by which
       point SV is whatever the open panel and the Classification chip have
       filtered it down to, so reading it here made a row's colour depend on
       where the user happened to be standing when the sync landed, and shuffle
       every ten minutes. A fixed origin also keeps these idx values clear of the
       base sub-verticals' 0..12, which viewTracker uses as row keys. */
    x.idx = DATA.subverticals.length + i;
    x.mdsd = true;
    SVCOL[x.name] = SERIES[x.idx % SERIES.length];

  m.grand.up = m.grand.assign ? m.grand.exp / m.grand.assign : 0;
  m.zeroCount = m.items.filter(function (x) { return x.exp === 0; }).length;
  m.topUtil = m.items.slice().sort(function (a, b) { return b.up - a.up; })[0];
  return m;
}

/* Seeded at boot from the embedded block, then replaced by the sheet on the
   first successful sync. MDSD IS DATA.mdsd — the same object — so refreshing one
   refreshes the other and nothing can hold a stale copy. */
const MDSD=mdsdDerive(DATA.mdsd||{items:[],grand:{assign:0,exp:0}});

/* ---- centralized filtered-dataset architecture ----
   Every KPI / chart / table / insight / search result / analysis page reads its figures
   from the module-level bindings SV, VERTICALS, SECT, SECTIONS and G - never from DATA.*
   directly. getFilteredDataset() is the single place that recomputes those bindings from
   DATA + MDSD according to the active global Financial Classification filter (state.filt),
   so "All / Recurring / Non-Recurring / Infrastructure" means exactly one thing everywhere.
   Infrastructure-MDSD is classified as Infrastructure (it is literally the source
   workbook's "Infrastructure-MDSD" block), so selecting "Infrastructure" folds New Sports
   Infrastructure Projects + every MDSD State/Institute together; selecting "All" folds
   MDSD into the consolidated grand totals, reconciling exactly with the workbook's own
   GRAND TOTAL row. */
function mdsdAsSubverticals(){
  return MDSD.items.map(x=>({
    name:x.name, short:x.name, parent:'KI Infra (States/UTs) (State / Institute Grants)',
    section:'Infrastructure', code:null, idx:x.idx,
    assign:x.assign, exp:x.exp, bal:x.bal, up:x.up, ddoki:0, mdsd:true,
    byCentre:Object.fromEntries(CENTRES.map(c=>[c,{lim:0,act:0}]))

/* ---- master-dataset toggles (DDO KI Direct, Infrastructure MDSD) ----
   Both default ticked (included, matching the full source-Excel picture). Unticking a
   chip excludes its contribution at the lowest granularity - individual sub-vertical
   records - BEFORE any rollup, so every section/grand total below is summed fresh from
   that same adjusted list. There is no separate "patched" total anywhere: a sub-vertical
   with DDO-KI excluded simply reports exp = totAct (its centre-only actual, which never
   included DDO-KI to begin with) instead of exp = ddoki + totAct, and a fully-excluded
   Infrastructure-MDSD state/institute simply never enters the candidate list at all. */
function svWithoutDdoki(s){
  if(!s.ddoki) return s;

/* ---- centre-level exclusion (DDO HQ · Infra-SAI chips) ------------------------------

   one is the headquarters DDO, the other SAI's infrastructure wing. Each gets its own chip so
   they can be taken out of the picture entirely.

   Excluding a centre withdraws the WHOLE of that centre from the picture at sub-vertical
   level, before any rollup - the money earmarked to it as well as the money it spent:
       assign -= centre limit    (the share of the assignment earmarked to that centre)
       totLim -= centre limit,  totAct -= centre actual
       exp     = ddoki + totAct  (expenditure falls by what that centre drew)
       bal     = assign - exp    (so balance falls by exactly that centre's UNSPENT amount)

   stranded in the totals and overstate Balance, so assignment moves with it. A centre's limit
   is the portion of the assignment released to it, which is the only assignment figure that
   exists at centre level. The identity assign - exp = bal therefore holds at every step, and
   the balance change equals the excluded centre's idle amount - nothing appears or vanishes.

   The centre's byCentre entry is zeroed rather than deleted, so every `byCentre[c]` lookup on
   the platform stays safe, and the centre drops out of ACTIVE_CENTRES so it disappears from
   tables, dropdowns, tooltips and search. MDSD rows carry no centre limits and are untouched.

   The DDO KI chip is deliberately different: DDO-KI is the workbook's direct-expenditure
   column and has no allocation line of its own - the Ministry never assigned money "to DDO

   expenditure only. */
function svWithoutCentres(s,ex){
  if(!ex.length) return s;

  const bc=Object.assign({},s.byCentre);

    if(b){ if(b.lim||b.act) hit=true; dl+=b.lim; da+=b.act; bc[c]={lim:0,act:0}; } });
  if(!hit) return s;

function excludedCentres(){
  const ex=[];

  return ex;
}
function rollupTotals(list){
  return {
    assign:sum(list,s=>s.assign), exp:sum(list,s=>s.exp), bal:sum(list,s=>s.bal),
    limit:sum(list,s=>s.totLim||0), actual:sum(list,s=>s.totAct||0), ddoki:sum(list,s=>s.ddoki||0)
  };
}
function getFilteredDataset(){
  const filt=state.filt||'All';

  const inclDdoki=state.inclDdoki!==false, inclMdsd=state.inclMdsd!==false;

  const mdsdSV = inclMdsd ? mdsdAsSubverticals() : [];
  let masterSV = DATA.subverticals.concat(mdsdSV);
  /* centre exclusion runs first, then DDO-KI. The two are order-independent (DDO-KI is a
     separate workbook column that never sat in a centre limit) but doing centres first keeps
     exp = ddoki + totAct true at every step. */
  const exC = excludedCentres();
  if(exC.length) masterSV = masterSV.map(s=>svWithoutCentres(s,exC));
  if(!inclDdoki) masterSV = masterSV.map(svWithoutDdoki);

  const svOut = filt==='All' ? masterSV : masterSV.filter(s=>s.section===filt);

  // ex-MDSD ("base") totals - same DDO-KI-adjusted list, MDSD rows excluded regardless of
  // the MDSD toggle, so the KPI-card "of which Infrastructure-MDSD" breakdown always has a
  // true ex-MDSD figure to compare against.
  const exOut = rollupTotals(svOut.filter(s=>!s.mdsd));
  exOut.idle = exOut.limit-exOut.actual;

  const gOut = rollupTotals(svOut);

  // G.idle deliberately folds in MDSD's unspent balance (mdsdIdle) on top of the RC-limit
  // idle figure - it feeds only the "Unspent by Centre" card's tooltip/"Incl. MDSD" caption,
  // which has always shown that combined figure alongside the RC-only headline (G.ex.idle).
  gOut.idle = (gOut.limit-gOut.actual) + mdsdIdle;
  gOut.mdsdIdle=mdsdIdle;
  gOut.ex=exOut;
  gOut.mdsdIncluded = activeSections.includes('Infrastructure') && inclMdsd;
  gOut.inclDdoki=inclDdoki; gOut.inclMdsd=inclMdsd;
  gOut.exCentres=exC; gOut.inclHQ=state.inclHQ!==false; gOut.inclInfraSai=state.inclInfraSai!==false;

  // rebuild VERTICALS referencing the SAME adjusted sub-vertical objects used everywhere

  // separately-embedded DATA.verticals[].subs copies, eliminating the duplicate source of
  // truth that let a per-component fix go stale in one place and not the other.
  const byName=new Map(svOut.map(s=>[s.name,s]));

  return {SV:svOut, VERTICALS:vOut, SECT:sectOut, G:gOut, SECTIONS:activeSections,

}
function applyFilter(){
  const f=getFilteredDataset();

function setFilt(v){ state.filt=v; applyFilter(); render(); }
function toggleDdoki(){ if(rcOnlyOn()) return; state.inclDdoki=!state.inclDdoki; render(); }
function toggleMdsd(){ if(rcOnlyOn()) return; state.inclMdsd=!state.inclMdsd; render(); }
function toggleHQ(){ if(rcOnlyOn()) return; state.inclHQ=state.inclHQ===false; render(); }

   Infra started syncing at 35.375 Cr. Dividing to lakh first keeps the value an

/* Panel subtitle / "as on" date: the date the figures were last pulled from the

function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function sum(a,f){ let s=0; for(const x of a) s+=f(x); return s; }

/* ---- aggregation ---- */

   Regional Centres and DDO HQ are subtotalled separately and labelled as such: DDO HQ is the

/* Three populations are reported separately because they are three different kinds of

const HQ_KEY='DDO HQ', INFRA_KEY='INFRA-SAI';

/* Tile titles grow additively with the chips: the two non-Regional-Centre rows are

}
/* Itemised centre breakdown for any of the three measures - 'lim', 'act' or 'idle'.

   Regional Centres subtotal, the two non-RC rows when they are in scope, the total,
   and finally what the filter is holding out. */
function rcTipRows(metric,label){
  var rows=idleByCentre(SV);

  var pick=function(k){ return rows.find(function(r){ return r.key===k; })||{key:k,lim:0,act:0,idle:0}; };

   The second half is what makes it actionable. A large balance on money released this week is
   normal - the centre has not had time to spend it. A large balance on money released weeks
   ago is money genuinely parked. The age is measured from AS_OF, the data's own position date,
   not from today's clock, so the page reads identically whenever it is opened for a given

/* ---- health score: every vertical / sub-vertical / centre gets a 🟢🟡🟠🔴 rating
   from three signals - Utilisation (weight 50), Idle fund (weight 30, the sharper
   execution-bottleneck signal: money already released but sitting unused), and
   Balance (weight 20, the macro unspent picture, which also captures amounts not
   yet released at all). Zero utilisation on a real assignment is always floored
   into Critical, however the weighted score computes. ---- */
const HEALTH_META={
  healthy:{emoji:'🟢',label:'Healthy',cls:'b-good'},
  moderate:{emoji:'🟡',label:'Moderate',cls:'b-warn'},
  delayed:{emoji:'🟠',label:'Delayed',cls:'b-ser'},
  critical:{emoji:'🔴',label:'Critical',cls:'b-crit'},
  na:{emoji:'-',label:'No Assignment',cls:'b-mut'}
};
function healthOf(assign,up,idle,bal){
  if(!assign||assign<=0) return Object.assign({score:null,up:0,idleR:0,balR:0,level:'na'},HEALTH_META.na);
  const idleR=Math.min(1,Math.max(0,idle)/assign), balR=Math.min(1,Math.max(0,bal)/assign);
  let score=(up*50)+((1-idleR)*30)+((1-balR)*20);
  if(up<=0) score=Math.min(score,12);
  score=Math.max(0,Math.min(100,score));
  const level = score>=75?'healthy':score>=50?'moderate':score>=25?'delayed':'critical';
  return Object.assign({score,up,idleR,balR,level},HEALTH_META[level]);
}

    `<b>${h.emoji} ${h.label}</b><br>Utilisation ${pct(h.up,0)} · Idle ${pct(h.idleR,0)} of assignment · Balance ${pct(h.balR,0)}<br>Health score ${h.score.toFixed(0)}/100`;
}

 * tapped pushed somewhere off-view. One at a time keeps the answer to "what is
 * inside this?" next to the question.
 *
 * Closing a component closes what was open inside it too. A sub-vertical left
 * expanded under a collapsed parent is invisible state: reopen the parent and it
 * springs back to a place the reader did not leave it.
 */
function trToggle(k){

  state.tr={};
  state.trSub=null; state.cdOpen=null;
  if(!wasOpen) state.tr[k]=true;

/**
 * Do the work, then leave the tapped row exactly where the finger left it.
 *
 * Opening one row closes another, and when the one that closes sits higher up
 * the page everything below jumps toward the top - the row just tapped can
 * travel hundreds of pixels, or off the screen entirely. The reader's own
 * gesture becomes the thing that loses their place.
 *
 * So: note where the row sits, do the work, find it again, and scroll by the
 * difference. From the reader's side nothing moved but the content.
 */
function keepInPlace(findEl,work){
  const before=findEl();
  const top=before?before.getBoundingClientRect().top:null;
  work();
  if(top==null) return;
  const after=findEl();
  if(!after) return;
  const delta=Math.round(after.getBoundingClientRect().top-top);
  if(!delta) return;
  /* Instant, never smooth. The document sets scroll-behavior:smooth, which is
     right for a navigation the reader asked for and wrong here: this is a
     correction meant to be invisible, and animating it turns a row that never
     moved into a row that visibly slides. */
  try{ window.scrollBy({top:delta,left:0,behavior:'instant'}); }
  catch(e){ (document.scrollingElement||document.documentElement).scrollTop+=delta; }
}

      .filter(function(r){ return (r.getAttribute('onclick')||'').indexOf(want)>=0; })[0]||null;
  };

/* Budget Estimate for the scheme, FY 2026-27 — the ceiling the Ministry set,

const BUDGET_BE=924.35e7;

/* Both panels that show this band — Financial Overview and the Component

   opted into. The two were briefly allowed to differ; there is no reading of

   the other. */
function kpiScheme(){
  const ex=G.ex, inc=G.mdsdIncluded;
  const exUp=ex.assign?ex.exp/ex.assign:0;
  /* KI Infra (States/UTs) totals. Added to the ex-MDSD rollup rather than read
     off G: `G.ex` is always ex-MDSD while `G` only carries KI Infra when the
     chip is ticked, so adding holds whichever way the chip is set and cannot
     double-count. Everything below that needs a scheme-wide figure — the card
     captions and the spend measured against the BE — draws on these, so the two
     can never drift apart.

     They answer to the classification filter but not to the chip: KI Infra sits
     inside Infrastructure and drops out with it, at which point the caption goes
     quiet rather than repeating the headline. */
  const infraIn=SECTIONS.indexOf('Infrastructure')>=0;
  const mAssign=infraIn?MDSD.grand.assign:0;
  const mExp=infraIn?MDSD.grand.exp:0;
  const mBal=infraIn?MDSD.grand.bal:0;

  /* The caption is shown whether or not the chip is on. The scheme-wide figure
     is a fact about the scheme, not about which pills happen to be lit, and a
     reader comparing panels should not have to remember what state they left
     the chips in. */
  /* One footer treatment for every card in the band, so the dashed rules line up
     across the row instead of appearing on four cards and not the fifth. */
  const capRow=(label,v,tail)=>`<div class="sub kpi-foot">${label} <b class="tnum">${cr(v)}</b>${tail?` <span class="kpi-foot-x">${tail}</span>`:''}</div>`;
  const cap=(v)=>infraIn?capRow('Incl. KI Infra',v):'';

  /* The BE is a scheme-wide ceiling that covers KI Infra, so the spend measured
     against it counts KI Infra too — otherwise part of the outlay would be
     compared with all of the budget. */
  const expBE=ex.exp+mExp;
  const beUp=BUDGET_BE?expBE/BUDGET_BE:0;

     headline minus the tranche under the very same chips and classification.

  const q2In=sum(SV,function(x){ return x.q2||0; });

    <div class="kpi"><div class="kpi-top"><span class="kpi-ic ic-orange">${kpiIcon('scale')}</span><div class="kpi-txt"><div class="lbl">Balance</div><div class="val tnum">${cr(ex.bal)}</div></div></div><div class="sub">${pct(ex.assign?ex.bal/ex.assign:0,1)} unspent</div>${cap(ex.bal+mBal)}</div>

  </div>`;
}

  const segs=items.map(it=>{const ang=Math.max(it.value/T*2*Math.PI,0.0002),p=arcPath(cx,cy,rO,rI,a,a+ang);a+=ang;
    return `<path class="arc" d="${p}" fill="${it.color}"${tattr('<b>'+esc(it.key)+'</b><br>'+crShort(it.value)+' · '+pct(it.value/T,0))}/>`;}).join('');
  return `<svg class="chart-svg" viewBox="0 0 220 220" width="188" height="188" style="flex:none">${segs}<text x="110" y="106" text-anchor="middle" font-size="20" font-weight="800" fill="var(--text-primary)">${(T/1e7).toFixed(0)} Cr</text><text x="110" y="125" text-anchor="middle" font-size="11" fill="var(--text-muted)">assignment</text></svg>`;
}

function fmtD(d){ if(!d) return ''; const p=String(d).split('-'); if(p.length<3) return d; return p[2]+' '+MON[(+p[1])-1]; }

function txForSVCentre(sv,c){ return TXN.filter(t=>t.sv===sv&&t.rc===c).sort((a,b)=>b.net-a.net); }
function cdToggle(k){ tipHide(); state.cdOpen = state.cdOpen===k?null:k; render(); }
/* The voucher table. `centre` is passed by the Regional Centres panel alone and
   is what turns the Comment column on; every other caller gets the five-column
   table it has always had. Scoping it by an argument rather than by reading
   state.view means the two other panels that share this function - Component
   Tracker and Sub-Vertical Analysis, both via centreDetail - cannot grow the
   column by accident.

   The header cells and the body cells are driven by the SAME `cmt` flag on
   purpose: labelTableCells() silently skips a row whose cell count differs from
   the header's, leaving every mobile label blank rather than erroring, so the
   two must be incapable of disagreeing. */
function txnList(rows,centre){
  const cmt=!!centre;
  const body=rows.map(t=>{
    const k=txKey(t);
    const row=`<tr title="${esc(t.nar)}">`
      +`<td><b>${esc(t.voucher||t.sanction)}</b> <span class="muted">· ${esc(t.sanction)} · ${fmtD(t.date)}</span><div class="txnar">${esc(t.nar)}</div></td>`
      +(cmt?`<td class="cmtcell">${cmtCell(t,k,centre)}</td>`:'')
      +`<td>${esc(t.scat)}</td>`
      +`<td class="num tnum">${crShort(t.net)}</td>`
      +`<td class="num tnum" style="color:${t.util>0?'var(--good)':'var(--text-muted)'}">${crShort(t.util)}</td>`
      +`<td class="num tnum">${crShort(t.bal)}</td></tr>`;
    /* The editor is a full-width row of its own rather than a cell, so it can
       hold a real textarea without squeezing the columns. Its colspan makes the
       cell count differ from the header, which is exactly why labelTableCells
       leaves it alone. */
    return row+((cmt&&state.cmtEdit===k)
      ? `<tr class="cmtrow"><td colspan="6">${cmtEditor(t,k)}</td></tr>` : '');
  }).join('');
  return `<table class="txmini${cmt?' hascmt':''}"><thead><tr><th>Voucher · Sanction · Date</th>`
    +(cmt?'<th>Comment</th>':'')
    +`<th>Sub-category</th><th class="num">Released</th><th class="num">Utilised</th><th class="num">Balance</th></tr></thead><tbody>${body}</tbody></table>`;
}

/* ---- Voucher comments ------------------------------------------------------
   A Regional Centre's note to HQ about one release: what it is for, or what is
   holding it up.

   Who may write. Only the user assigned to that centre, and only while the
   voucher still has a balance. Both are re-checked server-side on every write -
   see comments.ts - so what follows decides what to DRAW and never what is
   allowed. A user who edits their own state gets a 403, not a saved comment.

   Why the balance rule is only kept here. The server holds no financial data at
   all: the dashboard reads the sheet in the browser, so the balance is
   something only this code knows. The server therefore latches a comment closed
   when it is TOLD the balance is nil, and the honest description of the rule is
   that the UI keeps it and the latch makes it durable - not that it is verified.

   Identity. txKey(t) is `CENTRE|VOUCHER`, the same key the change log uses, and
   it deliberately carries no amount: the figures move on every sync, and the
   balance reaching nil must freeze a comment rather than orphan it. */
var CMT = { byKey:{}, loaded:false, loading:false, err:null, dup:{} };

/** Comments cannot be keyed on a blank or pipe-bearing voucher - see txKey. */
function cmtKeyable(t){
  return !!(t && t.rc && t.voucher && String(t.voucher).indexOf('|')<0 && String(t.rc).indexOf('|')<0);
}
/**
 * May the signed-in user write on this row?
 *
 * Every clause is a reason the button must not appear; the server enforces the
 * first three again. `bal` is read as a number because the sheet can hand back
 * a string, and `'0' > 0` is false but `'' > 0` is too - both mean no button.
 */
function cmtCanWrite(t,centre){
  /* Until the store has actually loaded, an empty CMT.byKey is indistinguishable
     from "no comment here" - and saving against that would silently overwrite a
     colleague's note. No store, no writing. */
  if(!CMT.loaded||CMT.err) return false;
  if(!ME||!ME.regional_centre) return false;
  if(ME.regional_centre!==centre||t.rc!==centre) return false;
  if(!cmtKeyable(t)) return false;
  if(CMT.dup[txKey(t)]) return false;              // ambiguous identity - see cmtIndex
  if(!(Number(t.bal)>0)) return false;             // closed voucher: frozen
  const c=CMT.byKey[txKey(t)];
  return !(c&&c.locked);
}
/** One cell: the comment if there is one, and the button if they may write. */
function cmtCell(t,k,centre){
  const c=CMT.byKey[k], can=cmtCanWrite(t,centre);
  let out='';
  if(c){
    /* Comment bodies are the only text in this document typed by a user rather
       than written by its author. They go through esc() into element content
       and into a plain title attribute - never through tattr(), which stores
       HTML for innerHTML and would hand an <img onerror> straight back. */
    /* The byline carries the date and, once the voucher closes, that fact - and
       not who wrote it. A comment already belongs to exactly one centre, and
       within a centre only that centre's own login can have written it, so the
       name added a line of text without adding an answer. The author is still
       recorded on the row for the audit trail; it is simply not on screen.
       Built as parts so a missing date cannot leave a leading separator. */
    const meta=[];
    if(c.updated_at) meta.push(esc(fmtD(String(c.updated_at).slice(0,10))));
    if(c.locked) meta.push('closed');
    out+=`<div class="txcmt" title="${esc(c.body)}">${esc(c.body)}`
      +(meta.length?`<div class="txcmt-by">${meta.join(' · ')}</div>`:'')
      +`</div>`;
  }
  /* While this row's editor is open the button is withdrawn: it sits directly
     above the textarea, and clicking it would reload the stored body over
     whatever was being typed. */
  if(can&&state.cmtEdit!==k){
    out+=`<button class="cmt-btn${c?' has':''}" onclick="event.stopPropagation();cmtOpen(${jstr(k)})"`
      +` title="Please type your query/explanation or any support you needed from HQ for this transaction"`
      +` aria-label="${c?'Edit the comment on this transaction':'Add a comment on this transaction'}">`
      +`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">`
      +`<path d="M21 11.5a8.4 8.4 0 0 1-8.5 8.4 8.6 8.6 0 0 1-3.9-.9L3 21l2-4.9a8.4 8.4 0 0 1-1-4 8.5 8.5 0 0 1 8.5-8.4h.5a8.4 8.4 0 0 1 8 8v.3z"/></svg>`
      +`<span>${c?'Edit':'Comment'}</span></button>`;
  } else if(!c){
    out+='<span class="muted">—</span>';
  }
  return out;
}
function cmtEditor(t,k){
  return `<div class="cmt-ed" onclick="event.stopPropagation()">`
    +`<div class="cmt-ed-hd">Query or explanation for HQ <span class="muted">· ${esc(t.voucher||'')} · ${esc(t.rc||'')}</span></div>`
    +`<div id="cmtMsg"></div>`
    +`<textarea class="cmt-ta" id="cmtTa" rows="3" maxlength="2000"`
    +` placeholder="What is this release for, or what support do you need from HQ?"`
    +` oninput="state.cmtDraft=this.value">${esc(state.cmtDraft)}</textarea>`
    +`<div class="cmt-act"><span class="pf-hint">Visible to HQ. Editable until the balance reaches nil.</span>`
    +`<button class="btn" onclick="cmtCancel()">Cancel</button>`
    +`<button class="pf-btn" id="cmtSaveBtn" onclick="cmtSave(${jstr(k)},${Number(t.bal)||0})">Save comment</button>`
    +`</div></div>`;
}
/**
 * Is an editor actually on screen?
 *
 * state.cmtEdit alone is not the answer. Nothing clears it when the row is
 * collapsed or the panel is left, so a flag left standing would have stopped
 * every timed repaint for the rest of the session - the sync would keep
 * applying figures the page never showed. Asking the DOM cannot go stale, and
 * the chance to tidy the flag is taken while we are here.
 */
function cmtEditorLive(){
  if(!state.cmtEdit) return false;
  if(document.getElementById('cmtTa')) return true;
  state.cmtEdit=null; state.cmtDraft='';
  return false;
}
/**
 * Recompute which keys are ambiguous.
 *
 * The duplicate check reads DATA.txns, which syncApply replaces wholesale every
 * ten minutes. Computed once at load it would answer for a dataset that no
 * longer exists, so it is redone whenever the transactions are.
 */
function cmtReindexDups(){
  if(!CMT.loaded) return;
  CMT.dup={};
  const seen={};
  (DATA.txns||[]).forEach(function(t){
    if(!cmtKeyable(t)) return;
    const k=txKey(t);
    if(seen[k]) CMT.dup[k]=true; else seen[k]=1;
  });
}
function cmtOpen(k){
  tipHide();
  state.cmtEdit=k;
  state.cmtDraft=(CMT.byKey[k]&&CMT.byKey[k].body)||'';
  render();
  const el=document.getElementById('cmtTa');
  if(el){ el.focus(); el.selectionStart=el.selectionEnd=el.value.length; }
}
function cmtCancel(){ state.cmtEdit=null; state.cmtDraft=''; render(); }   // repaints the deferred sync too
function cmtSave(k,bal){
  const btn=document.getElementById('cmtSaveBtn');
  const body=(state.cmtDraft||'').trim();
  if(!body){ pfNote('cmtMsg','err','Enter a comment before saving.'); return; }
  btn.disabled=true; btn.textContent='Saving…';
  pfNote('cmtMsg','','');
  pfSend('/api/comments','POST',{tx_key:k, body:body, balance:Number(bal)||0})
    .then(function(r){
      /* Adopt the server's stored record rather than the draft - it is the one
         that was actually saved, trimmed and capped - then repaint so the cell
         shows it. The editor closes, so there is no notice to preserve. */
      if(r&&r.comment) CMT.byKey[k]=r.comment;
      state.cmtEdit=null; state.cmtDraft='';
      render();
    })
    .catch(function(err){
      pfNote('cmtMsg','err',err.message);
      /* Only here: on success the button no longer exists to re-enable. */
      if(btn.isConnected){ btn.disabled=false; btn.textContent='Save comment'; }
    });
}
/**
 * Index the comments for one centre, and note any key two rows share.
 *
 * (centre, voucher) was verified unique within each worksheet tab, but nothing
 * in the sheet enforces it. If it is ever violated, two rows would share one
 * comment; rather than let that happen silently the duplicate is recorded and
 * cmtCanWrite withholds the button from both, so the ambiguity shows up as a
 * missing control rather than as one centre's note appearing on another's row.
 */
function cmtIndex(list){
  CMT.byKey={}; CMT.dup={}; CMT.loaded=true;
  (list||[]).forEach(function(c){ if(c&&c.tx_key) CMT.byKey[c.tx_key]=c; });
  cmtReindexDups();
  const dups=Object.keys(CMT.dup);
  if(dups.length) console.warn('These voucher numbers repeat within one centre, so a comment could not be attributed to a single row and the control was withheld:',dups);
}
/** Load every comment once. Re-entrant, and refetched only on request. */
function cmtLoad(force){
  if(CMT.loading) return;
  if(CMT.loaded&&!force) return;
  CMT.loading=true; CMT.err=null;
  fetch('/api/comments',{credentials:'include'})
    .then(function(r){ return r.text().then(function(t){
      let p=null; try{ p=t?JSON.parse(t):null; }catch(e){ p=null; }
      if(!r.ok) throw new Error((p&&p.message)||('Request failed ('+r.status+').'));
      return p;
    }); })
    .then(function(p){
      cmtIndex(p&&p.comments);
      /* Seal anything that has closed since it was last written. Fire-and-
         forget: the panel already treats a nil balance as frozen. */
      if(ME&&ME.regional_centre) cmtSealClosed(ME.regional_centre);
    })
    .catch(function(err){ CMT.err=err.message; CMT.byKey={}; CMT.loaded=true; })
    /* Same deferral as the sync: this fetch can land while someone is typing. */
    .then(function(){ CMT.loading=false; if(!cmtEditorLive()) render(); });
}
/**
 * Seal comments whose voucher has since closed.
 *
 * A comment written while the balance was healthy leaves no later write, so
 * nothing would ever record that the voucher has closed and the latch would
 * stay open forever. The panel reports the keys it now sees at nil; the server
 * only ever sets the latch, never clears it. Only the owning centre may ask.
 */
function cmtSealClosed(centre){
  if(!ME||ME.regional_centre!==centre) return;
  const keys=[];
  (DATA.txns||[]).forEach(function(t){
    if(t.rc!==centre||!cmtKeyable(t)) return;
    if(Number(t.bal)>0) return;
    const k=txKey(t), c=CMT.byKey[k];
    if(c&&!c.locked) keys.push(k);
  });
  if(!keys.length) return;
  pfSend('/api/comments/lock','POST',{keys:keys})
    .then(function(){ keys.forEach(function(k){ if(CMT.byKey[k]) CMT.byKey[k].locked=true; }); })
    .catch(function(){ /* decorative: the UI already treats these as closed */ });
}

/* ---- insights ---- */
function insightCards(){
  const ca=centreAgg(), topIdle=ca.slice().sort((a,b)=>b.idle-a.idle)[0];
  const topBal=SVA.slice().sort((a,b)=>b.bal-a.bal)[0];
  const cards=[
    ['var(--serious)','₹',`<b>${esc(topBal.name)}</b> holds the largest unspent balance - <b>${crShort(topBal.bal)}</b> of ${crShort(topBal.assign)} assigned (${pct(topBal.assign?1-topBal.up:0,0)} unspent).`, topBal.mdsd?"go('mdsd')":"go('sv')"],
    ['var(--warn)','▲',`Overall utilisation is <b>${pct(G.assign?G.exp/G.assign:0,1)}</b> - <b>${crShort(G.bal)}</b> of the ${cr(G.assign)} assignment is still unspent.`,"go('tracker')"],
    ['var(--primary)','◧',`<b>${esc(topIdle.key)}</b> has the highest idle at a centre - <b>${crShort(topIdle.idle)}</b> of its ${crShort(topIdle.lim)} limit unspent.`,"go('rc')"],
    ['var(--good)','₹',`<b>DDO KI Direct</b> expenditure is <b>${crShort(G.ddoki)}</b>, spent centrally outside the centre limits.`,"go('detail')"]
  ];
  if(G.mdsdIncluded) cards.push(['var(--critical)','◆',`Infrastructure-MDSD: <b>${MDSD.zeroCount} of ${MDSD.items.length}</b> States/Institutes have utilised nothing yet - <b>${crShort(MDSD.grand.bal)}</b> of ${crShort(MDSD.grand.assign)} sanctioned remains unspent.`,"go('mdsd')"]);
  const hc={healthy:0,moderate:0,delayed:0,critical:0}; SVA.forEach(s=>{const h=healthForNode(s); if(hc[h.level]!=null) hc[h.level]++;});
  if(hc.critical+hc.delayed>0) cards.push(['var(--critical)','⚑',`Health check: <b>${hc.critical} 🔴 Critical</b> and <b>${hc.delayed} 🟠 Delayed</b> sub-verticals need attention, out of ${hc.healthy+hc.moderate+hc.delayed+hc.critical} rated.`,"go('tracker')"]);
  return cards.map(c=>`<div class="insight" style="border-left-color:${c[0]}" onclick="${c[3]}"><div class="ico" style="background:${c[0]}">${c[1]}</div><div class="tx">${c[2]}</div></div>`).join('');
}

/* ---- views ---- */
function treeCells(x,health){ const up=x.assign?x.exp/x.assign:0;
  const expCell=x.exp?`<span style="color:var(--good)">${crC(x.exp)}</span>`:crC(x.exp);

/* ============================================================================
   YESTERDAY'S EXPENDITURE AND ASSIGNMENTS
   ============================================================================
   What moved in the workbook yesterday, read from its own EditHistory log
   rather than inferred from the figures.

   Why the log and not the figures. A voucher's row carries a running balance,
   not a diary: "Utilization by RC = 18,35,993" says what the total is now and
   nothing about when any of it was booked. The Payment Date column dates the
   VOUCHER, not the data entry - a voucher paid in June can be keyed in
   yesterday. Only the edit log knows when a figure actually changed, so only
   the edit log can answer this panel's question.

   What a day's movement is. The INCREMENT, New - Old, never the new balance.
   GANDHINAGAR TSA/185 went 8,36,000 -> 18,35,993 yesterday; 9,99,993 was booked
   yesterday and the 8,36,000 beneath it was booked on some earlier day. Summing
   balances would have counted that older money again and put a figure in a
   panel labelled "Yesterday" that reconciles against nothing else on screen.

   Double counting, the other way. One cell edited three times in a day writes
   three log rows - (empty)->5L, 5L->7L, 7L->7.5L - and adding those deltas is
   right while adding those balances is not. Edits are therefore collapsed per
   cell first: earliest Old, latest New, one movement. The collapse key carries
   the sheet name because a voucher number is only unique WITHIN a centre's tab
   - TSA/388 exists in both IMPHAL and GUWAHATI as two unrelated transactions,
   and keying on the voucher alone would silently merge them.

   Where the detail comes from. The log names a centre and a voucher and stops
   there; the component, sanction, grantee and narration live in the main
   workbook. (rc, voucher) is unique within a centre tab - checked against every
   tab - so the join is 1:1 and needs no disambiguation. The log's own Sub
   Vertical column wins when the tracker starts filling it. */
const YD_GROUP={centre:'SAI Regional Centres', infra:'KI Infra (States/UTs)', other:'Other'};
/* The log's "Sheet Name (State)" is a tab name. A centre tab is one thing, a
   State/UT grant is another, and anything we cannot place is shown as itself
   rather than quietly dropped or filed under a centre it is not. */
function ydayBucket(rc){
  if((DATA.centres||[]).indexOf(rc)>=0) return 'centre';
  const n=String(rc||'').trim().toLowerCase();
  for(let i=0;i<(MDSD.items||[]).length;i++){
    if(String(MDSD.items[i].name).trim().toLowerCase()===n) return 'infra';
  }
  return 'other';
}
function ydayMovement(){
  const day=istDateStr(1), win=istDayWindow(1);
  const out={day:day, label:sheetDMY(day), places:[], assigned:0, spent:0, n:0,
             ready:!!SYNC.editLog};
  if(!SYNC.editLog) return out;
  /* One movement per cell: earliest Old, latest New, however many edits landed. */
  const cell={}, order=[];
  SYNC.editLog.forEach(function(e){
    if(!e||!e.kind||!isFinite(e.ts)||e.ts<win.start||e.ts>win.end) return;
    const k=e.rc+'|'+e.voucher+'|'+e.col;
    let p=cell[k];
    if(!p){ p=cell[k]={rc:e.rc, voucher:e.voucher, col:e.col, kind:e.kind, sv:e.sv||'',
                       firstTs:e.ts, lastTs:e.ts, open:e.oldV, close:e.newV, edits:0};
            order.push(p); }
    p.edits++;
    if(e.ts<p.firstTs){ p.firstTs=e.ts; p.open=e.oldV; }
    if(e.ts>=p.lastTs){ p.lastTs=e.ts; p.close=e.newV; }
    if(!p.sv&&e.sv) p.sv=e.sv;
  });
  const byPlace={};
  order.forEach(function(p){
    /* A label column has no arithmetic. It is a real edit and is listed as one,
       but it moves no money and must not be summed into a rupee total. */
    p.delta=(p.open==null||p.close==null)?null:(p.close-p.open);
    let tx=null; const tl=DATA.txns||[];
    for(let i=0;i<tl.length;i++){
      if(tl[i]&&tl[i].rc===p.rc&&tl[i].voucher===p.voucher){ tx=tl[i]; break; }
    }
    p.sv=p.sv||(tx?tx.sv:'');
    p.scat=tx?tx.scat:''; p.nar=tx?tx.nar:''; p.sanction=tx?tx.sanction:'';
    p.date=tx?tx.date:null; p.matched=!!tx;
    const b=byPlace[p.rc]||(byPlace[p.rc]={name:p.rc, group:ydayBucket(p.rc), rel:0, util:0, n:0, rows:[]});
    b.rows.push(p); b.n++; out.n++;
    if(p.delta!=null){ b[p.kind]+=p.delta; out[p.kind==='rel'?'assigned':'spent']+=p.delta; }
  });
  const GRANK={centre:0, infra:1, other:2};
  out.places=Object.keys(byPlace).map(function(k){ return byPlace[k]; })
    .sort(function(a,b){
      return (GRANK[a.group]-GRANK[b.group])
          || ((b.util+b.rel)-(a.util+a.rel))
          || a.name.localeCompare(b.name);
    });
  out.places.forEach(function(b){
    b.rows.sort(function(x,y){ return (y.delta||0)-(x.delta||0) || String(x.voucher).localeCompare(String(y.voucher)); });
  });
  return out;
}
/** Voucher-level detail for one centre - what changed, and on which component. */
function ydayTxns(b){
  const body=b.rows.map(function(p){
    const asg=p.kind==='rel';
    const head='<b>'+esc(p.voucher||'—')+'</b>'
      + (p.sanction?' <span class="muted">· '+esc(p.sanction)+'</span>':'')
      + (p.date?' <span class="muted">· '+esc(fmtD(p.date))+'</span>':'')
      + (p.edits>1?' <span class="muted">· '+p.edits+' edits merged</span>':'')
      + (p.nar?'<div class="txnar">'+esc(p.nar)+'</div>':'');
    const comp=p.sv
      ? esc(p.sv)+(p.scat?'<div class="muted" style="font-size:10.5px">'+esc(p.scat)+'</div>':'')
      : '<span class="muted">Not found in the main sheet</span>';
    /* crShort rounds to two decimals of a lakh, so 9,99,993 prints as ₹10.00 L.
       That is the platform's convention and stays, but this table is where the
       exact movement is checked, so every figure carries its rupees on hover. */
    const amt=function(v){
      return v==null ? '<span class="muted">—</span>'
        : '<span title="₹'+esc(grpIN(v))+'">'+esc(crShort(v))+'</span>';
    };
    return '<tr'+(p.nar?' title="'+esc(p.nar)+'"':'')+'>'
      + '<td>'+head+'</td>'
      + '<td>'+comp+'</td>'
      + '<td><span class="yd-tag'+(asg?' asg':'')+'">'+(asg?'Assignment':'Expenditure')+'</span></td>'
      + '<td class="num tnum">'+amt(p.open)+'</td>'
      + '<td class="num tnum">'+amt(p.close)+'</td>'
      + '<td class="num tnum" style="color:'+(p.delta>0?'var(--good)':p.delta<0?'var(--serious)':'var(--text-muted)')+'">'
        + (p.delta==null?'<span class="muted">label only</span>':amt(p.delta))+'</td></tr>';
  }).join('');
  return '<table class="txmini"><thead><tr><th>Voucher · Sanction · Payment date</th>'
    + '<th>Component</th><th>Field</th><th class="num">Previous</th><th class="num">Updated</th>'
    + '<th class="num">Booked yesterday</th></tr></thead><tbody>'+body+'</tbody></table>';
}

function viewYday(){

          + '<td class="subc"><span class="chev'+(o?' open':'')+'" style="margin-right:6px">'+(o?'▾':'▸')+'</span>'
            + '<b>'+esc(b.name)+'</b> <span class="muted" style="font-weight:400;font-size:10.5px">· '
            + b.n+' entr'+(b.n===1?'y':'ies')+'</span></td>'
          + '<td class="num tnum">'+(b.rel?'<span title="₹'+esc(grpIN(b.rel))+'">'+esc(crShort(b.rel))+'</span>':'<span class="muted">—</span>')+'</td>'

      });
      drop='<div class="usage"><table><thead><tr><th>Centre / State</th>'

         + '</tr></thead><tbody>'+trs+'</tbody></table></div>';
    }
  }
  /* No chevron and nothing to open: on its own page the figures and the centres
     are the page. The strip needed a disclosure only because it was a guest

  return pageHead("Yesterday's Expenditure and Assignments",
      'What changed in the sheet on ' + esc(y.label) + ' — the movement booked that day, not the balance standing in the cell.')
    + '<div class="card" style="padding:0;overflow:hidden">'
    + '<div class="card-hd" style="padding:16px 18px 0"><h3>Booked on ' + esc(y.label) + '</h3>'
      + '<span class="small muted">' + esc(hint) + '</span></div>'
    + '<div class="yd-sum flat">'
      + '<div class="yd-figs">'+fig('Total Assigned', y.assigned)
        + fig('Total Expenditure', y.spent, 'used')+'</div></div>'

    + '</div>';

/* A sub-vertical opens onto the same centre breakdown the Component Tracker
   uses - literally centreDetail, so the two panels cannot drift. That is what
   surfaces the workbook's INFRA pair (Sheet3 AF/AG) here: it is one of the
   fourteen centre columns, shown as "SAI-Infra to vendors".

   It belongs inside the sub-vertical rather than beside it. SAI-Infra is where
   part of that sub-vertical's money went, not a sub-vertical of its own, so a
   sibling row would be counted twice against the section total. */
function svMiniTable(rows){
  const body=rows.map(r=>{
    const sv=r.sv, k=sv?('S|'+sv.section+'|'+sv.name):null;
    const open=!!k&&state.secSv===k;

               :'<span style="display:inline-block;width:25px"></span>';
    return `<tr${k?` class="click${open?' rc-open':''}" style="cursor:pointer" onclick="secSvToggle(${jstr(k)})"`:''}>`
      +`<td>${chev}${esc(r.key)}</td>`

      +`<td class="num tnum">${crShort(r.util)}</td>`
      +`<td class="num tnum">${crShort(r.bal)}</td>`

      +(open?`<tr class="det"><td colspan="5" onclick="event.stopPropagation()">${centreDetail(sv)}</td></tr>`:'');
  }).join('');
  return `<div class="tscroll"><table class="dt"><thead><tr><th>Sub-Vertical</th><th class="num">Assignment</th><th class="num">Expenditure</th><th class="num">Balance</th><th class="num">Used</th></tr></thead><tbody>${body}</tbody></table></div>`;
