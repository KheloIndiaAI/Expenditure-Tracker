/* ---- cross-page expenditure reconciliation -----------------------------------------
   This page reports what the centres spent; Financial Overview / Component Tracker report
   what the SCHEME spent. They differ by DDO KI Direct expenditure, which is real spend
   that never passed through a centre limit. Both are correct, but seeing ₹60.60 Cr here and
   ₹99.76 Cr there with no visible bridge reads as a contradiction, so the identity is now
   stated explicitly and recomputed live from the same filtered bindings:

       centre actual (G.actual) + DDO KI direct (G.ddoki) = ex-MDSD expenditure (G.ex.exp)

   and, when the KI Infra chip is on, + MDSD expenditure = G.exp - mirroring the "Incl. KI
   Infra" caption the Overview cards already carry. Asserted in both directions rather than
   hard-coded, so if a future dataset breaks the identity the strip says so instead of
   silently printing a wrong sum. */
function rcReco(){
  const act=G.actual, dk=G.ddoki, ex=G.ex.exp, mdsdExp=G.mdsdIncluded?MDSD.grand.exp:0, all=ex+mdsdExp;
  const ok=Math.abs((act+dk)-ex)<1;
  if(!ok) return `<div class="reco" style="border-left-color:var(--critical)"><span class="rl" style="color:var(--critical)">Reconciliation error</span><span>centre actual ${cr(act)} + DDO KI ${cr(dk)} = ${cr(act+dk)}, but scheme expenditure is ${cr(ex)} (Δ ${cr(ex-act-dk)}). Figures on this page and Financial Overview will not agree - the source dataset is inconsistent.</span></div>`;
  return `<div class="reco">
    <span class="rl">Expenditure bridge</span>
    <span>Centres <span class="rv">${cr(act)}</span></span><span class="op">+</span>
    <span>DDO KI Direct <span class="rv">${cr(dk)}</span></span><span class="op">=</span>
    <span>Scheme total <span class="rv" style="color:var(--primary)">${cr(ex)}</span></span>
    ${mdsdExp?`<span class="op">+</span><span>KI Infra <span class="rv">${cr(mdsdExp)}</span><span class="op"> = </span><span class="rv">${cr(all)}</span></span>`:''}
  </div>`;
}

/* ---- SAI KI 1 / KI 2 / Infra delivery blocks -----------------------------------------
   A third analytical lens over the SAME sub-vertical records the rest of the platform uses.
   It is a pure re-grouping: membership is declared by explicit sub-vertical name below, and
   the three blocks form an exact partition of every non-MDSD sub-vertical - so KI 1 + KI 2 +
   Infra reconciles, to the rupee, with the ex-MDSD grand total on Financial Overview.

   Membership follows the scheme's own delivery structure:
     KI 1  - Khelo India Games, Fit India Movement, and all four sub-verticals of
             "Promotion of Inclusiveness through Sports".
     KI 2  - Talent Identification & Development, Community Coaching & Development,
             Khelo India Centres and Sports Academies. The latter two each exist as BOTH a
             Recurring and a Non-Recurring record in the workbook; both are claimed, so the
             block stays whole no matter which Classification is selected.
     Infra - New Sports Infrastructure Projects only. Deliberately EXCLUDES the KI Infra
             States/UTs (MDSD) grants, which are released direct to States and Institutes
             and have their own page; the KI Infra chip therefore cannot move these figures.

   Because a silently unclaimed sub-vertical would understate a block without any visible
   symptom, kiUnassigned() re-derives the partition on every render and the page shows a
   loud warning strip rather than quietly dropping money. */
const KI_GROUPS=[
  {key:'KI1',tag:'KI 1',name:'Khelo India 1',col:'#2a78d6',
   note:'Games, mass participation & inclusiveness',
   members:['Khelo India Games','Fit India Movement','Sports for Peace and Development','Sports for rural/indigenous/tribal','Sports for disabled sportspersons','Sports for Women']},
  {key:'KI2',tag:'KI 2',name:'Khelo India 2',col:'#4a3aa7',
   note:'Talent pathway, coaching, centres & academies',
   members:['Talent Identification & Development','Community Coaching & Development','Khelo India Centres','Khelo India Centres (N-Rec)','Sports Academies','Sports Academies (Rec)']},
  {key:'INFRA',tag:'INFRA',name:'Infrastructure (SAI)',col:'#eb6834',
   note:'New sports infrastructure · excludes KI Infra States/UTs',
   members:['New Sports Infrastructure Projects']}
];
function kiGroupAgg(){
  const byName=new Map(SV.filter(s=>!s.mdsd).map(s=>[s.name,s]));
  return KI_GROUPS.map(g=>{
    const subs=g.members.map(n=>byName.get(n)).filter(Boolean);
    const assign=sum(subs,s=>s.assign), exp=sum(subs,s=>s.exp), bal=sum(subs,s=>s.bal);
    const lim=sum(subs,s=>s.totLim||0), act=sum(subs,s=>s.totAct||0);
    return Object.assign({},g,{subs,assign,exp,bal,lim,act,ddoki:sum(subs,s=>s.ddoki||0),
      idle:lim-act, up:assign?exp/assign:0});
  });
}
function kiUnassigned(){
  const claimed=new Set(KI_GROUPS.reduce((a,g)=>a.concat(g.members),[]));
  return SV.filter(s=>!s.mdsd && !claimed.has(s.name));

/* ---------------------------------------------------------------------------
   The component table, folded away behind its own control
   ---------------------------------------------------------------------------
   A block's headline figures answer "how is this block doing"; the component
   table answers "which component inside it". Those are two different questions
   and the second is much the longer answer, so it opens on request rather than
   pushing the next block off the screen by default.
--------------------------------------------------------------------------- */
function kiCompGroup(g){
  const on=!!state.kiComp;
  return `<div class="kig-comp">
    <button class="kig-comp-hd${on?' on':''}" onclick="toggleKiComp()" aria-expanded="${on?'true':'false'}">
      <span class="kig-comp-c"></span>
      <span>Components of ${esc(g.tag)}</span>
      <span class="kig-comp-n">${g.subs.length}</span>
    </button>
    ${on?`<div class="kig-comp-body">${kiCompTable(g)}</div>`:''}
  </div>`;
}
/* Opening a block closes the other two — three blocks' worth of KPI cards and
   tables at once is a page nobody reads. Tapping the open one shuts it, so the
   comparison above can be read on its own. The component fold resets with each
   change of block: carried over, it would spring open on a block the reader has
   not asked to see inside yet. */
function setKiOpen(tag){
  state.kiOpen = state.kiOpen===tag ? null : tag;
  state.kiComp = false;
  render();
}
function toggleKiComp(){ state.kiComp=!state.kiComp; render(); }
function viewKI(){
  const groups=kiGroupAgg(), orphans=kiUnassigned();
  const T={assign:sum(groups,g=>g.assign),exp:sum(groups,g=>g.exp),bal:sum(groups,g=>g.bal),
           lim:sum(groups,g=>g.lim),act:sum(groups,g=>g.act),ddoki:sum(groups,g=>g.ddoki)};
  T.idle=T.lim-T.act; T.up=T.assign?T.exp/T.assign:0;
  /* partition guard - the three blocks must reproduce the ex-MDSD grand total exactly. */
  const tie=Math.abs(T.assign-G.ex.assign)<1 && Math.abs(T.exp-G.ex.exp)<1;
  const warn = orphans.length
    ? `<div class="kig-warn"><b>⚠ ${orphans.length} component${orphans.length===1?' is':'s are'} not assigned to any block:</b> ${orphans.map(s=>esc(s.name)).join(', ')}. The block totals below therefore do <b>not</b> add up to the scheme total - add the component to KI_GROUPS to fix.</div>`
    : (!tie ? `<div class="kig-warn"><b>⚠ Reconciliation error:</b> blocks total ${cr(T.assign)} assignment / ${cr(T.exp)} expenditure against a scheme total of ${cr(G.ex.assign)} / ${cr(G.ex.exp)}.</div>` : '');
  const shown=groups.filter(g=>g.assign>0);
  const share=shown.map(g=>`<span style="flex:${Math.max(g.assign,1)} 1 0;background:${g.col}" title="${esc(g.tag)} ${cr(g.assign)}">${T.assign&&g.assign/T.assign>0.07?`${g.tag} ${pct(g.assign/T.assign,0)}`:''}</span>`).join('');
  const cmp=`<table class="kig-cmp">
    <thead><tr><th>Block</th><th>Assignment</th><th>Expenditure</th><th>Balance</th><th>Unspent by Centre</th><th class="barcell" style="text-align:left">Utilisation</th></tr></thead>
    <tbody>${groups.map(g=>`<tr><td><span class="kig-dot" style="background:${g.col}"></span><b>${g.tag}</b> <span class="muted" style="font-size:12px">${g.subs.length} comp.</span></td>
      <td class="tnum">${crShort(g.assign)}</td><td class="tnum">${crShort(g.exp)}</td><td class="tnum${Math.round(g.bal)===0?'':(g.bal<0?' bal-over':' bal-red')}">${crShort(g.bal)}</td><td class="tnum">${crShort(Math.max(0,g.idle))}</td>
      <td class="barcell">${g.assign?utilBar(g.up,'Used','Bal'):'<span class="muted">–</span>'}</td></tr>`).join('')}</tbody>
    <tfoot><tr><td>Scheme total <span class="muted" style="font-weight:500;font-size:12px">(ex-KI Infra)</span></td><td class="tnum">${crShort(T.assign)}</td><td class="tnum">${crShort(T.exp)}</td><td class="tnum${Math.round(T.bal)===0?'':(T.bal<0?' bal-over':' bal-red')}">${crShort(T.bal)}</td><td class="tnum">${crShort(Math.max(0,T.idle))}</td><td class="barcell">${utilBar(T.up,'Used','Bal')}</td><td></td></tr></tfoot></table>`;
  return pageHead('SAI KI 1, KI 2 &amp; Infra','')
   + warn
   + `<div class="reco">
      <span class="rl">Partition check</span>
      <span>KI 1 <span class="rv">${cr(groups[0].assign)}</span></span><span class="op">+</span>
      <span>KI 2 <span class="rv">${cr(groups[1].assign)}</span></span><span class="op">+</span>
      <span>Infra <span class="rv">${cr(groups[2].assign)}</span></span><span class="op">=</span>
      <span><span class="rv" style="color:var(--primary)">${cr(T.assign)}</span></span>
      <span class="rt">${tie?'ties to <b>Total Assignment</b> on Financial Overview':'<b style="color:var(--critical)">does not tie</b>'}</span>
    </div>`
   + `<div class="card"><div class="card-hd"><h3>Block comparison</h3></div>
      <div class="qh">Share of the ${cr(T.assign)} assignment across the three blocks${state.filt==='All'?'':` · Classification: <b>${esc(state.filt)}</b>`}</div>
      <div class="kig-share">${share}</div>${cmp}</div>`
   + kiPills(groups)
   + (groups.filter(function(g){ return g.tag===state.kiOpen; }).map(kiGroupBlock).join('')
      || `<div class="kig-hint">Choose a block above to open its figures.</div>`);
}

/* One pill per block, carrying the block's colour and its assignment so the
   three can be weighed against each other before any is opened. The pill is the
   control and the label at once — there is no separate heading to keep in step

function kiPills(groups){
  return `<div class="kig-pills" role="tablist">${groups.map(function(g){

}

/* small, honest per-sub-vertical iconography - one recognisable glyph per scheme

/* utilisation gauge: 0–100% track with a coloured marker + endpoint labels - a quick,
   at-a-glance read that is deliberately independent of the fuller weighted Health Score
   (which also folds in idle funds & balance), so the two columns can legitimately
   disagree and both be correct - e.g. 58% utilised can still be "Delayed" overall. */
function utilGauge(up,assign){
  if(!assign||assign<=0) return `<div class="sv-gauge"><div class="sv-gauge-pct" style="color:var(--text-muted)">-</div>
    <div class="sv-gauge-track"><div class="sv-gauge-dot" style="left:0%;background:var(--text-muted)"></div></div>
    <div class="sv-gauge-ends"><span>0%</span><span>100%</span></div>

  const p=Math.max(0,Math.min(100,Math.round((up||0)*100)));

  return `<div class="sv-gauge">
    <div class="sv-gauge-pct" style="color:${col}">${p}%</div>

    <div class="sv-gauge-ends"><span>0%</span><span>100%</span></div>
  </div>`;
}
function secPill(sec){ const c=SECTCOL[sec]||'#888'; return `<span class="sv-sec-pill" style="background:${hexToRgba(c,.13)};color:${c}">${esc(sec)}</span>`; }
function viewSV(){

/* ---- Attention Centre (Intelligence): four ranked queues over the same live,
   filter-aware dataset as every other page. Queue membership/sort/order are
   unchanged from the original implementation - only presentation is enriched
   (rank, icon, section pill, utilisation gauge, health tier, ₹ context). ---- */
function excKpis(){
  const rows=ageingReleases(), by=ageingByCentre();

  const nC=ACTIVE_CENTRES.length;
  const relTot=sum(TXN.filter(t=>SECTIONS.includes(t.section)&&excludedCentres().indexOf(t.rc)<0),t=>t.bal);
  const share=relTot?tot/relTot:0;
  /* Two cards: how much is parked, and who is holding it. The count of flagged
     releases and the age of the oldest one have been withdrawn — the table
     below states both per release, and neither is something anyone acts on.
     "Centres to Talk To" now lists every centre holding ageing funds rather
     than the top four and a remainder, since the whole point of the card is
     knowing who to call. */
  return `<div class="kpi-grid k2">

  </div>`;
}
function ageRow(t){

function detailRows(){ let all=[];
  SV.forEach(s=>{

/* Aggregate the sheet's own release rows for one IST calendar day (YYYY-MM-DD). */
function sheetDayStats(day){
  const o={n:0,net:0,util:0,rc:0,rcN:0};
  (DATA.txns||[]).forEach(function(t){
    if(t.date!==day) return;
    o.n++; o.net+=t.net||0; o.util+=t.util||0;
    if(isRegionalCentre(t.rc)){ o.rc+=t.net||0; o.rcN++; }
  });
  return o;
}
/* Assignment revisions observed in a window - the one figure the sheet cannot date. */
function assignStats(win){
  let n=0, amt=0;
  (TXLOG.entries||[]).forEach(function(x){
    if(x.type!=='assign' || x.ts<win.start || x.ts>win.end) return;
    n++; const d=(x.assign||0)-(x.pAssign||0); if(d>0) amt+=d;
  });
  return {n:n, amt:amt};
}
/* Change annotation for a sheet row, if a revision has been observed for it. */
function txChangeFor(t){
  const k=txKey(t), e=(TXLOG.entries||[]);
  for(let i=e.length-1;i>=0;i--){
    const x=e[i];
    if(x.type==='update' && (x.rc+'|'+x.voucher)===k) return txChange(x);
    if(x.type==='new'    && (x.rc+'|'+x.voucher)===k) return '<span style="color:var(--good);font-weight:600">Newly recorded</span>';
  }
  return '<span class="muted">—</span>';
}
/** Human before -> after for an observed revision. */
function txChange(x){
  if(x.type==='sheet')
    return esc(x.field)+': '+esc(crShort(x.pVal))+' → <b>'+esc(crShort(x.val))+'</b> '+txDelta((x.val||0)-(x.pVal||0));
  if(x.type==='new')     return '<span style="color:var(--good);font-weight:600">Newly recorded</span>';
  if(x.type==='removed') return '<span class="muted">Row withdrawn (was '+esc(crShort(x.pNet))+' released)</span>';
  if(x.type==='assign'){
    return esc(crShort(x.pAssign))+' → <b>'+esc(crShort(x.assign))+'</b> '+txDelta((x.assign||0)-(x.pAssign||0));
  }
  var bits=[];
  if(Math.abs((x.net||0)-(x.pNet||0))>1)
    bits.push('Released '+esc(crShort(x.pNet))+' → <b>'+esc(crShort(x.net))+'</b> '+txDelta((x.net||0)-(x.pNet||0)));
  if(Math.abs((x.util||0)-(x.pUtil||0))>1)
    bits.push('Utilised '+esc(crShort(x.pUtil))+' → <b>'+esc(crShort(x.util))+'</b> '+txDelta((x.util||0)-(x.pUtil||0)));
  if(!bits.length && Math.abs((x.bal||0)-(x.pBal||0))>1)
    bits.push('Balance '+esc(crShort(x.pBal))+' → <b>'+esc(crShort(x.bal))+'</b>');
  return bits.join('<br>')||'<span class="muted">—</span>';
}
function txDelta(d){

/* ============================================================================
   TREND ANALYTICS
   ============================================================================
   Three modules over one engine: overall, by Regional Centre, and by component
   / sub-component. Each can be grouped Daily, 3-Day, Weekly or Monthly; the
   metric filter and the per-period/cumulative switch apply across all three.

   WHAT IS PLOTTED, AND WHY IT IS ONLY THIS.
   Only the release rows carry a date, so they are the only thing that can
   honestly sit on a timeline. All three metrics are therefore read from dated
   releases and reconcile exactly to one another:
       Assigned limit = amount released in the period   (release "net")
       Expenditure    = amount utilised in the period   (release "util")
       Balance        = released - utilised, i.e. money released but not drawn
   Component assignment (Rs 219.84 Cr) has no date column anywhere in the
   workbook and is deliberately NOT inferred onto the timeline.

   COVERAGE. Dated releases cover Rs 89.20 Cr of the Rs 99.80 Cr the summary
   reports as released. The gap is one component - New Sports Infrastructure
   Projects - whose releases are not itemised in the transaction tabs, plus
   DDO KI Direct expenditure which has no release rows by design. Rather than
   spread those over dates that do not exist, the panel charts what is dated
   and states the coverage on screen, so the trend can never silently
   contradict the totals on the other pages.
   ========================================================================== */
const TA_METRICS={
  exp:{f:'util', label:'Expenditure',    color:'#1baf7a', tip:'Utilised on releases dated in the period'},
  lim:{f:'net',  label:'Assigned limit', color:'#2a78d6', tip:'Limit released to centres in the period'},
  bal:{f:'bal',  label:'Balance',        color:'#eb6834', tip:'Released minus utilised - money released but not yet drawn'}
};
const TA_BUCKETS=[['D','Daily'],['3D','3-Day'],['W','Weekly'],['M','Monthly']];

/** Earliest dated release in the FULL dataset - anchors 3-day blocks so the
    bucket edges never shift when a filter changes. */
function taEpoch(){
  let min='';
  (DATA.txns||[]).forEach(function(t){ if(t.date && (!min||t.date<min)) min=t.date; });
  return min||'2026-04-01';
}
function taDay(s){ return new Date(s+'T00:00:00Z'); }
function taISO(d){ return d.toISOString().slice(0,10); }

/** The bucket a date belongs to, expressed as the bucket's start key. */
function taKeyOf(date,b){
  if(b==='D') return date;
  if(b==='M') return date.slice(0,7);
  const d=taDay(date);
  if(b==='W'){ d.setUTCDate(d.getUTCDate()-((d.getUTCDay()+6)%7)); return taISO(d); }   // Monday start
  const e=taDay(taEpoch());
  const n=Math.floor((d-e)/86400000);
  return taISO(new Date(e.getTime()+Math.floor(n/3)*3*86400000));
}
/** Every bucket key from `from` to `to` inclusive, so quiet periods show as gaps. */
function taKeysBetween(from,to,b){
  const out=[];
  if(b==='M'){
    let y=+from.slice(0,4), m=+from.slice(5,7);
    const ey=+to.slice(0,4), em=+to.slice(5,7);
    while(y<ey||(y===ey&&m<=em)){ out.push(y+'-'+String(m).padStart(2,'0')); m++; if(m>12){m=1;y++;} }
    return out;
  }
  const step=b==='D'?1:b==='3D'?3:7;
  let d=taDay(taKeyOf(from,b)); const end=taDay(taKeyOf(to,b));
  let guard=0;
  while(d<=end && guard++<4000){ out.push(taISO(d)); d=new Date(d.getTime()+step*86400000); }
  return out;
}
function taLabel(key,b){
  if(b==='M'){ const p=key.split('-'); return MON[(+p[1])-1]+' '+p[0].slice(2); }
  const d=taDay(key), dd=d.getUTCDate(), mm=MON[d.getUTCMonth()];
  if(b==='D') return dd+' '+mm;
  if(b==='W') return dd+' '+mm;
  const e=new Date(d.getTime()+2*86400000);
  return dd+'–'+e.getUTCDate()+' '+(e.getUTCMonth()===d.getUTCMonth()?mm:MON[e.getUTCMonth()]);
}
function taRangeLabel(key,b){
  if(b==='M'){ const p=key.split('-'); return MON[(+p[1])-1]+' '+p[0]; }
  const d=taDay(key);
  const span=b==='D'?0:b==='W'?6:2;
  const e=new Date(d.getTime()+span*86400000);
  const f=function(x){ return x.getUTCDate()+' '+MON[x.getUTCMonth()]; };
  return span? f(d)+' – '+f(e) : f(d);
}

/** Bucket a set of dated releases. Returns points in chronological order. */
function taSeries(rows,b){
  const dated=rows.filter(function(t){ return !!t.date; });
  if(!dated.length) return [];
  const m={};
  let lo='', hi='';
  dated.forEach(function(t){
    if(!lo||t.date<lo) lo=t.date;
    if(!hi||t.date>hi) hi=t.date;
    const k=taKeyOf(t.date,b);
    if(!m[k]) m[k]={key:k,net:0,util:0,n:0};
    m[k].net+=t.net||0; m[k].util+=t.util||0; m[k].n++;
  });
  return taKeysBetween(lo,hi,b).map(function(k){
    const v=m[k]||{key:k,net:0,util:0,n:0};
    v.bal=v.net-v.util;
    return v;
  });
}
/** Running totals - the cumulative view. */
function taCumulate(pts){
  let n=0,u=0,c=0;
  return pts.map(function(p){
    n+=p.net; u+=p.util; c+=p.bal;
    return {key:p.key,n:p.n,net:n,util:u,bal:c};
  });
}
function taActiveMetrics(){
  const m=state.taMetric||'all';
  return m==='all' ? ['lim','exp','bal'] : [m];
}

/* ---- Chart ---------------------------------------------------------------
   Hand-drawn SVG: one path per metric, an area wash when a single metric is
   selected, and a full-height hit zone per bucket carrying the hover detail so
   the pointer never has to find a 3px line. */
function taChart(pts,id){
  if(!pts.length) return '<div class="dt-empty"><div class="e-ic">📈</div><div class="e-t">No dated releases in this selection</div>'
    + '<div class="e-s">Only itemised release rows carry a date and can be plotted.</div></div>';
  const cum=!!state.taCum, b=state.taBucket&&state.taBucket[id]||'W';
  const data=cum?taCumulate(pts):pts;
  const keys=taActiveMetrics();
  const W=780,H=252,L=64,R=16,T=16,B=34;
  const iw=W-L-R, ih=H-T-B;
  let max=0;
  data.forEach(function(p){ keys.forEach(function(k){ const v=p[TA_METRICS[k].f]; if(v>max) max=v; }); });
  if(max<=0) max=1;
  const nice=Math.pow(10,Math.floor(Math.log10(max)));
  const top=Math.ceil(max/nice*4)/4*nice;
  const n=data.length;
  const x=function(i){ return n===1 ? L+iw/2 : L+(i*iw)/(n-1); };
  const y=function(v){ return T+ih-(v/top)*ih; };

  let grid='';
  for(let g=0;g<=4;g++){
    const gy=T+ih-(g/4)*ih, gv=top*g/4;
    grid+=`<line x1="${L}" y1="${gy.toFixed(1)}" x2="${W-R}" y2="${gy.toFixed(1)}" stroke="var(--grid)" stroke-width="1"/>`
        + `<text x="${L-8}" y="${(gy+3.5).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--text-muted)">${esc(crShort(gv))}</text>`;
  }
  let series='';
  keys.forEach(function(k){
    const c=TA_METRICS[k], f=c.f;
    const pathD=data.map(function(p,i){ return (i?'L':'M')+x(i).toFixed(1)+' '+y(p[f]).toFixed(1); }).join(' ');
    if(keys.length===1){
      series+=`<path d="${pathD} L ${x(n-1).toFixed(1)} ${(T+ih).toFixed(1)} L ${x(0).toFixed(1)} ${(T+ih).toFixed(1)} Z" fill="${c.color}" opacity=".12"/>`;
    }
    series+=`<path d="${pathD}" fill="none" stroke="${c.color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`;
    if(n<=40) data.forEach(function(p,i){
      series+=`<circle cx="${x(i).toFixed(1)}" cy="${y(p[f]).toFixed(1)}" r="2.6" fill="#fff" stroke="${c.color}" stroke-width="1.8"/>`;
    });
  });
  // x labels, thinned so they never collide
  const every=Math.max(1,Math.ceil(n/12));
  let xl='';
  data.forEach(function(p,i){
    if(i%every && i!==n-1) return;
    xl+=`<text x="${x(i).toFixed(1)}" y="${H-12}" text-anchor="middle" font-size="10" fill="var(--text-muted)">${esc(taLabel(p.key,b))}</text>`;
  });
  // hover zones
  const bw=n>1?iw/(n-1):iw;
  let hits='';
  data.forEach(function(p,i){
    const raw=pts[i];
    const tip='<b>'+esc(taRangeLabel(p.key,b))+'</b>'
      +(cum?' <span style="opacity:.7">(cumulative)</span>':'')
      +'<br>'+raw.n+' release'+(raw.n===1?'':'s')+' in period'
      +'<br>Assigned limit: <b>'+esc(crShort(p.net))+'</b>'
      +'<br>Expenditure: <b>'+esc(crShort(p.util))+'</b>'
      +'<br>Balance: <b>'+esc(crShort(p.bal))+'</b>'
      +(cum?'<br><span style="opacity:.7">This period alone: '+esc(crShort(raw.net))+' released · '+esc(crShort(raw.util))+' utilised</span>':'');
    hits+=`<rect x="${(x(i)-bw/2).toFixed(1)}" y="${T}" width="${bw.toFixed(1)}" height="${ih}" fill="transparent" style="cursor:crosshair"${tattr(tip)}/>`;
  });
  const legend=keys.map(function(k){
    return `<span class="ta-lg"><i style="background:${TA_METRICS[k].color}"></i>${TA_METRICS[k].label}</span>`;
  }).join('');
  return `<div class="ta-legend">${legend}<span class="ta-cov">${data.length} ${b==='M'?'months':b==='W'?'weeks':b==='3D'?'blocks':'days'}</span></div>`
    + `<svg class="chart-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:252px">${grid}${series}${xl}${hits}</svg>`;
}

/* ---- KPI strip - recomputed for whatever the module has selected ---- */
function taKpis(rows,scope){
  const net=sum(rows,function(t){return t.net;}), util=sum(rows,function(t){return t.util;});
  const b=state.taBucket&&state.taBucket[scope.id]||'W';
  const pts=taSeries(rows,b);
  let peak=null;
  pts.forEach(function(p){ if(!peak||p.util>peak.util) peak=p; });
  const active=pts.filter(function(p){ return p.n>0; }).length;
  const rate=active?util/active:0;
  return `<div class="kpi-grid">
    <div class="kpi accent"${tattr('<b>Assigned limit released</b><br>Total released to '+esc(scope.name)+' across every dated release in view.')}>
      <div class="kpi-top"><span class="kpi-ic ic-blue">${kpiIcon('wallet')}</span><div class="kpi-txt">
      <div class="lbl">Assigned limit</div><div class="val tnum">${crShort(net)}</div></div></div>
      <div class="sub">${rows.length} release${rows.length===1?'':'s'}</div></div>
    <div class="kpi"${tattr('<b>Expenditure</b><br>Utilised against those releases - '+pct(net?util/net:0,1)+' of the limit released.')}>
      <div class="kpi-top"><span class="kpi-ic ic-green">${kpiIcon('coins')}</span><div class="kpi-txt">
      <div class="lbl">Expenditure</div><div class="val tnum">${crShort(util)}</div></div></div>
      <div class="sub">${pct(net?util/net:0,1)} of limit released</div></div>
    <div class="kpi"${tattr('<b>Balance</b><br>Released but not yet drawn: '+esc(crShort(net))+' − '+esc(crShort(util))+'.')}>
      <div class="kpi-top"><span class="kpi-ic ic-orange">${kpiIcon('scale')}</span><div class="kpi-txt">
      <div class="lbl">Balance</div><div class="val tnum${net-util>0?' neg':''}">${crShort(net-util)}</div></div></div>
      <div class="sub">released, not drawn</div></div>
    <div class="kpi"${tattr('<b>Busiest period</b><br>The '+(b==='M'?'month':b==='W'?'week':b==='3D'?'3-day block':'day')+' with the highest utilisation.<br><span style="opacity:.75">Average across active periods: '+esc(crShort(rate))+'.</span>')}>
      <div class="kpi-top"><span class="kpi-ic ic-purple">${kpiIcon('gauge')}</span><div class="kpi-txt">
      <div class="lbl">Busiest period</div><div class="val tnum sm">${peak&&peak.util>0?esc(crShort(peak.util)):'—'}</div></div></div>
      <div class="sub">${peak&&peak.util>0?esc(taRangeLabel(peak.key,b)):'no activity'}</div></div>
  </div>`;
}

function taBucketBar(id){
  return '<div class="ta-seg">'+TA_BUCKETS.map(function(o){
    const on=(state.taBucket&&state.taBucket[id]||'W')===o[0];
    return `<button class="${on?'on':''}" onclick="setTaBucket('${id}','${o[0]}')">${o[1]}</button>`;
  }).join('')+'</div>';
}

/* ---- The panel ---- */
function viewTrend(){
  const scoped=detailScopedTxn();                 // honours classification + centre chips
  const metric=state.taMetric||'all';
  const mChip=function(k,l){ return `<button class="fchip${metric===k?' on':''}" onclick="setTaMetric('${k}')">${l}</button>`; };

  const controls=`<div class="filterbar ta-top">
      <span class="ta-cap">Measure</span>
      ${mChip('all','All')}${mChip('exp','Expenditure')}${mChip('lim','Assigned limit')}${mChip('bal','Balance')}
      <div class="tools">
        <div class="toggle"><button class="${!state.taCum?'on':''}" onclick="setTaCum(0)">Per period</button>
        <button class="${state.taCum?'on':''}" onclick="setTaCum(1)">Cumulative</button></div>
      </div></div>`;

  const covered=sum(scoped,function(t){return t.net;});
  const cov=`<div class="dki-note"><div class="ico">i</div><div>
      Trends are built from <b>itemised release rows</b>, the only records in the workbook that carry a date.
      In the current filter that is <b>${crShort(covered)}</b> across ${scoped.length} releases.
      Component assignment has no date column and is never inferred onto the timeline; DDO KI Direct expenditure
      and the New Sports Infrastructure Projects releases are not itemised, so they sit outside these curves.
      <span class="muted">Figures here reconcile to the release tables, not to the scheme-wide assignment total.</span>
    </div></div>`;

  /* Module 1 - overall, under the site's own filters */
  const m1=`<div class="card ta-mod">
      <div class="ta-hd"><div><h3>1 · Overall</h3>
        <div class="qh">Every release in scope of the filters set at the top of the platform</div></div>
        ${taBucketBar('m1')}</div>
      ${taKpis(scoped,{id:'m1',name:'the current filter'})}
      ${taChart(taSeries(scoped,state.taBucket.m1),'m1')}</div>`;

  /* Module 2 - Regional Centre */
  const centres=ACTIVE_CENTRES.filter(function(c){ return isRegionalCentre(c); });
  const byRc={}; scoped.forEach(function(t){ if(!byRc[t.rc]) byRc[t.rc]={net:0,util:0,n:0};
    byRc[t.rc].net+=t.net||0; byRc[t.rc].util+=t.util||0; byRc[t.rc].n++; });
  const ranked=centres.slice().sort(function(a,b){ return (byRc[b]?byRc[b].net:0)-(byRc[a]?byRc[a].net:0); });
  if(!state.taRc || ranked.indexOf(state.taRc)<0) state.taRc=ranked[0]||'';
  const rcRows=scoped.filter(function(t){ return t.rc===state.taRc; });
  const rcPicker=ranked.map(function(c){
    const v=byRc[c]||{net:0,util:0,n:0};
    return `<button class="ta-pick${state.taRc===c?' on':''}" onclick="setTaRc('${esc(c)}')"
      ${tattr('<b>'+esc(c)+'</b><br>Released '+esc(crShort(v.net))+'<br>Utilised '+esc(crShort(v.util))+'<br>'+v.n+' releases')}>
      <span class="nm">${esc(c)}</span><span class="vv">${crShort(v.net)}</span></button>`;
  }).join('');
  const m2=`<div class="card ta-mod">
      <div class="ta-hd"><div><h3>2 · Regional Centre</h3>
        <div class="qh">Pick a centre to see how its releases and spending moved over time</div></div>
        ${taBucketBar('m2')}</div>
      <div class="ta-picks">${rcPicker}</div>
      ${state.taRc?taKpis(rcRows,{id:'m2',name:state.taRc})+taChart(taSeries(rcRows,state.taBucket.m2),'m2'):''}</div>`;

  /* Module 3 - component, then sub-component */
  const comps={}; scoped.forEach(function(t){ if(!comps[t.sv]) comps[t.sv]={net:0,util:0,n:0};
    comps[t.sv].net+=t.net||0; comps[t.sv].util+=t.util||0; comps[t.sv].n++; });
  const compList=Object.keys(comps).sort(function(a,b){ return comps[b].net-comps[a].net; });
  if(!state.taComp || compList.indexOf(state.taComp)<0){ state.taComp=compList[0]||''; state.taSub=''; }
  let cRows=scoped.filter(function(t){ return t.sv===state.taComp; });
  const subs={}; cRows.forEach(function(t){ const k=t.scat||'(Unspecified)';
    if(!subs[k]) subs[k]={net:0,util:0,n:0}; subs[k].net+=t.net||0; subs[k].util+=t.util||0; subs[k].n++; });
  const subList=Object.keys(subs).sort(function(a,b){ return subs[b].net-subs[a].net; });
  if(state.taSub && subList.indexOf(state.taSub)<0) state.taSub='';
  const rows3=state.taSub?cRows.filter(function(t){ return (t.scat||'(Unspecified)')===state.taSub; }):cRows;
  const compPicker=compList.map(function(c){
    const v=comps[c];
    return `<button class="ta-pick${state.taComp===c?' on':''}" onclick="setTaComp('${esc(c).replace(/'/g,"\\'")}')"
      ${tattr('<b>'+esc(c)+'</b><br>Released '+esc(crShort(v.net))+'<br>Utilised '+esc(crShort(v.util))+'<br>'+v.n+' releases')}>
      <span class="nm">${esc(c)}</span><span class="vv">${crShort(v.net)}</span></button>`;
  }).join('');
  const subPicker=subList.length>1?`<div class="ta-subs"><span class="ta-cap">Sub-component</span>
      <button class="fchip${!state.taSub?' on':''}" onclick="setTaSub('')">All</button>
      ${subList.map(function(s){ return `<button class="fchip${state.taSub===s?' on':''}" onclick="setTaSub('${esc(s).replace(/'/g,"\\'")}')">${esc(s)} <span style="opacity:.65">${crShort(subs[s].net)}</span></button>`; }).join('')}</div>`:'';
  const m3=`<div class="card ta-mod">
      <div class="ta-hd"><div><h3>3 · Component &amp; sub-component</h3>
        <div class="qh">Pick a component, then narrow to a sub-component</div></div>
        ${taBucketBar('m3')}</div>
      <div class="ta-picks">${compPicker}</div>
      ${subPicker}
      ${state.taComp?taKpis(rows3,{id:'m3',name:state.taSub||state.taComp})+taChart(taSeries(rows3,state.taBucket.m3),'m3'):''}</div>`;

  return pageHead('Trend Analytics','How releases and spending have moved over time · '+(state.taCum?'cumulative':'per period'))
   + controls + cov + m1 + m2 + m3;
}
function setTaMetric(v){ state.taMetric=v; render(); }
function setTaCum(v){ state.taCum=!!(+v); render(); }
function setTaBucket(id,v){ state.taBucket[id]=v; render(); }
function setTaRc(v){ state.taRc=v; render(); }
function setTaComp(v){ state.taComp=v; state.taSub=''; render(); }
function setTaSub(v){ state.taSub=v; render(); }

/* ---- Infrastructure MDSD module ---- */
function mdsdDetail(x){
  const rank=MDSD.items.slice().sort((a,b)=>b.assign-a.assign).findIndex(m=>m.name===x.name)+1;

  return `<div class="grp-drop">

    <div class="small" style="margin:0 4px 4px;color:var(--text-secondary)">Rank <b>#${rank}</b> of ${MDSD.items.length} States/Institutes by assignment · <b>${pct(shareA,1)}</b> of total Infrastructure-MDSD assignment</div>
    <div class="small" style="margin:0 4px 4px;color:var(--text-secondary)">Utilisation <b>${pct(x.up,1)}</b> vs Infrastructure-MDSD average <b>${pct(MDSD.grand.up,1)}</b> (${vsAvg>=0?'+':'−'}${pct(Math.abs(vsAvg),1)} ${vsAvg>=0?'above':'below'} average)</div>
    <div class="small" style="margin-top:9px;color:var(--text-secondary)">Assignment <b>${crShort(x.assign)}</b> &nbsp;·&nbsp; Expenditure <b>${crShort(x.exp)}</b> &nbsp;·&nbsp; Balance <b>${crShort(x.bal)}</b> &nbsp;·&nbsp; Utilisation <b>${pct(x.up,1)}</b></div>
  </div>`;
}
function mdsdInsightCards(){
  const items=MDSD.items, top=MDSD.topUtil;
  const zero=items.filter(x=>x.exp===0).sort((a,b)=>b.assign-a.assign);
  const cards=[
    ['var(--critical)','◆',`<b>${MDSD.zeroCount} of ${items.length}</b> States/Institutes have utilised <b>0%</b> of their sanctioned Infrastructure-MDSD grant - <b>${crShort(sum(zero,x=>x.assign))}</b> sanctioned, entirely unspent.`],
    top?['var(--good)','▲',`<b>${esc(top.name)}</b> has the highest utilisation at <b>${pct(top.up,0)}</b> of its ${crShort(top.assign)} sanction.`]:null,
    ['var(--warn)','₹',`<b>${crShort(MDSD.grand.bal)}</b> (${pct(MDSD.grand.assign?MDSD.grand.bal/MDSD.grand.assign:0,0)} of assignment) remains unspent across all Infrastructure-MDSD grantees as on ${AS_OF}.`]
  ].filter(Boolean);
  return cards.map(c=>`<div class="insight" style="border-left-color:${c[0]};cursor:default"><div class="ico" style="background:${c[0]}">${c[1]}</div><div class="tx">${c[2]}</div></div>`).join('');
}

/* ---- generic entity utilisation table (Sanctioned/Used/Balance/Utilisation with sortable
   headers + health-rated rows) - shared, single implementation used by both Infrastructure
   MDSD (States/Institutes) and Regional Centres, so the two panels stay pixel-for-pixel
   consistent and any future refinement only has to happen once. cfg fields:
   {ns, sortField, nameLabel, sancLabel, usedLabel, balLabel, icon(x), detail(x)} */
function entityUtilTable(items,cfg){
  const barU=cfg.barUsedWord||cfg.usedLabel, barB=cfg.barBalWord||cfg.balLabel;
  const rows=items.map(x=>{
    const key=cfg.ns+':'+x.name, open=state.hsOpen===key;
    const h=healthOf(x.assign, x.assign?x.exp/x.assign:0, x.bal, x.bal);
    const upPct=Math.max(0,Math.min(100,(x.up||0)*100)), balPct=100-upPct;
    const labU = upPct>=20?`${pct(x.up,0)} ${barU}`:upPct>=10?pct(x.up,0):'';
    const labB = balPct>=20?`${pct(1-x.up,0)} ${barB}`:balPct>=10?pct(1-x.up,0):'';
    const segU=upPct>0?`<span class="mdsd-seg-u" style="width:${upPct.toFixed(2)}%">${labU}</span>`:'';
    const segB=balPct>0?`<span class="mdsd-seg-b" style="width:${balPct.toFixed(2)}%">${labB}</span>`:'';
    return `<div class="mdsd-row${open?' open':''}" onclick="hsToggle(${jstr(key)})">
      <div class="mdsd-head"><span class="mdsd-chev">${open?'▾':'▸'}</span><span class="mdsd-ic">${cfg.icon(x)}</span><b title="${esc(x.name)}">${esc(x.name)}</b></div>
      <div class="mdsd-ov">${healthPctPill(h,'mdsd-pill')}<div class="mdsd-bar">${segU}${segB}</div></div>
      <div class="mdsd-nums">
        <div class="mdsd-num"><span class="mdsd-mlbl">${cfg.sancLabel} </span>${crShort(x.assign)}</div>
        <div class="mdsd-num" style="color:${x.exp>0?'var(--good)':'var(--text-muted)'}"><span class="mdsd-mlbl">${cfg.usedLabel} </span>${crShort(x.exp)}</div>
        <div class="mdsd-num" style="color:${x.bal>0?'var(--serious)':'var(--text-muted)'}"><span class="mdsd-mlbl">${cfg.balLabel} </span>${crShort(x.bal)}</div>
        <div class="mdsd-util">${healthPctPill(h)}</div>
      </div>
    </div>${open?`<div class="mdsd-drop">${cfg.detail(x)}</div>`:''}`;
  }).join('');
  const s=state[cfg.sortField]||{key:'assign',dir:-1};
  const th=(key,label,numeric)=>{
    const ascOn=s.key===key&&s.dir===1, descOn=s.key===key&&s.dir===-1;
    return `<div class="mdsd-th${numeric?' num':''}"><span>${label}</span><span class="mdsd-sort">
      <button class="mdsd-sbtn${ascOn?' on':''}" onclick="event.stopPropagation();setUtilSort('${cfg.sortField}','${key}',1)" title="Sort ${label} ascending" aria-label="Sort ascending">▲</button>
      <button class="mdsd-sbtn${descOn?' on':''}" onclick="event.stopPropagation();setUtilSort('${cfg.sortField}','${key}',-1)" title="Sort ${label} descending" aria-label="Sort descending">▼</button>
    </span></div>`;
  };
  return `<div class="mdsd-tbl">
    <div class="mdsd-thead">${th('name',cfg.nameLabel)}<div>Utilisation Overview</div>${th('assign',cfg.sancLabel,true)}${th('exp',cfg.usedLabel,true)}${th('bal',cfg.balLabel,true)}${th('up','Utilisation',true)}</div>
    ${rows}
    <div class="mdsd-legend"><span><i class="lu"></i>${barU} (Utilised)</span><span><i class="lb"></i>${barB} (Unutilised)</span><span class="muted">Amounts in ₹ (Indian Rupees)</span></div>
  </div>`;
}
const MDSD_CFG={ns:'mdsdtbl',sortField:'mdsdSort',nameLabel:'State / Institute',sancLabel:'Sanctioned',usedLabel:'Used',balLabel:'Balance',icon:x=>mdsdIcon(x.type),detail:x=>mdsdDetail(x)};
function viewMDSD(){
  /* The "KI Infra is excluded" empty state that stood here is gone. This panel's
     preset forces inclMdsd:true on every render, so the branch was unreachable -
     and it both named the filter chip and offered a link to re-enable it, which is
     precisely the control this panel is meant to have no visible trace of. */
  const items=utilSorted(MDSD.items,state.mdsdSort), Gm=MDSD.grand;
  const kpis=`<div class="kpi-grid">
    <div class="kpi accent"><div class="kpi-top"><span class="kpi-ic ic-blue">${kpiIcon('wallet')}</span><div class="kpi-txt"><div class="lbl">KI Infra Assignment</div><div class="val tnum">${cr(Gm.assign)}</div></div></div><div class="sub">${items.length} States / Institutes funded</div></div>
    <div class="kpi"><div class="kpi-top"><span class="kpi-ic ic-green">${kpiIcon('coins')}</span><div class="kpi-txt"><div class="lbl">KI Infra Expenditure</div><div class="val tnum">${cr(Gm.exp)}</div></div></div><div class="sub" style="color:var(--serious)">${pct(Gm.up,1)} utilised</div></div>
    <div class="kpi"><div class="kpi-top"><span class="kpi-ic ic-orange">${kpiIcon('scale')}</span><div class="kpi-txt"><div class="lbl">KI Infra Balance</div><div class="val tnum">${cr(Gm.bal)}</div></div></div><div class="sub">${pct(Gm.assign?Gm.bal/Gm.assign:0,1)} unspent</div></div>
    <div class="kpi"><div class="kpi-top"><span class="kpi-ic ic-purple">${kpiIcon('gauge')}</span><div class="kpi-txt"><div class="lbl">Zero-Utilisation Entities</div><div class="val tnum">${MDSD.zeroCount} <span class="small muted" style="font-weight:500">of ${items.length}</span></div></div></div><div class="sub">have not drawn down any sanctioned funds</div></div>

  return pageHead('KI Infra (States/UTs)','')

/* ---------------------------------------------------------------------------
   Filters as a bottom sheet (phones)
   The chips are the same elements in the same place in the DOM — only their
   position changes — so every handler, every per-panel preset and the rcOnly
   mode behave exactly as they do on desktop. The trigger carries a count of the
   streams currently included, so the filter state stays legible while shut.
--------------------------------------------------------------------------- */
function syncFilterBadge(){
  const n=document.getElementById('filtBtnN'); if(!n) return;

     would advertise hidden state and mean nothing to whoever is reading it. The
     sheet now holds exactly one control - Classification - so the badge marks only
     whether that has been narrowed away from All, and is otherwise absent. */
  const narrowed = state.filt && state.filt!=='All';
  n.textContent = narrowed ? '1' : '';
  n.className = 'filtbtn-n' + (narrowed ? '' : ' off');

/* ---------------------------------------------------------------------------

   The KPI tooltips are pointer-only, and the phone stylesheet hides them

   sidebar cannot reappear here; if one is ever unhidden it needs no change.
--------------------------------------------------------------------------- */
const TABS=[
  {v:'command',   t:'Overview',   d:'M4 20V10M10 20V4M16 20v-7M22 20H2'},
  {v:'tracker',   t:'Components', d:'m12 2 9 5-9 5-9-5 9-5M3 12l9 5 9-5M3 17l9 5 9-5'},

];

      <span class="tab-t">More</span></button>`;
